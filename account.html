<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rorraxy - Retail Account & Order Tracking</title>

    <script src="/ecosystem-core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-body: #000000;
            --card-bg: #07070a;
            --gold-color: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --text-main: #ffffff;
            --text-muted: #a0a0b8;
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --accent-green: #00e676;
        }

        * {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 12px 90px 12px;
            text-transform: uppercase !important;
            -webkit-font-smoothing: antialiased;
        }

        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        .account-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            animation: luxurySlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin: auto 0;
        }

        @keyframes luxurySlideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-orders-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            gap: 16px;
        }

        .shop-now-trigger {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
            padding: 10px 16px;
            background: transparent;
            border: none;
            outline: none;
            animation: softPulse 2.5s infinite ease-in-out;
            transition: transform 0.2s ease;
        }

        .shop-now-trigger:active {
            transform: scale(0.95);
        }

        .shop-now-icon {
            font-size: 1.5rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: floatIcon 3s infinite ease-in-out;
        }

        .shop-now-text {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes softPulse {
            0%, 100% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .memo-preview-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .memo-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .download-pdf-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 0.74rem;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: opacity 0.2s ease;
        }
        .download-pdf-btn:active { opacity: 0.8; }

        .memo-details-grid {
            background: #030305;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.68rem;
            color: var(--text-muted);
            line-height: 1.6;
        }
        .memo-details-grid span { color: #fff; font-weight: 700; }

        .memo-items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            margin-top: 2px;
        }
        .memo-items-table th, .memo-items-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .memo-items-table th {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            font-size: 0.68rem;
            letter-spacing: 0.5px;
        }

        .memo-total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--gold-color);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            margin-top: 2px;
        }

        .section-title {
            font-size: 0.72rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* FIXED BOTTOM SEARCH & CLOSE BAR */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: rgba(10, 10, 14, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            box-shadow: none !important;
            border: none !important;
        }

        .search-tracking-box {
            flex: 1;
            background: #121217;
            border: none !important;
            border-radius: 25px;
            padding: 4px 6px 4px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-input-field {
            flex: 1;
            background: transparent;
            border: none !important;
            color: #fff;
            font-size: 0.72rem;
            outline: none;
            font-family: var(--font-family);
        }
        .search-input-field::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .search-submit-btn {
            background: var(--gold-gradient);
            border: none !important;
            color: #000;
            font-weight: 900;
            font-size: 0.7rem;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.15s ease;
        }
        .search-submit-btn:active {
            opacity: 0.8;
        }

        /* CLOSE / CROSS BUTTON STYLING */
        .close-icon-btn {
            background: #121217;
            border: none !important;
            color: var(--gold-color);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            cursor: pointer;
        }
        .close-icon-btn:active {
            opacity: 0.8;
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div class="account-container" id="accountDynamicContent">
        <!-- Dynamic Content Loaded Here -->
    </div>

    <!-- SOFT FIXED BOTTOM SEARCH & CLOSE BAR -->
    <div class="bottom-nav-bar">
        <a href="./index.html" class="close-icon-btn" title="Close" onclick="event.preventDefault(); window.location.replace('./index.html');">
            <i class="fa-solid fa-xmark"></i>
        </a>
        <div class="search-tracking-box">
            <input type="text" id="orderSearchInput" class="search-input-field" placeholder="ENTER ORDER ID">
            <button onclick="executeOrderSearch()" class="search-submit-btn"><i class="fa-solid fa-magnifying-glass"></i> TRACK</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = ''; 
        let currentOrderData = null;

        window.onload = function() {
            initRetailAccountFetch();
            triggerConfetti();
        };

        function triggerConfetti() {
            try {
                confetti({
                    particleCount: 75,
                    spread: 70,
                    origin: { y: 0.5 },
                    colors: ['#d4af37', '#fcf6ba', '#b38728', '#ffffff']
                });
            } catch(e) {}
        }

        async function initRetailAccountFetch() {
            const lastOrderRaw = localStorage.getItem('rorraxy_last_order');
            if (lastOrderRaw) {
                try {
                    currentOrderData = JSON.parse(lastOrderRaw);
                    renderOrdersUI(currentOrderData);
                    return;
                } catch(e) { console.error(e); }
            }

            try {
                let response = await fetch(`${API_BASE_URL}/api/get?table=retail_orders&limit=1`);
                let result = await response.json();

                if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                    currentOrderData = result.data[0];
                    renderOrdersUI(currentOrderData);
                } else {
                    renderEmptyOrdersUI();
                }
            } catch(err) {
                renderEmptyOrdersUI();
            }
        }

        async function executeOrderSearch() {
            let query = document.getElementById('orderSearchInput').value.trim();
            if(!query) {
                initRetailAccountFetch();
                return;
            }

            try {
                let response = await fetch(`${API_BASE_URL}/api/get?table=retail_orders`);
                let result = await response.json();

                if (result.success && Array.isArray(result.data)) {
                    let found = result.data.find(o => 
                        (o.master_order_id && o.master_order_id.toLowerCase().includes(query.toLowerCase())) ||
                        (o.customer_phone && o.customer_phone.includes(query)) ||
                        (o.id && String(o.id).includes(query))
                    );

                    if (found) {
                        currentOrderData = found;
                        renderOrdersUI(currentOrderData);
                    } else {
                        alert("No order found matching your search query!");
                    }
                }
            } catch(e) {
                alert("Error searching database.");
            }
        }

        function renderEmptyOrdersUI() {
            const container = document.getElementById('accountDynamicContent');
            container.innerHTML = `
                <div class="empty-orders-screen">
                    <div onclick="window.location.href='./index.html'" class="shop-now-trigger">
                        <i class="fa-solid fa-bag-shopping shop-now-icon"></i>
                        <span class="shop-now-text">SHOPPING NOW</span>
                    </div>
                </div>
            `;
        }

        function renderOrdersUI(orderData) {
            const container = document.getElementById('accountDynamicContent');
            const items = orderData.items || [];
            const mainOrderId = orderData.master_order_id || orderData.id || 'RRX-RET-' + Math.floor(100000 + Math.random() * 900000);
            const customerName = orderData.customer_name || 'Valued Customer';
            const customerPhone = orderData.customer_phone || 'N/A';
            const paymentMethod = orderData.payment_method || 'Online Gateway';
            const orderDate = orderData.created_at ? new Date(orderData.created_at).toLocaleDateString() : '2026';

            let itemsTableHtml = '';
            let totalAmt = 0;

            items.forEach((item) => {
                let itemPriceNum = parseFloat(String(item.price || '0').replace('$', '')) || 0;
                let itemTotal = itemPriceNum * (item.qty || 1);
                totalAmt += itemTotal;
                let title = item.title || item.product_title || 'Retail Product';

                itemsTableHtml += `
                    <tr>
                        <td style="font-size:0.7rem; font-weight:700; color:#fff;">${title}</td>
                        <td style="text-align:center; font-weight:700;">${item.qty || 1}</td>
                        <td style="text-align:right; color:var(--gold-color); font-weight:900;">$${itemTotal.toFixed(2)}</td>
                    </tr>
                `;
            });

            let finalTotal = orderData.total_amount ? parseFloat(orderData.total_amount).toFixed(2) : totalAmt.toFixed(2);

            container.innerHTML = `
                <div class="section-title">
                    <i class="fa-solid fa-file-invoice"></i> ORDER MEMO
                </div>

                <div class="memo-preview-card" id="printableMemoArea">
                    <div class="memo-top-row">
                        <div>
                            <h2 style="font-size:0.85rem; font-weight:900; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">rorraxy RETAIL</h2>
                            <p style="font-size:0.48rem; color:var(--text-muted);">DIGITAL MEMO</p>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-size:0.68rem; font-weight:900; color:#fff;">#${mainOrderId}</p>
                            <p style="font-size:0.48rem; color:var(--text-muted);">${orderDate}</p>
                        </div>
                    </div>

                    <div class="memo-details-grid">
                        <strong>CUSTOMER NAME:</strong> <span>${customerName}</span><br>
                        <strong>PHONE / WHATSAPP:</strong> <span>${customerPhone}</span><br>
                        <strong>PAYMENT METHOD:</strong> <span>${paymentMethod}</span><br>
                        <strong>ORDER STATUS:</strong> <span style="color:var(--accent-green);">CONFIRMED & FULFILLED</span>
                    </div>

                    <table class="memo-items-table">
                        <thead>
                            <tr>
                                <th>PRODUCT ITEM</th>
                                <th style="text-align:center;">QTY</th>
                                <th style="text-align:right;">AMOUNT</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsTableHtml}
                        </tbody>
                    </table>

                    <div class="memo-total-row">
                        <span>TOTAL PAYABLE:</span>
                        <span>$${finalTotal} USD</span>
                    </div>
                </div>

                <div style="width:100%;">
                    <button onclick="downloadMemoAsPDF('${mainOrderId}')" class="download-pdf-btn">
                        <i class="fa-solid fa-file-arrow-down"></i> DOWNLOAD MEMO PDF
                    </button>
                </div>
            `;
        }

        function downloadMemoAsPDF(orderId) {
            const element = document.getElementById('printableMemoArea');
            const options = {
                margin:       10,
                filename:     `rorraxy-memo-${orderId}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(options).save().then(() => {
                setTimeout(() => {
                    window.location.href = './index.html';
                }, 1000);
            });
        }
    </script>
</body>
</html>
