<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>rorraxy - Wholesale B2B Categories & Search</title>
    <script src="/ecosystem-core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev">
    <link rel="icon" type="image/png" sizes="32x32" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png">
    <link rel="apple-touch-icon" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-wholesale: #000000;
            --card-wholesale: #0b0b10;
            --card-active: #101017;
            --header-wholesale: rgba(0, 0, 0, 0.9);
            --footer-wholesale: rgba(4, 4, 6, 0.95);
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #9a9ab0;
            --font-main: 'Poppins', sans-serif;
        }
        html, body {
            width: 100%; max-width: 100%; overflow-x: hidden;
            background: var(--bg-wholesale) !important;
            color: var(--text-white); font-family: var(--font-main);
            min-height: 100vh; font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        body { padding-top: 15px; padding-bottom: 25px; text-transform: uppercase !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Direct Flat Category Grid Container */
        .category-fullscreen-view {
            padding: 12px 14px;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 768px) {
            .category-fullscreen-view {
                grid-template-columns: repeat(4, 1fr);
                gap: 14px;
            }
        }

        .direct-category-card {
            background: var(--card-wholesale);
            border-radius: 14px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            border: none;
            min-height: 112px;
        }
        .direct-category-card:hover,
        .direct-category-card.active {
            background: var(--card-active);
        }

        .category-icon-box {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .category-icon-box i {
            font-size: 1.4rem;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .category-card-title {
            font-size: 0.88rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Dynamic Product Feed Section */
        .dynamic-product-section {
            display: none;
            grid-template-columns: 1fr;
            margin-top: 15px;
            padding: 10px 0;
        }
        .dynamic-product-section.active { display: block; }
        .section-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding: 0 4px; }
        .section-title-result { font-size: 0.85rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.8px; }

        .back-to-cat-btn {
            background: #14141d;
            border: none;
            color: var(--gold-solid);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            transition: background-color 0.2s ease;
        }
        .back-to-cat-btn:hover { background: #1c1c28; }

        .feed-container {
            padding: 4px 0;
            column-count: 2;
            column-gap: 10px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .feed-container {
                column-count: 4;
                column-gap: 12px;
            }
        }

        .product-card {
            background: var(--card-wholesale);
            border-radius: 12px;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            border: none;
            position: relative;
            cursor: pointer;
            margin-bottom: 10px;
            break-inside: avoid;
            page-break-inside: avoid;
        }
        .product-media-box { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #07070b; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .product-media-box img { width: 100%; height: 100%; display: block; object-fit: cover; background: transparent; }

        .card-footer-actions {
            display: flex; align-items: center; justify-content: space-between; padding: 9px 10px;
            background: #09090e !important; border: none; gap: 6px; margin-top: 0;
            white-space: nowrap; overflow: hidden;
        }
        .wholesale-info-inline { display: flex; align-items: baseline; gap: 6px; overflow: hidden; }
        .product-price-tag { font-size: 0.80rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .moq-tag { font-size: 0.60rem; color: var(--text-gray); font-weight: 600; text-transform: uppercase; }
        .share-icon-btn {
            background: none; border: none; cursor: pointer;
            font-size: 1.1rem; background: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            padding: 4px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* Clean Floating Search Modal */
        .floating-search-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 20000; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease; padding: 16px;
        }
        .floating-search-modal.active { opacity: 1; visibility: visible; }
        .floating-search-box {
            background: #0c0c12; border: none;
            border-radius: 20px; padding: 30px 24px; width: 100%; max-width: 480px;
            display: flex; flex-direction: column; gap: 20px; position: relative;
        }
        .close-modal-btn {
            position: absolute; top: 16px; right: 18px; background: rgba(255,255,255,0.05); border: none;
            color: var(--text-gray); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; cursor: pointer;
        }
        .modal-title { font-size: 1.05rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .modal-input-container { display: flex; flex-direction: column; gap: 14px; }
        .modal-input {
            width: 100%; background: #060609; border: none;
            border-radius: 12px; padding: 15px 18px; color: var(--text-white); font-size: 0.90rem; outline: none; text-transform: uppercase;
        }
        .search-bottom-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .search-action-item-btn {
            background: #14141d; border: none;
            border-radius: 12px; padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px; width: 100%;
        }
        .search-action-item-btn i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-action-item-btn span { font-size: 0.62rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body id="mainBody">
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
      <linearGradient id="goldGradientSvg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#bf953f" />
        <stop offset="25%" stop-color="#fcf6ba" />
        <stop offset="50%" stop-color="#b38728" />
        <stop offset="75%" stop-color="#fbf5b7" />
        <stop offset="100%" stop-color="#aa771c" />
      </linearGradient>
    </svg>

    <main class="category-fullscreen-view" id="categoryMainListView">
        <div class="direct-category-card" id="cat-watches" onclick="fetchAndDisplayProducts('watches', 'WATCHES')">
            <div class="category-icon-box"><i class="fa-solid fa-clock"></i></div>
            <span class="category-card-title">WATCHES</span>
        </div>

        <div class="direct-category-card" id="cat-jewelry" onclick="fetchAndDisplayProducts('jewelry', 'JEWELRY')">
            <div class="category-icon-box"><i class="fa-solid fa-gem"></i></div>
            <span class="category-card-title">JEWELRY</span>
        </div>

        <div class="direct-category-card" id="cat-bracelets" onclick="fetchAndDisplayProducts('bracelets', 'BRACELETS')">
            <div class="category-icon-box"><i class="fa-solid fa-ring"></i></div>
            <span class="category-card-title">BRACELETS</span>
        </div>

        <div class="direct-category-card" id="cat-clocks" onclick="fetchAndDisplayProducts('clocks', 'CLOCKS')">
            <div class="category-icon-box"><i class="fa-solid fa-clock-rotate-left"></i></div>
            <span class="category-card-title">CLOCKS</span>
        </div>

        <div class="direct-category-card" id="cat-lamps-lighting" onclick="fetchAndDisplayProducts('lamps-lighting', 'LAMPS & LIGHTING')">
            <div class="category-icon-box"><i class="fa-solid fa-lightbulb"></i></div>
            <span class="category-card-title">LAMPS & LIGHTING</span>
        </div>

        <div class="direct-category-card" id="cat-wall-art-decor" onclick="fetchAndDisplayProducts('wall-art-decor', 'WALL ART & DECOR')">
            <div class="category-icon-box"><i class="fa-solid fa-image"></i></div>
            <span class="category-card-title">WALL ART & DECOR</span>
        </div>

        <div class="direct-category-card" id="cat-luxury-gifts" onclick="fetchAndDisplayProducts('luxury-gifts', 'LUXURY GIFTS')">
            <div class="category-icon-box"><i class="fa-solid fa-gift"></i></div>
            <span class="category-card-title">LUXURY GIFTS</span>
        </div>

        <div class="direct-category-card" id="cat-accessories" onclick="fetchAndDisplayProducts('accessories', 'ACCESSORIES')">
            <div class="category-icon-box"><i class="fa-solid fa-sparkles"></i></div>
            <span class="category-card-title">ACCESSORIES</span>
        </div>
    </main>

    <!-- Dynamic Wholesale Product Feed -->
    <div class="category-fullscreen-view dynamic-product-section" id="dynamicProductSection">
        <div class="section-header-row">
            <span class="section-title-result" id="resultCategoryTitle">WHOLESALE PRODUCTS</span>
            <button class="back-to-cat-btn" onclick="goBackToCategories()"><i class="fa-solid fa-arrow-left"></i> BACK TO CATEGORIES</button>
        </div>
        <div class="feed-container" id="categoryProductFeed"></div>
    </div>

    <!-- Floating Search Modal -->
    <div class="floating-search-modal" id="searchModal" onclick="handleOutsideClick(event)">
        <div class="floating-search-box" id="searchBoxContainer">
            <button class="close-modal-btn" onclick="closeSearchModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-title">SEARCH WHOLESALE PRODUCTS</div>
            <div class="modal-input-container">
                <input type="text" id="modalSearchInput" class="modal-input" placeholder="Type bulk product name..." autocomplete="off">
                <div class="search-bottom-actions">
                    <label class="search-action-item-btn" style="cursor: pointer;">
                        <i class="fa-solid fa-camera"></i>
                        <span>CAMERA</span>
                        <input type="file" accept="image/*" style="display: none;" onchange="handleCameraSearch(event)">
                    </label>
                    <button type="button" class="search-action-item-btn" onclick="startAudioSearch()">
                        <i class="fa-solid fa-microphone"></i>
                        <span>AUDIO</span>
                    </button>
                    <button type="button" class="search-action-item-btn" onclick="submitModalSearch()">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>SEARCH</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '';

        function getActiveAffiliateId() {
            const urlParams = new URLSearchParams(window.location.search);
            const refFromUrl = urlParams.get('ref') || urlParams.get('aff') || urlParams.get('affiliate');

            if (refFromUrl) {
                try {
                    localStorage.setItem('rorraxy_active_affiliate_ref', refFromUrl);
                    sessionStorage.setItem('rorraxy_active_affiliate_ref', refFromUrl);
                } catch(e) {}
                return refFromUrl;
            }

            let userProfile = {};
            try {
                userProfile = JSON.parse(localStorage.getItem('rorraxy_user_account')) || JSON.parse(localStorage.getItem('user_profile')) || {};
            } catch(e) {}

            return userProfile.affiliate_id || userProfile.id || userProfile.userId || localStorage.getItem('rorraxy_my_affiliate_id') || localStorage.getItem('rorraxy_active_affiliate_ref') || sessionStorage.getItem('rorraxy_active_affiliate_ref') || null;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref') || urlParams.get('aff') || urlParams.get('affiliate');
            const rateParam = urlParams.get('rate') || '3';
            const platformParam = urlParams.get('platform') || 'wholesale';

            if (refParam) {
                try {
                    localStorage.setItem('rorraxy_active_affiliate_ref', refParam);
                    localStorage.setItem('rorraxy_active_commission_rate', rateParam);
                    localStorage.setItem('rorraxy_active_platform', platformParam);
                } catch(e) {}
            }

            getActiveAffiliateId();
        });

        async function fetchAndDisplayProducts(queryKey, displayLabel = '') {
            document.getElementById('categoryMainListView').style.display = 'none';
            const dynamicSection = document.getElementById('dynamicProductSection');
            dynamicSection.classList.add('active');
            const readableLabel = (displayLabel || queryKey.replace(/-/g, ' ')).toUpperCase();
            document.getElementById('resultCategoryTitle').innerText = `BULK RESULTS FOR: ${readableLabel}`;

            const feedContainer = document.getElementById('categoryProductFeed');
            feedContainer.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--gold-solid); padding: 40px;"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i><br><span style="font-size: 0.75rem; margin-top: 10px; display:inline-block;">LOADING WHOLESALE PRODUCTS...</span></p>`;

            try {
                const response = await fetch(`${API_BASE_URL}/api/products?t=` + Date.now(), { cache: 'no-store' });
                const result = await response.json();
                let products = [];
                if (result && result.success && Array.isArray(result.data)) {
                    products = result.data;
                } else if (Array.isArray(result)) {
                    products = result;
                }

                let localProducts = [];
                let cachedFeed = [];
                try {
                    localProducts = JSON.parse(localStorage.getItem('rorraxy_wholesale_products')) || [];
                    cachedFeed = JSON.parse(localStorage.getItem('rorraxy_wholesale_feed_cache')) || [];
                } catch(e) {}

                let mergedMap = new Map();
                [...localProducts, ...cachedFeed, ...products].forEach(p => {
                    let pId = p.id || p.product_id || p.product_code || p.title;
                    if(pId) mergedMap.set(String(pId), p);
                });
                let allProducts = Array.from(mergedMap.values());

                if (allProducts.length > 0) {
                    const filtered = allProducts.filter(item => {
                        const title = (item.title || '').toLowerCase();
                        const cat = (item.category || item.tag || item.description || '').toLowerCase();
                        const query = queryKey.toLowerCase();
                        return title.includes(query) || cat.includes(query) || query === 'all';
                    });
                    renderWholesaleFeed(filtered.length > 0 ? filtered : allProducts);
                } else {
                    feedContainer.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-gray); padding: 40px;">NO WHOLESALE PRODUCTS FOUND</p>`;
                }
            } catch (err) {
                console.error('Error fetching wholesale products:', err);
                let localProducts = [];
                try {
                    localProducts = JSON.parse(localStorage.getItem('rorraxy_wholesale_products')) || [];
                } catch(e) {}

                if(localProducts.length > 0) {
                    renderWholesaleFeed(localProducts);
                } else {
                    feedContainer.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-gray); padding: 40px;">FAILED TO LOAD PRODUCTS</p>`;
                }
            }
        }

        function renderWholesaleFeed(products) {
            const feedContainer = document.getElementById('categoryProductFeed');
            feedContainer.innerHTML = products.map(item => {
                const productId = item.id || item.product_id || item.product_code || '101';
                const title = item.title || 'WHOLESALE ITEM';
                const bulkPrice = item.price_bulk ? `$${parseFloat(item.price_bulk).toFixed(2)}` : (item.price ? `$${parseFloat(item.price).toFixed(2)}` : '$25.00');
                const moqCount = item.moq || item.min_order_qty || 1;

                let imageUrl = "https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png";
                try {
                    if (item.images_json) {
                        let parsed = typeof item.images_json === 'string' ? JSON.parse(item.images_json) : item.images_json;
                        if (Array.isArray(parsed) && parsed.length > 0) imageUrl = parsed[0];
                    } else if (item.image_url) {
                        imageUrl = typeof item.image_url === 'string' && item.image_url.startsWith('[') ? JSON.parse(item.image_url)[0] : item.image_url;
                    }
                } catch(e) {
                    imageUrl = item.image_url || imageUrl;
                }

                return `
                    <div class="product-card" onclick="openProductDetails('${productId}')">
                        <div class="product-media-box">
                            <img src="${imageUrl}" alt="${title}" loading="lazy" decoding="async" onerror="this.src='https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png'">
                        </div>
                        <div class="card-footer-actions">
                            <div class="wholesale-info-inline">
                                <span class="product-price-tag">${bulkPrice}</span>
                                <span class="moq-tag">Min ${moqCount} Pcs</span>
                            </div>
                            <button class="share-icon-btn" onclick="shareProduct(event, '${title.replace(/'/g, "\\'")}', '${productId}')" title="Share & Earn">
                                <i class="fa-solid fa-share-nodes"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openProductDetails(productId) {
            let affId = getActiveAffiliateId();
            let rate = localStorage.getItem('rorraxy_active_commission_rate') || '3';
            let platform = localStorage.getItem('rorraxy_active_platform') || 'wholesale';

            let url = `/wholesale/pd.html?id=${productId}`;
            if (affId) {
                url += `&ref=${affId}&rate=${rate}&platform=${platform}`;
            }
            window.location.href = url;
        }

        function goBackToCategories() {
            document.getElementById('dynamicProductSection').classList.remove('active');
            document.getElementById('categoryMainListView').style.display = 'grid';
        }

        function openSearchModal() {
            document.getElementById('searchModal').classList.add('active');
            setTimeout(() => { document.getElementById('modalSearchInput').focus(); }, 100);
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.remove('active');
        }

        function handleOutsideClick(event) {
            if (event.target === document.getElementById('searchModal')) closeSearchModal();
        }

        function submitModalSearch() {
            let input = document.getElementById('modalSearchInput');
            if(!input) return;
            let query = input.value.trim();
            if (!query) return;
            closeSearchModal();
            fetchAndDisplayProducts(query, query);
        }

        document.getElementById('modalSearchInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitModalSearch();
        });

        function startAudioSearch() {
            const searchInput = document.getElementById('modalSearchInput');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                searchInput.value = "";
                searchInput.placeholder = "VOICE NOT SUPPORTED IN BROWSER";
                return;
            }
            searchInput.value = "";
            searchInput.placeholder = "LISTENING...";
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onresult = function(event) {
                let transcript = event.results[0][0].transcript;
                searchInput.value = transcript;
                closeSearchModal();
                fetchAndDisplayProducts(transcript, transcript);
            };
            try { recognition.start(); } catch (err) {}
        }

        function handleCameraSearch(event) {
            if (!event.target.files[0]) return;
            closeSearchModal();
            fetchAndDisplayProducts("search", "SEARCH");
        }

        async function shareProduct(event, title, productId) {
            if(event) event.stopPropagation();

            let affId = getActiveAffiliateId();
            let rate = localStorage.getItem('rorraxy_active_commission_rate') || '3';
            let platform = localStorage.getItem('rorraxy_active_platform') || 'wholesale';

            let shareUrl = `${window.location.origin}/wholesale/pd.html?id=${productId}`;

            if (affId) {
                shareUrl += `&ref=${affId}&rate=${rate}&platform=${platform}`;
            }

            if (navigator.share) {
                try {
                    await navigator.share({ title: title, url: shareUrl });
                } catch(e) {}
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(shareUrl);
                const btn = event.currentTarget;
                if(btn) {
                    const origHtml = btn.innerHTML;
                    btn.innerHTML = `<i class="fa-solid fa-check" style="color:#00e676;"></i>`;
                    setTimeout(() => { btn.innerHTML = origHtml; }, 1600);
                }
            }
        }
    </script>
</body>
</html>
