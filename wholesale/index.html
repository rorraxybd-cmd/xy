    <style>

        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden;

        /* ---------- header ---------- */

            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--header-wholesale); backdrop-filter: blur(20px);

        .trending-marquee-bar {
            overflow: hidden; white-space: nowrap; font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            flex: 1; display: flex; align-items: center; height: 42px; position: relative; background: transparent;

        .marquee-container {
            display: flex; width: max-content;
            animation: smoothMarquee 22s linear infinite;
            will-change: transform; backface-visibility: hidden;
        }
        .marquee-group { display: flex; align-items: center; gap: 40px; padding-right: 40px; flex-shrink: 0; }
        .marquee-group span { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-gray); }
        .txt-gold { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes smoothMarquee {

        .mode-selector-wrapper {

        .mode-selector-corner {
            background: transparent; border: none; outline: none;

            font-family: var(--font-main);

        .mode-selector-wrapper::after {
            content: "\f0d7"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 8px; pointer-events: none;
            font-size: 0.65rem; color: var(--gold-solid);
        }
        .mode-selector-corner option {
            background: #0a0a0f; color: #ffffff; -webkit-text-fill-color: #ffffff; font-weight: 600; padding: 10px;
        }

        /* ---------- feed filter bar ---------- */
        .feed-filter-bar {
            display: none; align-items: center; justify-content: space-between; gap: 10px;
            background: rgba(212,175,55,0.12);
            border: 1px solid rgba(212,175,55,0.35);
            border-radius: 999px; padding: 7px 14px;

            width: calc(100% - 12px);
            font-size: 0.62rem; font-weight: 700; color: var(--gold-solid);
            letter-spacing: 0.4px;
            animation: fadeSlideIn 0.25s ease both;

        .feed-filter-bar.active { display: flex; }
        .feed-filter-bar span {
            display: flex; align-items: center; gap: 7px; min-width: 0;

            background: var(--gold-gradient); border: none;
            color: #000; padding: 4px 10px; border-radius: 999px;

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-8px); }

        /* ---------- feed ---------- */

            column-count: 2;
            column-gap: 8px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;

                column-gap: 12px;
                padding: 12px;

        .feed-status-box {
            column-span: all;
            width: 100%;
            text-align: center;
            padding: 55px 16px;
            color: var(--gold-solid);

        .product-card {
            background: var(--card-wholesale); border-radius: 16px; overflow: hidden;
            display: inline-block; width: 100%;
            border: 1px solid rgba(212,175,55,0.20); position: relative; cursor: pointer;
            margin-bottom: 8px; break-inside: avoid; page-break-inside: avoid;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transform: translateZ(0);
            transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.55);
            animation: cardAppear 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(12px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* Zero-jitter mode for related/AI filter views */
        .product-card.no-animate {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        .product-card:active { transform: scale(0.98); }
        .product-card:hover {
            border-color: rgba(212,175,55,0.55);
            box-shadow: 0 10px 28px rgba(212,175,55,0.14);

        .product-card.is-anchor-card {
            border: 1.5px solid var(--gold-solid);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.22);

        .product-media-box {
            position: relative; width: 100%; aspect-ratio: 1 / 1;
            background: #08080d linear-gradient(90deg, #08080d 0%, #12121c 50%, #08080d 100%);

            animation: skeletonLoading 1.5s infinite;
            overflow: hidden; display: flex; align-items: center; justify-content: center;

            100% { background-position: -200% 0; }

        .product-media-box.loaded { animation: none; background: #000000; }
        .product-media-box img,
        .product-media-box video {
            width: 100%; height: 100%; display: block; object-fit: cover; background: transparent;
            opacity: 0; transition: opacity 0.3s ease-in-out;

        .product-media-box img.loaded-img,

        /* ✅ CLEAN, CRYSTAL-CLEAR PRICE PILL (no blur) */
        .price-qty-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1px;
            z-index: 6;

            backdrop-filter: blur(8px);
            padding: 4px 9px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.38);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
            transform: translateZ(0);
        }
        .price-qty-overlay .price {
            font-size: 0.92rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            letter-spacing: 0.2px;
        }
        .price-qty-overlay .qty {
            font-size: 0.52rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Pinterest-style AI Lens icon */
        .ai-lens-corner-btn {
            position: absolute;
            bottom: 9px;
            right: 9px;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: rgba(12, 12, 18, 0.88);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(212, 175, 55, 0.45);

            align-items: center;
            justify-content: center;

            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.32);
        }
        .ai-lens-corner-btn:active { transform: scale(0.92); }
        .ai-lens-corner-btn svg { width: 19px; height: 19px; display: block; }

        /* ---------- bottom nav ---------- */
        nav.bottom-nav {
            position: fixed !important; bottom: 0 !important; left: 0 !important; width: 100% !important; background: var(--footer-wholesale) !important;
            display: flex !important; justify-content: space-around !important; align-items: center !important; padding: 8px 4px 10px 4px !important;

        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;

        .cart-icon-box { position: relative; display: inline-flex; align-items: center; justify-content: center; }

        /* ---------- modals & overlays ---------- */
        .floating-search-modal {

        .modal-title { font-size: 1.05rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; padding-right: 20px; }
        .modal-input-container { display: flex; flex-direction: column; gap: 14px; }
        .modal-input {

        .search-bottom-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .search-action-item-btn {
            background: rgba(212, 175, 55, 0.08); border: 1px solid rgba(212, 175, 55, 0.25);

            align-items: center; justify-content: center; gap: 6px; width: 100%;
        }
        .search-action-item-btn i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-action-item-btn span { font-size: 0.62rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .external-page-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 60px);
            background: #000; z-index: 1500000; display: none; border: none; outline: none;
        }
        .external-page-overlay.active { display: block; }
        .external-page-overlay iframe { width: 100%; height: 100%; border: none; }

        /* Vision modal */
        .similar-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            max-height: 360px; overflow-y: auto; padding: 2px;
        }
        .similar-item {
            background: #0e0e16; border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(212,175,55,0.15); cursor: pointer;
            display: flex; flex-direction: column;
        }
        .similar-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #12121c; }
        .similar-item .sim-info { padding: 5px 6px; }
        .similar-item .sim-title { font-size: 0.5rem; color: #d8d8e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; font-weight: 600; }
        .similar-item .sim-price { color: var(--gold-solid); font-weight: 800; font-size: 0.56rem; }
        .ai-vision-analyzing { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 10px; }
        .ai-vision-preview { width: 120px; height: 120px; border-radius: 14px; object-fit: cover; border: 2px solid var(--gold-solid); }
        .ai-vision-pulse { width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(212,175,55,0.15); border-top-color: var(--gold-solid); animation: aiSpin 1s linear infinite; }

        .ai-vision-text { font-size: 0.78rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ai-vision-sub { font-size: 0.55rem; color: var(--text-gray); }
        .ai-vision-results-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 10px; background: rgba(212,175,55,0.06); border-radius: 12px; border: 1px solid rgba(212,175,55,0.2); }
        .ai-vision-preview-small { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; border: 1px solid var(--gold-solid); flex-shrink: 0; }

        .ai-vision-empty { font-size: 0.7rem; color: var(--text-gray); text-align: center; padding: 20px; }

    // ============================================================
    // 1. GLOBAL CONFIG & SYNONYMS
    // ============================================================
    const LOCAL_STORAGE_CACHE_KEY = 'rorraxy_wholesale_feed_cache';
    const PREF_STORAGE_KEY = 'rorraxy_user_visual_prefs';
    const FALLBACK_IMG_URL = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png';
    let cachedAffiliateId = null;
    let __ALL_PRODUCTS = [];
    let __IS_FILTERED_VIEW = false;

    // Build category knowledge base from categories.js
    function normalizeText(str) {
        return String(str || '')
            .toLowerCase()
            .replace(/[^a-z0-9\u0980-\u09FF]+/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    const CATEGORY_KNOWLEDGE = {};
    rorraxyCategoriesData.forEach(cat => {
        cat.subCategories.forEach(sub => {
            const wordSource = [sub.name, sub.key, cat.title].join(' ');
            const words = Array.from(new Set(
                normalizeText(wordSource).split(' ').filter(w => w.length >= 3)
            ));
            CATEGORY_KNOWLEDGE[sub.key] = {
                key: sub.key,
                name: sub.name,
                parentId: cat.id,
                parentTitle: cat.title,
                words: words

    const MATERIAL_SYNONYMS = {
        mahogany: ['mahogany', 'মেহগনি', 'wood', 'wooden', 'timber', 'darkwood', 'furniture', 'handicrafts'],
        gamari:   ['gamari', 'গামারি', 'wood', 'wooden', 'timber', 'warmwood', 'handicrafts'],
        leather:  ['leather', 'চামড়া', 'চামড়া', 'wallet', 'wallets', 'handbag', 'handbags', 'bag', 'bags', 'shoes', 'belt', 'grooming', 'accessories'],

        earring:  ['earring', 'earrings', 'stud', 'studs', 'hoop', 'hoops', 'drop', 'jewelry', 'jewellery', 'women-jewelry', 'girls-jewelry', 'কানের দুল', 'দুল'],
        baby:     ['baby', 'babies', 'infant', 'toddler', 'newborn', 'mother', 'maternity', 'nursery', 'feeding', 'toys', 'mother-baby-clothing', 'pregnancy-maternity', 'baby-care-feeding', 'nursery-baby-gear', 'eco-baby-toys', 'বেবি', 'শিশু'],
        fabric:   ['fabric', 'cloth', 'কাপড়', 'কাপড়', 'clothing', 'dress', 'dresses', 'wear', 'fashion', 'traditional', 'activewear', 'sets', 'girls-clothing', 'boys-clothing', 'women-clothing', 'men-clothing'],
        decor:    ['decor', 'homedecor', 'home decor', 'হোম ডেকর', 'ডেকর', 'clock', 'lamp', 'coaster', 'bamboo', 'brass', 'crafts', 'gift', 'bamboo-brass-decor'],
        resin:    ['resin', 'রেজিন', 'epoxy', 'wood-resincrafts', 'woodresin', 'art', 'crafts', 'handicrafts', 'wood-resin']

    // ============================================================
    // 2. HELPERS
    // ============================================================
    function escapeHtmlAttr(str) {
        return String(str || '')
            .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeJsSingle(str) {
        return String(str || '')
            .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');

    // ============================================================
    // 3. PREFERENCE MEMORY
    // ============================================================
    function getUserPrefs() {
        try { return JSON.parse(localStorage.getItem(PREF_STORAGE_KEY) || '{}') || {}; }
        catch (e) { return {}; }
    }
    function recordUserPreference(product) {
        if (!product) return;
        try {
            const prefs = getUserPrefs();
            extractExpandedTags(product).forEach(t => {
                if (t.length > 2) prefs[t] = Math.min(25, (prefs[t] || 0) + 1);
            });
            localStorage.setItem(PREF_STORAGE_KEY, JSON.stringify(prefs));
        } catch (e) {}
    }

    function extractExpandedTags(p) {
        if (!p) return [];
        if (Array.isArray(p.__expandedTags)) return p.__expandedTags;
        const rawTokens = new Set();
        const addWords = (val) => {
            normalizeText(val).split(' ').forEach(w => { if (w.length > 1) rawTokens.add(w); });
        };
        if (p.tags) {
            if (Array.isArray(p.tags)) p.tags.forEach(t => addWords(t));
            else if (typeof p.tags === 'string') p.tags.split(/[,|]/).forEach(t => addWords(t));
        }
        addWords(p.title); addWords(p.subtitle); addWords(p.category);
        addWords(p.subCategory || p.subcategory || p.tag);
        addWords(p.description);
        if (p.visual?.colorTone) addWords(p.visual.colorTone);
        if (p.visual?.style) addWords(p.visual.style);
        if (p.visual?.shape) addWords(p.visual.shape);

        const fullText = Array.from(rawTokens).join(' ');
        Object.entries(MATERIAL_SYNONYMS).forEach(([groupKey, words]) => {
            if (words.some(w => fullText.includes(normalizeText(w)))) {
                rawTokens.add(groupKey);
                words.forEach(w => rawTokens.add(normalizeText(w)));
            }
        });
        p.__expandedTags = Array.from(rawTokens);
        return p.__expandedTags;
    }

    // ============================================================
    // 4. CATEGORY HELPERS
    // ============================================================
    function findCategoryKey(product) {
        if (!product) return null;
        const candidates = [product.category, product.subCategory, product.subcategory,
                            product.tag, product.category_key, product.cat_key]
            .filter(Boolean).map(normalizeText);
        for (const key of Object.keys(CATEGORY_KNOWLEDGE)) {
            if (candidates.includes(normalizeText(key))) return key;
        }
        // Fallback: word-based inference
        const allText = normalizeText([
            product.title, product.subtitle, product.description,
            product.category, product.subCategory
        ].filter(Boolean).join(' '));
        for (const [key, info] of Object.entries(CATEGORY_KNOWLEDGE)) {
            if (info.words.length && info.words.every(w => allText.includes(w))) return key;
        }
        return null;
    }

    // ============================================================
    // 5. COLOR / VISUAL HELPERS (image-derived matching)
    // ============================================================
    function inferColorTone(text) {
        const t = normalizeText(text);
        if (/\bgold(en)?\b/.test(t) || /\bgolden\b/.test(t)) return 'gold';
        if (/\bblack\b|\bdark\b|\bebony\b/.test(t)) return 'black';
        if (/\bwhite\b|\bcream\b|\bivory\b/.test(t)) return 'white';
        if (/\bred\b|\bcrimson\b|\bmaroon\b/.test(t)) return 'red';
        if (/\bblue\b|\bnavy\b/.test(t)) return 'blue';
        if (/\bgreen\b|\bemerald\b/.test(t)) return 'green';
        if (/\bsilver\b|\bgrey\b|\bgray\b/.test(t)) return 'silver';
        if (/\bbrown\b|\btan\b|\bbeige\b|\bwood(en)?\b|\bmahogany\b|\bgamari\b/.test(t)) return 'brown';
        if (/\bpink\b|\brose\b/.test(t)) return 'pink';
        return null;
    }

    function inferProductColorTone(p) {
        if (p.visual && p.visual.colorTone) return normalizeText(p.visual.colorTone);
        const text = [p.title, p.description, p.subtitle,
                     ...(p.__expandedTags || extractExpandedTags(p))].join(' ');
        return inferColorTone(text);
    }

    function rgbToTone(r, g, b) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const brightness = (r + g + b) / 3;
        const sat = max === 0 ? 0 : (max - min) / max;

        if (sat < 0.12) {
            if (brightness < 55) return 'black';
            if (brightness > 210) return 'white';
            return 'silver';
        }
        let hue;
        const delta = max - min || 1;
        if (max === r) hue = ((g - b) / delta) % 6;
        else if (max === g) hue = (b - r) / delta + 2;
        else hue = (r - g) / delta + 4;
        hue = hue * 60;
        if (hue < 0) hue += 360;

        if (brightness < 70 && hue > 20 && hue < 60) return 'brown';
        if (hue < 15 || hue >= 345) return 'red';
        if (hue < 45) return brightness > 140 ? 'gold' : 'brown';
        if (hue < 70) return 'gold';
        if (hue < 170) return 'green';
        if (hue < 260) return 'blue';
        return 'pink';
    }

    function colorToneGroup(tone) {
        const groups = {
            gold: 'warm', brown: 'warm', red: 'warm', pink: 'warm',
            blue: 'cool', green: 'cool', silver: 'cool',
            black: 'neutral', white: 'neutral'
        };
        return groups[tone] || 'neutral';
    }

    // Extract dominant color from uploaded image via canvas
    function extractColorProfile(dataUrl) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    const size = 48;
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0, size, size);
                    const data = ctx.getImageData(0, 0, size, size).data;
                    let rSum = 0, gSum = 0, bSum = 0, count = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        if (data[i + 3] < 128) continue;
                        rSum += data[i]; gSum += data[i + 1]; bSum += data[i + 2];
                        count++;
                    }
                    if (count === 0) { resolve(null); return; }
                    const r = rSum / count, g = gSum / count, b = bSum / count;
                    resolve({
                        r, g, b,
                        brightness: (r + g + b) / 3,
                        tone: rgbToTone(r, g, b)
                    });
                } catch (e) { resolve(null); }
            };
            img.onerror = () => resolve(null);
            img.src = dataUrl;
        });
    }

    // ============================================================
    // 6. SIMILARITY ENGINE (uses categories.js + color + tags)
    // ============================================================
    function computeSimilarityScore(source, target) {
        if (!source || !target) return 0;
        if (String(source.__id) === String(target.__id)) return -1;

        let score = 0;
        const srcTags = new Set(extractExpandedTags(source));
        const tgtTags = new Set(extractExpandedTags(target));
        srcTags.forEach(tag => { if (tgtTags.has(tag)) score += 6; });

        const srcCat = normalizeText(source.category || source.subCategory || '');
        const tgtCat = normalizeText(target.category || target.subCategory || '');
        if (srcCat && tgtCat && srcCat === tgtCat) score += 12;

        // ✅ Category knowledge boost
        const srcKey = findCategoryKey(source);
        const tgtKey = findCategoryKey(target);
        if (srcKey && tgtKey) {
            if (srcKey === tgtKey) score += 20;
            else if (CATEGORY_KNOWLEDGE[srcKey]?.parentId === CATEGORY_KNOWLEDGE[tgtKey]?.parentId) score += 10;
        }

        if (source.visual && target.visual) {
            if (source.visual.colorTone && source.visual.colorTone === target.visual.colorTone) score += 5;
            if (source.visual.style && source.visual.style === target.visual.style) score += 5;
            if (source.visual.shape && source.visual.shape === target.visual.shape) score += 3;
        }

        // Color tone match
        const srcTone = inferProductColorTone(source);
        const tgtTone = inferProductColorTone(target);
        if (srcTone && tgtTone) {
            if (srcTone === tgtTone) score += 8;
            else if (colorToneGroup(srcTone) === colorToneGroup(tgtTone)) score += 3;
        }

        if (target.is_new || target.isNew || target.new_arrival) score += 5;
        if (target.views) score += Math.min(4, Number(target.views) / 100);
        return score;
    }

    // ============================================================
    // 7. ZERO-JITTER RELATED SEARCH
    // ============================================================
    function triggerRelatedFeedSearch(productId, event) {
        if (event) event.stopPropagation();
        const source = __ALL_PRODUCTS.find(p => String(p.__id) === String(productId));
        if (!source) return;

        recordUserPreference(source);

        const scored = __ALL_PRODUCTS
            .map(item => ({ item, score: computeSimilarityScore(source, item) }))
            .filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score)
            .map(x => x.item);

        const seen = new Set([String(source.__id), ...scored.map(s => String(s.__id))]);
        const remaining = __ALL_PRODUCTS.filter(p => !seen.has(String(p.__id)));
        const finalFeed = [source, ...scored, ...remaining];

        __IS_FILTERED_VIEW = true;
        showFeedFilterBar(`SIMILAR ITEMS (${scored.length})`);

        // ✅ allowStagger = false → adds no-animate class → ZERO jitter
        renderWholesaleCards(finalFeed, source.__id, false);

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ✅ Real image-based matcher: color tone + filename hints + category
    async function simulateVisualMatch(file, previewUrl) {
        const profile = await extractColorProfile(previewUrl);

        const filenameWords = normalizeText(String(file.name || '').replace(/\.(jpg|jpeg|png|webp|gif|heic|bmp)$/i, ''))
            .split(' ')
            .filter(w => w.length > 2 && !/^\d+$/.test(w));

        const filenameCat = filenameWords.length
            ? findCategoryFromText(filenameWords.join(' '))
            : null;

        const scored = __ALL_PRODUCTS.map(p => {
            let score = 0;

            // Color-derived match (strong signal — genuinely image-based)
            if (profile && profile.tone) {
                const pTone = inferProductColorTone(p);
                if (pTone) {
                    if (pTone === profile.tone) score += 50;
                    else if (colorToneGroup(pTone) === colorToneGroup(profile.tone)) score += 22;
                }
            }

            // Filename keyword (weak signal — user-described content)
            if (filenameWords.length > 0) {
                const tags = extractExpandedTags(p);
                filenameWords.forEach(w => {
                    if (tags.some(t => t.includes(w) || w.includes(t))) score += 15;
                });
            }

            // Category inference from filename
            if (filenameCat) {
                const pCatKey = findCategoryKey(p);
                if (pCatKey && CATEGORY_KNOWLEDGE[pCatKey]
                    && CATEGORY_KNOWLEDGE[pCatKey].parentId === filenameCat.parentId) {
                    score += 15;
                }
            }

            // Freshness + popularity tiebreaker
            if (p.is_new || p.isNew || p.new_arrival) score += 3;
            if (p.views) score += Math.min(3, Number(p.views) / 200);

            return { p, score };
        });

        let matches = scored.filter(x => x.score > 0)
            .sort((a, b) => b.score - a.score)
            .map(x => x.p);

        if (matches.length === 0) {
            matches = prioritizeHomepageFeed(__ALL_PRODUCTS).slice(0, 12);
        }
        return matches.slice(0, 24);
    }

    function findCategoryFromText(text) {
        const t = normalizeText(text);
        for (const [key, info] of Object.entries(CATEGORY_KNOWLEDGE)) {
            if (info.words.some(w => w.length >= 3 && t.includes(w))) return info;
        }
        return null;
    }

    // 11. FEED PRIORITY & LOADING
    // ============================================================
    function seededShuffle(array, seed) {
        let m = array.length;
        const arr = [...array];
        while (m) {
            const x = Math.sin(seed++) * 10000;
            const r = x - Math.floor(x);
            const i = Math.floor(r * m--);
            const t = arr[m]; arr[m] = arr[i]; arr[i] = t;
        }
        return arr;
    }

    function prioritizeHomepageFeed(list) {
        if (!Array.isArray(list) || list.length === 0) return [];
        const prefs = getUserPrefs();
        const isNew = p => Boolean(p.is_new || p.isNew || p.new_arrival || p.isNewArrival);
        const prefScore = p => extractExpandedTags(p).reduce((sum, t) => sum + (prefs[t] || 0), 0);

        const sorted = [...list].sort((a, b) => {
            const nA = isNew(a) ? 1 : 0;
            const nB = isNew(b) ? 1 : 0;
            if (nA !== nB) return nB - nA;
            return prefScore(b) - prefScore(a);
        });

        const sessionSeed = Math.floor(Date.now() / 15000);
        const newOnes = sorted.filter(isNew);
        const rest = sorted.filter(p => !isNew(p));
        return [
            ...seededShuffle(newOnes, sessionSeed + 1),
            ...seededShuffle(rest, sessionSeed + 2)
        ];
    }

    function expandSearchTerms(rawQuery) {
        const normalized = normalizeText(rawQuery);
        const tokens = normalized.split(' ').filter(Boolean);
        const expanded = new Set(tokens);
        tokens.forEach(token => {
            Object.entries(MATERIAL_SYNONYMS).forEach(([groupKey, words]) => {
                const normalizedGroup = words.map(w => normalizeText(w));
                if (normalizeText(groupKey).includes(token) || normalizedGroup.some(w => w.includes(token) || token.includes(w))) {
                    expanded.add(normalizeText(groupKey));
                    normalizedGroup.forEach(w => { if (w) expanded.add(w); });
                }
            });
        });
        return { tokens, expanded: Array.from(expanded) };
    }

    async function loadWholesaleProducts(searchFilter = null) {
        const feedContainer = document.getElementById('productFeed');

        let localProducts = [], cachedFeed = [];
        try {
            localProducts = JSON.parse(localStorage.getItem('rorraxy_seller_products') || '[]') || [];
            cachedFeed = JSON.parse(localStorage.getItem(LOCAL_STORAGE_CACHE_KEY) || '[]') || [];
        } catch (e) {}

        if (!searchFilter && !__IS_FILTERED_VIEW && cachedFeed.length > 0) {
            __ALL_PRODUCTS = cachedFeed;
            renderWholesaleCards(prioritizeHomepageFeed(cachedFeed), null, true);
        } else if (!__IS_FILTERED_VIEW) {
            feedContainer.innerHTML = `<div class="feed-status-box">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <p style="margin-top: 10px; font-size: 0.75rem; letter-spacing: 1px;">${searchFilter ? 'SEARCHING...' : 'LOADING WHOLESALE PRODUCTS...'}</p></div>`;
        }

        let products = [];
        try {
            const response = await fetch('/api/products?t=' + Date.now(), { cache: 'no-store' });
            if (response.ok) {
                const result = await response.json();
                const rawData = result.data || result.results || result;
                if (Array.isArray(rawData)) products = rawData;
            }
        } catch (err) { console.warn('API Fetch Warning:', err); }

        const mergedMap = new Map();
        const combined = [...localProducts, ...cachedFeed, ...products];
        for (let i = 0; i < combined.length; i++) {
            const p = combined[i];
            if (!p || typeof p !== 'object') continue;
            const pId = p.id || p.product_id || p.product_code || p.title;
            if (pId) {
                const key = String(pId);
                p.__id = key;
                if (!mergedMap.has(key)) mergedMap.set(key, p);
            }
        }

        const allProducts = Array.from(mergedMap.values());
        let wholesaleProducts = allProducts.filter(p => {
            const mode = String
