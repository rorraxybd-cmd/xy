function normalizeText(s){return String(s||'').toLowerCase().replace(/[^a-z0-9\u0980-\u09FF]+/g,' ').replace(/\s+/g,' ').trim();}
function escapeHtmlAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escapeJsSingle(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');}

function detectProductTypes(product){
if(!product)return[];
if(Array.isArray(product.__productTypes))return product.__productTypes;
const rawText=normalizeText([product.title,product.subtitle,product.category,product.subCategory,product.subcategory,product.tag].filter(Boolean).join(' '));
const tokens=new Set(rawText.split(' ').filter(Boolean));
const matchedTypes=[];
for(const[typeKey,keywords]of Object.entries(PRODUCT_TYPE_GROUPS)){
const hit=keywords.some(kw=>{
const nkw=normalizeText(kw);
if(!nkw)return false;
if(nkw.includes(' '))return rawText.includes(nkw);
return Array.from(tokens).some(tk=>tk===nkw||tk===nkw+'s'||tk===nkw+'es'||(nkw.length>=4&&tk.startsWith(nkw)));
});
if(hit)matchedTypes.push(typeKey);
}
product.__productTypes=matchedTypes;
return matchedTypes;
}

function extractExpandedTags(p){
if(!p)return[];
if(Array.isArray(p.__expandedTags))return p.__expandedTags;
const rawTokens=new Set();
const addWords=v=>{normalizeText(v).split(' ').forEach(w=>{if(w.length>1)rawTokens.add(w);});};
if(p.tags){if(Array.isArray(p.tags))p.tags.forEach(t=>addWords(t));else if(typeof p.tags==='string')p.tags.split(/[,|]/).forEach(t=>addWords(t));}
addWords(p.title);addWords(p.subtitle);addWords(p.category);
addWords(p.subCategory||p.subcategory||p.tag);addWords(p.description);
const fullText=Array.from(rawTokens).join(' ');
Object.entries(MATERIAL_SYNONYMS).forEach(([gk,words])=>{
if(words.some(w=>fullText.includes(normalizeText(w)))){rawTokens.add(gk);words.forEach(w=>rawTokens.add(normalizeText(w)));}
});
p.__expandedTags=Array.from(rawTokens);
return p.__expandedTags;
}

function findCategoryKey(product){
if(!product)return null;
const candidates=[product.category,product.subCategory,product.subcategory,product.tag,product.category_key,product.cat_key].filter(Boolean).map(normalizeText);
for(const key of Object.keys(CATEGORY_KNOWLEDGE)){if(candidates.includes(normalizeText(key)))return key;}
const allText=normalizeText([product.title,product.subtitle,product.description,product.category,product.subCategory].filter(Boolean).join(' '));
for(const[key,info]of Object.entries(CATEGORY_KNOWLEDGE)){if(info.words.length&&info.words.every(w=>allText.includes(w)))return key;}
return null;
}

function getProductBucketKey(p){
const types=detectProductTypes(p);
if(types.length>0)return types[0];
return findCategoryKey(p)||normalizeText(p.category||p.subCategory||p.title||'general')||'general';
}

function getTrendingNewScore(p){
let score=0;
const ts=Date.parse(p.created_at||p.updated_at||p.added_at||'');
if(!isNaN(ts))score+=ts/1e12;
if(p.is_new||p.isNew||p.new_arrival||p.isNewArrival)score+=15;
if(p.trending||p.is_trending||p.featured)score+=12;
if(p.views)score+=Math.min(10,Number(p.views)/50);
return score;
}

function prioritizeHomepageFeed(list){
if(!Array.isArray(list)||list.length===0)return[];
const prefs=getUserPrefs();
const prefScore=p=>extractExpandedTags(p).reduce((sum,t)=>sum+(prefs[t]||0),0);
const rankItem=p=>getTrendingNewScore(p)+prefScore(p);

const buckets=new Map();
[...list].sort((a,b)=>rankItem(b)-rankItem(a)).forEach(p=>{
const bKey=getProductBucketKey(p);
if(!buckets.has(bKey))buckets.set(bKey,[]);
buckets.get(bKey).push(p);
});

const diverseFirst=[];
const leftovers=[];
let round=0;
let addedInRound=true;
while(addedInRound){
addedInRound=false;
for(const[,items]of buckets.entries()){
if(round<items.length){
addedInRound=true;
if(round===0)diverseFirst.push(items[round]);
else leftovers.push(items[round]);
}
}
round++;
}
leftovers.sort((a,b)=>rankItem(b)-rankItem(a));
return [...diverseFirst,...leftovers];
}

function computeSimilarityScore(source,target){
if(!source||!target)return 0;
if(String(source.__id)===String(target.__id))return-1;

const srcTypes=detectProductTypes(source);
const tgtTypes=detectProductTypes(target);

/* If source has a specific item type (e.g., watch, glasses, wallet, bag, shoe, bracelet),
   ONLY allow items that share that exact item type */
if(srcTypes.length>0){
const sharesType=srcTypes.some(t=>tgtTypes.includes(t));
if(!sharesType)return-1;
}else if(tgtTypes.length>0){
return-1;
}

let score=20;
const srcTags=new Set(extractExpandedTags(source)),tgtTags=new Set(extractExpandedTags(target));
srcTags.forEach(tag=>{if(tgtTags.has(tag))score+=6;});
const srcCat=normalizeText(source.category||source.subCategory||''),tgtCat=normalizeText(target.category||target.subCategory||'');
if(srcCat&&tgtCat&&srcCat===tgtCat)score+=12;
const srcKey=findCategoryKey(source),tgtKey=findCategoryKey(target);
if(srcKey&&tgtKey){if(srcKey===tgtKey)score+=15;else if(CATEGORY_KNOWLEDGE[srcKey]?.parentId===CATEGORY_KNOWLEDGE[tgtKey]?.parentId)score+=6;}
score+=Math.min(5,getTrendingNewScore(target)/5);
return score;
}

function expandSearchTerms(rawQuery){
const normalized=normalizeText(rawQuery);
const tokens=normalized.split(' ').filter(Boolean);
const expanded=new Set(tokens);
tokens.forEach(token=>{
Object.entries(MATERIAL_SYNONYMS).forEach(([gk,words])=>{
const ng=words.map(w=>normalizeText(w));
if(normalizeText(gk).includes(token)||ng.some(w=>w.includes(token)||token.includes(w))){expanded.add(normalizeText(gk));ng.forEach(w=>{if(w)expanded.add(w);});}
});
});
return{tokens,expanded:Array.from(expanded)};
}

const{tokens,expanded}=expandSearchTerms(searchFilter);
const scoredMatches=wholesaleProducts.map(item=>{

const full=normalizeText([item.title,item.subtitle,item.category,item.subCategory,...tags].join(' '));
let ms=0;
tokens.forEach(tk=>{if(full.includes(tk))ms+=10;if(tags.some(t=>t.includes(tk)))ms+=8;});
expanded.forEach(ex=>{if(full.includes(ex))ms+=4;if(tags.some(t=>t===ex||t.includes(ex)))ms+=3;});
return{item,matchScore:ms};
}).filter(x=>x.matchScore>0).sort((a,b)=>b.matchScore-a.matchScore).map(x=>x.item);
__IS_FILTERED_VIEW=true;
showFeedFilterBar(`${searchFilter.toUpperCase()} (${scoredMatches.length})`);
renderWholesaleCards(scoredMatches,false);
return;
}
if(wholesaleProducts.length>0){
renderWholesaleCards(prioritizeHomepageFeed(wholesaleProducts),true);
}else{
feedContainer.innerHTML=`<div class="feed-status-box" style="color:var(--text-gray);"><i class="fa-solid fa-boxes-stacked fa-2x" style="color:var(--gold-solid);margin-bottom:12px;"></i><p style="font-size:.8rem;font-weight:600;">NO WHOLESALE PRODUCTS FOUND.</p></div>`;
}
}

function resolveProductImage(p){
let url=FALLBACK_IMG_URL;
try{
if(p.images_json){
if(typeof p.images_json==='string'){const parsed=JSON.parse(p.images_json);if(Array.isArray(parsed)&&parsed.length>0)url=parsed[0];else if(typeof parsed==='string')url=parsed;}
else if(Array.isArray(p.images_json)&&p.images_json.length>0)url=p.images_json[0];
}
}catch(e){if(typeof p.images_json==='string'&&p.images_json.trim()!=='')url=p.images_json.split(',')[0].trim();}
if((!url||url.includes('rorraxy logo')||url===FALLBACK_IMG_URL)&&p.image_url){
if(typeof p.image_url==='string'){
if(p.image_url.startsWith('[')){try{const parsed=JSON.parse(p.image_url);if(Array.isArray(parsed)&&parsed.length>0)url=parsed[0];}catch(e){url=p.image_url;}}
else url=p.image_url;
}else if(Array.isArray(p.image_url)&&p.image_url.length>0)url=p.image_url[0];
}
if((!url||url.includes('mr masudar logo'))&&p.imageUrl)url=p.imageUrl;
if((!url||url.includes('mr masudar logo'))&&(p.productImage||p.jiImageUrl||p.cjImage))url=p.productImage||p.jiImageUrl||p.cjImage;
return url||FALLBACK_IMG_URL;
}
function resolveProductVideo(p){
const c=p.video_url||p.videoUrl||p.video||p.productVideo||'';
if(typeof c==='string'&&c.trim().startsWith('http'))return c.trim();
return'';
}

function renderWholesaleCards(wholesaleProducts,allowStagger=true){
const feedContainer=document.getElementById('productFeed');
const fragment=document.createDocumentFragment();
if(!Array.isArray(wholesaleProducts)||wholesaleProducts.length===0){
feedContainer.innerHTML=`<div class="feed-status-box" style="color:var(--text-gray);"><i class="fa-solid fa-magnifying-glass fa-2x" style="color:var(--gold-solid);margin-bottom:12px;"></i><p style="font-size:.8rem;font-weight:600;">NO MATCHING PRODUCTS FOUND.</p></div>`;
return;
}
wholesaleProducts.forEach((p,idx)=>{
const pTitle=p.title||'WHOLESALE ITEM';
const bulkPrice=p.price_bulk||p.price_min_whole||p.price||0;
const resolvedImageUrl=resolveProductImage(p);
const resolvedVideoUrl=resolveProductVideo(p);
const productId=String(p.__id||p.id||p.product_id||p.product_code||('p_'+idx));
p.__id=productId;
const safeTitleAttr=escapeHtmlAttr(pTitle);
const safeIdJs=escapeJsSingle(productId);
const cardDiv=document.createElement('div');
cardDiv.className='product-card';
cardDiv.onclick=()=>goToProduct(productId);
const mediaTagHtml=resolvedVideoUrl
?`<video src="${escapeHtmlAttr(resolvedVideoUrl)}" poster="${escapeHtmlAttr(resolvedImageUrl)}" autoplay muted loop playsinline preload="metadata"></video>`
:`<img src="${escapeHtmlAttr(resolvedImageUrl)}" alt="${safeTitleAttr}" loading="lazy" decoding="async" onerror="this.src='${FALLBACK_IMG_URL}'">`;
cardDiv.innerHTML=`
<div class="product-media-box">${mediaTagHtml}</div>
<div class="card-footer-actions" onclick="event.stopPropagation()">
<span class="product-price-tag">$${(parseFloat(bulkPrice)||0).toFixed(2)}</span>
<div class="card-right-icons">
<button type="button" class="card-action-icon-btn" title="Share product" onclick="shareProduct('${safeIdJs}',event)">
<i class="fa-solid fa-share-nodes"></i>
</button>
<button type="button" class="card-action-icon-btn" title="Related products" onclick="triggerRelatedFeedSearch('${safeIdJs}',event)">
<svg class="related-search-svg" viewBox="0 0 24 24" fill="none" stroke="url(#goldGradientSvg)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
</svg>
</button>
</div>
</div>`;
fragment.appendChild(cardDiv);
});
feedContainer.innerHTML='';
feedContainer.appendChild(fragment);
}

function updateCartBadgeCount(){
let cart=[];
try{cart=JSON.parse(localStorage.getItem('rorraxy_cart')||'[]')||[];}catch(e){}
const totalQty=cart.reduce((sum,item)=>sum+(parseInt(item.qty,10)||0),0);
const badge=document.getElementById('floatingCartItemCountBadge');
if(badge){badge.innerText=totalQty;totalQty>0?badge.classList.remove('empty-badge'):badge.classList.add('empty-badge');}
}
</script>
