function extractExpandedTags(p){
if(!p)return[];
if(Array.isArray(p.__expandedTags))return p.__expandedTags;
const rawTokens=new Set();
const addWords=v=>{normalizeText(v).split(' ').forEach(w=>{if(w.length>1)rawTokens.add(w);});};
if(p.tags){if(Array.isArray(p.tags))p.tags.forEach(t=>addWords(t));else if(typeof p.tags==='string')p.tags.split(/[,|]/).forEach(t=>addWords(t));}
addWords(p.title);addWords(p.subtitle);addWords(p.category);
addWords(p.subCategory||p.subcategory||p.tag);addWords(p.description);
if(p.visual?.colorTone)addWords(p.visual.colorTone);
if(p.visual?.style)addWords(p.visual.style);
if(p.visual?.shape)addWords(p.visual.shape);
const fullText=Array.from(rawTokens).join(' ');
Object.entries(MATERIAL_SYNONYMS).forEach(([gk,words])=>{
if(words.some(w=>fullText.includes(normalizeText(w)))){rawTokens.add(gk);words.forEach(w=>rawTokens.add(normalizeText(w)));}
});
p.__expandedTags=Array.from(rawTokens);
return p.__expandedTags;
}

function findCategoryKey(product){
if(!product)return null;
const candidates=[product.category,product.subCategory,product.subcategory,product.tag,product.category_key,product.cat_key].filter(Boolean).map(normalizeText);
for(const key of Object.keys(CATEGORY_KNOWLEDGE)){if(candidates.includes(normalizeText(key)))return key;}
const allText=normalizeText([product.title,product.subtitle,product.description,product.category,product.subCategory].filter(Boolean).join(' '));
for(const[key,info]of Object.entries(CATEGORY_KNOWLEDGE)){if(info.words.length&&info.words.every(w=>allText.includes(w)))return key;}
return null;
}

function inferColorTone(text){
const t=normalizeText(text);
if(/\bgold(en)?\b/.test(t))return'gold';
if(/\bblack\b|\bdark\b|\bebony\b/.test(t))return'black';
if(/\bwhite\b|\bcream\b|\bivory\b/.test(t))return'white';
if(/\bred\b|\bcrimson\b|\bmaroon\b/.test(t))return'red';
if(/\bblue\b|\bnavy\b/.test(t))return'blue';
if(/\bgreen\b|\bemerald\b/.test(t))return'green';
if(/\bsilver\b|\bgrey\b|\bgray\b/.test(t))return'silver';
if(/\bbrown\b|\btan\b|\bbeige\b|\bwood(en)?\b|\bmahogany\b|\bgamari\b/.test(t))return'brown';
if(/\bpink\b|\brose\b/.test(t))return'pink';
return null;
}
function inferProductColorTone(p){
if(p.visual&&p.visual.colorTone)return normalizeText(p.visual.colorTone);
const text=[p.title,p.description,p.subtitle,...(p.__expandedTags||extractExpandedTags(p))].join(' ');
return inferColorTone(text);
}
function rgbToTone(r,g,b){
const max=Math.max(r,g,b),min=Math.min(r,g,b);
const brightness=(r+g+b)/3;
const sat=max===0?0:(max-min)/max;
if(sat<.12){if(brightness<55)return'black';if(brightness>210)return'white';return'silver';}
let hue;const delta=max-min||1;
if(max===r)hue=((g-b)/delta)%6;else if(max===g)hue=(b-r)/delta+2;else hue=(r-g)/delta+4;
hue=hue*60;if(hue<0)hue+=360;
if(brightness<70&&hue>20&&hue<60)return'brown';
if(hue<15||hue>=345)return'red';
if(hue<45)return brightness>140?'gold':'brown';
if(hue<70)return'gold';
if(hue<170)return'green';
if(hue<260)return'blue';
return'pink';
}
function colorToneGroup(t){
const g={gold:'warm',brown:'warm',red:'warm',pink:'warm',blue:'cool',green:'cool',silver:'cool',black:'neutral',white:'neutral'};
return g[t]||'neutral';
}
function extractColorProfile(dataUrl){
return new Promise(resolve=>{
const img=new Image();
img.onload=()=>{
try{
const canvas=document.createElement('canvas');const size=48;
canvas.width=size;canvas.height=size;
const ctx=canvas.getContext('2d',{willReadFrequently:true});
ctx.drawImage(img,0,0,size,size);
const data=ctx.getImageData(0,0,size,size).data;
let rS=0,gS=0,bS=0,count=0;
for(let i=0;i<data.length;i+=4){if(data[i+3]<128)continue;rS+=data[i];gS+=data[i+1];bS+=data[i+2];count++;}
if(count===0){resolve(null);return;}
const r=rS/count,g=gS/count,b=bS/count;
resolve({r,g,b,brightness:(r+g+b)/3,tone:rgbToTone(r,g,b)});
}catch(e){resolve(null);}
};
img.onerror=()=>resolve(null);
img.src=dataUrl;
});
}

/* ===== SIMILARITY ===== */
function computeSimilarityScore(source,target){
if(!source||!target)return 0;
if(String(source.__id)===String(target.__id))return-1;
let score=0;
const srcTags=new Set(extractExpandedTags(source)),tgtTags=new Set(extractExpandedTags(target));
srcTags.forEach(tag=>{if(tgtTags.has(tag))score+=6;});
const srcCat=normalizeText(source.category||source.subCategory||''),tgtCat=normalizeText(target.category||target.subCategory||'');
if(srcCat&&tgtCat&&srcCat===tgtCat)score+=12;
const srcKey=findCategoryKey(source),tgtKey=findCategoryKey(target);
if(srcKey&&tgtKey){if(srcKey===tgtKey)score+=20;else if(CATEGORY_KNOWLEDGE[srcKey]?.parentId===CATEGORY_KNOWLEDGE[tgtKey]?.parentId)score+=10;}
if(source.visual&&target.visual){
if(source.visual.colorTone&&source.visual.colorTone===target.visual.colorTone)score+=5;
if(source.visual.style&&source.visual.style===target.visual.style)score+=5;
if(source.visual.shape&&source.visual.shape===target.visual.shape)score+=3;
}
const srcTone=inferProductColorTone(source),tgtTone=inferProductColorTone(target);
if(srcTone&&tgtTone){if(srcTone===tgtTone)score+=8;else if(colorToneGroup(srcTone)===colorToneGroup(tgtTone))score+=3;}
if(target.is_new||target.isNew||target.new_arrival)score+=5;
if(target.views)score+=Math.min(4,Number(target.views)/100);
return score;
}

async function simulateVisualMatch(file,previewUrl){

if(pTone){if(pTone===profile.tone)score+=50;else if(colorToneGroup(pTone)===colorToneGroup(profile.tone))score+=22;}
}
if(filenameWords.length>0){
const tags=extractExpandedTags(p);
filenameWords.forEach(w=>{if(tags.some(t=>t.includes(w)||w.includes(t)))score+=15;});
}
if(filenameCat){
const pCatKey=findCategoryKey(p);
if(pCatKey&&CATEGORY_KNOWLEDGE[pCatKey]&&CATEGORY_KNOWLEDGE[pCatKey].parentId===filenameCat.parentId)score+=15;
}
if(p.is_new||p.isNew||p.new_arrival)score+=3;
if(p.views)score+=Math.min(3,Number(p.views)/200);
return{p,score};
});
let matches=scored.filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.p);
if(matches.length===0)matches=prioritizeHomepageFeed(__ALL_PRODUCTS).slice(0,12);
return matches.slice(0,24);
}
function findCategoryFromText(text){

const title=document.getElementById('aiVisionTitle'),body=document.getElementById('aiVisionBody');
title.innerText='AI VISION RESULTS';
if(!matches||matches.length===0){body.innerHTML=`<div class="ai-vision-empty">No visual matches found.</div>`;return;}
const gridHtml=matches.slice(0,12).map(m=>{
const mId=String(m.__id||m.id||m.product_id||m.product_code||'');
const mTitle=m.title||'ITEM';
const mImg=resolveProductImage(m);
const mPrice=m.price_bulk||m.price_min_whole||m.price||0;
return `<div class="similar-item" onclick="goToProduct('${escapeJsSingle(mId)}')"><img src="${escapeHtmlAttr(mImg)}" alt="${escapeHtmlAttr(mTitle)}" loading="lazy" onerror="this.src='${FALLBACK_IMG_URL}'"><div class="sim-info"><div class="sim-title">${escapeHtmlAttr(mTitle)}</div><div class="sim-price">$${(parseFloat(mPrice)||0).toFixed(2)}</div></div></div>`;
}).join('');
body.innerHTML=`<div class="ai-vision-results-header"><img class="ai-vision-preview-small" src="${previewSrc}" alt="Query image"><div class="ai-vision-count">${matches.length} VISUAL MATCHES FOUND</div></div><div class="similar-grid">${gridHtml}</div><button type="button" class="ai-vision-filter-btn" onclick="filterFeedFromVision()"><i class="fa-solid fa-filter"></i> SHOW IN MAIN FEED</button>`;
window.__aiVisionMatches=matches;
}
function filterFeedFromVision(){
const matches=window.__aiVisionMatches||[];if(!matches.length)return;
closeAiVisionModal();__IS_FILTERED_VIEW=true;
renderWholesaleCards(matches,null,false);
showFeedFilterBar(`AI VISION (${matches.length})`);
window.scrollTo({top:0,behavior:'smooth'});
}
function closeAiVisionModal(){document.getElementById('aiVisionModal')?.classList.remove('active');}

/* ===== FEED PRIORITY ===== */
function seededShuffle(array,seed){
let m=array.length;const arr=[...array];
while(m){const x=Math.sin(seed++)*10000;const r=x-Math.floor(x);const i=Math.floor(r*m--);const t=arr[m];arr[m]=arr[i];arr[i]=t;}
return arr;
}
function prioritizeHomepageFeed(list){
if(!Array.isArray(list)||list.length===0)return[];
const prefs=getUserPrefs();
const isNew=p=>Boolean(p.is_new||p.isNew||p.new_arrival||p.isNewArrival);
const prefScore=p=>extractExpandedTags(p).reduce((sum,t)=>sum+(prefs[t]||0),0);
const sorted=[...list].sort((a,b)=>{
const nA=isNew(a)?1:0,nB=isNew(b)?1:0;
if(nA!==nB)return nB-nA;
return prefScore(b)-prefScore(a);
});
const sessionSeed=Math.floor(Date.now()/15000);
const newOnes=sorted.filter(isNew),rest=sorted.filter(p=>!isNew(p));
return[...seededShuffle(newOnes,sessionSeed+1),...seededShuffle(rest,sessionSeed+2)];
}
function expandSearchTerms(rawQuery){
const normalized=normalizeText(rawQuery);
const tokens=normalized.split(' ').filter(Boolean);
const expanded=new Set(tokens);
tokens.forEach(token=>{
Object.entries(MATERIAL_SYNONYMS).forEach(([gk,words])=>{
const ng=words.map(w=>normalizeText(w));
if(normalizeText(gk).includes(token)||ng.some(w=>w.includes(token)||token.includes(w))){expanded.add(normalizeText(gk));ng.forEach(w=>{if(w)expanded.add(w);});}
});
});
return{tokens,expanded:Array.from(expanded)};
}

/* ===== LOAD PRODUCTS ===== */
async function loadWholesaleProducts(searchFilter=null){
const feedContainer=document.getElementById('productFeed');
let localProducts=[],cachedFeed=[];
try{localProducts=JSON.parse(localStorage.getItem('rorraxy_seller_products')||'[]')||[];cachedFeed=JSON.parse(localStorage.getItem(LOCAL_STORAGE_CACHE_KEY)||'[]')||[];}catch(e){}
if(!searchFilter&&!__IS_FILTERED_VIEW&&cachedFeed.length>0){
__ALL_PRODUCTS=cachedFeed;
renderWholesaleCards(prioritizeHomepageFeed(cachedFeed),null,true);
}else if(!__IS_FILTERED_VIEW){
feedContainer.innerHTML=`<div class="feed-status-box"><i class="fa-solid fa-circle-notch fa-spin fa-2x"></i><p style="margin-top:10px;font-size:.75rem;letter-spacing:1px;">${searchFilter?'SEARCHING...':'LOADING WHOLESALE PRODUCTS...'}</p></div>`;
}
let products=[];
try{
const response=await fetch('/api/products?t='+Date.now(),{cache:'no-store'});
if(response.ok){const result=await response.json();const rawData=result.data||result.results||result;if(Array.isArray(rawData))products=rawData;}
}catch(err){console.warn('API Fetch Warning:',err);}
const mergedMap=new Map();
const combined=[...localProducts,...cachedFeed,...products];
for(let i=0;i<combined.length;i++){
const p=combined[i];if(!p||typeof p!=='object')continue;
const pId=p.id||p.product_id||p.product_code||p.title;
if(pId){const key=String(pId);p.__id=key;if(!mergedMap.has(key))mergedMap.set(key,p);}
}
const allProducts=Array.from(mergedMap.values());
let wholesaleProducts=allProducts.filter(p=>{
const mode=String(p.upload_mode||p.mode||'').toLowerCase().trim();
return mode==='wholesale'||mode==='both'||mode===''||mode==='null'||mode==='undefined'||p.is_cj||p.product_code||p.cj_product_id;
});
if(wholesaleProducts.length>0&&!searchFilter){try{localStorage.setItem(LOCAL_STORAGE_CACHE_KEY,JSON.stringify(wholesaleProducts));}catch(e){}}
if(__IS_FILTERED_VIEW&&!searchFilter){if(__ALL_PRODUCTS.length===0)__ALL_PRODUCTS=wholesaleProducts;return;}
__ALL_PRODUCTS=wholesaleProducts;
if(searchFilter){
const{tokens,expanded}=expandSearchTerms(searchFilter);
const scoredMatches=wholesaleProducts.map(item=>{
const tags=extractExpandedTags(item);
const full=normalizeText([item.title,item.subtitle,item.category,item.subCategory,...tags].join(' '));
let ms=0;
tokens.forEach(tk=>{if(full.includes(tk))ms+=10;if(tags.some(t=>t.includes(tk)))ms+=8;});
expanded.forEach(ex=>{if(full.includes(ex))ms+=4;if(tags.some(t=>t===ex||t.includes(ex)))ms+=3;});
return{item,matchScore:ms};
}).filter(x=>x.matchScore>0).sort((a,b)=>b.matchScore-a.matchScore).map(x=>x.item);
__IS_FILTERED_VIEW=true;
showFeedFilterBar(`${searchFilter.toUpperCase()} (${scoredMatches.length})`);
renderWholesaleCards(scoredMatches,null,false);
return;
}
if(wholesaleProducts.length>0){
renderWholesaleCards(prioritizeHomepageFeed(wholesaleProducts),null,true);
}else{
feedContainer.innerHTML=`<div class="feed-status-box" style="color:var(--text-gray);"><i class="fa-solid fa-boxes-stacked fa-2x" style="color:var(--gold-solid);margin-bottom:12px;"></i><p style="font-size:.8rem;font-weight:600;">NO WHOLESALE PRODUCTS FOUND.</p></div>`;
}
}

/* ===== MEDIA RESOLVERS ===== */
function resolveProductImage(p){
let url=FALLBACK_IMG_URL;
try{
if(p.images_json){
if(typeof p.images_json==='string'){const parsed=JSON.parse(p.images_json);if(Array.isArray(parsed)&&parsed.length>0)url=parsed[0];else if(typeof parsed==='string')url=parsed;}
else if(Array.isArray(p.images_json)&&p.images_json.length>0)url=p.images_json[0];
}
}catch(e){if(typeof p.images_json==='string'&&p.images_json.trim()!=='')url=p.images_json.split(',')[0].trim();}
if((!url||url.includes('rorraxy logo')||url===FALLBACK_IMG_URL)&&p.image_url){
if(typeof p.image_url==='string'){
if(p.image_url.startsWith('[')){try{const parsed=JSON.parse(p.image_url);if(Array.isArray(parsed)&&parsed.length>0)url=parsed[0];}catch(e){url=p.image_url;}}
else url=p.image_url;
}else if(Array.isArray(p.image_url)&&p.image_url.length>0)url=p.image_url[0];
}
if((!url||url.includes('mr masudar logo'))&&p.imageUrl)url=p.imageUrl;
if((!url||url.includes('mr masudar logo'))&&(p.productImage||p.jiImageUrl||p.cjImage))url=p.productImage||p.jiImageUrl||p.cjImage;
return url||FALLBACK_IMG_URL;
}
function resolveProductVideo(p){
const c=p.video_url||p.videoUrl||p.video||p.productVideo||'';
if(typeof c==='string'&&c.trim().startsWith('http'))return c.trim();
return'';
}

/* ===== RENDER CARDS (with SHARE + AI LENS) ===== */
function renderWholesaleCards(wholesaleProducts,anchorProductId=null,allowStagger=true){
const feedContainer=document.getElementById('productFeed');
const fragment=document.createDocumentFragment();
if(!Array.isArray(wholesaleProducts)||wholesaleProducts.length===0){
feedContainer.innerHTML=`<div class="feed-status-box" style="color:var(--text-gray);"><i class="fa-solid fa-magnifying-glass fa-2x" style="color:var(--gold-solid);margin-bottom:12px;"></i><p style="font-size:.8rem;font-weight:600;">NO MATCHING PRODUCTS FOUND.</p></div>`;
return;
}
wholesaleProducts.forEach((p,idx)=>{
const pTitle=p.title||'WHOLESALE ITEM';
const bulkPrice=p.price_bulk||p.price_min_whole||p.price||0;
const moqCount=p.moq||1;
const resolvedImageUrl=resolveProductImage(p);
const resolvedVideoUrl=resolveProductVideo(p);
const productId=String(p.__id||p.id||p.product_id||p.product_code||('p_'+idx));
p.__id=productId;
const isNew=Boolean(p.is_new||p.isNew||p.new_arrival);
const safeTitleAttr=escapeHtmlAttr(pTitle);
const safeIdJs=escapeJsSingle(productId);
const cardDiv=document.createElement('div');
cardDiv.className='product-card'+(!allowStagger?' no-animate':'')+(String(anchorProductId)===productId?' is-anchor-card':'');
cardDiv.dataset.productId=productId;
if(allowStagger)cardDiv.style.animationDelay=Math.min(idx*.025,.4)+'s';
cardDiv.onclick=()=>goToProduct(productId);
const mediaTagHtml=resolvedVideoUrl
?`<video src="${escapeHtmlAttr(resolvedVideoUrl)}" poster="${escapeHtmlAttr(resolvedImageUrl)}" autoplay muted loop playsinline preload="metadata" onloadeddata="this.classList.add('loaded-img');this.parentElement.classList.add('loaded');"></video><span class="video-badge-overlay"><i class="fa-solid fa-play"></i></span>`
:`<img src="${escapeHtmlAttr(resolvedImageUrl)}" alt="${safeTitleAttr}" loading="lazy" decoding="async" onload="this.classList.add('loaded-img');this.parentElement.classList.add('loaded');" onerror="this.src='${FALLBACK_IMG_URL}';this.classList.add('loaded-img');this.parentElement.classList.add('loaded');">`;
cardDiv.innerHTML=`
<div class="product-media-box">
${isNew?`<span class="new-badge-overlay">NEW</span>`:''}
<div class="price-qty-overlay"><span class="price">$${(parseFloat(bulkPrice)||0).toFixed(2)}</span><span class="qty">MIN ${escapeHtmlAttr(moqCount)} PCS</span></div>
${mediaTagHtml}
<button type="button" class="share-corner-btn" title="Share product" onclick="shareProduct('${safeIdJs}',event)">
<svg viewBox="0 0 24 24" fill="none" stroke="url(#goldGradientSvg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
<line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
</svg>
</button>
<button type="button" class="ai-lens-corner-btn" title="Find similar" onclick="triggerRelatedFeedSearch('${safeIdJs}',event)">
<svg viewBox="0 0 24 24" fill="none" stroke="url(#goldGradientSvg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M10.5 3.5a7 7 0 1 0 7 7"/><line x1="15.8" y1="15.8" x2="20.5" y2="20.5"/>
<path d="M18.2 2.2l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1z" fill="url(#goldGradientSvg)" stroke="none"/>
</svg>
</button>
</div>`;
fragment.appendChild(cardDiv);
});
feedContainer.innerHTML='';
feedContainer.appendChild(fragment);
}

/* ===== CART BADGE ===== */
function updateCartBadgeCount(){
let cart=[];
try{cart=JSON.parse(localStorage.getItem('rorraxy_cart')||'[]')||[];}catch(e){}
const totalQty=cart.reduce((sum,item)=>sum+(parseInt(item.qty,10)||0),0);
const badge=document.getElementById('floatingCartItemCountBadge');
if(badge){badge.innerText=totalQty;totalQty>0?badge.classList.remove('empty-badge'):badge.classList.add('empty-badge');}
}
