    <style>
        :root {
            --bg-wholesale: #07070b;
            --card-wholesale: linear-gradient(155deg, #11111a 0%, #09090f 100%);
            --header-wholesale: rgba(9, 9, 14, 0.96);
            --footer-wholesale: rgba(6, 6, 10, 0.98);
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --gold-light: #fcf6ba;
            --pink-love: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #a6a6bd;
            --font-main: 'Poppins', system-ui, -apple-system, sans-serif;
            --font-price: 'Barlow Condensed', system-ui, -apple-system, sans-serif;
            --luxury-ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden;
            background: radial-gradient(circle at 50% 0%, #13131f 0%, #07070b 65%) !important;
            color: var(--text-white); font-family: var(--font-main);
            min-height: 100vh; font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
            text-rendering: optimizeSpeed;
            scrollbar-width: none;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        body { padding-top: 44px; padding-bottom: 68px; text-transform: uppercase !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button, a, select, .product-card { touch-action: manipulation; user-select: none; -webkit-user-select: none; }

        /* =========================================================
           LUXURY SHIMMER ONLY FOR PRICE / SHARE FOOTER BAR
           ========================================================= */
        @keyframes luxuryFooterSweep {
            0% { transform: translate3d(-120%, 0, 0) skewX(-22deg); }
            45%, 100% { transform: translate3d(260%, 0, 0) skewX(-22deg); }
        }

        @keyframes badgePulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 42, 133, 0.5); }
            50% { box-shadow: 0 0 8px 2px rgba(255, 42, 133, 0.3); }
        }

        @keyframes smoothMarquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* =========================================================
           CLEAN STATIC LUXURY HEADER
           ========================================================= */
        header.app-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--header-wholesale);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            padding: 0 0 0 8px; height: 44px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.14);
            transform: translate3d(0, 0, 0);
            contain: layout style;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        }
        .trending-marquee-bar {
            overflow: hidden; white-space: nowrap; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
            flex: 1; display: flex; align-items: center; height: 44px; position: relative; background: transparent;
        }
        .marquee-container {
            display: flex; width: max-content;
            animation: smoothMarquee 22s linear infinite;
            will-change: transform;
            backface-visibility: hidden;
        }
        .marquee-group { display: flex; align-items: center; gap: 36px; padding-right: 36px; flex-shrink: 0; }
        .marquee-group span { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; letter-spacing: 0.6px; }
        .txt-gold {
            background: var(--gold-gradient);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mode-selector-wrapper {
            position: relative; display: flex; align-items: center; height: 44px;
            background: rgba(5, 5, 10, 0.95); padding: 0 12px 0 10px;
            border-left: 1px solid rgba(212, 175, 55, 0.16);
            flex-shrink: 0;
        }
        .mode-selector-corner {
            background-color: transparent; border: none; outline: none;
            background-image: var(--gold-gradient);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 0.72rem; font-weight: 800; padding-right: 15px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.6px;
            height: 100%; z-index: 1001; appearance: none; -webkit-appearance: none; -moz-appearance: none;
            font-family: var(--font-main);
        }
        .mode-selector-wrapper::after {
            content: "\f0d7"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 9px; pointer-events: none;
            font-size: 0.68rem; color: var(--gold-light);
        }
        .mode-selector-corner option {
            background: #0a0a0f; color: #ffffff; -webkit-text-fill-color: #ffffff; font-weight: 600; padding: 10px;
        }

        /* =========================================================
           SUPER-FAST MASONRY FEED & LUXURY PRODUCT CARDS
           ========================================================= */
        .feed-container {
            padding: 10px 8px;
            column-count: 2;
            column-gap: 9px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            contain: layout style;
        }
        @media (min-width: 768px) {
            .feed-container {
                column-count: 4;
                column-gap: 14px;
                padding: 14px;
            }
        }
        .product-card {
            background: var(--card-wholesale); border-radius: 14px; overflow: hidden;
            display: inline-block; width: 100%;
            border: 1px solid rgba(212, 175, 55, 0.16); position: relative; cursor: pointer;
            margin-bottom: 9px; break-inside: avoid; page-break-inside: avoid;
            opacity: 0;
            transform: translate3d(0, 12px, 0) scale(0.985);
            transition: opacity 0.28s var(--luxury-ease), transform 0.28s var(--luxury-ease), border-color 0.22s ease, box-shadow 0.22s ease;
            transition-delay: var(--stagger, 0ms);
            contain: paint;
            backface-visibility: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        }
        @media (min-width: 768px) {
            .product-card { margin-bottom: 14px; }
        }
        .product-card.card-visible {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
        }
        .product-card:hover {
            border-color: rgba(212, 175, 55, 0.45);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
            transform: translate3d(0, -2px, 0);
        }
        .product-card:active { transform: scale(0.97); transition-duration: 0.08s; }

        .product-media-box {
            position: relative; width: 100%; aspect-ratio: 1 / 1;
            background: #0c0c14;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .product-media-box img {
            width: 100%; height: 100%; display: block; object-fit: cover; background: transparent;
            position: relative; z-index: 1;
            opacity: 0;
            transform: scale(1.02);
            transition: opacity 0.22s ease-out, transform 0.35s var(--luxury-ease);
        }
        .product-media-box img.loaded-img { opacity: 1; transform: scale(1); }
        .product-card:hover .product-media-box img.loaded-img { transform: scale(1.04); }

        /* =========================================================
           SINGLE-LINE 3-TIER CRISP PRICE & QUANTITY FOOTER BAR
           ========================================================= */
        .card-footer-actions {
            display: flex; align-items: center; justify-content: center;
            padding: 7px 6px;
            background: linear-gradient(180deg, #0b0b12 0%, #06060a 100%) !important;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            white-space: nowrap; overflow: hidden;
            position: relative; z-index: 2;
        }
        @media (min-width: 768px) {
            .card-footer-actions {
                padding: 8px 10px;
            }
        }
        .card-footer-actions::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 45%; height: 100%;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(212, 175, 55, 0.05) 25%,
                rgba(252, 246, 186, 0.22) 50%,
                rgba(212, 175, 55, 0.05) 75%,
                transparent 100%
            );
            animation: luxuryFooterSweep 3.4s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
            animation-delay: var(--footer-shimmer-delay, 0s);
            will-change: transform;
            pointer-events: none;
            z-index: 1;
        }

        /* Full-Width 3-Tier Single Line Container (Auto-scales for large numbers like $1000.00) */
        .wholesale-tiers-line {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            min-width: 0;
            gap: 2px;
            position: relative;
            z-index: 2;
            font-family: var(--font-price);
        }
        @media (min-width: 768px) {
            .wholesale-tiers-line {
                gap: 6px;
            }
        }

        .tier-item {
            display: inline-flex;
            align-items: baseline;
            line-height: 1;
            white-space: nowrap;
            min-width: 0;
        }

        .tier-sep {
            color: rgba(212, 175, 55, 0.28);
            font-size: clamp(0.65rem, 2.6vw, 0.85rem);
            font-weight: 600;
            line-height: 1;
            user-select: none;
            flex-shrink: 0;
        }

        .tier-q {
            font-size: clamp(0.64rem, 2.6vw, 0.84rem);
            font-weight: 700;
            color: #c6c6dc;
            margin-right: 1px;
        }
        .tier-p {
            font-size: clamp(0.76rem, 3.2vw, 1.02rem);
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (min-width: 768px) {
            .tier-q { font-size: 0.90rem; margin-right: 2px; }
            .tier-p { font-size: 1.08rem; }
            .tier-sep { font-size: 0.88rem; }
        }

        /* =========================================================
           BOTTOM 5 MENUS - STATIC GOLDEN GRADIENT
           ========================================================= */
        nav.bottom-nav {
            position: fixed !important; bottom: 0 !important; left: 0 !important; width: 100% !important; height: 60px !important;
            background: var(--footer-wholesale) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex !important; justify-content: space-around !important; align-items: center !important; padding: 4px !important;
            border-top: 1px solid rgba(212, 175, 55, 0.14);
            z-index: 9999999 !important;
            transform: translate3d(0, 0, 0);
            contain: layout style;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.65);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none;
            font-size: 0.52rem; font-weight: 700; cursor: pointer; text-align: center; gap: 3px; flex: 1; height: 100%; text-transform: uppercase;
            background-color: transparent; border: none; outline: none;
        }
        .nav-item:active { transform: scale(0.92); }
        .nav-item i {
            font-size: 1.2rem;
            background-image: var(--gold-gradient);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-item span { color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; font-size: 0.52rem; font-weight: 700; letter-spacing: 0.4px; }

        .cart-icon-box { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .cart-badge-circle {
            position: absolute; top: -5px; right: -8px; background: var(--pink-love); color: #ffffff !important;
            font-size: 0.52rem; font-weight: 800; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 5;
            animation: badgePulseGlow 2.4s infinite ease-in-out;
        }
        .cart-badge-circle.empty-badge { display: none !important; }
        .cart-custom-svg { width: 21px; height: 21px; fill: url(#goldGradientSvg); }

        /* =========================================================
           CLEAN MODALS
           ========================================================= */
        .floating-search-modal {
            position: fixed; inset: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 7, 0.86);
            z-index: 2000000; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.16s ease, visibility 0.16s ease; padding: 16px;
        }
        .floating-search-modal.active { opacity: 1; visibility: visible; }
        .floating-search-box {
            background: linear-gradient(155deg, #12121e 0%, #08080e 100%);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 450px;
            display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            position: relative; overflow: hidden;
            transform: scale(0.96) translateY(8px);
            transition: transform 0.2s var(--luxury-ease);
        }
        .floating-search-modal.active .floating-search-box {
            transform: scale(1) translateY(0);
        }
        .close-modal-btn {
            position: absolute; top: 14px; right: 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: var(--text-gray); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.95rem; cursor: pointer;
        }
        .modal-title {
            font-size: 0.98rem; font-weight: 800;
            background-image: var(--gold-gradient);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        .modal-input-container { display: flex; flex-direction: column; gap: 12px; }
        .modal-input {
            width: 100%; background: #05050a; border: 1px solid rgba(212, 175, 55, 0.32);
            border-radius: 12px; padding: 13px 16px; color: #ffffff; font-weight: 600; font-size: 0.9rem; outline: none; text-transform: uppercase;
        }
        .modal-input:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.2);
        }
        .search-bottom-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        .search-action-item-btn {
            background: rgba(212, 175, 55, 0.07); border: 1px solid rgba(212, 175, 55, 0.22);
            border-radius: 12px; padding: 11px 8px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px; width: 100%;
            transition: transform 0.14s ease, border-color 0.14s ease;
        }
        .search-action-item-btn:hover { border-color: var(--gold-light); }
        .search-action-item-btn:active { transform: scale(0.95); }
        .search-action-item-btn i { font-size: 1.1rem; background-image: var(--gold-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .search-action-item-btn span { font-size: 0.6rem; font-weight: 700; background-image: var(--gold-gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .external-page-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 60px); height: calc(100dvh - 60px);
            background: #000; z-index: 1500000; display: none; border: none; outline: none;
        }
        .external-page-overlay.active { display: block; }
        .external-page-overlay iframe { width: 100%; height: 100%; border: none; }

        .universal-share-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px;
        }
        .share-target-btn {
            background: #06060a; border: 1px solid rgba(212, 175, 55, 0.22); border-radius: 12px;
            padding: 10px 6px; color: #ffffff; font-size: 0.6rem; font-weight: 700; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
            text-decoration: none; transition: transform 0.1s ease;
        }
        .share-target-btn:active { transform: scale(0.95); }
        .share-target-btn:hover {
            background: var(--gold-gradient); color: #000000; border-color: transparent;
        }
        .share-target-btn i { font-size: 1.05rem; }
        .share-link-copy-row { display: flex; gap: 6px; margin-top: 6px; }
        .share-link-box {
            flex: 1; min-width: 0; background: #050508; border: 1px solid rgba(212,175,55,0.28);
            border-radius: 10px; padding: 8px 10px; color: var(--gold-solid); font-size: 0.64rem;
            outline: none; text-transform: none !important;
        }

        /* Toast Notification */
        #fastToastMsg {
            position: fixed; top: 54px; left: 50%; transform: translate3d(-50%, -18px, 0);
            background: #0c0c14; border: 1px solid var(--gold-solid); color: #fcf6ba;
            padding: 8px 18px; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
            z-index: 99999999; opacity: 0; pointer-events: none; transition: opacity 0.16s ease, transform 0.16s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85);
        }
        #fastToastMsg.show { opacity: 1; transform: translate3d(-50%, 0, 0); }

        @supports not ((-webkit-background-clip:text) or (background-clip:text)) {
            .txt-gold, .mode-selector-corner, .tier-p, .share-icon-btn, .nav-item i, .modal-title, .search-action-item-btn i, .search-action-item-btn span {
                background: none !important; -webkit-text-fill-color: initial !important; color: var(--gold-solid) !important;
            }
        }
    </style>
</head>

                <button type="button" id="shareModalCopyBtn" onclick="copyShareLinkFromModal()" style="background:var(--gold-gradient); color:#000; border:none; padding:0 14px; border-radius:10px; font-weight:800; font-size:0.68rem; cursor:pointer;">COPY</button>
            </div>

    <nav class="bottom-nav" id="bottomNav">
        <a href="https://rorraxy.com/world" class="nav-item">
            <i class="fa-solid fa-earth-americas"></i>
            <span>World</span>
        </a>

            <i class="fa-solid fa-user"></i>
            <span>You</span>

            <i class="fa-solid fa-list-check"></i>
            <span>Category</span>

            <i class="fa-solid fa-magnifying-glass"></i>

            <div class="cart-icon-box">
                <svg class="cart-custom-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="cart-badge-circle empty-badge" id="floatingCartItemCountBadge">0</span>
            </div>
            <span>Cart</span>
        </button>

    <script>
        const LOCAL_STORAGE_CACHE_KEY = 'rorraxy_wholesale_feed_cache';
        const WHOLESALE_CART_KEY = 'rorraxy_wholesale_cart';
        const FALLBACK_IMG_URL = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png';
        const $ = id => document.getElementById(id);
        let cachedAffiliateId = null;
        let masterWholesaleProducts = [];
        let renderedCount = 0;
        const BATCH_SIZE = 28;
        let activeFilteredList = [];
        let toastTimer = null;

        function showFastToast(msg) {
            const el = $('fastToastMsg');
            if (!el) return;
            el.innerText = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
        }

        function debounce(fn, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        function getActiveAffiliateId() {
            if (cachedAffiliateId !== null) return cachedAffiliateId;
            const urlParams = new URLSearchParams(window.location.search);
            const refFromUrl = urlParams.get('ref') || urlParams.get('aff') || urlParams.get('affiliate');

            if (refFromUrl) {
                try {
                    localStorage.setItem('rorraxy_active_affiliate_ref', refFromUrl);
                    sessionStorage.setItem('rorraxy_active_affiliate_ref', refFromUrl);
                } catch(e) {}
                cachedAffiliateId = refFromUrl;
                return cachedAffiliateId;
            }

            let userProfile = {};
            try {
                userProfile = JSON.parse(localStorage.getItem('rorraxy_user_account') || 'null') || JSON.parse(localStorage.getItem('user_profile') || 'null') || {};
            } catch(e) {}

            cachedAffiliateId = userProfile.affiliate_id || userProfile.id || userProfile.userId || localStorage.getItem('rorraxy_my_affiliate_id') || localStorage.getItem('rorraxy_active_affiliate_ref') || sessionStorage.getItem('rorraxy_active_affiliate_ref') || null;
            return cachedAffiliateId;
        }

        function buildProductShareUrl(productId) {
            const affId = getActiveAffiliateId();
            const rate = localStorage.getItem('rorraxy_active_commission_rate') || '3';
            const platform = localStorage.getItem('rorraxy_active_platform') || 'wholesale';
            let shareUrl = `${window.location.origin}/wholesale/pd.html?id=${encodeURIComponent(productId)}`;
            if (affId) shareUrl += `&ref=${encodeURIComponent(affId)}&rate=${rate}&platform=${platform}`;
            return shareUrl;
        }

        function escapeHtmlAttr(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function escapeJsSingle(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }

        /**
         * Always displays 2 decimal places (e.g., $20.00, $1000.00) cleanly on a single line.
         */
        function formatCompactTierPrice(val) {
            const num = parseFloat(val) || 0;
            return `$${num.toFixed(2)}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const selector = $('userModeSelector');
            if (selector) selector.value = 'wholesale';

            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref') || urlParams.get('aff') || urlParams.get('affiliate');
            const rateParam = urlParams.get('rate') || '3';
            const platformParam = urlParams.get('platform') || 'wholesale';

            if (refParam) {
                localStorage.setItem('rorraxy_active_affiliate_ref', refParam);
                localStorage.setItem('rorraxy_active_commission_rate', rateParam);
                localStorage.setItem('rorraxy_active_platform', platformParam);
            }

            getActiveAffiliateId();
            updateCartBadgeCount();
            setupInfiniteScroll();

            window.addEventListener('storage', (e) => {
                if (e.key === WHOLESALE_CART_KEY) {
                    updateCartBadgeCount();
                }
            });
            window.addEventListener('focus', updateCartBadgeCount);
            window.addEventListener('pageshow', updateCartBadgeCount);

            const searchQuery = urlParams.get('search') || urlParams.get('q') || urlParams.get('category');
            loadWholesaleProducts(searchQuery);

            const searchInput = $('modalSearchInput');
            if (searchInput) {
                const liveSearch = debounce((val) => {
                    if (val.trim().length >= 2) loadWholesaleProducts(val.trim());
                }, 220);
                searchInput.addEventListener('input', (e) => liveSearch(e.target.value));
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') submitModalSearch();
                });
            }
        });

        function switchEcosystemMode(selectedMode) {
            window.location.href = selectedMode === 'retail' ? '/' : '/wholesale/';
        }

        function closeAllOverlays() {
            $('searchModal')?.classList.remove('active');
            $('accountPageOverlay')?.classList.remove('active');
            $('categoryPageOverlay')?.classList.remove('active');
            $('cartPageOverlay')?.classList.remove('active');
            $('universalShareModal')?.classList.remove('active');
            updateCartBadgeCount();
        }

        function toggleAccountPage() {
            const overlay = $('accountPageOverlay');
            const iframe = $('accountPageIframe');
            const isOpen = overlay.classList.contains('active');
            closeAllOverlays();
            if (!isOpen) {
                if (iframe && !iframe.getAttribute('src')) iframe.src = '/wholesale/account.html';
                overlay.classList.add('active');
            }
        }

        function toggleCategoryPage() {
            const overlay = $('categoryPageOverlay');
            const iframe = $('categoryPageIframe');
            const isOpen = overlay.classList.contains('active');
            closeAllOverlays();
            if (!isOpen) {
                if (iframe && !iframe.getAttribute('src')) iframe.src = '/wholesale/category.html';
                overlay.classList.add('active');
            }
        }

        function toggleSearchModal() {
            const overlay = $('searchModal');
            const isOpen = overlay.classList.contains('active');
            closeAllOverlays();
            if (!isOpen) {
                overlay.classList.add('active');
                setTimeout(() => $('modalSearchInput')?.focus(), 40);
            }
        }

        function toggleCartPage() {
            const overlay = $('cartPageOverlay');
            const iframe = $('cartPageIframe');
            const isOpen = overlay.classList.contains('active');
            closeAllOverlays();
            if (!isOpen) {
                if (iframe) iframe.src = '/wholesale/cart.html?t=' + Date.now();
                overlay.classList.add('active');
            }
        }

        function handleOutsideClick(event, overlayId) {
            if (event.target === $(overlayId)) closeAllOverlays();
        }

        function submitModalSearch() {
            const input = $('modalSearchInput');
            if (!input) return;
            const query = input.value.trim();
            closeAllOverlays();
            loadWholesaleProducts(query || null);
        }

        function startAudioSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showFastToast("VOICE SEARCH NOT SUPPORTED");
                return;
            }
            const searchInput = $('modalSearchInput');
            searchInput.value = "";
            searchInput.placeholder = "LISTENING...";
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                searchInput.value = transcript;
                closeAllOverlays();
                loadWholesaleProducts(transcript);
            };
            recognition.onerror = () => { searchInput.placeholder = "Type bulk product name..."; };
            try { recognition.start(); } catch (err) {}
        }

        function handleCameraSearch(event) {
            if (!event.target.files[0]) return;
            closeAllOverlays();
            showFastToast("ANALYZING IMAGE...");
            loadWholesaleProducts(null);
        }

        function seededShuffle(array, seed) {
            let m = array.length;
            const arr = [...array];
            while (m) {
                const x = Math.sin(seed++) * 10000;
                const r = x - Math.floor(x);
                const i = Math.floor(r * m--);
                [arr[m], arr[i]] = [arr[i], arr[m]];
            }
            return arr;
        }

        function getReverseOppositeWholesaleProducts(rawList) {
            if (!Array.isArray(rawList) || rawList.length === 0) return [];
            const invertedList = [...rawList].reverse();
            const splitPoint = Math.floor(invertedList.length * 0.6);
            const sessionSeed = Math.floor(Date.now() / 10000);
            const partA = seededShuffle(invertedList.slice(0, splitPoint), sessionSeed + 101);
            const partB = seededShuffle(invertedList.slice(splitPoint), sessionSeed + 202);

            const wholesaleFeed = [];
            while (partA.length > 0 || partB.length > 0) {
                if (partB.length > 0) wholesaleFeed.push(partB.shift());
                if (partA.length > 0) wholesaleFeed.push(partA.shift());
                if (partA.length > 0) wholesaleFeed.push(partA.shift());
            }
            return wholesaleFeed;
        }

        function resolveProductImage(p) {
            let url = FALLBACK_IMG_URL;
            try {
                if (p.images_json) {
                    if (typeof p.images_json === 'string') {
                        const parsed = JSON.parse(p.images_json);
                        if (Array.isArray(parsed) && parsed.length > 0) url = parsed[0];
                        else if (typeof parsed === 'string') url = parsed;
                    } else if (Array.isArray(p.images_json) && p.images_json.length > 0) {
                        url = p.images_json[0];
                    }
                }
            } catch(e) {
                if (typeof p.images_json === 'string' && p.images_json.trim() !== '') {
                    url = p.images_json.split(',')[0].trim();
                }
            }

            if ((!url || url.includes('rorraxy logo') || url === FALLBACK_IMG_URL) && p.image_url) {
                if (typeof p.image_url === 'string') {
                    if (p.image_url.startsWith('[')) {
                        try {
                            const parsed = JSON.parse(p.image_url);
                            if (Array.isArray(parsed) && parsed.length > 0) url = parsed[0];
                        } catch(e) { url = p.image_url; }
                    } else {
                        url = p.image_url;
                    }
                } else if (Array.isArray(p.image_url) && p.image_url.length > 0) {
                    url = p.image_url[0];
                }
            }

            if ((!url || url.includes('mr masudar logo')) && p.imageUrl) url = p.imageUrl;
            if ((!url || url.includes('mr masudar logo')) && (p.productImage || p.jiImageUrl || p.cjImage)) {
                url = p.productImage || p.jiImageUrl || p.cjImage;
            }
            return url || FALLBACK_IMG_URL;
        }

        async function loadWholesaleProducts(searchFilter = null) {
            const feedContainer = $('productFeed');
            let localProducts = [];
            let cachedFeed = [];

            try {
                localProducts = JSON.parse(localStorage.getItem('rorraxy_seller_products') || '[]') || [];
                cachedFeed = JSON.parse(localStorage.getItem(LOCAL_STORAGE_CACHE_KEY) || '[]') || [];
            } catch(e) {}

            if (cachedFeed.length > 0) {
                let initialList = getReverseOppositeWholesaleProducts(cachedFeed);
                if (searchFilter) {
                    const q = searchFilter.toLowerCase();
                    initialList = initialList.filter(item => `${item.title || ''} ${item.category || ''} ${item.tag || ''} ${item.description || ''}`.toLowerCase().includes(q));
                }
                if (initialList.length > 0) startBatchRender(initialList);
            } else {
                feedContainer.innerHTML = `<div style="column-span: all; text-align: center; padding: 60px 0; color: var(--gold-solid);"><i class="fa-solid fa-circle-notch fa-spin fa-xl"></i></div>`;
            }

            let products = [];
            try {
                const response = await fetch('/api/products?t=' + Date.now(), { cache: 'no-store' });
                if (response.ok) {
                    const result = await response.json();
                    const rawData = result.data || result.results || result;
                    if (Array.isArray(rawData)) products = rawData;
                }
            } catch (err) {}

            const mergedMap = new Map();
            const combined = [...localProducts, ...cachedFeed, ...products];
            for (let i = 0; i < combined.length; i++) {
                const p = combined[i];
                const pId = p.id || p.product_id || p.product_code || p.title;
                if (pId) mergedMap.set(String(pId), p);
            }

            const allProducts = Array.from(mergedMap.values());
            let wholesaleProducts = allProducts.filter(p => {
                const mode = String(p.upload_mode || p.mode || "").toLowerCase().trim();
                return mode === 'wholesale' || mode === 'both' || mode === '' || mode === 'null' || mode === 'undefined' || p.is_cj || p.product_code || p.cj_product_id;
            });

            if (!searchFilter && wholesaleProducts.length > 0) {
                try { localStorage.setItem(LOCAL_STORAGE_CACHE_KEY, JSON.stringify(wholesaleProducts)); } catch(e) {}
            }

            if (searchFilter) {
                const query = searchFilter.toLowerCase();
                wholesaleProducts = wholesaleProducts.filter(item => `${item.title || ''} ${item.category || ''} ${item.tag || ''} ${item.description || ''}`.toLowerCase().includes(query));
            }

            if (wholesaleProducts.length > 0) {
                const nextList = getReverseOppositeWholesaleProducts(wholesaleProducts);
                if (renderedCount === 0 || searchFilter || nextList.length !== activeFilteredList.length) {
                    masterWholesaleProducts = nextList;
                    startBatchRender(masterWholesaleProducts);
                }
            } else {
                feedContainer.innerHTML = `
                    <div style="column-span: all; text-align: center; padding: 60px 20px; color: var(--text-gray);">
                        <i class="fa-solid fa-boxes-stacked fa-2x" style="color: var(--gold-solid); margin-bottom: 12px;"></i>
                        <p style="font-size: 0.8rem; font-weight: 600;">NO WHOLESALE PRODUCTS FOUND.</p>
                    </div>
                `;
            }
        }

        function startBatchRender(list) {
            activeFilteredList = list;
            renderedCount = 0;
            $('productFeed').innerHTML = '';
            appendBatchCards(BATCH_SIZE);
        }

        function appendBatchCards(count) {
            const feedContainer = $('productFeed');
            if (!feedContainer || renderedCount >= activeFilteredList.length) return;

            const endIdx = Math.min(renderedCount + count, activeFilteredList.length);
            const fragment = document.createDocumentFragment();
            const affId = getActiveAffiliateId();
            const rate = localStorage.getItem('rorraxy_active_commission_rate') || '3';
            const platform = localStorage.getItem('rorraxy_active_platform') || 'wholesale';

            const organicDelays = [0.1, 1.35, 0.65, 2.05, 0.35, 1.75, 0.95, 2.4];

            for (let idx = renderedCount; idx < endIdx; idx++) {
                const p = activeFilteredList[idx];
                const pTitle = p.title || 'WHOLESALE ITEM';

                // Calculate the 3 wholesale tiers matching pd.html logic
                const basePrice = parseFloat(p.price_bulk || p.price_min_whole || p.price || p.wholesale_price) || 25.00;
                const tier100Price = parseFloat(p.price_100) || (basePrice * 0.80);
                const tier300Price = parseFloat(p.price_300) || (basePrice * 0.72);
                const moqQty = parseInt(p.moq || p.MOQ || 1, 10) || 1;

                const resolvedImageUrl = resolveProductImage(p);
                const productId = String(p.id || p.product_id || p.product_code || '');

                const safeTitleAttr = escapeHtmlAttr(pTitle);
                const safeTitleJs = escapeJsSingle(pTitle);
                const safeIdJs = escapeJsSingle(productId);
                const isEager = idx < 12;

                const cardDiv = document.createElement('div');
                cardDiv.className = 'product-card';
                const staggerMs = (idx % 6) * 20;
                const footerShimmerOffset = organicDelays[idx % organicDelays.length];
                cardDiv.style.setProperty('--stagger', `${staggerMs}ms`);
                cardDiv.style.setProperty('--footer-shimmer-delay', `${footerShimmerOffset}s`);

                cardDiv.onclick = () => {
                    let url = `pd.html?id=${encodeURIComponent(productId)}`;
                    if (affId) url += `&ref=${encodeURIComponent(affId)}&rate=${rate}&platform=${platform}`;
                    location.href = url;
                };

                // Full-width single-line 3-tier quantity & price (2 decimal places, no share button)
                cardDiv.innerHTML = `
                    <div class="product-media-box">
                        <img src="${escapeHtmlAttr(resolvedImageUrl)}" alt="${safeTitleAttr}" loading="${isEager ? 'eager' : 'lazy'}" ${isEager ? 'fetchpriority="high"' : ''} decoding="async">
                    </div>
                    <div class="card-footer-actions">
                        <div class="wholesale-tiers-line" title="Qty ${moqQty}: ${formatCompactTierPrice(basePrice)} | Qty 100: ${formatCompactTierPrice(tier100Price)} | Qty 300: ${formatCompactTierPrice(tier300Price)}">
                            <span class="tier-item"><span class="tier-q">${moqQty}:</span><span class="tier-p">${formatCompactTierPrice(basePrice)}</span></span>
                            <span class="tier-sep">|</span>
                            <span class="tier-item"><span class="tier-q">100:</span><span class="tier-p">${formatCompactTierPrice(tier100Price)}</span></span>
                            <span class="tier-sep">|</span>
                            <span class="tier-item"><span class="tier-q">300:</span><span class="tier-p">${formatCompactTierPrice(tier300Price)}</span></span>
                        </div>
                    </div>
                `;

                const img = cardDiv.querySelector('img');
                const markLoaded = () => img.classList.add('loaded-img');

                if (img.complete && img.naturalWidth > 0) {
                    markLoaded();
                } else {
                    img.addEventListener('load', markLoaded, { once: true });
                    img.addEventListener('error', () => {
                        img.onerror = null;
                        img.src = FALLBACK_IMG_URL;
                        markLoaded();
                    }, { once: true });
                }

                fragment.appendChild(cardDiv);
            }

            feedContainer.appendChild(fragment);
            renderedCount = endIdx;

            requestAnimationFrame(() => {
                feedContainer.querySelectorAll('.product-card:not(.card-visible)').forEach(c => c.classList.add('card-visible'));
            });
        }

        function setupInfiniteScroll() {
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    if ((window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 650)) {
                        appendBatchCards(BATCH_SIZE);
                    }
                    ticking = false;
                });
            }, { passive: true });
        }

        async function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {}
            }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        function showShareTick(btnEl) {
            if (!btnEl) return;
            const origHtml = btnEl.innerHTML;
            btnEl.innerHTML = `<i class="fa-solid fa-check" style="color:#00e676;-webkit-text-fill-color:#00e676;"></i>`;
            setTimeout(() => { btnEl.innerHTML = origHtml; }, 1400);
        }

        async function shareProduct(event, title, productId) {
            if (event) event.stopPropagation();
            const btnEl = event && event.currentTarget ? event.currentTarget : null;
            const shareUrl = buildProductShareUrl(productId);
            const shareText = `${title} - rorraxy Wholesale`;

            if (typeof navigator.share === 'function') {
                try {
                    await navigator.share({ title: title, text: shareText, url: shareUrl });
                    showShareTick(btnEl);
                    return;
                } catch(e) {
                    if (e && e.name === 'AbortError') return;
                }
            }

            await copyTextToClipboard(shareUrl);
            showShareTick(btnEl);
            openUniversalShareModal(title, shareText, shareUrl);
        }

        function openUniversalShareModal(title, text, url) {
            closeAllOverlays();
            const modal = $('universalShareModal');
            const grid = $('shareTargetGrid');
            const urlInput = $('shareModalUrlInput');
            const copyBtn = $('shareModalCopyBtn');

            if (copyBtn) copyBtn.innerText = 'COPY';
            if (urlInput) urlInput.value = url;

            const encUrl = encodeURIComponent(url);
            const encText = encodeURIComponent(`${text}\n${url}`);
            const encTitle = encodeURIComponent(title);

            const targets = [
                { name: 'WHATSAPP', icon: 'fa-brands fa-whatsapp', href: `https://wa.me/?text=${encText}` },
                { name: 'TELEGRAM', icon: 'fa-brands fa-telegram', href: `https://t.me/share/url?url=${encUrl}&text=${encText}` },
                { name: 'MESSENGER', icon: 'fa-brands fa-facebook-messenger', href: `https://www.facebook.com/dialog/send?link=${encUrl}&app_id=291494419107518&redirect_uri=${encUrl}` },
                { name: 'FACEBOOK', icon: 'fa-brands fa-facebook', href: `https://www.facebook.com/sharer/sharer.php?u=${encUrl}` },
                { name: 'X / TWITTER', icon: 'fa-brands fa-x-twitter', href: `https://twitter.com/intent/tweet?url=${encUrl}&text=${encText}` },
                { name: 'LINKEDIN', icon: 'fa-brands fa-linkedin', href: `https://www.linkedin.com/sharing/share-offsite/?url=${encUrl}` },
                { name: 'REDDIT', icon: 'fa-brands fa-reddit', href: `https://www.reddit.com/submit?url=${encUrl}&title=${encTitle}` },
                { name: 'EMAIL APP', icon: 'fa-solid fa-envelope', href: `mailto:?subject=${encTitle}&body=${encText}` },
                { name: 'OPEN LINK', icon: 'fa-solid fa-up-right-from-square', href: url, copyFirst: true }
            ];

            grid.innerHTML = targets.map(t => `
                <a class="share-target-btn" href="${escapeHtmlAttr(t.href)}" target="_blank" rel="noopener noreferrer" ${t.copyFirst ? `onclick="copyTextToClipboard('${escapeJsSingle(url)}')"` : ''}>
                    <i class="${t.icon}"></i>
                    <span>${t.name}</span>
                </a>
            `).join('');

            modal.classList.add('active');
        }

        function closeShareModal() {
            $('universalShareModal')?.classList.remove('active');
        }

        async function copyShareLinkFromModal() {
            const input = $('shareModalUrlInput');
            const btn = $('shareModalCopyBtn');
            if (!input) return;
            input.select();
            await copyTextToClipboard(input.value);
            if (btn) {
                btn.innerText = 'COPIED';
                setTimeout(() => { btn.innerText = 'COPY'; }, 1400);
            }
        }

        function updateCartBadgeCount() {
            let cart = [];
            try {
                cart = JSON.parse(localStorage.getItem(WHOLESALE_CART_KEY) || '[]') || [];
            } catch(e) { cart = []; }
            const totalQty = cart.reduce((sum, item) => sum + (parseInt(item.qty || item.quantity, 10) || 0), 0);
            const badge = $('floatingCartItemCountBadge');
            if (badge) {
                badge.innerText = totalQty;
                totalQty > 0 ? badge.classList.remove('empty-badge') : badge.classList.add('empty-badge');
            }
        }
    </script>
</body>
</html>
