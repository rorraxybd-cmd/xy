    <style>
        :root {
            --bg-wholesale: #0b0b0b;
            --card-wholesale: #0c0c12;
            --header-wholesale: rgba(11, 11, 11, 0.95);
            --footer-wholesale: rgba(6, 6, 8, 0.95);
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --pink-love: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #a0a0b5;
            --font-main: 'Poppins', system-ui, -apple-system, sans-serif;
        }
        html, body {
            width: 100%; max-width: 100vw; overflow-x: hidden;
            background: var(--bg-wholesale) !important;
            color: var(--text-white); font-family: var(--font-main);
            min-height: 100vh; font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        body { padding-top: 42px; padding-bottom: 85px; text-transform: uppercase !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* ---------- header ---------- */
        header.app-header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: var(--header-wholesale); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding: 0 0 0 8px; height: 42px;
            transform: translateZ(0);
        }
        .trending-marquee-bar {
            overflow: hidden; white-space: nowrap; font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
            flex: 1; display: flex; align-items: center; height: 42px; position: relative; background: transparent;
        }
        .marquee-container {
            display: flex; width: max-content;
            animation: smoothMarquee 22s linear infinite;
            will-change: transform;
            backface-visibility: hidden;
        }
        .marquee-group { display: flex; align-items: center; gap: 40px; padding-right: 40px; flex-shrink: 0; }
        .marquee-group span { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-gray); }
        .txt-gold { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes smoothMarquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
        .mode-selector-wrapper {
            position: relative; display: flex; align-items: center; height: 42px;
            background: #050508; padding: 0 10px 0 6px; border-left: 1px solid rgba(212, 175, 55, 0.15);
            flex-shrink: 0;
        }
        .mode-selector-corner {
            background: transparent; border: none; outline: none;
            background-image: var(--gold-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 0.72rem; font-weight: 800; padding-right: 14px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
            height: 100%; z-index: 1001; appearance: none; -webkit-appearance: none; -moz-appearance: none;
            font-family: var(--font-main);
        }
        .mode-selector-wrapper::after {
            content: "\f0d7"; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; right: 8px; pointer-events: none;
            font-size: 0.65rem; color: var(--gold-solid);
        }
        .mode-selector-corner option {
            background: #0a0a0f; color: #ffffff; -webkit-text-fill-color: #ffffff; font-weight: 600; padding: 10px;
        }

        /* ---------- feed filter bar ---------- */
        .feed-filter-bar {
            display: none; align-items: center; justify-content: space-between; gap: 10px;
            background: rgba(212,175,55,0.12);
            border: 1px solid rgba(212,175,55,0.35);
            border-radius: 999px; padding: 7px 14px;
            margin: 10px auto 4px auto;
            max-width: 1384px;
            width: calc(100% - 12px);
            font-size: 0.62rem; font-weight: 700; color: var(--gold-solid);
            letter-spacing: 0.4px;
            animation: fadeSlideIn 0.25s ease both;
        }
        .feed-filter-bar.active { display: flex; }
        .feed-filter-bar span {
            display: flex; align-items: center; gap: 7px; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .feed-filter-bar .reset-all-btn {
            background: var(--gold-gradient); border: none;
            color: #000; padding: 4px 10px; border-radius: 999px;
            cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.58rem; font-weight: 800; flex-shrink: 0; text-transform: uppercase;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- feed ---------- */
        .feed-container {
            padding: 8px 6px;
            column-count: 2;
            column-gap: 8px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .feed-container {
                column-count: 4;
                column-gap: 12px;
                padding: 12px;
            }
        }
        .feed-status-box {
            column-span: all;
            width: 100%;
            text-align: center;
            padding: 55px 16px;
            color: var(--gold-solid);
        }

        .product-card {
            background: var(--card-wholesale); border-radius: 16px; overflow: hidden;
            display: inline-block; width: 100%;
            border: 1px solid rgba(212,175,55,0.20); position: relative; cursor: pointer;
            margin-bottom: 8px; break-inside: avoid; page-break-inside: avoid;
            will-change: transform, opacity;
            backface-visibility: hidden;
            transform: translateZ(0);
            transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.55);
            animation: cardAppear 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(12px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .product-card:active { transform: scale(0.98); }
        .product-card:hover {
            border-color: rgba(212,175,55,0.55);
            box-shadow: 0 10px 28px rgba(212,175,55,0.14);
        }
        .product-card.is-anchor-card {
            border: 1.5px solid var(--gold-solid);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.22);
        }

        .product-media-box {
            position: relative; width: 100%; aspect-ratio: 1 / 1;
            background: #08080d linear-gradient(90deg, #08080d 0%, #12121c 50%, #08080d 100%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .product-media-box.loaded { animation: none; background: #000000; }
        .product-media-box img,
        .product-media-box video {
            width: 100%; height: 100%; display: block; object-fit: cover; background: transparent;
            opacity: 0; transition: opacity 0.3s ease-in-out;
        }
        .product-media-box img.loaded-img,
        .product-media-box video.loaded-img { opacity: 1; }

        .new-badge-overlay {
            position: absolute; top: 8px; left: 8px;
            background: var(--gold-gradient);
            color: #000; font-size: 0.52rem; font-weight: 800;
            padding: 3px 8px; border-radius: 999px; z-index: 6;
            letter-spacing: 0.4px; pointer-events: none;
        }
        .video-badge-overlay {
            position: absolute; bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.65);
            color: #fff; font-size: 0.52rem; font-weight: 700;
            padding: 3px 7px; border-radius: 999px; z-index: 6;
            display: inline-flex; align-items: center; gap: 4px; pointer-events: none;
        }

        /* clean frameless price on top-right of product */
        .price-qty-overlay {
            position: absolute; top: 9px; right: 10px;
            display: flex; flex-direction: column; align-items: flex-end;
            z-index: 6;
            pointer-events: none;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.92), 0 0 3px rgba(0, 0, 0, 0.95);
        }
        .price-qty-overlay .price {
            font-size: 0.92rem; font-weight: 800;
            color: #ffffff;
            line-height: 1.15; letter-spacing: 0.2px;
        }
        .price-qty-overlay .qty {
            font-size: 0.52rem; font-weight: 600; color: #f0e6c8;
            letter-spacing: 0.3px; text-transform: uppercase; white-space: nowrap;
        }

        /* Pinterest-style AI Lens icon button on bottom-right corner */
        .ai-lens-corner-btn {
            position: absolute;
            bottom: 9px;
            right: 9px;
            width: 34px;
            height: 34px;
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: none;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 8;
            padding: 0;
            transition: transform 0.18s ease, background 0.18s ease;
        }
        .ai-lens-corner-btn:hover {
            transform: scale(1.08);
            background: #ffffff;
        }
        .ai-lens-corner-btn:active {
            transform: scale(0.92);
        }
        .ai-lens-corner-btn svg {
            width: 19px;
            height: 19px;
            display: block;
        }

        /* bottom nav */
        nav.bottom-nav {
            position: fixed !important; bottom: 0 !important; left: 0 !important; width: 100% !important; background: var(--footer-wholesale) !important;
            display: flex !important; justify-content: space-around !important; align-items: center !important; padding: 8px 4px 10px 4px !important;
            z-index: 9999999 !important; backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.15) !important;
            transform: translateZ(0);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; text-decoration: none;
            font-size: 0.50rem; font-weight: 600; cursor: pointer; text-align: center; gap: 3px; flex: 1; text-transform: uppercase;
            background: none; border: none; outline: none;

        .nav-item i { font-size: 1.25rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item span { color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; font-size: 0.50rem; font-weight: 600; }

        .cart-icon-box { position: relative; display: inline-flex; align-items: center; justify-content: center; }
        .cart-badge-circle {
            position: absolute; top: -5px; right: -8px; background: var(--pink-love); color: #ffffff !important;
            font-size: 0.50rem; font-weight: 700; width: 15px; height: 15px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; z-index: 5;
        }
        .cart-badge-circle.empty-badge { display: none !important; }
        .cart-custom-svg { width: 22px; height: 22px; fill: url(#goldGradientSvg); }

        /* modals / overlays */
        .floating-search-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            z-index: 2000000; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; padding: 16px;
        }
        .floating-search-modal.active { opacity: 1; visibility: visible; }
        .floating-search-box {
            background: rgba(8, 8, 12, 0.96); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 480px;

        .close-modal-btn {
            position: absolute; top: 16px; right: 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-gray); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; cursor: pointer;
        }
        .modal-title { font-size: 1.05rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; padding-right: 20px; }
        .modal-input-container { display: flex; flex-direction: column; gap: 14px; }
        .modal-input {
            width: 100%; background: rgba(3, 3, 5, 0.8); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 14px; padding: 15px 18px; color: var(--text-white); font-size: 0.95rem; outline: none; text-transform: uppercase;
        }
        .search-bottom-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .search-action-item-btn {
            background: rgba(212, 175, 55, 0.08); border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 12px; padding: 12px 8px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px; width: 100%;
        }
        .search-action-item-btn i { font-size: 1.15rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-action-item-btn span { font-size: 0.62rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .external-page-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 60px);
            background: #000; z-index: 1500000; display: none; border: none; outline: none;
        }
        .external-page-overlay.active { display: block; }
        .external-page-overlay iframe { width: 100%; height: 100%; border: none; }

        /* Vision modal */
        .similar-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            max-height: 360px; overflow-y: auto; padding: 2px;
        }
        .similar-item {
            background: #0e0e16; border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(212,175,55,0.15); cursor: pointer;
            display: flex; flex-direction: column;
        }
        .similar-item img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #12121c; }
        .similar-item .sim-info { padding: 5px 6px; }
        .similar-item .sim-title { font-size: 0.5rem; color: #d8d8e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; font-weight: 600; }
        .similar-item .sim-price { color: var(--gold-solid); font-weight: 800; font-size: 0.56rem; }
        .ai-vision-analyzing { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 20px 10px; }
        .ai-vision-preview { width: 120px; height: 120px; border-radius: 14px; object-fit: cover; border: 2px solid var(--gold-solid); }
        .ai-vision-pulse { width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(212,175,55,0.15); border-top-color: var(--gold-solid); animation: aiSpin 1s linear infinite; }
        @keyframes aiSpin { to { transform: rotate(360deg); } }
        .ai-vision-text { font-size: 0.78rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ai-vision-sub { font-size: 0.55rem; color: var(--text-gray); }
        .ai-vision-results-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding: 10px; background: rgba(212,175,55,0.06); border-radius: 12px; border: 1px solid rgba(212,175,55,0.2); }
        .ai-vision-preview-small { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; border: 1px solid var(--gold-solid); flex-shrink: 0; }
        .ai-vision-count { font-size: 0.68rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ai-vision-filter-btn { margin-top: 12px; width: 100%; background: var(--gold-gradient); color: #000; border: none; border-radius: 12px; padding: 12px; font-size: 0.72rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .ai-vision-empty { font-size: 0.7rem; color: var(--text-gray); text-align: center; padding: 20px; }
    </style>
</head>

            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </button>
        <button type="button" class="nav-item" onclick="toggleCartPage()">
            <div class="cart-icon-box">
                <svg class="cart-custom-svg" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="cart-badge-circle empty-badge" id="floatingCartItemCountBadge">0</span>
            </div>
            <span>Cart</span>
        </button>
    </nav>

    <script>
        // ============================================================
        // 1. GLOBAL CONFIG & SYNONYMS (MAHOGANY, GAMARI, LEATHER, FABRIC, DECOR, RESIN)
        // ============================================================
        const LOCAL_STORAGE_CACHE_KEY = 'rorraxy_wholesale_feed_cache';
        const PREF_STORAGE_KEY = 'rorraxy_user_visual_prefs';
        const FALLBACK_IMG_URL = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png';
        let cachedAffiliateId = null;
        let __ALL_PRODUCTS = [];

        const MATERIAL_SYNONYMS = {
            mahogany: ['mahogany', 'মেহগনি', 'wood', 'wooden', 'timber', 'darkwood', 'furniture', 'handicrafts'],
            gamari:   ['gamari', 'গামারি', 'wood', 'wooden', 'timber', 'warmwood', 'handicrafts'],
            leather:  ['leather', 'চামড়া', 'চামড়া', 'wallet', 'handbag', 'bag', 'shoes', 'belt', 'grooming', 'accessories'],
            fabric:   ['fabric', 'cloth', 'কাপড়', 'কাপড়', 'clothing', 'dress', 'wear', 'fashion', 'traditional', 'activewear', 'sets'],
            decor:    ['decor', 'homedecor', 'home decor', 'হোম ডেকর', 'ডেকর', 'clock', 'lamp', 'coaster', 'bamboo', 'brass', 'crafts', 'gift'],
            resin:    ['resin', 'রেজিন', 'epoxy', 'wood-resincrafts', 'woodresin', 'art', 'crafts', 'handicrafts']
        };

        function getActiveAffiliateId() {
            if (cachedAffiliateId !== null) return cachedAffiliateId;
            const urlParams = new URLSearchParams(window.location.search);
            const refFromUrl = urlParams.get('ref') || urlParams.get('aff') || urlParams.get('affiliate');
            if (refFromUrl) {
                try {
                    localStorage.setItem('rorraxy_active_affiliate_ref', refFromUrl);
                    sessionStorage.setItem('rorraxy_active_affiliate_ref', refFromUrl);
                } catch(e) {}
                cachedAffiliateId = refFromUrl;
                return cachedAffiliateId;
            }
            let userProfile = {};
            try {
                userProfile = JSON.parse(localStorage.getItem('rorraxy_user_account') || 'null')
                           || JSON.parse(localStorage.getItem('user_profile') || 'null') || {};
            } catch(e) {}
            cachedAffiliateId = userProfile.affiliate_id || userProfile.id || userProfile.userId
                || localStorage.getItem('rorraxy_my_affiliate_id')
                || localStorage.getItem('rorraxy_active_affiliate_ref')
                || sessionStorage.getItem('rorraxy_active_affiliate_ref')
                || null;
            return cachedAffiliateId;
        }

        function escapeHtmlAttr(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function escapeJsSingle(str) {
            return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, ' ');
        }

        // ============================================================
        // 2. SMART AUTO-TAGGER, PREFERENCE MEMORY & SIMILARITY ENGINE
        // ============================================================
        function normalizeText(str) {
            return String(str || '').toLowerCase()
                .replace(/[^a-z0-9\u0980-\u09FF]+/g, ' ')
                .replace(/\s+/g, ' ').trim();
        }

        function getUserPrefs() {
            try {
                return JSON.parse(localStorage.getItem(PREF_STORAGE_KEY) || '{}') || {};
            } catch(e) { return {}; }
        }

        function recordUserPreference(product) {
            if (!product) return;
            const prefs = getUserPrefs();
            const tags = extractExpandedTags(product);
            tags.forEach(t => {
                if (t.length > 2) prefs[t] = Math.min(25, (prefs[t] || 0) + 1);
            });
            try { localStorage.setItem(PREF_STORAGE_KEY, JSON.stringify(prefs)); } catch(e) {}
        }

        function extractExpandedTags(p) {
            if (Array.isArray(p.__expandedTags)) return p.__expandedTags;

            const rawTokens = new Set();
            const addWords = (val) => {
                normalizeText(val).split(' ').forEach(w => {
                    if (w.length > 1) rawTokens.add(w);
                });
            };

            if (p.tags) {
                if (Array.isArray(p.tags)) p.tags.forEach(t => addWords(t));
                else if (typeof p.tags === 'string') p.tags.split(/[,|]/).forEach(t => addWords(t));
            }
            addWords(p.title);
            addWords(p.subtitle);
            addWords(p.category);
            addWords(p.subCategory || p.subcategory || p.tag);
            addWords(p.description);
            if (p.visual?.colorTone) addWords(p.visual.colorTone);
            if (p.visual?.style) addWords(p.visual.style);
            if (p.visual?.shape) addWords(p.visual.shape);

            const fullText = Array.from(rawTokens).join(' ');
            Object.entries(MATERIAL_SYNONYMS).forEach(([groupKey, words]) => {
                if (words.some(w => fullText.includes(normalizeText(w)))) {
                    rawTokens.add(groupKey);
                    words.forEach(w => rawTokens.add(normalizeText(w)));
                }
            });

            p.__expandedTags = Array.from(rawTokens);
            return p.__expandedTags;
        }

        function getCardQuickSearchLabel(p) {
            if (p.quickSearch) return p.quickSearch;
            const full = normalizeText([p.title, p.subtitle, p.category, ...(Array.isArray(p.tags) ? p.tags : [p.tags || ''])].join(' '));
            for (const [key, words] of Object.entries(MATERIAL_SYNONYMS)) {
                if (words.some(w => full.includes(normalizeText(w)))) {
                    const labels = {
                        mahogany: 'MAHOGANY WOOD',
                        gamari: 'GAMARI WOOD',
                        leather: 'LEATHER ITEMS',
                        fabric: 'FABRIC & WEAR',
                        decor: 'HOME DECOR',
                        resin: 'RESIN CRAFTS'
                    };
                    return labels[key] || key.toUpperCase();
                }
            }
            if (p.category) return String(p.category).replace(/[-_]/g, ' ').toUpperCase();
            return (p.title || 'SIMILAR ITEMS').split(' ').slice(0, 3).join(' ').toUpperCase();
        }

        function computeSimilarityScore(source, target) {
            if (!source || !target) return 0;
            if (String(source.__id) === String(target.__id)) return -1;

            let score = 0;
            const srcTags = new Set(extractExpandedTags(source));
            const tgtTags = new Set(extractExpandedTags(target));

            srcTags.forEach(tag => {
                if (tgtTags.has(tag)) score += 6;
            });

            const srcCat = normalizeText(source.category || source.subCategory || '');
            const tgtCat = normalizeText(target.category || target.subCategory || '');
            if (srcCat && tgtCat && srcCat === tgtCat) score += 12;

            // Visual attribute match (tone, style, shape)
            if (source.visual && target.visual) {
                if (source.visual.colorTone && source.visual.colorTone === target.visual.colorTone) score += 5;
                if (source.visual.style && source.visual.style === target.visual.style) score += 5;
                if (source.visual.shape && source.visual.shape === target.visual.shape) score += 3;
            }

            // Boost new & popular items so attractive/new items appear first
            if (target.is_new || target.isNew || target.new_arrival) score += 5;
            if (target.views) score += Math.min(4, Number(target.views) / 100);

            return score;
        }

        // ============================================================
        // 3. CLICK-TO-SEARCH IN MAIN FEED (PINTEREST BEHAVIOR)
        // ============================================================
        function triggerRelatedFeedSearch(productId, event) {
            if (event) event.stopPropagation();
            const source = __ALL_PRODUCTS.find(p => String(p.__id) === String(productId));
            if (!source) return;

            recordUserPreference(source);

            const scored = __ALL_PRODUCTS
                .map(item => ({ item, score: computeSimilarityScore(source, item) }))
                .filter(x => x.score > 0)
                .sort((a, b) => b.score - a.score)
                .map(x => x.item);

            const seen = new Set([String(source.__id), ...scored.map(s => String(s.__id))]);
            const remaining = prioritizeHomepageFeed(__ALL_PRODUCTS.filter(p => !seen.has(String(p.__id))));

            const finalFeed = [source, ...scored, ...remaining];

            showFeedFilterBar(`SIMILAR ITEMS (${scored.length})`);
            renderWholesaleCards(finalFeed, source.__id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showFeedFilterBar(text) {
            const bar = document.getElementById('feedFilterBar');
            if (!bar) return;
            bar.innerHTML = `
                <span><i class="fa-solid fa-wand-magic-sparkles"></i> ${escapeHtmlAttr(text)}</span>
                <button type="button" class="reset-all-btn" onclick="clearFeedFilter()">
                    <i class="fa-solid fa-rotate-left"></i> ALL ITEMS
                </button>
            `;
            bar.classList.add('active');
        }

        function clearFeedFilter() {
            const bar = document.getElementById('feedFilterBar');
            if (bar) bar.classList.remove('active');
            window.__aiVisionMatches = null;
            renderWholesaleCards(prioritizeHomepageFeed(__ALL_PRODUCTS));
        }

        // ============================================================
        // 9. RENDER CARDS (CLEAN MEDIA + FRAMELESS PRICE + CORNER AI ICON)
        // ============================================================
        function renderWholesaleCards(wholesaleProducts, anchorProductId = null) {
            const feedContainer = document.getElementById('productFeed');
            const fragment = document.createDocumentFragment();

            wholesaleProducts.forEach((p, idx) => {
                const pTitle = p.title || 'WHOLESALE ITEM';
                const bulkPrice = p.price_bulk || p.price_min_whole || p.price || 0;
                const moqCount = p.moq || 1;
                const resolvedImageUrl = resolveProductImage(p);
                const resolvedVideoUrl = resolveProductVideo(p);
                const productId = String(p.__id || p.id || p.product_id || p.product_code || ('p_' + idx));
                p.__id = productId;

                const isNew = Boolean(p.is_new || p.isNew || p.new_arrival);
                const safeTitleAttr = escapeHtmlAttr(pTitle);
                const safeIdJs = escapeJsSingle(productId);

                const cardDiv = document.createElement('div');
                cardDiv.className = 'product-card' + (String(anchorProductId) === productId ? ' is-anchor-card' : '');
                cardDiv.dataset.productId = productId;
                cardDiv.style.animationDelay = Math.min(idx * 0.025, 0.4) + 's';

                // Clicking anywhere on the product card opens details page directly
                cardDiv.onclick = () => goToProduct(productId);

                const mediaTagHtml = resolvedVideoUrl
                    ? `<video src="${escapeHtmlAttr(resolvedVideoUrl)}" poster="${escapeHtmlAttr(resolvedImageUrl)}" autoplay muted loop playsinline preload="metadata"
                              onloadeddata="this.classList.add('loaded-img'); this.parentElement.classList.add('loaded');"></video>
                       <span class="video-badge-overlay"><i class="fa-solid fa-play"></i></span>`
                    : `<img src="${escapeHtmlAttr(resolvedImageUrl)}" alt="${safeTitleAttr}" loading="lazy" decoding="async"
                            onload="this.classList.add('loaded-img'); this.parentElement.classList.add('loaded');"
                            onerror="this.src='${FALLBACK_IMG_URL}'; this.classList.add('loaded-img'); this.parentElement.classList.add('loaded');">`;

                cardDiv.innerHTML = `
                    <div class="product-media-box">
                        ${isNew ? `<span class="new-badge-overlay">NEW</span>` : ''}
                        <div class="price-qty-overlay">
                            <span class="price">$${(parseFloat(bulkPrice) || 0).toFixed(2)}</span>
                            <span class="qty">MIN ${escapeHtmlAttr(moqCount)} PCS</span>
                        </div>
                        ${mediaTagHtml}
                        <button type="button" class="ai-lens-corner-btn" title="Find similar"
                                onclick="triggerRelatedFeedSearch('${safeIdJs}', event)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10.5 3.5a7 7 0 1 0 7 7" />
                                <line x1="15.8" y1="15.8" x2="20.5" y2="20.5" />
                                <path d="M18.2 2.2l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1z" fill="#111111" stroke="none" />
                            </svg>
                        </button>
                    </div>
                `;
                fragment.appendChild(cardDiv);
            });

            feedContainer.innerHTML = '';
            feedContainer.appendChild(fragment);
        }

        // ============================================================
        // 10. CART BADGE
        // ============================================================
        function updateCartBadgeCount() {
            let cart = [];
            try { cart = JSON.parse(localStorage.getItem('rorraxy_cart') || '[]') || []; } catch(e) {}
            const totalQty = cart.reduce((sum, item) => sum + (parseInt(item.qty, 10) || 0), 0);
            const badge = document.getElementById('floatingCartItemCountBadge');
            if (badge) {
                badge.innerText = totalQty;
                totalQty > 0 ? badge.classList.remove('empty-badge') : badge.classList.add('empty-badge');
            }
        }
    </script>
</body>
</html>
