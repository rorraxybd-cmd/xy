    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --pink-accent: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100vw; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh; font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        body { margin: 0; padding: 0 0 75px 0; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        #rorraxyLoaderOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: #000000; z-index: 999999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 15px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .loader-logo-box {
            width: 85px; height: 85px; border-radius: 50%; overflow: hidden;
            border: 2px solid var(--gold-solid); box-shadow: 0 0 35px rgba(212,175,55,0.5);
            animation: pulseGlow 1.2s infinite alternate ease-in-out;
        }
        .loader-logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .loader-brand-name {
            font-size: 1.2rem; font-weight: 800; letter-spacing: 3px;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        @keyframes pulseGlow {
            from { transform: scale(0.92); box-shadow: 0 0 15px rgba(212,175,55,0.3); }
            to { transform: scale(1.08); box-shadow: 0 0 35px rgba(212,175,55,0.8); }
        }

        .animate-card-entry { animation: fadeInLuxury 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInLuxury {
            from { opacity: 0; transform: translateY(16px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .top-floating-search-bar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 1800; display: none;
            align-items: center; background: #090a0f; border: 1.5px solid #6b5523;
            border-radius: 40px; padding: 4px 6px 4px 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        .floating-search-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #ffffff; font-size: 0.85rem; font-family: var(--font-main);
        }
        .floating-search-input::placeholder { color: #7a7a85; }
        .floating-search-btn-circle {
            width: 36px; height: 36px; border-radius: 50%; background: var(--gold-gradient);
            border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #000; font-size: 0.9rem;
        }

        .bottom-nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 68px;
            background: rgba(3, 3, 5, 0.98); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.25);
            display: flex; justify-content: space-around; align-items: center; z-index: 5000; padding: 0 4px;
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; cursor: pointer; color: #a0a0ab; font-size: 0.52rem; font-weight: 600; gap: 3px;
            width: 100%; height: 100%; text-align: center; position: relative; transition: transform 0.1s ease;
        }
        .bottom-nav-item:active { transform: scale(0.95); }
        .bottom-nav-item i { 
            font-size: 1.25rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }
        .bottom-nav-item span { 
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 65px; 
        }

        .pinterest-feed-container {
            padding: 10px 8px; column-count: 2; column-gap: 8px; width: 100%; max-width: 1200px; margin: 0 auto;
        }
        @media (min-width: 768px) { .pinterest-feed-container { column-count: 4; column-gap: 12px; padding: 15px; } }

        .product-card {
            background: transparent; border-radius: 14px; overflow: hidden; 
            display: inline-block; width: 100%; border: none; 
            position: relative; cursor: pointer; margin-bottom: 8px; break-inside: avoid;
            transition: transform 0.2s ease;
        }
        .product-card:active { transform: scale(0.97); }

        .product-media-box { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #050508; border-radius: 12px; overflow: hidden; }
        .product-media-box img { width: 100%; height: 100%; display: block; object-fit: cover; }

        .corner-discount-badge {
            position: absolute; top: 8px; left: 8px; z-index: 45;
            background: var(--pink-accent); color: #fff; font-size: 0.62rem; font-weight: 800;
            padding: 3px 8px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .card-clean-price-badge {
            position: absolute; bottom: 8px; right: 8px; z-index: 45;
            font-size: 0.88rem; font-weight: 800;
            background: var(--gold-gradient) !important; 
            -webkit-background-clip: text !important; 
            -webkit-text-fill-color: transparent !important;
            filter: drop-shadow(0px 2px 4px #000000) drop-shadow(0px 0px 6px #000000);
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
        }

        /* Perfectly Optimized Instant Reels Modal */
        .reel-modal-overlay {
            display: none; position: fixed; inset: 0;
            background: #000000; z-index: 4000;
            align-items: center; justify-content: center;
        }
        .reel-modal-wrapper {
            position: relative; width: 100%; max-width: 420px; height: 100vh; height: 100dvh;
            background: #000000; overflow-y: scroll; scroll-snap-type: y mandatory;
            scroll-behavior: auto; -webkit-overflow-scrolling: touch;
        /* Smooth video & cross-fade slideshow container */
        .reel-primary-video-container {
            width: 100%; height: 100%; background: #000000; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }

        /* Dynamic Zoom-In & Zoom-Out Premium Ken Burns Slideshow Effect */
        .slide-layer {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: contain; opacity: 0; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
            image-rendering: -webkit-optimize-contrast;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            padding: 6px;
        }
        
        .slide-layer.active { opacity: 1; z-index: 2; }
        .slide-layer.previous { opacity: 0; z-index: 1; }

        /* Dynamic Zooming Animations */
        .slide-layer.zoom-in-anim {
            animation: zoomInLuxury 2.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .slide-layer.zoom-out-anim {
            animation: zoomOutLuxury 2.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes zoomInLuxury {
            0% { transform: scale(0.92); }
            100% { transform: scale(1.08); }
        }
        @keyframes zoomOutLuxury {
            0% { transform: scale(1.1); }
            100% { transform: scale(0.96); }
        }

        .reel-primary-video-container video {
            width: 100%; height: 100%; object-fit: contain; display: block; background: #000;
            position: relative; z-index: 3; opacity: 1; transition: opacity 0.5s ease;
            image-rendering: -webkit-optimize-contrast;
            will-change: transform;
        }

        .reel-bottom-price-overlay {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            z-index: 50; pointer-events: none; display: flex; flex-direction: row; align-items: center; justify-content: center;
            gap: 8px; padding: 6px 18px; border-radius: 20px;
            background: rgba(8, 8, 14, 0.88) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
        }
        .reel-center-price-badge {
            font-size: 1.05rem; font-weight: 800;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .reel-center-discount-badge {
            background: var(--pink-accent); color: #fff; font-size: 0.62rem; font-weight: 800;
            padding: 3px 8px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        .right-vertical-actions {
            position: fixed; right: 12px; bottom: 85px; z-index: 4500;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            pointer-events: auto; width: 45px;
        }
        .side-action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 2px; position: relative; transition: transform 0.1s ease; width: 100%; }
        .side-action-item:active { transform: scale(0.9); }
        .action-pure-icon { 
            font-size: 1.6rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
            filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.9));
        }
        .side-count-text { 
            font-size: 0.58rem; font-weight: 700; color: #ffffff; letter-spacing: 0px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.9); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45px;
        }
        .love-action-btn.liked-active .action-pure-icon { color: var(--pink-accent) !important; background: none !important; -webkit-background-clip: initial !important; -webkit-text-fill-color: initial !important; }
        .save-action-btn.active .action-pure-icon { color: var(--pink-accent) !important; background: none !important; -webkit-background-clip: initial !important; -webkit-text-fill-color: initial !important; }

        .cart-pink-badge {
            position: absolute; top: -6px; right: -2px; background: var(--pink-accent); color: #fff;
            font-size: 0.55rem; font-weight: 800; width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px var(--pink-accent);
        }

        .overlay-sheet {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(0, 0, 0, 0.6); z-index: 6000; overflow-y: auto; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px;
            scrollbar-width: none;
        }
        .overlay-sheet::-webkit-scrollbar { display: none; }

        .buy-preview-modal {
            width: 95%; max-width: 420px; background: rgba(10, 10, 16, 0.98); border: 1.5px solid rgba(212,175,55,0.5);
            border-radius: 18px; padding: 18px; margin: auto; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }
        .preview-horizontal-scroll {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .preview-horizontal-scroll::-webkit-scrollbar { display: none; }

        .preview-img-item {
            flex: 0 0 88px; width: 88px; height: 88px; border-radius: 12px; overflow: hidden;
            border: 2px solid transparent; cursor: pointer; scroll-snap-align: start; background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
        }
        .preview-img-item.selected { border-color: var(--pink-accent); }
        .preview-img-item img { width: 100%; height: 100%; object-fit: cover; }

        .flying-gold-coin {
            position: fixed; z-index: 9999999; width: 32px; height: 32px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fcf6ba 25%, #bf953f 65%, #8a5d0f 100%);
            border: 2px solid #fff; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #4d3300;
            box-shadow: 0 0 15px rgba(212,175,55,0.8);
            transition: left 0.4s cubic-bezier(0.25, 0.1, 0.25, 1), top 0.4s cubic-bezier(0.5, 0, 0.75, 0.4), transform 0.4s linear, opacity 0.4s ease-in;
        }

        .inpage-details-modal {
            width: 94%; max-width: 440px; max-height: 85vh; background: rgba(8, 8, 14, 0.98); border: 1.5px solid var(--gold-solid);
            border-radius: 18px; padding: 16px; margin: auto; display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.95);
            scrollbar-width: none;
        }
        .inpage-details-modal::-webkit-scrollbar { display: none; }

        .fullscreen-iframe-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 68px); height: calc(100dvh - 68px);
            background: #000000; z-index: 4500; flex-direction: column;
        }
        .fullscreen-iframe-body { flex: 1; width: 100%; border: none; background: #000; }

        .category-transparent-overlay, .saved-gallery-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(0, 0, 0, 0.3) !important; z-index: 6500; overflow-y: auto; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px 15px 85px 15px;
            scrollbar-width: none;
        }
        .category-transparent-overlay::-webkit-scrollbar, .saved-gallery-overlay::-webkit-scrollbar { display: none; }
        .seller-fullscreen-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; position: relative; margin: auto; }
        .category-fullscreen-view { padding: 0; max-width: 100%; display: flex; flex-direction: column; gap: 8px; width: 100%; }

        .accordion-category-box { background: rgba(10, 10, 15, 0.95) !important; border-radius: 12px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.35) !important; margin-bottom: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); width: 100%; }
        .accordion-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; background: transparent !important; }
        .accordion-header:hover { background: rgba(212, 175, 55, 0.15) !important; }
        .accordion-title-wrap { display: flex; align-items: center; gap: 10px; }
        .cat-main-icon { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; width: 22px; text-align: center; }
        .accordion-main-title { font-size: 0.88rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .accordion-arrow { font-size: 0.85rem; color: var(--gold-solid); transition: transform 0.2s ease; flex-shrink: 0; }
        .accordion-category-box.active .accordion-arrow { transform: rotate(180deg); }

        .accordion-content { display: none; background: transparent !important; padding: 6px 10px 12px 10px; }
        .accordion-category-box.active .accordion-content { display: block; }

        .sub-categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .sub-cat-item {
            background: rgba(15, 15, 22, 0.92); border-radius: 8px; padding: 10px;
            display: flex; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.1s ease, background 0.1s ease; border: 1px solid rgba(255,255,255,0.12);
        }
        .sub-cat-item:active { transform: scale(0.96); }
        .sub-cat-item:hover { background: rgba(25, 25, 35, 1); border-color: rgba(212, 175, 55, 0.6); }
        .sub-cat-item i { font-size: 1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
        .sub-cat-name { font-size: 0.65rem; color: var(--text-white); font-weight: 600; }

        .saved-thumb-card { background: var(--card-retail); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; border: 1px solid rgba(212,175,55,0.2); }
        .saved-thumb-preview { width: 100%; height: 110px; background: #000; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .fs-videos-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .fs-profile-header-box { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; gap: 5px; }
        .fs-profile-name { font-size: 0.95rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>

    <script>
        const LOCAL_STORAGE_CACHE_KEY = 'rorraxy_retail_feed_cache';
        let globalMasterProductsList = [];
        let activeProductList = [];
        let currentReelIndex = 0;
        let slideIntervalsMap = {};
        let selectedVariantImg = '';
        let lastSaveClickTime = 0;
        let currentProductQty = 1;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            let refParam = urlParams.get('ref') || urlParams.get('seller_id') || urlParams.get('affiliate');
            if (refParam) {
                localStorage.setItem('rorraxy_active_affiliate_ref', refParam);
            } else if (!localStorage.getItem('rorraxy_active_affiliate_ref')) {
                localStorage.setItem('rorraxy_active_affiliate_ref', 'rorraxy-store');
            }

            buildCategoriesUI();
            loadLiveProducts();
            updateCartBadgeCount();

            setTimeout(() => {
                const loader = document.getElementById('rorraxyLoaderOverlay');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 300);
                }
            }, 250);

            const bottomWorldBtn = document.getElementById('bottomWorldBtn');
            const bottomCategoryBtn = document.getElementById('bottomCategoryBtn');
            const bottomBuyBtn = document.getElementById('bottomBuyBtn');
            const bottomDetailsBtn = document.getElementById('bottomDetailsBtn');
            
            const categoryTransparentOverlay = document.getElementById('categoryTransparentOverlay');
            const searchInput = document.getElementById('floatingSearchInput');
            const searchBtn = document.getElementById('floatingSearchBtn');

            if(bottomWorldBtn) {
                bottomWorldBtn.addEventListener('click', () => {
                    window.location.href = 'https://rorraxy.com/world.html';
                });

        function startImageSlideshow(cardIdx, container, images) {
            if (!container) return;

            let slidesHtml = images.map((img, i) => `
                <img src="${img}" class="slide-layer ${i === 0 ? 'active zoom-in-anim' : ''}" id="slide_${cardIdx}_${i}" alt="Reel Slide">
            `).join('');

            container.innerHTML = slidesHtml;

            if (images.length > 1) {
                let currentIdx = 0;
                slideIntervalsMap[cardIdx] = setInterval(() => {
                    let nextIdx = (currentIdx + 1) % images.length;
                    
                    let currSlide = document.getElementById(`slide_${cardIdx}_${currentIdx}`);
                    let nextSlide = document.getElementById(`slide_${cardIdx}_${nextIdx}`);

                    if (currSlide && nextSlide) {
                        currSlide.classList.remove('active');
                        currSlide.classList.add('previous');

                        // Alternating Zoom-In & Zoom-Out Effects for Variety
                        const isZoomIn = nextIdx % 2 === 0;
                        nextSlide.className = `slide-layer active ${isZoomIn ? 'zoom-in-anim' : 'zoom-out-anim'}`;

                        setTimeout(() => {
                            currSlide.className = 'slide-layer';
                        }, 600);
                    }

                    currentIdx = nextIdx;
                }, 2200); // Perfectly balanced speed: snappy, smooth & responsive
            }
        }

        function playCoinDropChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                const freqs = [1567.98, 2093.00, 2637.02, 3135.96, 4186.01]; 
                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (idx * 0.02));
                    gain.gain.setValueAtTime(0, now + (idx * 0.02));
                    gain.gain.linearRampToValueAtTime(0.08 / (idx + 1), now + (idx * 0.02) + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.00001, now + (idx * 0.02) + 0.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + (idx * 0.02));
                    osc.stop(now + (idx * 0.02) + 0.5);
                });
            } catch (e) {}
        }

        function triggerCoinDropAnimation(e) {
            const cartIconElem = document.getElementById('cartTargetIcon');
            let targetRect = cartIconElem ? cartIconElem.getBoundingClientRect() : null;
            let targetX = targetRect ? targetRect.left + (targetRect.width / 2) : window.innerWidth - 30;
            let targetY = targetRect ? targetRect.top + (targetRect.height / 2) : window.innerHeight - 50;

            let startX = e ? e.clientX : window.innerWidth / 2;
            let startY = e ? e.clientY : window.innerHeight / 2;

            const coin = document.createElement('div');
            coin.className = 'flying-gold-coin';
            coin.innerHTML = '<i class="fa-solid fa-coins"></i>';
            coin.style.left = `${startX - 16}px`;
            coin.style.top = `${startY - 16}px`;
            document.body.appendChild(coin);

            requestAnimationFrame(() => {
                coin.style.left = `${targetX - 16}px`;
                coin.style.top = `${targetY - 16}px`;
                coin.style.transform = 'scale(0.3) rotate(720deg)';
                coin.style.opacity = '0';
            });

            setTimeout(() => {
                if(coin.parentNode) coin.parentNode.removeChild(coin);
            }, 350);
        }

        function confirmAddToCart(e, pId, title, price, sellerId) {
            let cartKey = 'rorraxy_cart';
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            let activeAffiliateRef = localStorage.getItem('rorraxy_active_affiliate_ref') || 'rorraxy-store';

            let existing = cart.find(i => String(i.productId) === String(pId) && i.img === selectedVariantImg);

            if(existing) {
                existing.qty += currentProductQty;
            } else {
                cart.push({
                    productId: pId,
                    sellerId: sellerId || 'rorraxy-store',
                    affiliateRef: activeAffiliateRef,
                    title: title,
                    price: `$${parseFloat(price).toFixed(2)}`,
                    qty: currentProductQty,
                    img: selectedVariantImg
                });
            }
            localStorage.setItem(cartKey, JSON.stringify(cart));
            updateCartBadgeCount();
            triggerCoinDropAnimation(e);
            closeBuyPreview();
        }

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
            let badge = document.getElementById('sideCartBadgeCount');
            if(badge) badge.innerText = totalQty;
        }

        function getDynamicEngagement(productId) {
            let storageKey = `rorraxy_retail_likes_${productId}`;
            let storedData = localStorage.getItem(storageKey);
            let currentVal;
            if (storedData) {
                currentVal = JSON.parse(storedData).value;
            } else {
                const pool = [185, 245, 445, 890, 1500, 3200, 7800, 15400, 48000, 125000];
                let index = Math.abs(hashCode(String(productId))) % pool.length;
                let base = pool[index];
                let variance = (Math.abs(hashCode(String(productId))) % 199);
                currentVal = base + variance;
                localStorage.setItem(storageKey, JSON.stringify({ value: currentVal }));
            }
            return formatCompactNumber(currentVal);
        }

        function formatCompactNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }

        window.toggleReelLove = function(e, btn, productId) {
            e.stopPropagation();
            let countElem = btn.querySelector('.side-count-text');
            let storageKey = `rorraxy_retail_likes_${productId}`;
            let activeStateKey = storageKey + '_active';
            let isLiked = localStorage.getItem(activeStateKey) === 'true';
            let storedData = localStorage.getItem(storageKey);
            let currentVal = storedData ? JSON.parse(storedData).value : 1500;

            if (isLiked) {
                btn.classList.remove('liked-active');
                currentVal = Math.max(0, currentVal - 1);
                localStorage.setItem(activeStateKey, 'false');
            } else {
                btn.classList.add('liked-active');
                currentVal += 1;
                localStorage.setItem(activeStateKey, 'true');
            }

            localStorage.setItem(storageKey, JSON.stringify({ value: currentVal }));
            if(countElem) countElem.innerText = formatCompactNumber(currentVal);
        };

        window.handleDualSaveAction = function(e, btn, pId) {
            e.stopPropagation();
            let currentTime = new Date().getTime();
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let existingIndex = savedObjects.findIndex(item => String(item.id || item.product_id) === String(pId));
            
            if (currentTime - lastSaveClickTime < 400 || btn.classList.contains('active') || existingIndex > -1) {
                renderSavedGalleryContent();
                const overlay = document.getElementById('savedGalleryOverlay');
                if(overlay) overlay.style.display = 'flex';
                lastSaveClickTime = 0;
            } else {
                lastSaveClickTime = currentTime;
                let targetProduct = globalMasterProductsList.find(item => String(item.id || item.product_id) === String(pId));
                if(targetProduct && existingIndex === -1) {
                    savedObjects.push(targetProduct);
                    btn.classList.add('active');
                    localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(savedObjects));
                } else if(existingIndex > -1) {
                    btn.classList.add('active');
                }
            }
        };

        function renderSavedGalleryContent() {
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let containerBody = document.getElementById('savedGalleryBody');
            if(!containerBody) return;

            if (savedObjects.length === 0) {
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div>
                    <div style="text-align:center; color:#a0a0ab; padding:40px; font-size:0.85rem;">NO SAVED VIDEOS FOUND</div>`;
            } else {
                let thumbsHtml = '';
                savedObjects.forEach(v => {
                    let thumbImg = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
                    try {
                        if(v.images_json) {
                            let parsed = typeof v.images_json === 'string' ? JSON.parse(v.images_json) : v.images_json;
                            if(Array.isArray(parsed) && parsed.length > 0) thumbImg = parsed[0];
                        } else if(v.image_url) thumbImg = v.image_url;
                    } catch(e){}

                    let vId = v.id || v.product_id;
                    thumbsHtml += `
                        <div class="saved-thumb-card" onclick="selectSavedVideo('${vId}')">
                            <div class="saved-thumb-preview">
                                <img src="${thumbImg}" style="width:100%; height:100%; object-fit:cover;">
                                <i class="fa-solid fa-play" style="position:absolute; color:#fcf6ba; font-size:1.2rem;"></i>
                            </div>
                            <span style="font-size:0.68rem; font-weight:700; color:#fff;">ID: ${vId}</span>
                        </div>`;
                });
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div>
                    <div class="fs-videos-grid">${thumbsHtml}</div>`;
            }
        }

        window.selectSavedVideo = function(videoId) {
            let foundIdx = globalMasterProductsList.findIndex(p => String(p.id || p.product_id) === String(videoId));
            if(foundIdx !== -1) {
                openReelsModal(foundIdx);
            }
            document.getElementById('savedGalleryOverlay').style.display = 'none';
        };

        window.openNativeShare = async function(e, pId) {
            e.stopPropagation();
            let activeAffiliateRef = localStorage.getItem('rorraxy_active_affiliate_ref') || 'rorraxy-store';
            const shareUrl = `${window.location.origin}/index.html?ref=${encodeURIComponent(activeAffiliateRef)}&product=${encodeURIComponent(pId)}`;
            if (navigator.share) {
                try { await navigator.share({ title: 'rorraxy product', url: shareUrl }); } catch (err) {}
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(shareUrl);
                alert('Affiliate product link copied to clipboard!');
            }
        };
    </script>
