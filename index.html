/* ================= SECURE GATEWAY OVERLAY ================= */
#secureGatewayOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
    z-index: 6200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px 20px 80px 20px;
    transition: opacity 0.3s ease;
}
.gateway-card {
    width: 100%;
    max-width: 400px;
    background: #06060a;
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 20px;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(212,175,55,0.05);
    position: relative;
}
.gateway-close-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: none;
    color: var(--text-gray);
    font-size: 1.2rem;
    cursor: pointer;
}
.gateway-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    margin: 0 auto 10px auto;
}
.gateway-btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.2s ease, filter 0.2s ease;
    text-decoration: none;
}
.gateway-btn:active {
    transform: scale(0.97);
}
.gateway-btn.gold {
    background: var(--gold-gradient);
    color: #000;
}
.gateway-btn.pink {
    background: var(--pink-gradient);
    color: #fff;
}
.gateway-footer-text {
    font-size: 0.65rem;
    color: var(--text-gray);
    font-weight: 600;
    margin-top: 10px;
    letter-spacing: 0.5px;
}

function navigateReelStep(dir){const wrapper=$('reelModalWrapperBody');if(!wrapper)return;const list=activeProductList.length?activeProductList:globalMasterProductsList;const nextIdx=Math.max(0,Math.min(list.length-1,currentReelIndex+dir));if(nextIdx>=renderedReelsCount-2&&renderedReelsCount<list.length)appendReelsBatch(REELS_BATCH_SIZE);wrapper.scrollTo({top:nextIdx*wrapper.clientHeight,behavior:'smooth'});activateReelAtIndex(nextIdx);}
function setupPullToRefresh(){const wrapper=$('reelModalWrapperBody'),ind=$('pullRefreshIndicator');if(!wrapper||!ind)return;let startY=0,pulling=false;wrapper.addEventListener('touchstart',e=>{if(wrapper.scrollTop<=0){startY=e.touches[0].clientY;pulling=true;}},{passive:true});wrapper.addEventListener('touchmove',e=>{if(pulling&&e.touches[0].clientY-startY>60&&wrapper.scrollTop<=0)ind.classList.add('visible');},{passive:true});wrapper.addEventListener('touchend',()=>{if(!pulling)return;pulling=false;if(ind.classList.contains('visible')){setTimeout(()=>{ind.classList.remove('visible');refreshAndShuffleFeed();},180);}});}

async function loadLiveProducts(){

try{const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(Array.isArray(cached)&&cached.length){globalMasterProductsList=cached;checkInitialProductParam();rendered=true;}}catch(e){}

function checkInitialProductParam(){
const params=new URLSearchParams(window.location.search);

if(targetCat){selectSubCategoryItem(targetCat,targetCat);hideLoaderFast();return;}

products.forEach((item,index)=>{

const card=document.createElement('div');

};
card.innerHTML=`<div class="product-media-box">
${disc>0?`<div class="corner-discount-badge">${disc}% OFF</div>`:''}
<img src="${imgs[0]}" alt="${item.title||'rorraxy'}" loading="${index<12?'eager':'lazy'}" decoding="async">
<div class="card-clean-price-badge">${price}</div>
</div>`;
const img=card.querySelector('img');
const mediaBox=card.querySelector('.product-media-box');
const onReady=()=>{img.classList.add('img-ready');mediaBox.classList.add('img-loaded');};
if(img.complete&&img.naturalWidth)onReady();
else{img.addEventListener('load',onReady,{once:true});img.addEventListener('error',()=>{img.onerror=null;img.src=FALLBACK_LOGO;onReady();},{once:true});}
frag.appendChild(card);
});
container.innerHTML='';
container.appendChild(frag);
const cards=container.querySelectorAll('.product-card');
if('IntersectionObserver' in window){
const obs=new IntersectionObserver((entries,o)=>{for(let i=0;i<entries.length;i++){const entry=entries[i];if(entry.isIntersecting){entry.target.classList.add('ai-revealed');o.unobserve(entry.target);}}},{rootMargin:'300px 0px',threshold:0});
cards.forEach(c=>obs.observe(c));
setTimeout(()=>{cards.forEach(c=>{if(!c.classList.contains('ai-revealed'))c.classList.add('ai-revealed');});},400);
}else{cards.forEach(c=>c.classList.add('ai-revealed'));}
updateSideActionState();
}
function updateSideActionState(){
const list=activeProductList.length?activeProductList:globalMasterProductsList;
const prod=list[currentReelIndex]||list[0]||{};
const id=prod.id||prod.product_id||'101';

function handlePinterestInterception(e,type){if(e)e.stopPropagation();const list=activeProductList.length?activeProductList:globalMasterProductsList;const prod=list[currentReelIndex]||list[0]||{};const id=prod.id||prod.product_id||'101';if(type==='like')toggleReelLove(id);else if(type==='save')handleDualSaveAction(id);else if(type==='share')openNativeShare(id);}
function activateReelAtIndex(idx){
currentReelIndex=idx;
updateSideActionState();
if(activeSlideTimer){clearInterval(activeSlideTimer);activeSlideTimer=null;}
const wrapper=$('reelModalWrapperBody');
if(!wrapper)return;
wrapper.querySelectorAll('video').forEach(v=>{const cardIdx=Number(v.closest('.reel-card')?.dataset.index);if(cardIdx===idx){v.play().catch(()=>{});}else if(!v.paused){v.pause();}});
const list=activeProductList.length?activeProductList:globalMasterProductsList;
for(let lookahead=idx+1;lookahead<=idx+4&&lookahead<list.length;lookahead++){const nextImgs=extractImages(list[lookahead]);if(nextImgs[0])preloadImageUrl(nextImgs[0],lookahead===idx+1);}
const prod=list[idx];
if(!prod)return;
const pVideo=prod.video_url||prod.youtube_video||'';
const imgs=extractImages(prod);
if(imgs.length>1&&!pVideo){
imgs.slice(1).forEach(u=>preloadImageUrl(u,false));
let curImg=0;
activeSlideTimer=setInterval(()=>{
const nextImg=(curImg+1)%imgs.length;
const currEl=$(`slide_${idx}_${curImg}`);

},2500);

}
function appendReelsBatch(count){
const wrapper=$('reelModalWrapperBody');
const list=activeProductList.length?activeProductList:globalMasterProductsList;
if(!wrapper||renderedReelsCount>=list.length)return;
const endIdx=Math.min(renderedReelsCount+count,list.length);

for(let idx=renderedReelsCount;idx<endIdx;idx++){
const product=list[idx];
const pId=String(product.id||product.product_id||'101');
const pVideo=product.video_url||product.youtube_video||'';
const imgs=extractImages(product);
const price=`$${parseFloat(product.price||0).toFixed(2)}`;
const disc=parseFloat(product.discount_rate||product.discountRate||0);
if(idx===0)preloadImageUrl(imgs[0],true);
let mediaContent='';
if(pVideo&&(pVideo.includes('.mp4')||pVideo.includes('.r2.dev')||pVideo.includes('http'))){
mediaContent=`<video src="${pVideo}" poster="${imgs[0]}" ${idx===0?'autoplay preload="auto"':'preload="none"'} muted loop controls playsinline style="width:100%;height:100%;object-fit:contain;"></video>`;
}else{
const layers=imgs.map((url,i)=>{
const isFirst=(idx===0&&i===0);
const isEager=(idx<=2&&i===0);
return `<img src="${url}" onerror="this.onerror=null;this.src='${FALLBACK_LOGO}';" class="slide-layer ${i===0?'active':''}" id="slide_${idx}_${i}" alt="slide" ${isFirst?'fetchpriority="high" decoding="sync" onload="hideLoaderFast()"':`loading="${isEager?'eager':'lazy'}" decoding="async"`}>`;
}).join('');
mediaContent=`<div style="width:100%;height:100%;position:relative;overflow:hidden;">${layers}</div>`;
}
const card=document.createElement('div');
card.className='reel-card';
card.dataset.index=idx;
card.dataset.productId=pId;
card.innerHTML=`<div class="reel-media-box" onclick="openBuyPreviewByIndex(${idx})">
<div class="reel-bottom-price-overlay">
<div class="reel-price-row">
<span class="reel-center-price-badge">${price}</span>
${disc>0?`<span class="reel-center-discount-badge">${disc}% OFF</span>`:''}
</div>
</div>
<div class="reel-primary-video-container" id="primaryMediaBox_${idx}">${mediaContent}</div>
</div>`;
frag.appendChild(card);
}
wrapper.appendChild(frag);
renderedReelsCount=endIdx;
}
function openReelsModal(startIndex){
const overlay=$('reelModalOverlay'),wrapper=$('reelModalWrapperBody');
$('appContainer')?.classList.remove('active-grid');
overlay?.classList.remove('hidden-reels');
let list=activeProductList.length?activeProductList:globalMasterProductsList;
if(!list||!list.length)return;
if(startIndex>0&&startIndex<list.length){
const target=list[startIndex];
const cat=(target.category||'').toLowerCase();
const related=list.filter((p,i)=>i!==startIndex&&(p.category||'').toLowerCase()===cat);
const others=list.filter((p,i)=>i!==startIndex&&(p.category||'').toLowerCase()!==cat);
list=[target,...related,...others];
activeProductList=list;
}
wrapper.innerHTML='';
renderedReelsCount=0;
appendReelsBatch(REELS_BATCH_SIZE);
wrapper.style.scrollBehavior='auto';
wrapper.scrollTop=0;
activateReelAtIndex(0);
let scrollRaf=null;
wrapper.onscroll=()=>{
const sb=$('floatingSearchContainer');
if(sb&&!sb.classList.contains('search-hidden')){sb.classList.add('search-hidden');sb.classList.remove('manual-open');}
if(scrollRaf)cancelAnimationFrame(scrollRaf);
scrollRaf=requestAnimationFrame(()=>{
const h=wrapper.clientHeight;
if(h>0){
const idx=Math.round(wrapper.scrollTop/h);
if(idx>=renderedReelsCount-2&&renderedReelsCount<list.length){appendReelsBatch(REELS_BATCH_SIZE);}
if(idx>=0&&idx<list.length&&idx!==currentReelIndex){activateReelAtIndex(idx);}
}
});
};
}

<div style="display:flex;flex-direction:column;gap:4px;">
<div style="display:flex;justify-content:space-between;align-items:center;">
<span style="font-size:0.65rem;font-weight:700;color:#fff;letter-spacing:0.3px;">QTY</span>
<div style="display:flex;align-items:center;gap:10px;">
<button onclick="adjustDetailQty(-1)" style="background:#151520;color:#fff;border:1px solid rgba(212,175,55,0.4);width:24px;height:24px;border-radius:5px;cursor:pointer;font-weight:700;line-height:1;font-size:0.85rem;">-</button>

function closeInpageDetails(){const noteInput=$('inpageCustomNoteInput');if(noteInput&&noteInput.value.trim())persistentCustomNote=noteInput.value.trim();$('inpageDetailsOverlay').style.display='none';}
function openBuyPreviewModal(product){
const imgs=extractImages(product);
selectedVariantImg=imgs[0];
const imgsHtml=imgs.map((img,i)=>`<div class="preview-img-item ${i===0?'selected':''}" onclick="selectPreviewImg(this,'${img}')"><img src="${img}" loading="lazy"></div>`).join('');
const pId=product.id||product.product_id||'101';
const titleEsc=(product.title||'item').toLowerCase().replace(/'/g,"\\'");
const sku=getSku(product);
const skuEsc=escapeSku(sku);
let initialNote='';
const detailsNoteInput=$('inpageCustomNoteInput');
if(detailsNoteInput&&detailsNoteInput.value.trim()){initialNote=detailsNoteInput.value.trim();}
else if(persistentCustomNote){initialNote=persistentCustomNote;}
$('buyPreviewModalContent').innerHTML=`
<div style="display:flex;justify-content:space-between;align-items:center;">
<span style="font-size:0.78rem;font-weight:800;letter-spacing:0.4px;background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">SELECT VARIANT</span>
<button onclick="closeBuyPreview()" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;line-height:1;padding:0;">×</button>
</div>
${sku?`<div class="sku-preview-badge"><i class="fa-solid fa-barcode"></i><span>SKU: <strong style="color:var(--gold-solid);">${sku}</strong></span></div>`:''}
<div class="preview-horizontal-scroll">${imgsHtml}</div>
<div style="display:flex;flex-direction:column;gap:3px;">
<label style="font-size:0.64rem;font-weight:700;color:var(--gold-solid);letter-spacing:0.3px;">CUSTOM SIZE / NOTE</label>
<textarea id="orderCustomNoteInput" rows="2" placeholder="ENTER SIZE, COLOR OR SPECIAL NOTE..." style="width:100%;background:#040407;border:1px solid rgba(212,175,55,0.3);border-radius:8px;padding:8px 10px;color:#fff;font-size:0.72rem;outline:none;resize:none;font-family:var(--font-main);line-height:1.35;">${initialNote}</textarea>
</div>
<button onclick="openDetailsFromOrderModal('${pId}')" style="background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.55);color:#fcf6ba;padding:8px;border-radius:8px;font-weight:700;font-size:0.76rem;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;"><i class="fa-solid fa-circle-info"></i> DETAILS</button>
<button onclick="confirmAddToCart(event,'${pId}','${titleEsc}',${parseFloat(product.price||0)},'${product.seller_id||'rorraxy-store'}','${skuEsc}')" style="background:var(--pink-accent);border:none;color:#fff;padding:11px;border-radius:8px;font-weight:800;font-size:0.86rem;cursor:pointer;width:100%;box-shadow:0 4px 15px rgba(255,42,133,0.4);">CONFIRM & ADD TO CART</button>`;
$('buyPreviewOverlay').style.display='flex';
}
function openDetailsFromOrderModal(pId){
const note=$('orderCustomNoteInput')?.value||'';
if(note.trim())persistentCustomNote=note.trim();
closeBuyPreview();
const list=activeProductList.length?activeProductList:globalMasterProductsList;
const prod=list.find(p=>String(p.id||p.product_id)===String(pId))||list[currentReelIndex]||list[0];
if(prod){openInpageDetailsModal(prod);setTimeout(()=>{const inpageNote=$('inpageCustomNoteInput');if(inpageNote&&note)inpageNote.value=note;},10);}
}
function selectPreviewImg(el,url){document.querySelectorAll('.preview-img-item').forEach(i=>i.classList.remove('selected'));el.classList.add('selected');selectedVariantImg=url;}
function closeBuyPreview(){const noteInput=$('orderCustomNoteInput');if(noteInput&&noteInput.value.trim())persistentCustomNote=noteInput.value.trim();$('buyPreviewOverlay').style.display='none';}
function playLuxuryChimeSound(){
try{
const AudioCtx=window.AudioContext||window.webkitAudioContext;
if(!AudioCtx)return;
const ctx=new AudioCtx(),now=ctx.currentTime;
[880,1318.51].forEach((freq,idx)=>{
const osc=ctx.createOscillator(),gain=ctx.createGain();
osc.type='sine';
osc.frequency.setValueAtTime(freq,now+idx*0.06);
gain.gain.setValueAtTime(0.001,now+idx*0.06);
gain.gain.exponentialRampToValueAtTime(0.065,now+idx*0.06+0.02);
gain.gain.exponentialRampToValueAtTime(0.0001,now+idx*0.06+0.42);
osc.connect(gain);gain.connect(ctx.destination);
osc.start(now+idx*0.06);osc.stop(now+idx*0.06+0.45);
});
}catch(e){}
}
function triggerCoinDropAnimation(e){
playLuxuryChimeSound();
const cartIcon=$('cartTargetIcon');
const rect=cartIcon?cartIcon.getBoundingClientRect():null;
const targetX=rect?rect.left+rect.width/2:window.innerWidth-33;
const targetY=rect?rect.top+rect.height/2:window.innerHeight-280;
const startX=e?.clientX||window.innerWidth/2;
const startY=e?.clientY||window.innerHeight/2;
const coin=document.createElement('div');
coin.className='flying-gold-coin';
coin.innerHTML='<i class="fa-solid fa-coins"></i>';
coin.style.left=`${startX-17}px`;
coin.style.top=`${startY-17}px`;
document.body.appendChild(coin);
const duration=540,startTime=performance.now();
const ctrlX=Math.min(startX,targetX)-75,ctrlY=Math.min(startY,targetY)-95;
function step(now){
const t=Math.min((now-startTime)/duration,1);
const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const inv=1-ease;
coin.style.left=`${inv*inv*startX+2*inv*ease*ctrlX+ease*ease*targetX-17}px`;
coin.style.top=`${inv*inv*startY+2*inv*ease*ctrlY+ease*ease*targetY-17}px`;
coin.style.transform=`scale(${1-0.68*ease}) rotate(${720*ease}deg)`;
coin.style.opacity=t>0.85?1-((t-0.85)/0.15):1;
if(t<1)requestAnimationFrame(step);
else{
coin.remove();
if(cartIcon){cartIcon.style.transition='transform 0.14s ease';cartIcon.style.transform='scale(1.28)';setTimeout(()=>{cartIcon.style.transform='scale(1)';},140);}
}
}
requestAnimationFrame(step);
}

function confirmAddToCart(e,pId,title,price,sellerId,sku){
const cart=JSON.parse(localStorage.getItem('rorraxy_cart')||'[]');
const ref=localStorage.getItem('rorraxy_active_affiliate_ref')||'rorraxy-store';
const rate=localStorage.getItem('rorraxy_active_commission_rate')||'13'; 
const platform=localStorage.getItem('rorraxy_active_platform')||'retail';

let note='';
const orderNote=$('orderCustomNoteInput');
if(orderNote&&orderNote.value.trim()){note=orderNote.value.trim();}
else{const detailsNote=$('inpageCustomNoteInput');if(detailsNote&&detailsNote.value.trim()){note=detailsNote.value.trim();}}
if(note)persistentCustomNote=note;

const skuValue=String(sku||'').trim().toUpperCase();
const existing=cart.find(i=>String(i.productId)===String(pId)&&i.img===selectedVariantImg&&(i.note||'')===note);
if(existing){
    existing.qty+=currentProductQty;
    if(skuValue&&!existing.sku)existing.sku=skuValue;
}else{
    cart.push({
        productId:pId,
        sellerId:sellerId||'rorraxy-store',
        sku:skuValue,
        affiliateRef:ref,
        affiliateId:ref,
        commissionRate:parseFloat(rate),
        platform:platform,
        title,price:`$${parseFloat(price).toFixed(2)}`,
        qty:currentProductQty,
        img:selectedVariantImg,
        note
    });
}
localStorage.setItem('rorraxy_cart',JSON.stringify(cart));
updateCartBadgeCount();
triggerCoinDropAnimation(e);
closeBuyPreview();
}
function updateCartBadgeCount(){
const cart=JSON.parse(localStorage.getItem('rorraxy_cart')||'[]');
const total=cart.reduce((s,i)=>s+(parseInt(i.qty)||0),0);
if($('sideCartBadgeCount'))$('sideCartBadgeCount').innerText=total;
}
function getDynamicEngagement(id){
const key=`rorraxy_retail_likes_${id}`;
const stored=localStorage.getItem(key);
let val;
if(stored)val=JSON.parse(stored).value;
else{
const pool=[40000,50000,100000,200000,500000,1000000,15000,10000,20000,350000];
let h=0;for(let i=0;i<String(id).length;i++)h=((h<<5)-h+String(id).charCodeAt(i))|0;
val=pool[Math.abs(h)%pool.length]+(Math.abs(h)%899);
localStorage.setItem(key,JSON.stringify({value:val}));
}
const formatted=val>=1000000?(val/1000000).toFixed(1)+'M':(val>=1000?(val/1000).toFixed(1)+'K':String(val));
return{raw:val,formatted};
}
function toggleReelLove(id){
const key=`rorraxy_retail_likes_${id}`,actKey=key+'_active';
const liked=localStorage.getItem(actKey)==='true';
let data=JSON.parse(localStorage.getItem(key)||'{"value":45000}');
let val=data.value;
val=liked?Math.max(0,val-1):val+1;
localStorage.setItem(actKey,liked?'false':'true');
localStorage.setItem(key,JSON.stringify({value:val}));
updateSideActionState();
}
function handleDualSaveAction(pId){
const now=Date.now();
const saved=JSON.parse(localStorage.getItem('rorraxy_saved_video_objects')||'[]');
const exists=saved.findIndex(i=>String(i.id||i.product_id)===String(pId));
if(now-lastSaveClickTime<400||$('sideSaveActionBtn')?.classList.contains('active')||exists>-1){
renderSavedGalleryContent();
if($('savedGalleryOverlay'))$('savedGalleryOverlay').style.display='flex';
lastSaveClickTime=0;
}else{
lastSaveClickTime=now;
const prod=globalMasterProductsList.find(i=>String(i.id||i.product_id)===String(pId));
if(prod&&exists===-1){
saved.push(prod);
localStorage.setItem('rorraxy_saved_video_objects',JSON.stringify(saved));
}
}
updateSideActionState();
}
function renderSavedGalleryContent(){
const saved=JSON.parse(localStorage.getItem('rorraxy_saved_video_objects')||'[]');
const body=$('savedGalleryBody');
if(!body)return;
if(!saved.length){
body.innerHTML=`<div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div><div style="text-align:center;color:#a0a0ab;padding:40px;font-size:0.9rem;">NO SAVED VIDEOS FOUND</div>`;
return;
}
const thumbs=saved.map(v=>{
const imgs=extractImages(v),vId=v.id||v.product_id;
return `<div class="saved-thumb-card">
<div class="saved-thumb-preview" onclick="selectSavedVideo('${vId}')"><img src="${imgs[0]}" style="width:100%;height:100%;object-fit:cover;" loading="lazy"><i class="fa-solid fa-play" style="position:absolute;color:#fcf6ba;font-size:1.2rem;"></i></div>
<div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 2px;">
<span style="font-size:0.7rem;font-weight:700;color:#fff;">ID: ${vId}</span>
<button onclick="removeSavedItem(event,'${vId}')" style="background:rgba(255,42,133,0.2);border:1px solid var(--pink-accent);color:#fff;font-size:0.65rem;padding:3px 8px;border-radius:6px;cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
</div>
</div>`;
}).join('');
body.innerHTML=`<div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2><button onclick="clearAllSavedVideos()" style="background:var(--pink-accent);border:none;color:#fff;font-size:0.72rem;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;">DELETE ALL</button></div><div class="fs-videos-grid">${thumbs}</div>`;
}
window.removeSavedItem=function(e,id){if(e)e.stopPropagation();const saved=JSON.parse(localStorage.getItem('rorraxy_saved_video_objects')||'[]').filter(i=>String(i.id||i.product_id)!==String(id));localStorage.setItem('rorraxy_saved_video_objects',JSON.stringify(saved));renderSavedGalleryContent();updateSideActionState();};
window.clearAllSavedVideos=function(){localStorage.removeItem('rorraxy_saved_video_objects');renderSavedGalleryContent();updateSideActionState();};
window.selectSavedVideo=function(id){let idx=activeProductList.findIndex(p=>String(p.id||p.product_id)===String(id));if(idx===-1){activeProductList=[...globalMasterProductsList];idx=activeProductList.findIndex(p=>String(p.id||p.product_id)===String(id));}if(idx!==-1)openReelsModal(idx);if($('savedGalleryOverlay'))$('savedGalleryOverlay').style.display='none';};

window.openNativeShare=function(pId){
const ref=localStorage.getItem('rorraxy_active_affiliate_ref')||'rorraxy-store';
const rate=localStorage.getItem('rorraxy_active_commission_rate')||'13';
const platform=localStorage.getItem('rorraxy_active_platform')||'retail';
const url=`${window.location.origin}/index.html?ref=${encodeURIComponent(ref)}&rate=${rate}&platform=${platform}&product=${encodeURIComponent(pId)}`;
if(navigator.share)navigator.share({title:'rorraxy product',url}).catch(()=>{});
else if(navigator.clipboard)navigator.clipboard.writeText(url).catch(()=>{});
};
</script>
