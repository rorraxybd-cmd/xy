        // Pull-To-Refresh Mechanism on Top Scroll
        function setupPullToRefresh() {
            const wrapper = document.getElementById('reelModalWrapperBody');
            const indicator = document.getElementById('pullRefreshIndicator');
            if(!wrapper || !indicator) return;

            let startY = 0;
            let isPulling = false;

            wrapper.addEventListener('touchstart', (e) => {
                if (wrapper.scrollTop <= 0) {
                    startY = e.touches[0].clientY;
                    isPulling = true;
                }
            }, { passive: true });

            wrapper.addEventListener('touchmove', (e) => {
                if (!isPulling) return;
                let diff = e.touches[0].clientY - startY;
                if (diff > 65 && wrapper.scrollTop <= 0) {
                    indicator.classList.add('visible');
                }
            }, { passive: true });

            wrapper.addEventListener('touchend', () => {
                if (!isPulling) return;
                isPulling = false;
                if (indicator.classList.contains('visible')) {
                    setTimeout(() => {
                        indicator.classList.remove('visible');
                        refreshAndShuffleFeed();
                    }, 300);
                }
            });
        }

        function openReelsModal(startIndex) {
            const overlay = document.getElementById('reelModalOverlay');
            const wrapper = document.getElementById('reelModalWrapperBody');
            const gridContainer = document.getElementById('appContainer');
            
            if(gridContainer) gridContainer.classList.remove('active-grid');
            if(overlay) overlay.classList.remove('hidden-reels');
            clearAllSlideIntervals();

            let list = activeProductList.length > 0 ? activeProductList : globalMasterProductsList;
            if(!list || list.length === 0) return;

            if(startIndex > 0 && startIndex < list.length) {
                let targetItem = list[startIndex];
                let targetCat = (targetItem.category || '').toLowerCase();
                let related = list.filter((p, idx) => idx !== startIndex && (p.category || '').toLowerCase() === targetCat);
                let others = list.filter((p, idx) => idx !== startIndex && (p.category || '').toLowerCase() !== targetCat);
                
                list = [targetItem, ...related, ...others];
                activeProductList = list;
                startIndex = 0;
            }

            let reelsHtml = '';

            list.forEach((product, idx) => {
                let pId = String(product.id || product.product_id || '101');
                let pVideo = product.video_url || product.youtube_video || '';
                let extractedImages = [];

                try {
                    if(product.images_json) {
                        let parsed = typeof product.images_json === 'string' ? JSON.parse(product.images_json) : product.images_json;
                        if(Array.isArray(parsed)) extractedImages = parsed;
                    } else if(product.image_url) extractedImages = [product.image_url];
                } catch(e){}

                if(extractedImages.length === 0) extractedImages = ['https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png'];

                let mediaContent = '';
                if (pVideo !== '' && (pVideo.includes('.mp4') || pVideo.includes('.r2.dev') || pVideo.includes('http'))) {
                    mediaContent = `<video src="${pVideo}" autoplay loop controls playsinline style="width:100%; height:100%; object-fit:contain;"></video>`;
                } else {
                    let layersHtml = extractedImages.map((imgUrl, imgIdx) => `
                        <img src="${imgUrl}" class="slide-layer ${imgIdx === 0 ? 'active' : ''}" id="slide_${idx}_${imgIdx}" alt="slide" loading="${idx === startIndex ? 'eager' : 'lazy'}" decoding="async">
                    `).join('');
                    mediaContent = `<div style="width:100%; height:100%; position:relative; overflow:hidden;">${layersHtml}</div>`;
                }

                let priceVal = parseFloat(product.price || 0);
                let price = `$${priceVal.toFixed(2)}`;
                let discountPercent = parseFloat(product.discount_rate || product.discountRate || 0);

                reelsHtml += `
                    <div class="reel-card" data-index="${idx}" data-product-id="${pId}">
                        <div class="reel-media-box" onclick="openBuyPreviewByIndex(${idx})">
                            <div class="reel-bottom-price-overlay">
                                <span class="reel-center-price-badge">${price}</span>
                                ${discountPercent > 0 ? `<span class="reel-center-discount-badge">${discountPercent}% OFF</span>` : ''}
                            </div>
                            <div class="reel-primary-video-container" id="primaryMediaBox_${idx}">
                                ${mediaContent}
                            </div>
                        </div>
                    </div>
                `;

                if (extractedImages.length > 1 && (!pVideo || pVideo === '')) {
                    let currentImgIdx = 0;
                    slideIntervalsMap[idx] = setInterval(() => {
                        let nextImgIdx = (currentImgIdx + 1) % extractedImages.length;
                        let currSlide = document.getElementById(`slide_${idx}_${currentImgIdx}`);
                        let nextSlide = document.getElementById(`slide_${idx}_${nextImgIdx}`);
                        if(currSlide && nextSlide) {
                            currSlide.classList.remove('active');
                            currSlide.classList.add('previous');
                            nextSlide.classList.remove('previous');
                            nextSlide.classList.add('active');
                            setTimeout(() => { currSlide.classList.remove('previous'); }, 650);
                        }
                        currentImgIdx = nextImgIdx;
                    }, 3000);
                }
            });

            wrapper.innerHTML = reelsHtml;
            currentReelIndex = startIndex;
            wrapper.scrollTop = 0;

            let scrollTimer = null;
            wrapper.onscroll = () => {
                // Hide floating search bar smoothly on scroll
                const searchBar = document.getElementById('floatingSearchContainer');
                if (searchBar && !searchBar.classList.contains('search-hidden')) {
                    searchBar.classList.add('search-hidden');
                    searchBar.classList.remove('manual-open');
                }

                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(() => {
                    let cardHeight = wrapper.clientHeight;
                    if(cardHeight > 0) {
                        let calculatedIdx = Math.round(wrapper.scrollTop / cardHeight);
                        if (calculatedIdx >= 0 && calculatedIdx < list.length && calculatedIdx !== currentReelIndex) {
                            currentReelIndex = calculatedIdx;
                            updateSideActionState();
                        }
                    }
                }, 8);
            };

            updateSideActionState();
        }

                    <span style="font-size:0.75rem; font-weight:700; color:#ffffff;">quantity</span>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button onclick="adjustDetailQty(-1)" style="background:#151520; color:#fff; border:1px solid rgba(212,175,55,0.4); width:28px; height:28px; border-radius:6px; cursor:pointer; font-weight:700;">-</button>
                        <span id="detailQtyDisplay" style="font-size:0.88rem; font-weight:800; color:#ffffff;">1</span>
                        <button onclick="adjustDetailQty(1)" style="background:#151520; color:#fff; border:1px solid rgba(212,175,55,0.4); width:28px; height:28px; border-radius:6px; cursor:pointer; font-weight:700;">+</button>
                    </div>
                </div>

                <h3 style="font-size:0.95rem; font-weight:700; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-transform:lowercase; line-height:1.45; margin:4px 0 0 0;">${title}</h3>

                <div style="font-size:0.75rem; color:var(--text-gray); line-height:1.6; text-transform:none !important; background:rgba(0,0,0,0.4); padding:10px; border-radius:8px; border-left:2px solid var(--gold-solid);">
                    ${rawDesc || 'crafted with precision luxury materials for ultimate comfort and elegance.'}
                </div>

                <div style="display:flex; flex-direction:column; gap:6px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#040407; border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:8px 12px;">
                        <textarea id="inpageCustomNoteInput" rows="2" placeholder="ENTER SIZE OR NOTE..." style="background:transparent; border:none; color:#fff; font-size:0.7rem; outline:none; flex:1; text-transform:uppercase; resize:none; font-family:var(--font-main);"></textarea>
                    </div>
                </div>
            `;
            overlay.style.display = 'flex';
        }

        function adjustDetailQty(amount) {
            currentProductQty += amount;
            if (currentProductQty < 1) currentProductQty = 1;
            let disp = document.getElementById('detailQtyDisplay');
            if (disp) disp.innerText = currentProductQty;
        }

        function closeInpageDetails() { document.getElementById('inpageDetailsOverlay').style.display = 'none'; }

        function openBuyPreviewModal(product) {
            const overlay = document.getElementById('buyPreviewOverlay');
            const content = document.getElementById('buyPreviewModalContent');

            let images = [];
            try {
                if(product.images_json) {
                    let parsed = typeof product.images_json === 'string' ? JSON.parse(product.images_json) : product.images_json;
                    if(Array.isArray(parsed)) images = parsed;
                } else if(product.image_url) images = [product.image_url];
            } catch(e){}

            if(images.length === 0) images = ['https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png'];
            selectedVariantImg = images[0];

            let imgsHtml = images.map((img, i) => `
                <div class="preview-img-item ${i===0?'selected':''}" onclick="selectPreviewImg(this, '${img}')">
                    <img src="${img}" loading="lazy">
                </div>
            `).join('');

            let pId = product.id || product.product_id || '101';
            let titleEsc = (product.title || 'item').toLowerCase().replace(/'/g, "\\'");
            let priceVal = parseFloat(product.price || 0);
            let sellerVal = product.seller_id || 'rorraxy-store';

            content.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.8rem; font-weight:700; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">SELECT VARIANT ($${priceVal.toFixed(2)})</span>
                    <button onclick="closeBuyPreview()" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">×</button>
                </div>
                <div class="preview-horizontal-scroll">${imgsHtml}</div>
                <button onclick="confirmAddToCart(event, '${pId}', '${titleEsc}', ${priceVal}, '${sellerVal}')" style="background:var(--pink-accent); border:none; color:#fff; padding:12px; border-radius:10px; font-weight:800; font-size:0.85rem; cursor:pointer; width:100%; box-shadow:0 4px 15px rgba(255,42,133,0.4);">
                    CONFIRM & ADD TO CART
                </button>
            `;
            overlay.style.display = 'flex';
        }

        function selectPreviewImg(el, imgUrl) {
            document.querySelectorAll('.preview-img-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedVariantImg = imgUrl;
        }

        function closeBuyPreview() { document.getElementById('buyPreviewOverlay').style.display = 'none'; }

        function triggerCoinDropAnimation(e) {
            const cartIconElem = document.getElementById('cartTargetIcon');
            let targetRect = cartIconElem ? cartIconElem.getBoundingClientRect() : null;
            let targetX = targetRect ? targetRect.left + (targetRect.width / 2) : window.innerWidth - 30;
            let targetY = targetRect ? targetRect.top + (targetRect.height / 2) : window.innerHeight - 50;

            let startX = e ? e.clientX : window.innerWidth / 2;
            let startY = e ? e.clientY : window.innerHeight / 2;

            const coin = document.createElement('div');
            coin.className = 'flying-gold-coin';
            coin.innerHTML = '<i class="fa-solid fa-coins"></i>';
            coin.style.left = `${startX - 16}px`;
            coin.style.top = `${startY - 16}px`;
            document.body.appendChild(coin);

            requestAnimationFrame(() => {
                coin.style.left = `${targetX - 16}px`;
                coin.style.top = `${targetY - 16}px`;
                coin.style.transform = 'scale(0.3) rotate(720deg)';
                coin.style.opacity = '0';
            });

            setTimeout(() => { if(coin.parentNode) coin.parentNode.removeChild(coin); }, 250);
        }

        function confirmAddToCart(e, pId, title, price, sellerId) {
            let cartKey = 'rorraxy_cart';
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            let activeAffiliateRef = localStorage.getItem('rorraxy_active_affiliate_ref') || 'rorraxy-store';

            let existing = cart.find(i => String(i.productId) === String(pId) && i.img === selectedVariantImg);

            if(existing) {
                existing.qty += currentProductQty;
            } else {
                cart.push({
                    productId: pId,
                    sellerId: sellerId || 'rorraxy-store',
                    affiliateRef: activeAffiliateRef,
                    title: title,
                    price: `$${parseFloat(price).toFixed(2)}`,
                    qty: currentProductQty,
                    img: selectedVariantImg
                });
            }
            localStorage.setItem(cartKey, JSON.stringify(cart));
            updateCartBadgeCount();
            triggerCoinDropAnimation(e);
            closeBuyPreview();
        }

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
            let badge = document.getElementById('sideCartBadgeCount');
            if(badge) badge.innerText = totalQty;
        }

        function getDynamicEngagement(productId) {
            let storageKey = `rorraxy_retail_likes_${productId}`;
            let storedData = localStorage.getItem(storageKey);
            let currentVal;
            if (storedData) {
                currentVal = JSON.parse(storedData).value;
            } else {
                const pool = [185, 245, 445, 890, 1500, 3200, 7800, 15400, 48000, 125000];
                let index = Math.abs(hashCode(String(productId))) % pool.length;
                let base = pool[index];
                let variance = (Math.abs(hashCode(String(productId))) % 199);
                currentVal = base + variance;
                localStorage.setItem(storageKey, JSON.stringify({ value: currentVal }));
            }
            return formatCompactNumber(currentVal);
        }

        function formatCompactNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            return hash;
        }

        function toggleReelLove(productId) {
            let storageKey = `rorraxy_retail_likes_${productId}`;
            let activeStateKey = storageKey + '_active';
            let isLiked = localStorage.getItem(activeStateKey) === 'true';
            let storedData = localStorage.getItem(storageKey);
            let currentVal = storedData ? JSON.parse(storedData).value : 1500;

            if (isLiked) {
                currentVal = Math.max(0, currentVal - 1);
                localStorage.setItem(activeStateKey, 'false');
            } else {
                currentVal += 1;
                localStorage.setItem(activeStateKey, 'true');
            }

            localStorage.setItem(storageKey, JSON.stringify({ value: currentVal }));
            updateSideActionState();
        }

        function handleDualSaveAction(pId) {
            let currentTime = new Date().getTime();
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let existingIndex = savedObjects.findIndex(item => String(item.id || item.product_id) === String(pId));
            
            let saveBtn = document.getElementById('sideSaveActionBtn');
            let isBtnActive = saveBtn && saveBtn.classList.contains('active');

            if (currentTime - lastSaveClickTime < 400 || isBtnActive || existingIndex > -1) {
                renderSavedGalleryContent();
                const overlay = document.getElementById('savedGalleryOverlay');
                if(overlay) overlay.style.display = 'flex';
                lastSaveClickTime = 0;
            } else {
                lastSaveClickTime = currentTime;
                let targetProduct = globalMasterProductsList.find(item => String(item.id || item.product_id) === String(pId));
                if(targetProduct && existingIndex === -1) {
                    savedObjects.push(targetProduct);
                    localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(savedObjects));
                }
            }
            updateSideActionState();
        }

        function renderSavedGalleryContent() {
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let containerBody = document.getElementById('savedGalleryBody');
            if(!containerBody) return;

            if (savedObjects.length === 0) {
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div>
                    <div style="text-align:center; color:#a0a0ab; padding:40px; font-size:0.85rem;">NO SAVED VIDEOS FOUND</div>`;
            } else {
                let thumbsHtml = '';
                savedObjects.forEach((v) => {
                    let thumbImg = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
                    try {
                        if(v.images_json) {
                            let parsed = typeof v.images_json === 'string' ? JSON.parse(v.images_json) : v.images_json;
                            if(Array.isArray(parsed) && parsed.length > 0) thumbImg = parsed[0];
                        } else if(v.image_url) thumbImg = v.image_url;
                    } catch(e){}

                    let vId = v.id || v.product_id;
                    thumbsHtml += `
                        <div class="saved-thumb-card">
                            <div class="saved-thumb-preview" onclick="selectSavedVideo('${vId}')">
                                <img src="${thumbImg}" style="width:100%; height:100%; object-fit:cover;" loading="lazy" decoding="async">
                                <i class="fa-solid fa-play" style="position:absolute; color:#fcf6ba; font-size:1.2rem;"></i>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center; width:100%; padding:0 2px;">
                                <span style="font-size:0.65rem; font-weight:700; color:#fff;">ID: ${vId}</span>
                                <button onclick="removeSavedItem(event, '${vId}')" style="background:rgba(255,42,133,0.2); border:1px solid var(--pink-accent); color:#fff; font-size:0.6rem; padding:3px 8px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                });
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box">
                        <h2 class="fs-profile-name">SAVED VIDEOS</h2>
                        <button onclick="clearAllSavedVideos()" style="background:var(--pink-accent); border:none; color:#fff; font-size:0.7rem; font-weight:700; padding:6px 14px; border-radius:20px; cursor:pointer; box-shadow:0 4px 12px rgba(255,42,133,0.4);">DELETE ALL</button>
                    </div>
                    <div class="fs-videos-grid">${thumbsHtml}</div>`;
            }
        }

        window.removeSavedItem = function(e, videoId) {
            if(e) e.stopPropagation();
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let filtered = savedObjects.filter(item => String(item.id || item.product_id) !== String(videoId));
            localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(filtered));
            renderSavedGalleryContent();
            updateSideActionState();
        };

        window.clearAllSavedVideos = function() {
            localStorage.removeItem('rorraxy_saved_video_objects');
            renderSavedGalleryContent();
            updateSideActionState();
        };

        window.selectSavedVideo = function(videoId) {
            let foundIdx = activeProductList.findIndex(p => String(p.id || p.product_id) === String(videoId));
            if(foundIdx === -1) {
                activeProductList = [...globalMasterProductsList];
                foundIdx = activeProductList.findIndex(p => String(p.id || p.product_id) === String(videoId));
            }
            if(foundIdx !== -1) openReelsModal(foundIdx);
            document.getElementById('savedGalleryOverlay').style.display = 'none';
        };

        // Instant Zero-Delay Share Handler
        window.openNativeShare = function(pId) {
            let activeAffiliateRef = localStorage.getItem('rorraxy_active_affiliate_ref') || 'rorraxy-store';
            const shareUrl = `${window.location.origin}/index.html?ref=${encodeURIComponent(activeAffiliateRef)}&product=${encodeURIComponent(pId)}`;
            
            if (navigator.share) {
                navigator.share({ title: 'rorraxy product', url: shareUrl }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).catch(() => {});
            }
        };
    </script>
</body>
</html>
