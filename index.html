<style>
:root{

  --card-retail:#0a0a10;

  --text-white:#ffffff;
  --text-gray:#a0a0ab;
  --font-main:'Poppins',sans-serif;
  --snap-ease:cubic-bezier(0.16,1,0.3,1);
}
html,body{width:100%;max-width:100vw;overflow-x:hidden;overflow-y:auto!important;background:var(--bg-retail)!important;color:var(--text-white);font-family:var(--font-main);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-overflow-scrolling:touch;scrollbar-width:none;text-rendering:optimizeSpeed;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:break-word;word-break:break-word;}
body{margin:0;padding:0 0 58px 0;text-transform:none!important;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,.product-card,.side-action-item,.bottom-nav-item,.desktop-nav-circle,.preview-img-item{touch-action:manipulation;user-select:none;-webkit-user-select:none;}

/* ======= LOADER & PULL REFRESH ======= */
#rorraxyLoaderOverlay{position:fixed;inset:0;background:#000;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity 0.1s linear;pointer-events:none;}
.loader-logo-box{width:68px;height:68px;border-radius:50%;overflow:hidden;border:2px solid var(--gold-solid);box-shadow:0 0 15px rgba(212,175,55,0.3);}
.loader-logo-box img{width:100%;height:100%;object-fit:cover;}
.loader-brand-name{font-size:1rem;font-weight:800;letter-spacing:3px;background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#pullRefreshIndicator{position:fixed;top:-50px;left:50%;transform:translateX(-50%);z-index:7000;background:#0c0c12;border:1px solid var(--gold-solid);color:var(--gold-solid);padding:6px 16px;border-radius:20px;font-size:0.75rem;font-weight:700;display:flex;align-items:center;gap:8px;transition:top 0.15s ease-out;pointer-events:none;}
#pullRefreshIndicator.visible{top:18px;}

/* ======= CLEAN GALLERY GRID & CARDS ======= */
.pinterest-feed-container{
  padding:74px 10px 24px 10px;
  display:none;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:10px;
  width:100%;
  max-width:1280px;
  margin:0 auto;
}
.pinterest-feed-container.active-grid{display:grid;}
@media (min-width:640px){.pinterest-feed-container{grid-template-columns:repeat(3, minmax(0, 1fr));gap:14px;padding:82px 16px 24px 16px;}}
@media (min-width:960px){.pinterest-feed-container{grid-template-columns:repeat(4, minmax(0, 1fr));gap:16px;padding:86px 20px 28px 20px;}}
@media (min-width:1200px){.pinterest-feed-container{grid-template-columns:repeat(5, minmax(0, 1fr));}}

.product-card{
  background:var(--card-retail);
  border:1px solid rgba(212,175,55,0.18);
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  width:100%;
  position:relative;
  cursor:pointer;
  opacity:0;
  transform:translate3d(0,10px,0) scale(0.985);
  transition:opacity 0.2s var(--snap-ease),transform 0.2s var(--snap-ease),border-color 0.2s ease;
  contain:layout style paint;
  backface-visibility:hidden;
}
.product-card.ai-revealed{opacity:1;transform:translate3d(0,0,0) scale(1);}
.product-card:hover{border-color:rgba(212,175,55,0.55);}
.product-card:active{transform:scale(0.97);transition-duration:0.06s;}

/* 100% Clean Product Photo Box (No Price Overlay on Photo) */
.product-media-box{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
  background:#0a0a12;
  flex-shrink:0;
}
.product-media-box::before{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,#0a0a12 0%,#161626 50%,#0a0a12 100%);background-size:200% 100%;animation:cardShimmer 1.2s linear infinite;}
@keyframes cardShimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.product-media-box img{width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1;background:#0a0a12;opacity:0;transition:opacity 0.22s ease-out,transform 0.3s ease;}
.product-card:hover .product-media-box img{transform:scale(1.03);}
.product-media-box img.img-ready{opacity:1;}
.product-media-box.img-loaded::before{display:none;}

.corner-discount-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:10;
  background:var(--pink-accent);
  color:#fff;
  font-size:0.64rem;
  font-weight:800;
  padding:2px 7px;
  border-radius:6px;
  letter-spacing:0.3px;
  box-shadow:0 2px 6px rgba(255,42,133,0.45);
  pointer-events:none;
}

/* ======= COMPACT SINGLE-LINE BOTTOM PRICE STRIP WITH SHIMMER ======= */
.card-bottom-price-strip{
  position:relative;
  width:100%;
  height:30px;
  min-height:30px;
  max-height:30px;
  padding:0 8px;
  background:linear-gradient(180deg,#0c0c14 0%,#06060a 100%);
  border-top:1px solid rgba(212,175,55,0.22);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  overflow:hidden;
  white-space:nowrap;
  flex-shrink:0;
}

.card-bottom-price-strip::after{
  content:'';
  position:absolute;
  top:0;
  left:-120%;
  width:70%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(252,246,186,0.06) 30%,
    rgba(252,246,186,0.28) 50%,
    rgba(255,42,133,0.12) 70%,
    transparent 100%
  );
  transform:skewX(-22deg);
  animation:priceShimmerSweep 2.6s infinite ease-in-out;
  pointer-events:none;
}

@keyframes priceShimmerSweep{
  0%{left:-120%;}
  55%,100%{left:160%;}
}

.card-bottom-price-strip .price-usd{
  font-size:0.78rem;
  font-weight:800;
  background:linear-gradient(90deg,#bf953f 0%,#fcf6ba 35%,#ffffff 50%,#fcf6ba 65%,#b38728 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldTextSparkle 3s linear infinite;
  line-height:1;
  letter-spacing:0.2px;
}

@keyframes goldTextSparkle{
  0%{background-position:200% center;}
  100%{background-position:0% center;}
}

.card-bottom-price-strip .price-sep{
  width:3px;
  height:3px;
  border-radius:50%;
  background:rgba(212,175,55,0.55);
  flex-shrink:0;
}

.card-bottom-price-strip .price-bdt{
  font-size:0.74rem;
  font-weight:800;
  color:var(--pink-accent);
  line-height:1;
  letter-spacing:0.2px;
  text-shadow:0 0 8px rgba(255,42,133,0.35);
}

/* ======= FLOATING SEARCH & NAV ======= */
.top-floating-search-bar{position:fixed;top:14px;left:50%;transform:translate3d(-50%,0,0);width:92%;max-width:420px;z-index:5500;display:flex!important;align-items:center;background:#090a0f;border:1.5px solid #6b5523;border-radius:40px;padding:4px 6px 4px 18px;box-shadow:0 8px 25px rgba(0,0,0,0.9);transition:transform 0.18s var(--snap-ease),opacity 0.12s linear;will-change:transform,opacity;}
.top-floating-search-bar.search-hidden{transform:translate3d(-50%,-95px,0);opacity:0;pointer-events:none;}
.floating-search-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:0.88rem;font-family:var(--font-main);}
.floating-search-input::placeholder{color:#7a7a85;}
.floating-search-btn-circle{width:34px;height:34px;border-radius:50%;background:var(--gold-gradient);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#000;font-size:0.88rem;}

.desktop-reel-nav{position:fixed;right:74px;top:50%;transform:translateY(-50%);z-index:4600;display:flex;flex-direction:column;gap:14px;}
@media (max-width:768px){.desktop-reel-nav{display:none!important;}}
.desktop-nav-circle{width:44px;height:44px;border-radius:50%;background:rgba(12,12,18,0.9);border:1px solid rgba(212,175,55,0.4);color:#fcf6ba;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.12s ease;}
.desktop-nav-circle:hover{transform:scale(1.08);background:rgba(212,175,55,0.18);}
.right-vertical-actions{position:fixed!important;right:10px!important;bottom:68px!important;z-index:4500!important;display:flex;flex-direction:column;align-items:center;gap:14px!important;width:46px;transform:translate3d(0,0,0);backface-visibility:hidden;transition:opacity 0.1s linear;}
.right-vertical-actions.clean-hidden{opacity:0;pointer-events:none;visibility:hidden;}
.side-action-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;gap:2px;position:relative;width:100%;transition:transform 0.06s ease;}
.side-action-item:active{transform:scale(0.88);}
.action-pure-icon{font-size:1.5rem!important;background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block;filter:drop-shadow(0px 2px 4px rgba(0,0,0,0.95));}
.side-count-text{font-size:0.65rem!important;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,1);text-align:center;white-space:nowrap;max-width:46px;letter-spacing:0.2px;}
.love-action-btn.liked-active .action-pure-icon,.save-action-btn.active .action-pure-icon{color:var(--pink-accent)!important;background:none!important;-webkit-background-clip:initial!important;-webkit-text-fill-color:initial!important;}
.side-action-item.you-active .action-pure-icon,.side-action-item.you-active .side-count-text{color:var(--pink-accent)!important;background:none!important;-webkit-background-clip:initial!important;-webkit-text-fill-color:initial!important;}
.cart-pink-badge{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--pink-accent);color:#fff;font-size:0.6rem;font-weight:800;min-width:18px;height:18px;padding:0 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px var(--pink-accent);z-index:10;pointer-events:none;}

.bottom-nav-bar{position:fixed;bottom:0;left:0;width:100%;height:54px!important;background:rgba(0,0,0,0.92)!important;border-top:1px solid rgba(212,175,55,0.15)!important;display:flex;justify-content:space-around;align-items:center;z-index:5000;padding:0 4px;transform:translate3d(0,0,0);}
@media(min-width:768px){.bottom-nav-bar{justify-content:center;gap:60px;padding:0 20px;}.bottom-nav-item{width:auto!important;min-width:70px;}}
.bottom-nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:0.6rem;font-weight:700;gap:2px;width:100%;height:100%;}
.bottom-nav-item:active{transform:scale(0.92);}
.bottom-nav-item i{font-size:1.2rem;background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.bottom-nav-item span{background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.6rem;letter-spacing:0.3px;}

/* ======= REELS MODAL ======= */
.reel-modal-overlay{display:flex;position:fixed;inset:0;background:#000;z-index:4000;align-items:center;justify-content:center;}
.reel-modal-overlay.hidden-reels{display:none!important;}
.reel-modal-wrapper{position:relative;width:100%;max-width:420px;height:calc(100vh - 54px);height:calc(100dvh - 54px);background:#000;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.reel-modal-wrapper::-webkit-scrollbar{display:none;}
.reel-card{width:100%;height:calc(100vh - 54px)!important;height:calc(100dvh - 54px)!important;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;position:relative;background:#000;flex-shrink:0;align-items:center;justify-content:center;padding-bottom:18px;contain:layout style paint;transform:translate3d(0,0,0);}
.reel-media-box{position:relative;width:100%;max-width:390px;aspect-ratio:9/16;max-height:calc(100dvh - 88px);cursor:pointer;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:16px;}
.reel-primary-video-container{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}

/* Reel Loading Shimmer Animation before image/video renders */
.reel-primary-video-container::before{
  content:'';
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(110deg,#06060a 15%,#141422 38%,#241e12 50%,#141422 62%,#06060a 85%);
  background-size:240% 100%;
  animation:reelInitialShimmer 1.35s linear infinite;
  pointer-events:none;
}
.reel-primary-video-container.media-ready::before{display:none;}
@keyframes reelInitialShimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}

.reel-primary-video-container video{width:100%;height:100%;object-fit:contain;display:block;background:#000;position:relative;z-index:2;}

/* Smooth, Fast, Uncropped Slideshow with Subtle Gentle Zoom Motion */
.slide-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:0;
  z-index:2;
  transition:opacity 0.28s cubic-bezier(0.22,1,0.36,1),transform 1.85s cubic-bezier(0.25,0.46,0.45,0.94);
  will-change:opacity,transform;
  backface-visibility:hidden;
  transform:translateZ(0) scale(1);
}
.slide-layer.active{
  opacity:1;
  z-index:3;
  transform:translateZ(0) scale(1.06);
}
.slide-layer.previous{
  opacity:0;
  z-index:2;
  transform:translateZ(0) scale(1.08);
}

/* ======= BOTTOM CONTROL DOCK: PRICE (LEFT) + AI SIMILAR (RIGHT) ======= */
.reel-bottom-dock{
  position:absolute;
  bottom:20px;
  left:12px;
  right:58px;
  z-index:65;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}
@media (min-width:440px){
  .reel-bottom-dock{left:14px;right:14px;}
}

/* Soft Borderless Luxury AI Visual Search Similar Button (Right Side) */
.reel-similar-btn{
  pointer-events:auto;
  position:relative;
  overflow:hidden;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:9px 15px;
  border-radius:26px;
  background:linear-gradient(135deg,rgba(22,20,30,0.88) 0%,rgba(34,27,16,0.92) 100%);
  border:none;
  box-shadow:0 6px 20px rgba(0,0,0,0.65),inset 0 1px 0 rgba(252,246,186,0.16);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  cursor:pointer;
  flex-shrink:0;
  margin-left:auto;
  transition:transform 0.14s ease,box-shadow 0.2s ease,background 0.2s ease;
  animation:similarCuePulse 2.4s infinite ease-in-out;
}
.reel-similar-btn:hover{
  background:linear-gradient(135deg,rgba(30,27,40,0.94) 0%,rgba(44,35,20,0.96) 100%);
  box-shadow:0 8px 24px rgba(0,0,0,0.75),inset 0 1px 0 rgba(252,246,186,0.28);
}
.reel-similar-btn:active{transform:scale(0.91);}

.reel-similar-btn::after{
  content:'';
  position:absolute;
  top:0;
  left:-130%;
  width:75%;
  height:100%;
  background:linear-gradient(90deg,transparent 0%,rgba(252,246,186,0.1) 30%,rgba(252,246,186,0.38) 50%,rgba(255,42,133,0.15) 70%,transparent 100%);
  transform:skewX(-22deg);
  animation:priceShimmerSweep 2.4s infinite ease-in-out;
  pointer-events:none;
}

@keyframes similarCuePulse{
  0%,100%{transform:translateY(0);box-shadow:0 6px 18px rgba(0,0,0,0.62),inset 0 1px 0 rgba(252,246,186,0.14);}
  50%{transform:translateY(-1.5px);box-shadow:0 8px 22px rgba(0,0,0,0.72),inset 0 1px 0 rgba(252,246,186,0.26);}
}

.reel-similar-btn .ai-sim-svg{
  width:19px;
  height:19px;
  flex-shrink:0;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,0.85));
}
.reel-similar-btn .sim-label{
  font-family:var(--font-main);
  font-size:0.72rem;
  font-weight:800;
  letter-spacing:0.5px;
  background:linear-gradient(90deg,#bf953f 0%,#fcf6ba 45%,#ffffff 65%,#d4af37 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldTextSparkle 2.8s linear infinite;
  line-height:1;
  white-space:nowrap;
}

  position:relative;

  align-items:center;
  justify-content:center;

.reel-price-row{display:flex;align-items:center;gap:7px;}
.reel-center-price-badge{font-size:1.02rem;font-weight:800;background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* ======= OVERLAYS & MODALS ======= */

<script>
/* ===================== CURRENCY HELPERS ===================== */
const USD_TO_BDT_RATE = 120; // 1 USD = 120 BDT
function fmtUSD(val){ const p = parseFloat(val)||0; return `$${p.toFixed(2)}`; }
function getBdtFromProduct(product){
  if (!product) return 0;
  if (product.price_bdt != null && !isNaN(parseFloat(product.price_bdt))) return Math.round(parseFloat(product.price_bdt));
  return Math.round((parseFloat(product.price)||0) * USD_TO_BDT_RATE);
}
function fmtBDTFromNum(num){ return `৳${Math.round(num||0).toLocaleString('en-US')}`; }
function priceStripHtml(product){
  const usd = fmtUSD(product.price||0);
  const bdt = fmtBDTFromNum(getBdtFromProduct(product));
  return `<span class="price-usd">${usd}</span><span class="price-sep"></span><span class="price-bdt">${bdt}</span>`;
}
/* ============================================================ */

/* ===================== ACCOUNT PORTAL ===================== */
function isAccountPortalOpen() {
    const overlay = document.getElementById('fullscreenIframeOverlay');
    const iframe = document.getElementById('fullscreenIframeBody');
    if (!overlay || !iframe) return false;
    const currentSrc = iframe.getAttribute('src') || '';
    return overlay.style.display === 'flex' && currentSrc.includes('account.html');
}
function closeAccountPortal() {
    const overlay = document.getElementById('fullscreenIframeOverlay');
    const iframe = document.getElementById('fullscreenIframeBody');
    const youBtn = document.getElementById('youActionBtn');
    if (overlay) overlay.style.display = 'none';
    if (iframe) iframe.src = '';
    if (youBtn) youBtn.classList.remove('you-active');
}
function openAccountPortalDirect() {
    const overlay = document.getElementById('fullscreenIframeOverlay');
    const iframe = document.getElementById('fullscreenIframeBody');
    const youBtn = document.getElementById('youActionBtn');
    if ($('categoryTransparentOverlay')) $('categoryTransparentOverlay').style.display = 'none';
    if ($('savedGalleryOverlay')) $('savedGalleryOverlay').style.display = 'none';
    closeBuyPreview();
    closeInpageDetails();
    if (overlay && iframe) {
        iframe.src = '/account.html?mode=customer&direct=1';
        overlay.style.display = 'flex';
        if (youBtn) youBtn.classList.add('you-active');
        updateCartBadgeCount();
    } else {
        window.location.assign(new URL('/account.html?mode=customer&direct=1', window.location.origin).href);
    }
}
function toggleAccountPortal() {
    if (isAccountPortalOpen()) closeAccountPortal();
    else openAccountPortalDirect();
}
window.toggleAccountPortal = toggleAccountPortal;
window.openAccountPortalDirect = openAccountPortalDirect;
window.closeAccountPortal = closeAccountPortal;
/* ========================================================== */

const FALLBACK_LOGO='https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/rorraxy.png';
const CACHE_KEY='rorraxy_retail_feed_cache';

let globalMasterProductsList=[{id:'101',sku:'ROR-DEMO-01',title:'rorraxy Premium Matte Black Edition',category:'Fashion',price:'49.99',discount_rate:'20',image_url:FALLBACK_LOGO,description:'Luxury matte finish crafted with highest precision.'}];
let activeProductList=[];
let renderedReelsCount=0;
let currentReelIndex=0;
let activeSlideTimer=null;
let selectedVariantImg='';
let lastSaveClickTime=0;
let currentProductQty=1;
let persistentCustomNote='';

/* Gallery Infinite Scroll State */

function getSku(product){return String(product&&(product.sku||product.product_code||product.productCode)||'').trim().toUpperCase();}
function escapeSku(str){return String(str||'').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hideLoaderFast(){const loader=$('rorraxyLoaderOverlay');if(loader&&loader.style.display!=='none'){loader.style.opacity='0';setTimeout(()=>{loader.style.display='none';},100);}}
function debounce(func,wait){let timeout;return function executedFunction(...args){const later=()=>{clearTimeout(timeout);func(...args);};clearTimeout(timeout);timeout=setTimeout(later,wait);};}
function preloadImageUrl(url,highPriority=false){if(!url||preloadedUrls.has(url))return;preloadedUrls.add(url);const img=new Image();if(highPriority)img.fetchPriority='high';img.decoding='async';img.src=url;}
function markReelMediaReady(el){
  if(!el) return;
  const box = el.closest('.reel-primary-video-container');
  if(box) box.classList.add('media-ready');
}
function shuffleArray(arr){const copy=[...arr];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
function extractImages(product){try{if(product.images_json){const parsed=typeof product.images_json==='string'?JSON.parse(product.images_json):product.images_json;if(Array.isArray(parsed)&&parsed.length)return parsed;}if(product.image_url)return[product.image_url];}catch(e){}return[FALLBACK_LOGO];}

/* Helper to build a single clean product card DOM element */
function createCleanProductCard(item, index, onClickHandler) {
  const imgs = extractImages(item);
  const disc = parseFloat(item.discount_rate || item.discountRate || 0);
  const card = document.createElement('div');
  card.className = 'product-card';
  card.innerHTML = `
    <div class="product-media-box">
      ${disc > 0 ? `<div class="corner-discount-badge">${disc}% OFF</div>` : ''}
      <img src="${imgs[0]}" alt="${(item.title || 'rorraxy').replace(/"/g, '&quot;')}" loading="${index < 8 ? 'eager' : 'lazy'}" decoding="async">
    </div>
    <div class="card-bottom-price-strip">
      ${priceStripHtml(item)}
    </div>
  `;
  const img = card.querySelector('img');
  const mediaBox = card.querySelector('.product-media-box');
  const onReady = () => {
    img.classList.add('img-ready');
    mediaBox.classList.add('img-loaded');
  };
  if (img.complete && img.naturalWidth) {
    onReady();
  } else {
    img.addEventListener('load', onReady, { once: true });
    img.addEventListener('error', () => {
      img.onerror = null;
      img.src = FALLBACK_LOGO;
      onReady();
    }, { once: true });
  }
  card.addEventListener('click', (e) => {
    e.preventDefault();
    onClickHandler(item, index);
  });
  return card;
}

function revealCardsSmoothly(container) {
  const newCards = container.querySelectorAll('.product-card:not(.ai-revealed)');
  if ('IntersectionObserver' in window) {
    const obs = new IntersectionObserver((entries, o) => {
      for (let j = 0; j < entries.length; j++) {
        const entry = entries[j];
        if (entry.isIntersecting) {
          entry.target.classList.add('ai-revealed');
          o.unobserve(entry.target);
        }
      }
    }, { rootMargin: '320px 0px', threshold: 0 });
    newCards.forEach(c => obs.observe(c));
    setTimeout(() => {
      newCards.forEach(c => {
        if (!c.classList.contains('ai-revealed')) c.classList.add('ai-revealed');
      });
    }, 300);
  } else {
    newCards.forEach(c => c.classList.add('ai-revealed'));
  }
}

loadLiveProducts();

setupDesktopNavigation();
setupInfiniteGridScroll();
setupSimilarInfiniteScroll();
buildCategoriesAccordion();

const debouncedSearch=debounce(val=>executeHeaderSearch(val),220);
searchBtn.addEventListener('click',()=>executeHeaderSearch(searchInput.value));
searchInput.addEventListener('keypress',e=>{if(e.key==='Enter')executeHeaderSearch(searchInput.value);});
searchInput.addEventListener('input',e=>debouncedSearch(e.target.value));
}
});

/* Infinite Scroll for Main Gallery (Auto-cycles trending products endlessly) */
function setupInfiniteGridScroll(){
window.addEventListener('scroll',()=>{
if(!gridActiveContainer||!gridActiveContainer.classList.contains('active-grid'))return;
if(!gridRenderingActive)return;
const scrollBottom=window.innerHeight+window.scrollY;
const docHeight=document.documentElement.scrollHeight;
if(docHeight-scrollBottom<1000){
  if(gridRenderedCount>=gridSourceList.length && globalMasterProductsList.length>0){
    gridSourceList = gridSourceList.concat(shuffleArray(globalMasterProductsList));
  }
  appendGridChunk();
}
},{passive:true});
}

/* Infinite Scroll for Similar Products Modal */
function setupSimilarInfiniteScroll(){
const grid=$('similarGrid');
if(!grid)return;
grid.addEventListener('scroll',()=>{
if(!similarRenderingActive)return;
if(grid.scrollHeight - (grid.scrollTop + grid.clientHeight) < 600){
  if(similarRenderedCount>=similarSourceList.length && globalMasterProductsList.length>0){
    const extra = shuffleArray(globalMasterProductsList);
    similarSourceList = similarSourceList.concat(extra);
  }
  appendSimilarChunk();
}
},{passive:true});
}

function buildCategoriesAccordion(){
const container=$('categoryMainListView');
if(!container)return;
const list=(typeof rorraxyCategoriesData!=='undefined'&&Array.isArray(rorraxyCategoriesData))?rorraxyCategoriesData:[];
if(!list.length){container.innerHTML=`<div style="color:#fff;text-align:center;padding:20px;">CATEGORIES LOADING...</div>`;return;}
let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;width:100%;"><span style="font-size:0.9rem;font-weight:800;background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">ALL CATEGORIES</span><button onclick="document.getElementById('categoryTransparentOverlay').style.display='none'" style="background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;">×</button></div>`;
list.forEach((cat,idx)=>{
const subs=(cat.subCategories||[]).map(sub=>`<div class="sub-cat-item" onclick="selectSubCategoryItem('${sub.key}','${sub.name.replace(/'/g,"\\'")}')"><i class="${sub.icon||'fa-solid fa-tag'}"></i><span class="sub-cat-name">${sub.name}</span></div>`).join('');
html+=`<div class="accordion-category-box ${idx===0?'active':''}" id="catBox_${cat.id}"><div class="accordion-header" onclick="toggleAccordionBox('catBox_${cat.id}')"><div class="accordion-title-wrap"><i class="${cat.icon} cat-main-icon"></i><span class="accordion-main-title">${cat.title}</span></div><i class="fa-solid fa-chevron-down accordion-arrow"></i></div><div class="accordion-content"><div class="sub-categories-grid">${subs}</div></div></div>`;
});

/* ======= SIMILAR MODAL (SMART RELATED MATCHING + 16-ITEM INFINITE LAZY GRID) ======= */
function openSimilarModal(index){
const list=activeProductList.length?activeProductList:globalMasterProductsList;
const current=list[index]||list[0];
if(!current)return;

const cat=(current.category||'').toLowerCase().trim();
const subCat=(current.subcategory||current.sub_category||'').toLowerCase().trim();
const titleWords=(current.title||'').toLowerCase().split(/\s+/).filter(w=>w.length>3);
const currentId=String(current.id||current.product_id);

/* Priority 1: Exact Category / Subcategory / Keyword match */
const exactMatches = globalMasterProductsList.filter(p=>{
  if(String(p.id||p.product_id)===currentId) return false;
  const pCat=(p.category||'').toLowerCase().trim();
  const pSub=(p.subcategory||p.sub_category||'').toLowerCase().trim();
  const pTitle=(p.title||'').toLowerCase();
  if(cat && pCat===cat) return true;
  if(subCat && pSub===subCat) return true;
  return titleWords.some(w=>pTitle.includes(w));
});

/* Priority 2: Other trending products so infinite scroll never runs empty */
const exactIds = new Set(exactMatches.map(p=>String(p.id||p.product_id)));
const trendingOthers = globalMasterProductsList.filter(p=>{
  const pid=String(p.id||p.product_id);
  return pid!==currentId && !exactIds.has(pid);
});

similarSourceList = [...shuffleArray(exactMatches), ...shuffleArray(trendingOthers)];
similarRenderedCount = 0;
similarRenderingActive = true;

const sub=$('similarSubText');
if(sub){
  const labelCat = (current.category || 'TRENDING').toUpperCase();
  sub.textContent = exactMatches.length
    ? `${labelCat} • ${exactMatches.length} MATCHED + TRENDING`
    : `TRENDING & RELATED COLLECTION`;
}

const grid=$('similarGrid');
if(!grid)return;
grid.innerHTML='';
grid.scrollTop=0;

if(!similarSourceList.length){
  grid.innerHTML=`<div style="text-align:center;color:#a0a0ab;padding:40px 12px;font-size:0.85rem;grid-column:1/-1;">NO SIMILAR PRODUCTS FOUND</div>`;
  $('similarOverlay').style.display='flex';
  return;
}

appendSimilarChunk();
$('similarOverlay').style.display='flex';
}

function appendSimilarChunk(){
const grid=$('similarGrid');
if(!grid || !similarRenderingActive)return;
if(similarRenderedCount>=similarSourceList.length)return;

const end=Math.min(similarRenderedCount+SIMILAR_CHUNK_SIZE, similarSourceList.length);
const frag=document.createDocumentFragment();

for(let i=similarRenderedCount; i<end; i++){
  const item=similarSourceList[i];
  const card=createCleanProductCard(item, i, (selectedItem)=>{
    const pid=String(selectedItem.id||selectedItem.product_id);
    openProductFromSimilar(pid);
  });
  frag.appendChild(card);
}

grid.appendChild(frag);
similarRenderedCount=end;
revealCardsSmoothly(grid);
}

function playLuxuryChimeSound(){
try{
const AudioCtx=window.AudioContext||window.webkitAudioContext;
if(!AudioCtx)return;
const ctx=new AudioCtx(),now=ctx.currentTime;
[880,1318.51].forEach((freq,idx)=>{
const osc=ctx.createOscillator(),gain=ctx.createGain();
osc.type='sine';
osc.frequency.setValueAtTime(freq,now+idx*0.06);
gain.gain.setValueAtTime(0.001,now+idx*0.06);
gain.gain.exponentialRampToValueAtTime(0.065,now+idx*0.06+0.02);
gain.gain.exponentialRampToValueAtTime(0.0001,now+idx*0.06+0.42);
osc.connect(gain);gain.connect(ctx.destination);
osc.start(now+idx*0.06);osc.stop(now+idx*0.06+0.45);
});
}catch(e){}
}
function triggerCoinDropAnimation(e){
playLuxuryChimeSound();
const cartIcon=$('cartTargetIcon');
const rect=cartIcon?cartIcon.getBoundingClientRect():null;
const targetX=rect?rect.left+rect.width/2:window.innerWidth-33;
const targetY=rect?rect.top+rect.height/2:window.innerHeight-280;
const startX=e?.clientX||window.innerWidth/2;
const startY=e?.clientY||window.innerHeight/2;
const coin=document.createElement('div');
coin.className='flying-gold-coin';
coin.innerHTML='<i class="fa-solid fa-coins"></i>';
coin.style.left=`${startX-17}px`;
coin.style.top=`${startY-17}px`;
document.body.appendChild(coin);
const duration=540,startTime=performance.now();
const ctrlX=Math.min(startX,targetX)-75,ctrlY=Math.min(startY,targetY)-95;
function step(now){
const t=Math.min((now-startTime)/duration,1);
const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const inv=1-ease;
coin.style.left=`${inv*inv*startX+2*inv*ease*ctrlX+ease*ease*targetX-17}px`;
coin.style.top=`${inv*inv*startY+2*inv*ease*ctrlY+ease*ease*targetY-17}px`;
coin.style.transform=`scale(${1-0.68*ease}) rotate(${720*ease}deg)`;
coin.style.opacity=t>0.85?1-((t-0.85)/0.15):1;
if(t<1)requestAnimationFrame(step);
else{
coin.remove();
if(cartIcon){cartIcon.style.transition='transform 0.14s ease';cartIcon.style.transform='scale(1.28)';setTimeout(()=>{cartIcon.style.transform='scale(1)';},140);}
}
}
requestAnimationFrame(step);
}

function confirmAddToCart(e,pId,title,price,sellerId,sku){
const cart=JSON.parse(localStorage.getItem('rorraxy_cart')||'[]');
const ref=localStorage.getItem('rorraxy_active_affiliate_ref')||'rorraxy-store';
const rate=localStorage.getItem('rorraxy_active_commission_rate')||'13';
const platform=localStorage.getItem('rorraxy_active_platform')||'retail';

let note='';
const orderNote=$('orderCustomNoteInput');
if(orderNote&&orderNote.value.trim()){note=orderNote.value.trim();}
else{const detailsNote=$('inpageCustomNoteInput');if(detailsNote&&detailsNote.value.trim()){note=detailsNote.value.trim();}}
if(note)persistentCustomNote=note;

const skuValue=String(sku||'').trim().toUpperCase();
const existing=cart.find(i=>String(i.productId)===String(pId)&&i.img===selectedVariantImg&&(i.note||'')===note);
if(existing){
    existing.qty+=currentProductQty;
    if(skuValue&&!existing.sku)existing.sku=skuValue;
}else{
    const bdtPriceNum = getBdtFromProduct({price:price});
    cart.push({
        productId:pId,
        sellerId:sellerId||'rorraxy-store',
        sku:skuValue,
        affiliateRef:ref,
        affiliateId:ref,
        commissionRate:parseFloat(rate),
        platform:platform,
        title,
        price:`$${parseFloat(price).toFixed(2)}`,
        price_bdt: bdtPriceNum,
        bdt_rate: USD_TO_BDT_RATE,
        qty:currentProductQty,
        img:selectedVariantImg,
        note
    });
}
localStorage.setItem('rorraxy_cart',JSON.stringify(cart));
updateCartBadgeCount();
triggerCoinDropAnimation(e);
closeBuyPreview();
}
function updateCartBadgeCount(){
const cart=JSON.parse(localStorage.getItem('rorraxy_cart')||'[]');
const total=cart.reduce((s,i)=>s+(parseInt(i.qty)||0),0);
if($('sideCartBadgeCount'))$('sideCartBadgeCount').innerText=total;
}

function getDynamicEngagement(id){
const key=`rorraxy_retail_likes_${id}`;
const stored=localStorage.getItem(key);
let val;
if(stored)val=JSON.parse(stored).value;
else{
const pool=[40000,50000,100000,200000,500000,1000000,15000,10000,20000,350000];
let h=0;for(let i=0;i<String(id).length;i++)h=((h<<5)-h+String(id).charCodeAt(i))|0;
val=pool[Math.abs(h)%pool.length]+(Math.abs(h)%899);
localStorage.setItem(key,JSON.stringify({value:val}));
}
const formatted=val>=1000000?(val/1000000).toFixed(1)+'M':(val>=1000?(val/1000).toFixed(1)+'K':String(val));
return{raw:val,formatted};
}
function toggleReelLove(id){
const key=`rorraxy_retail_likes_${id}`,actKey=key+'_active';
const liked=localStorage.getItem(actKey)==='true';
let data=JSON.parse(localStorage.getItem(key)||'{"value":45000}');
let val=data.value;
val=liked?Math.max(0,val-1):val+1;
localStorage.setItem(actKey,liked?'false':'true');
localStorage.setItem(key,JSON.stringify({value:val}));
updateSideActionState();
}
function handleDualSaveAction(pId){

const saved=JSON.parse(localStorage.getItem('rorraxy_saved_video_objects')||'[]');

renderSavedGalleryContent();

lastSaveClickTime=0;
}else{
lastSaveClickTime=now;
const prod=globalMasterProductsList.find(i=>String(i.id||i.product_id)===String(pId));
if(prod&&exists===-1){
saved.push(prod);
localStorage.setItem('rorraxy_saved_video_objects',JSON.stringify(saved));
}
}
updateSideActionState();
}

}).join('');

window.openNativeShare=function(pId){
const ref=localStorage.getItem('rorraxy_active_affiliate_ref')||'rorraxy-store';

const url=`${window.location.origin}/index.html?ref=${encodeURIComponent(ref)}&rate=${rate}&platform=${platform}&product=${encodeURIComponent(pId)}`;
if(navigator.share)navigator.share({title:'rorraxy product',url}).catch(()=>{});

};
