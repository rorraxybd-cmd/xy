        .fullscreen-iframe-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 54px); height: calc(100dvh - 54px); background: #000; z-index: 4500; flex-direction: column; }

        .fs-profile-name { font-size: 0.95rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    <script>
        const FALLBACK_LOGO = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
        const CACHE_KEY = 'rorraxy_retail_feed_cache';
        const REELS_BATCH_SIZE = 30; // Standard 30-item virtualized batch size for zero-lag playback

        let globalMasterProductsList = [{
            id: '101', title: 'rorraxy Premium Matte Black Edition', category: 'Fashion',
            price: '49.99', discount_rate: '20', image_url: FALLBACK_LOGO,
            description: 'Luxury matte finish crafted with highest precision.'
        }];
        let activeProductList = [];
        let renderedReelsCount = 0;
        let currentReelIndex = 0;
        let activeSlideTimer = null;
        let selectedVariantImg = '';
        let lastSaveClickTime = 0;
        let currentProductQty = 1;

        const $ = id => document.getElementById(id);

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function extractImages(product) {
            try {
                if (product.images_json) {
                    const parsed = typeof product.images_json === 'string' ? JSON.parse(product.images_json) : product.images_json;
                    if (Array.isArray(parsed) && parsed.length) return parsed;
                }
                if (product.image_url) return [product.image_url];
            } catch (e) {}
            return [FALLBACK_LOGO];
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref') || urlParams.get('seller_id') || urlParams.get('affiliate');
            if (refParam) localStorage.setItem('rorraxy_active_affiliate_ref', refParam);
            else if (!localStorage.getItem('rorraxy_active_affiliate_ref')) localStorage.setItem('rorraxy_active_affiliate_ref', 'rorraxy-store');

            loadLiveProducts();
            updateCartBadgeCount();
            updateSideActionState();
            setupPullToRefresh();
            setupAutoHideSearchOnScroll();
            setupDesktopNavigation();
            buildCategoriesAccordion();

            setTimeout(() => {
                const loader = $('rorraxyLoaderOverlay');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 80);
                }
            }, 10);

            const searchInput = $('floatingSearchInput'), searchBtn = $('floatingSearchBtn');
            if (searchBtn && searchInput) {
                searchBtn.addEventListener('click', () => executeHeaderSearch(searchInput.value));
                searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') executeHeaderSearch(searchInput.value); });
                searchInput.addEventListener('input', e => executeHeaderSearch(e.target.value));
            }
        });

        function buildCategoriesAccordion() {
            const container = $('categoryMainListView');
            if (!container) return;
            const list = (typeof rorraxyCategoriesData !== 'undefined' && Array.isArray(rorraxyCategoriesData)) ? rorraxyCategoriesData : [];
            if (!list.length) {
                container.innerHTML = `<div style="color:#fff; text-align:center; padding:20px;">CATEGORIES LOADING...</div>`;
                return;
            }
            let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; width:100%;">

        function toggleAccordionBox(boxId) {

                wrapper.addEventListener('touchmove', hideSearch, { passive: true });

        function openCleanGalleryView() {

        function setupDesktopNavigation() {
            const wrapper = $('reelModalWrapperBody');
            if (!wrapper) return;
            let wheelLock = false;
            wrapper.addEventListener('wheel', e => {
                const rm = $('reelModalOverlay');
                if (!rm || rm.style.display === 'none' || rm.classList.contains('hidden-reels')) return;
                e.preventDefault();
                if (wheelLock || Math.abs(e.deltaY) < 12) return;
                wheelLock = true;
                navigateReelStep(e.deltaY > 0 ? 1 : -1);
                setTimeout(() => { wheelLock = false; }, 300);
            }, { passive: false });

            window.addEventListener('keydown', e => {
                if (document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                const rm = $('reelModalOverlay');
                if (!rm || rm.style.display === 'none' || rm.classList.contains('hidden-reels')) return;
                if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); navigateReelStep(1); }
                else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); navigateReelStep(-1); }
            });
        }

        function navigateReelStep(dir) {
            const wrapper = $('reelModalWrapperBody');
            if (!wrapper) return;
            const list = activeProductList.length ? activeProductList : globalMasterProductsList;
            const nextIdx = Math.max(0, Math.min(list.length - 1, currentReelIndex + dir));
            if (nextIdx >= renderedReelsCount - 3 && renderedReelsCount < list.length) appendReelsBatch(REELS_BATCH_SIZE);
            wrapper.scrollTo({ top: nextIdx * wrapper.clientHeight, behavior: 'smooth' });
            activateReelAtIndex(nextIdx);
        }

        function setupPullToRefresh() {
            const wrapper = $('reelModalWrapperBody'), ind = $('pullRefreshIndicator');
            if (!wrapper || !ind) return;
            let startY = 0, pulling = false;
            wrapper.addEventListener('touchstart', e => { if (wrapper.scrollTop <= 0) { startY = e.touches[0].clientY; pulling = true; } }, { passive: true });
            wrapper.addEventListener('touchmove', e => { if (pulling && e.touches[0].clientY - startY > 60 && wrapper.scrollTop <= 0) ind.classList.add('visible'); }, { passive: true });
            wrapper.addEventListener('touchend', () => {
                if (!pulling) return;
                pulling = false;
                if (ind.classList.contains('visible')) {
                    setTimeout(() => { ind.classList.remove('visible'); refreshAndShuffleFeed(); }, 200);
                }
            });
        }

        async function refreshAndShuffleFeed() {
            activeProductList = shuffleArray(globalMasterProductsList);
            openReelsModal(0);
            try {
                const res = await fetch('/api/products');
                const json = await res.json();
                const list = (json && json.success && Array.isArray(json.data)) ? json.data : (Array.isArray(json) ? json : []);
                if (list.length) {
                    globalMasterProductsList = list;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(list));
                    activeProductList = shuffleArray(globalMasterProductsList);
                    openReelsModal(0);

        async function loadLiveProducts() {
            let rendered = false;
            try {
                const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
                if (Array.isArray(cached) && cached.length) {
                    globalMasterProductsList = cached;
                    checkInitialProductParam();
                    rendered = true;
                }
            } catch (e) {}

            try {
                const res = await fetch('/api/products');
                const json = await res.json();
                const list = (json && json.success && Array.isArray(json.data)) ? json.data : (Array.isArray(json) ? json : []);
                if (list.length) {
                    globalMasterProductsList = list;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(list));
                    if (!rendered) checkInitialProductParam();
                } else if (!rendered) checkInitialProductParam();
            } catch (e) { if (!rendered) checkInitialProductParam(); }
        }

        function checkInitialProductParam() {
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('product') || params.get('id');
            const targetCat = params.get('category');

            if (targetCat) { selectSubCategoryItem(targetCat, targetCat); return; }
            if (targetId) {
                const targetProd = globalMasterProductsList.find(p => String(p.id || p.product_id) === String(targetId));
                if (targetProd) {
                    const cat = (targetProd.category || '').toLowerCase();
                    const related = globalMasterProductsList.filter(p => String(p.id || p.product_id) !== String(targetId) && (p.category || '').toLowerCase() === cat);
                    const others = globalMasterProductsList.filter(p => String(p.id || p.product_id) !== String(targetId) && (p.category || '').toLowerCase() !== cat);
                    activeProductList = [targetProd, ...shuffleArray(related), ...shuffleArray(others)];
                    openReelsModal(0);
                    return;
                }
            }
            activeProductList = shuffleArray(globalMasterProductsList);
            openReelsModal(0);
        }

        function executeHeaderSearch(keyword) {
            const q = keyword.toLowerCase().trim();
            if (!q) {
                $('appContainer')?.classList.remove('active-grid');
                $('reelModalOverlay')?.classList.remove('hidden-reels');
                $('fixedGlobalActionsBar')?.classList.remove('clean-hidden');
                activeProductList = shuffleArray(globalMasterProductsList);
                openReelsModal(0);
                return;
            }
            switchToGridMode(false);
            activeProductList = globalMasterProductsList.filter(item => `${item.title || ''} ${item.category || ''} ${item.description || ''}`.toLowerCase().includes(q));
            renderPinterestHomeGrid(activeProductList);
        }

        function renderPinterestHomeGrid(products) {
            const container = $('appContainer');
            if (!container) return;
            container.className = 'pinterest-feed-container active-grid';
            const frag = document.createDocumentFragment();

            products.forEach((item, index) => {
                const imgs = extractImages(item);
                const price = item.price ? `$${parseFloat(item.price).toFixed(2)}` : '$0.00';
                const disc = parseFloat(item.discount_rate || item.discountRate || 0);
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = e => {
                    e.preventDefault();
                    container.classList.remove('active-grid');
                    $('fixedGlobalActionsBar')?.classList.remove('clean-hidden');
                    if ($('desktopReelNav')) $('desktopReelNav').style.display = 'flex';
                    const sb = $('floatingSearchContainer');
                    if (sb) { sb.classList.add('search-hidden'); sb.classList.remove('manual-open'); }
                    openReelsModal(index);
                };
                card.innerHTML = `<div class="product-media-box">
                    ${disc > 0 ? `<div class="corner-discount-badge">${disc}% OFF</div>` : ''}
                    <img src="${imgs[0]}" onerror="this.onerror=null;this.src='${FALLBACK_LOGO}';" alt="${item.title || 'rorraxy'}" loading="${index < 6 ? 'eager' : 'lazy'}" decoding="async">
                    <div class="card-clean-price-badge">${price}</div>
                </div>`;
                frag.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(frag);

            const cards = container.querySelectorAll('.product-card');
            if ('IntersectionObserver' in window) {
                let batch = 0;
                const obs = new IntersectionObserver((entries, o) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const delay = Math.min(batch++ * 50, 320);
                            setTimeout(() => entry.target.classList.add('ai-revealed'), delay);
                            o.unobserve(entry.target);
                        }
                    });
                    setTimeout(() => { batch = 0; }, 100);
                }, { rootMargin: '60px 0px', threshold: 0.05 });
                cards.forEach(c => obs.observe(c));
            } else cards.forEach((c, i) => setTimeout(() => c.classList.add('ai-revealed'), i * 40));

            updateSideActionState();
        }

        function updateSideActionState() {
            const list = activeProductList.length ? activeProductList : globalMasterProductsList;
            const prod = list[currentReelIndex] || list[0] || {};
            const id = prod.id || prod.product_id || '101';

            if ($('sideLoveCountText')) $('sideLoveCountText').innerText = getDynamicEngagement(id);
            const liked = localStorage.getItem(`rorraxy_retail_likes_${id}_active`) === 'true';
            $('sideLoveActionBtn')?.classList.toggle('liked-active', liked);

            const saved = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            const isSaved = saved.some(i => String(i.id || i.product_id) === String(id));
            $('sideSaveActionBtn')?.classList.toggle('active', isSaved);
            updateCartBadgeCount();
        }

        function toggleReelSearchBox() {

            if (sb.classList.contains('search-hidden')) {
                sb.classList.remove('search-hidden');
                sb.classList.add('manual-open');
                setTimeout(() => $('floatingSearchInput')?.focus(), 20);
            } else {
                sb.classList.add('search-hidden');
                sb.classList.remove('manual-open');
            }
        }

        function handlePinterestInterception(e, type) {
            if (e) e.stopPropagation();
            const list = activeProductList.length ? activeProductList : globalMasterProductsList;
            const prod = list[currentReelIndex] || list[0] || {};
            const id = prod.id || prod.product_id || '101';
            if (type === 'like') toggleReelLove(id);
            else if (type === 'save') handleDualSaveAction(id);
            else if (type === 'share') openNativeShare(id);
        }

        // Single Active Reel Slideshow & Video Playback Manager (Zero Background CPU Waste)
        function activateReelAtIndex(idx) {
            currentReelIndex = idx;
            updateSideActionState();

            if (activeSlideTimer) { clearInterval(activeSlideTimer); activeSlideTimer = null; }

            const wrapper = $('reelModalWrapperBody');
            if (!wrapper) return;

            // Reveal card with AI curtain animation immediately
            const activeCard = wrapper.querySelector(`.reel-card[data-index="${idx}"]`);
            if (activeCard && !activeCard.classList.contains('ai-reel-revealed')) {
                requestAnimationFrame(() => activeCard.classList.add('ai-reel-revealed'));
            }

            // Pause all other videos & play only active video
            wrapper.querySelectorAll('video').forEach(v => {
                const cardIdx = Number(v.closest('.reel-card')?.dataset.index);
                if (cardIdx === idx) { v.play().catch(() => {}); }
                else if (!v.paused) { v.pause(); }
            });

            // Run slideshow ONLY for the currently visible reel card
            const list = activeProductList.length ? activeProductList : globalMasterProductsList;
            const prod = list[idx];
            if (!prod) return;
            const pVideo = prod.video_url || prod.youtube_video || '';
            const imgs = extractImages(prod);

            if (imgs.length > 1 && !pVideo) {
                let curImg = 0;
                activeSlideTimer = setInterval(() => {
                    const nextImg = (curImg + 1) % imgs.length;
                    const currEl = $(`slide_${idx}_${curImg}`);
                    const nextEl = $(`slide_${idx}_${nextImg}`);
                    if (currEl && nextEl) {
                        currEl.classList.remove('active');
                        currEl.classList.add('previous');
                        nextEl.classList.remove('previous');
                        nextEl.classList.add('active');
                        setTimeout(() => currEl.classList.remove('previous'), 500);
                    }
                    curImg = nextImg;
                }, 2800);
            }
        }

        // Progressive 30-Item Batch Renderer (Standard YouTube/Instagram Reels Engine)
        function appendReelsBatch(count) {
            const wrapper = $('reelModalWrapperBody');
            const list = activeProductList.length ? activeProductList : globalMasterProductsList;
            if (!wrapper || renderedReelsCount >= list.length) return;

            const endIdx = Math.min(renderedReelsCount + count, list.length);
            const frag = document.createDocumentFragment();

            for (let idx = renderedReelsCount; idx < endIdx; idx++) {
                const product = list[idx];
                const pId = String(product.id || product.product_id || '101');
                const pVideo = product.video_url || product.youtube_video || '';
                const imgs = extractImages(product);
                const price = `$${parseFloat(product.price || 0).toFixed(2)}`;
                const disc = parseFloat(product.discount_rate || product.discountRate || 0);

                let mediaContent = '';
                if (pVideo && (pVideo.includes('.mp4') || pVideo.includes('.r2.dev') || pVideo.includes('http'))) {
                    mediaContent = `<video src="${pVideo}" poster="${imgs[0]}" ${idx === 0 ? 'autoplay' : 'preload="metadata"'} muted loop controls playsinline style="width:100%; height:100%; object-fit:contain;"></video>`;
                } else {
                    const layers = imgs.map((url, i) => `<img src="${url}" onerror="this.onerror=null;this.src='${FALLBACK_LOGO}';" class="slide-layer ${i === 0 ? 'active' : ''}" id="slide_${idx}_${i}" alt="slide" loading="${idx <= 2 ? 'eager' : 'lazy'}" decoding="async">`).join('');
                    mediaContent = `<div style="width:100%; height:100%; position:relative; overflow:hidden;">${layers}</div>`;
                }

                const card = document.createElement('div');
                card.className = 'reel-card' + (idx === 0 ? ' ai-reel-revealed' : '');
                card.dataset.index = idx;
                card.dataset.productId = pId;
                card.innerHTML = `<div class="reel-media-box" onclick="openBuyPreviewByIndex(${idx})">
                    <div class="reel-bottom-price-overlay">
                        <span class="reel-center-price-badge">${price}</span>
                        ${disc > 0 ? `<span class="reel-center-discount-badge">${disc}% OFF</span>` : ''}
                    </div>
                    <div class="reel-primary-video-container" id="primaryMediaBox_${idx}">${mediaContent}</div>
                </div>`;
                frag.appendChild(card);
            }

            wrapper.appendChild(frag);
            renderedReelsCount = endIdx;
        }

        function openReelsModal(startIndex) {
            const overlay = $('reelModalOverlay'), wrapper = $('reelModalWrapperBody');
            $('appContainer')?.classList.remove('active-grid');
            overlay?.classList.remove('hidden-reels');

            let list = activeProductList.length ? activeProductList : globalMasterProductsList;
            if (!list || !list.length) return;

            if (startIndex > 0 && startIndex < list.length) {
                const target = list[startIndex];
                const cat = (target.category || '').toLowerCase();
                const related = list.filter((p, i) => i !== startIndex && (p.category || '').toLowerCase() === cat);
                const others = list.filter((p, i) => i !== startIndex && (p.category || '').toLowerCase() !== cat);
                list = [target, ...related, ...others];
                activeProductList = list;
            }

            wrapper.innerHTML = '';
            renderedReelsCount = 0;
            appendReelsBatch(REELS_BATCH_SIZE); // Load initial 30 reels smoothly

            wrapper.style.scrollBehavior = 'auto';
            wrapper.scrollTop = 0;
            activateReelAtIndex(0);

            let scrollRaf = null;
            wrapper.onscroll = () => {
                const sb = $('floatingSearchContainer');
                if (sb && !sb.classList.contains('search-hidden')) {
                    sb.classList.add('search-hidden');
                    sb.classList.remove('manual-open');
                }
                if (scrollRaf) cancelAnimationFrame(scrollRaf);
                scrollRaf = requestAnimationFrame(() => {
                    const h = wrapper.clientHeight;
                    if (h > 0) {
                        const idx = Math.round(wrapper.scrollTop / h);
                        if (idx >= renderedReelsCount - 5 && renderedReelsCount < list.length) {
                            appendReelsBatch(REELS_BATCH_SIZE); // Seamlessly append next 30 reels without reload
                        }
                        if (idx >= 0 && idx < list.length && idx !== currentReelIndex) {
                            activateReelAtIndex(idx);
                        }
                    }
                });
            };
        }

        function closeInpageDetails() { $('inpageDetailsOverlay').style.display = 'none'; }

        function openBuyPreviewModal(product) {
            const imgs = extractImages(product);
            selectedVariantImg = imgs[0];
            const imgsHtml = imgs.map((img, i) => `<div class="preview-img-item ${i===0?'selected':''}" onclick="selectPreviewImg(this, '${img}')"><img src="${img}" loading="lazy"></div>`).join('');
            const pId = product.id || product.product_id || '101';
            const titleEsc = (product.title || 'item').toLowerCase().replace(/'/g, "\\'");
            const initialNote = $('inpageCustomNoteInput')?.value || '';

            $('buyPreviewModalContent').innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.84rem; font-weight:800; letter-spacing:0.5px; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">SELECT VARIANT / COLOR</span>
                    <button onclick="closeBuyPreview()" style="background:none; border:none; color:#fff; font-size:1.35rem; cursor:pointer; line-height:1;">×</button>
                </div>
                <div class="preview-horizontal-scroll">${imgsHtml}</div>
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <label style="font-size:0.68rem; font-weight:700; color:var(--gold-solid); letter-spacing:0.4px;">CUSTOM SIZE / NOTE</label>
                    <textarea id="orderCustomNoteInput" rows="2" placeholder="ENTER SIZE, COLOR OR SPECIAL NOTE..." style="width:100%; background:#040407; border:1px solid rgba(212,175,55,0.35); border-radius:10px; padding:10px 12px; color:#fff; font-size:0.74rem; outline:none; resize:none; font-family:var(--font-main);">${initialNote}</textarea>
                </div>
                <button onclick="openDetailsFromOrderModal('${pId}')" style="background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.55); color:#fcf6ba; padding:10px; border-radius:10px; font-weight:700; font-size:0.78rem; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:7px;">
                    <i class="fa-solid fa-circle-info"></i> DETAILS
                </button>
                <button onclick="confirmAddToCart(event, '${pId}', '${titleEsc}', ${parseFloat(product.price || 0)}, '${product.seller_id || 'rorraxy-store'}')" style="background:var(--pink-accent); border:none; color:#fff; padding:13px; border-radius:10px; font-weight:800; font-size:0.86rem; cursor:pointer; width:100%; box-shadow:0 4px 15px rgba(255,42,133,0.4);">
                    CONFIRM & ADD TO CART
                </button>`;
            $('buyPreviewOverlay').style.display = 'flex';
        }

        function openDetailsFromOrderModal(pId) {
            const note = $('orderCustomNoteInput')?.value || '';
            closeBuyPreview();
            const list = activeProductList.length ? activeProductList : globalMasterProductsList;
            const prod = list.find(p => String(p.id || p.product_id) === String(pId)) || list[currentReelIndex] || list[0];
            if (prod) {
                openInpageDetailsModal(prod);
                setTimeout(() => { if ($('inpageCustomNoteInput') && note) $('inpageCustomNoteInput').value = note; }, 10);
            }
        }

        function selectPreviewImg(el, url) {
            document.querySelectorAll('.preview-img-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedVariantImg = url;
        }
        function closeBuyPreview() { $('buyPreviewOverlay').style.display = 'none'; }

        function playLuxuryChimeSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx(), now = ctx.currentTime;
                [880, 1318.51].forEach((freq, idx) => {
                    const osc = ctx.createOscillator(), gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                    gain.gain.setValueAtTime(0.001, now + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.065, now + idx * 0.06 + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.06 + 0.42);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now + idx * 0.06); osc.stop(now + idx * 0.06 + 0.45);
                });
            } catch (e) {}
        }

        function triggerCoinDropAnimation(e) {
            playLuxuryChimeSound();
            const cartIcon = $('cartTargetIcon');
            const rect = cartIcon ? cartIcon.getBoundingClientRect() : null;
            const targetX = rect ? rect.left + rect.width / 2 : window.innerWidth - 33;
            const targetY = rect ? rect.top + rect.height / 2 : window.innerHeight - 280;
            const startX = e?.clientX || window.innerWidth / 2;
            const startY = e?.clientY || window.innerHeight / 2;

            const coin = document.createElement('div');
            coin.className = 'flying-gold-coin';
            coin.innerHTML = '<i class="fa-solid fa-coins"></i>';
            coin.style.left = `${startX - 17}px`;
            coin.style.top = `${startY - 17}px`;
            document.body.appendChild(coin);

            const duration = 540, startTime = performance.now();
            const ctrlX = Math.min(startX, targetX) - 75, ctrlY = Math.min(startY, targetY) - 95;

            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                const inv = 1 - ease;
                coin.style.left = `${inv * inv * startX + 2 * inv * ease * ctrlX + ease * ease * targetX - 17}px`;
                coin.style.top = `${inv * inv * startY + 2 * inv * ease * ctrlY + ease * ease * targetY - 17}px`;
                coin.style.transform = `scale(${1 - 0.68 * ease}) rotate(${720 * ease}deg)`;
                coin.style.opacity = t > 0.85 ? 1 - ((t - 0.85) / 0.15) : 1;

                if (t < 1) requestAnimationFrame(step);
                else {
                    coin.remove();
                    if (cartIcon) {
                        cartIcon.style.transition = 'transform 0.14s ease';
                        cartIcon.style.transform = 'scale(1.28)';
                        setTimeout(() => { cartIcon.style.transform = 'scale(1)'; }, 140);
                    }
                }
            }
            requestAnimationFrame(step);
        }

        function confirmAddToCart(e, pId, title, price, sellerId) {
            const cart = JSON.parse(localStorage.getItem('rorraxy_cart') || '[]');
            const ref = localStorage.getItem('rorraxy_active_affiliate_ref') || 'rorraxy-store';
            const note = ($('orderCustomNoteInput')?.value || $('inpageCustomNoteInput')?.value || '').trim();
            const existing = cart.find(i => String(i.productId) === String(pId) && i.img === selectedVariantImg && (i.note || '') === note);

            if (existing) existing.qty += currentProductQty;
            else cart.push({ productId: pId, sellerId: sellerId || 'rorraxy-store', affiliateRef: ref, title, price: `$${parseFloat(price).toFixed(2)}`, qty: currentProductQty, img: selectedVariantImg, note });

            localStorage.setItem('rorraxy_cart', JSON.stringify(cart));
            updateCartBadgeCount();
            triggerCoinDropAnimation(e);
            closeBuyPreview();
        }

        function updateCartBadgeCount() {
            const cart = JSON.parse(localStorage.getItem('rorraxy_cart') || '[]');
            const total = cart.reduce((s, i) => s + (parseInt(i.qty) || 0), 0);
            if ($('sideCartBadgeCount')) $('sideCartBadgeCount').innerText = total;
        }

        function getDynamicEngagement(id) {
            const key = `rorraxy_retail_likes_${id}`;
            const stored = localStorage.getItem(key);
            let val;
            if (stored) val = JSON.parse(stored).value;
            else {
                const pool = [185, 245, 445, 890, 1500, 3200, 7800, 15400, 48000, 125000];
                let h = 0; for (let i = 0; i < String(id).length; i++) h = ((h << 5) - h + String(id).charCodeAt(i)) | 0;
                val = pool[Math.abs(h) % pool.length] + (Math.abs(h) % 199);
                localStorage.setItem(key, JSON.stringify({ value: val }));
            }
            return val >= 1000000 ? (val / 1000000).toFixed(1) + 'M' : (val >= 1000 ? (val / 1000).toFixed(1) + 'K' : String(val));
        }

        function toggleReelLove(id) {
            const key = `rorraxy_retail_likes_${id}`, actKey = key + '_active';
            const liked = localStorage.getItem(actKey) === 'true';
            let val = JSON.parse(localStorage.getItem(key) || '{"value":1500}').value;
            val = liked ? Math.max(0, val - 1) : val + 1;
            localStorage.setItem(actKey, liked ? 'false' : 'true');
            localStorage.setItem(key, JSON.stringify({ value: val }));
            updateSideActionState();
        }

        function handleDualSaveAction(pId) {
            const now = Date.now();
            const saved = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            const exists = saved.findIndex(i => String(i.id || i.product_id) === String(pId));
            if (now - lastSaveClickTime < 400 || $('sideSaveActionBtn')?.classList.contains('active') || exists > -1) {
                renderSavedGalleryContent();
                if ($('savedGalleryOverlay')) $('savedGalleryOverlay').style.display = 'flex';
                lastSaveClickTime = 0;
            } else {
                lastSaveClickTime = now;
                const prod = globalMasterProductsList.find(i => String(i.id || i.product_id) === String(pId));
                if (prod && exists === -1) {
                    saved.push(prod);
                    localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(saved));
                }
            }
            updateSideActionState();
        }

        function renderSavedGalleryContent() {
            const saved = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            const body = $('savedGalleryBody');
            if (!body) return;
            if (!saved.length) {
                body.innerHTML = `<div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div><div style="text-align:center; color:#a0a0ab; padding:40px; font-size:0.85rem;">NO SAVED VIDEOS FOUND</div>`;
                return;
            }
            const thumbs = saved.map(v => {
                const imgs = extractImages(v), vId = v.id || v.product_id;
                return `<div class="saved-thumb-card">
                    <div class="saved-thumb-preview" onclick="selectSavedVideo('${vId}')"><img src="${imgs[0]}" style="width:100%; height:100%; object-fit:cover;" loading="lazy"><i class="fa-solid fa-play" style="position:absolute; color:#fcf6ba; font-size:1.2rem;"></i></div>
                    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; padding:0 2px;">
                        <span style="font-size:0.65rem; font-weight:700; color:#fff;">ID: ${vId}</span>
                        <button onclick="removeSavedItem(event, '${vId}')" style="background:rgba(255,42,133,0.2); border:1px solid var(--pink-accent); color:#fff; font-size:0.6rem; padding:3px 8px; border-radius:6px; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
            }).join('');
            body.innerHTML = `<div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2><button onclick="clearAllSavedVideos()" style="background:var(--pink-accent); border:none; color:#fff; font-size:0.7rem; font-weight:700; padding:6px 14px; border-radius:20px; cursor:pointer;">DELETE ALL</button></div><div class="fs-videos-grid">${thumbs}</div>`;
        }

        window.removeSavedItem = function(e, id) {
            if (e) e.stopPropagation();
            const saved = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]').filter(i => String(i.id || i.product_id) !== String(id));
            localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(saved));
            renderSavedGalleryContent(); updateSideActionState();
        };
        window.clearAllSavedVideos = function() { localStorage.removeItem('rorraxy_saved_video_objects'); renderSavedGalleryContent(); updateSideActionState(); };
        window.selectSavedVideo = function(id) {
            let idx = activeProductList.findIndex(p => String(p.id || p.product_id) === String(id));
            if (idx === -1) { activeProductList = [...globalMasterProductsList]; idx = activeProductList.findIndex(p => String(p.id || p.product_id) === String(id)); }
            if (idx !== -1) openReelsModal(idx);
            if ($('savedGalleryOverlay')) $('savedGalleryOverlay').style.display = 'none';
        };
        window.openNativeShare = function(pId) {
            const ref = localStorage.getItem('rorraxy_active_affiliate_ref') || 'rorraxy-store';
            const url = `${window.location.origin}/index.html?ref=${encodeURIComponent(ref)}&product=${encodeURIComponent(pId)}`;
            if (navigator.share) navigator.share({ title: 'rorraxy product', url }).catch(() => {});
            else if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
        };
    </script>
</body>
