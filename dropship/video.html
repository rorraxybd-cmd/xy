<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>rorraxy - Dropship Reels & Video Feed</title>
    
    <!-- Central Script Tag -->
    <script src="/ecosystem-core.js"></script>

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="/manifest.json">

    <!-- Service Worker Registration Script -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
            .catch((err) => console.log('Service Worker registration failed:', err));
        });
      }
    </script>

    <!-- Popup JS Link -->
    <script src="/popup.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev">
    <link rel="preconnect" href="https://vid.rorraxy.com">

    <!-- Correct Cloudflare R2 Icons & Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">
    <link rel="apple-touch-icon" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        let globalVideoList = [];
        let currentIndex = 0;
        let currentSellerPage = 1;
        const itemsPerPage = 20;
        let isGlobalMuted = true;

        window.addEventListener('DOMContentLoaded', () => {
            loadLiveVideosFromBackend();

            const bottomSearchBtn = document.getElementById('bottomSearchBtn');
            const bottomHomeBtn = document.getElementById('bottomHomeBtn');
            const bottomBuyInfoBtn = document.getElementById('bottomBuyInfoBtn');
            const bottomSellerBtn = document.getElementById('bottomSellerBtn');
            const searchModal = document.getElementById('searchModal');
            const searchInput = document.getElementById('modalSearchInput');
            const searchBtn = document.getElementById('modalSearchBtn');
            const sellerFullscreenOverlay = document.getElementById('sellerFullscreenOverlay');

            if(bottomHomeBtn) {
                bottomHomeBtn.addEventListener('click', () => { window.location.href = "index.html"; });
            }

            if(bottomSearchBtn && searchModal) {
                bottomSearchBtn.addEventListener('click', () => {
                    searchModal.style.display = searchModal.style.display === 'flex' ? 'none' : 'flex';
                    if(searchInput) searchInput.focus();
                });
                searchModal.addEventListener('click', (e) => {
                    if(e.target === searchModal) searchModal.style.display = 'none';
                });
            }

            if(bottomSellerBtn && sellerFullscreenOverlay) {
                bottomSellerBtn.addEventListener('click', () => {
                    currentSellerPage = 1;
                    openSellerFullscreenProfile();
                });
            }

            if(bottomBuyInfoBtn) {
                bottomBuyInfoBtn.addEventListener('click', () => {
                    let activeList = globalVideoList;
                    if(activeList.length > 0 && activeList[currentIndex]) {
                        window.location.href = `pd.html?id=${encodeURIComponent(activeList[currentIndex].id || activeList[currentIndex].product_id)}`;
                    }
                });
            }

            if(searchBtn && searchInput && searchModal) {
                searchBtn.addEventListener('click', () => {
                    executeSearch(searchInput.value);
                    searchModal.style.display = 'none';
                });
                searchInput.addEventListener('keypress', (e) => {
                    if(e.key === 'Enter') {
                        executeSearch(searchInput.value);
                        searchModal.style.display = 'none';
                    }
                });
            }

            window.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowDown') { e.preventDefault(); scrollVideo(1); }
                else if(e.key === 'ArrowUp') { e.preventDefault(); scrollVideo(-1); }
            });

            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, {passive: true});
            window.addEventListener('touchend', (e) => {
                let diff = touchStartY - e.changedTouches[0].clientY;
                if (Math.abs(diff) > 50) diff > 0 ? scrollVideo(1) : scrollVideo(-1);
            }, {passive: true});
        });

        // ক্লাউডফ্লেয়ার D1 ডাটাবেজ থেকে ড্রপশিপিং মোড অনুযায়ী ভিডিও ফেচ করা
        async function loadLiveVideosFromBackend() {
            try {
                const response = await fetch(`/api/products?mode=dropshipping`);
                const result = await response.json();
                
                let productsList = [];
                if (result && result.success && Array.isArray(result.data)) {
                    productsList = result.data;
                } else if (Array.isArray(result)) {
                    productsList = result;
                }

                if (productsList.length > 0) {
                    globalVideoList = productsList.map(item => {
                        let rawVid = item.video_url || item.youtube_video || '';
                        if (rawVid.includes('.r2.dev')) {
                            rawVid = rawVid.replace(/https:\/\/[^/]+\.r2\.dev/, 'https://vid.rorraxy.com');
                        }

                        return {
                            id: item.id || item.product_code || '101',
                            videoUrl: rawVid || 'https://www.w3schools.com/html/mov_bbb.mp4',
                            price: item.dropship_base_price ? `$${parseFloat(item.dropship_base_price).toFixed(2)}` : (item.price ? `$${parseFloat(item.price).toFixed(2)}` : '$85.00'),
                            baseLikes: item.like_count || 5200,
                            baseShares: 180,
                            discount: (item.discount_rate || '30') + '% OFF',
                            category: item.category || 'video',
                            sellerName: item.brand_name || 'Rorraxy Dropship Partner',
                            sellerAvatar: 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png',
                            sellerDesc: 'Verified global fulfillment partner on Rorraxy ecosystem.'
                        };
                    });
                    renderBatchVideos();
                } else {
                    renderFallbackVideos();
                }
            } catch (error) {
                console.error('Failed to load dropshipping videos from backend:', error);
                renderFallbackVideos();
            }
        }

        function renderFallbackVideos() {
            globalVideoList = [
                { id: 'RRX-DROP-001', videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', price: '$85.00', baseLikes: 5200, baseShares: 180, discount: '30% OFF', category: 'video', sellerName: 'Rorraxy Dropship Hub', sellerAvatar: 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png', sellerDesc: 'Primary dropshipping supplier across global digital ecosystem.' }
            ];
            renderBatchVideos();
        }

        function getDynamicEngagement(productId, baseVal, type) {
            let storageKey = `rorraxy_dropship_${type}_${productId}`;
            let storedData = localStorage.getItem(storageKey);
            let currentTime = new Date().getTime();
            let currentVal = baseVal;

            if (storedData) {
                let parsed = JSON.parse(storedData);
                currentVal = parsed.value;
            } else {
                currentVal = baseVal + Math.floor(Math.random() * 300) + 100;
                localStorage.setItem(storageKey, JSON.stringify({ value: currentVal, lastUpdated: currentTime }));
            }

            if (currentVal >= 1000) {
                return (currentVal / 1000).toFixed(1) + 'K';
            }
            return currentVal.toString();
        }

        window.executeSearch = function(keyword) {
            let query = keyword.toLowerCase().trim();
            let foundIndex = globalVideoList.findIndex(p => 
                (p.id && p.id.toLowerCase().includes(query)) ||
                (p.sellerName && p.sellerName.toLowerCase().includes(query))
            );
            if (foundIndex !== -1) currentIndex = foundIndex;
            renderBatchVideos();
        };

        window.toggleGlobalAudio = function() {
            isGlobalMuted = !isGlobalMuted;
            const activeVideo = document.querySelector('.reel-media-box video');
            if (activeVideo) activeVideo.muted = isGlobalMuted;

            const soundBtnIcon = document.getElementById('soundBtnIcon');
            const soundItem = document.getElementById('soundActionItem');
            if(soundBtnIcon && soundItem) {
                if(isGlobalMuted) {
                    soundBtnIcon.className = "fa-solid fa-volume-xmark action-pure-icon";
                    soundItem.classList.remove('active-sound');
                } else {
                    soundBtnIcon.className = "fa-solid fa-volume-high action-pure-icon";
                    soundItem.classList.add('active-sound');
                }
            }
        };

        window.toggleSaveItem = function(e, btn, pId) {
            e.stopPropagation();
            let savedIds = JSON.parse(localStorage.getItem('rorraxy_dropship_saved_videos') || '[]');
            let index = savedIds.indexOf(pId);
            if(index > -1) {
                savedIds.splice(index, 1);
                btn.classList.remove('active');
            } else {
                savedIds.push(pId);
                btn.classList.add('active');
            }
            localStorage.setItem('rorraxy_dropship_saved_videos', JSON.stringify(savedIds));
        };

        window.openSavedGalleryModal = function() {
            let savedIds = JSON.parse(localStorage.getItem('rorraxy_dropship_saved_videos') || '[]');
            let savedVideos = globalVideoList.filter(p => savedIds.includes(p.id));
            let overlay = document.getElementById('savedGalleryOverlay');
            let containerBody = document.getElementById('savedGalleryBody');
            if(!overlay || !containerBody) return;

            if (savedVideos.length === 0) {
                containerBody.innerHTML = `<div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED DROPSHIP VIDEOS</h2></div><div style="text-align:center; color:#a0a0ab; padding:40px; font-size:0.85rem;">কোনো সংরক্ষিত ভিডিও নেই</div><div class="fs-bottom-back-action"><button class="fs-bottom-back-home-btn" onclick="closeSavedGallery()"><i class="fa-solid fa-house"></i> হোমে ফিরে যান</button></div>`;
            } else {
                let thumbsHtml = '';
                savedVideos.forEach(v => {
                    thumbsHtml += `<div class="saved-thumb-card" onclick="selectSavedVideo('${v.id}')"><div class="saved-thumb-preview"><i class="fa-solid fa-play"></i></div><div class="saved-thumb-footer"><span class="saved-thumb-title">ID: ${v.id}</span><button class="saved-clean-delete-btn" onclick="removeSavedVideo(event, '${v.id}')"><i class="fa-solid fa-trash"></i> ডিলিট</button></div></div>`;
                });
                containerBody.innerHTML = `<div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED DROPSHIP VIDEOS</h2><div class="fs-stats-pill"><i class="fa-solid fa-video"></i> মোট সেভ করা: <strong>${savedVideos.length}</strong></div></div><div class="fs-videos-grid">${thumbsHtml}</div><div class="fs-bottom-back-action"><button class="fs-bottom-back-home-btn" onclick="closeSavedGallery()"><i class="fa-solid fa-house"></i> হোমে ফিরে যান</button></div>`;
            }
            overlay.style.display = 'flex';
        };

        window.closeSavedGallery = function() {
            document.getElementById('savedGalleryOverlay').style.display = 'none';
        };

        window.selectSavedVideo = function(videoId) {
            let foundIdx = globalVideoList.findIndex(p => p.id === videoId);
            if(foundIdx !== -1) {
                currentIndex = foundIdx;
                document.getElementById('savedGalleryOverlay').style.display = 'none';
                renderBatchVideos();
            }
        };

        window.removeSavedVideo = function(e, videoId) {
            e.stopPropagation();
            let saved = JSON.parse(localStorage.getItem('rorraxy_dropship_saved_videos') || '[]');
            saved = saved.filter(id => id !== videoId);
            localStorage.setItem('rorraxy_dropship_saved_videos', JSON.stringify(saved));
            openSavedGalleryModal();
        };

        function updateBottomSellerProfile(product) {
            const avatarImg = document.getElementById('bottomSellerAvatar');
            if(avatarImg && product) {
                avatarImg.src = product.sellerAvatar || 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
            }
        }

        window.openSellerFullscreenProfile = function() {
            let activeList = globalVideoList;
            if (activeList.length === 0) return;
            let currentProduct = activeList[currentIndex] || activeList[0];

            let sName = currentProduct.sellerName || 'Rorraxy Dropship Partner';
            let sAvatar = currentProduct.sellerAvatar || 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
            let sDesc = currentProduct.sellerDesc || 'Verified global fulfillment partner on Rorraxy ecosystem.';

            let sellerVideos = globalVideoList.filter(p => (p.sellerName || 'Rorraxy Hub') === sName);
            let containerBody = document.getElementById('sellerFullscreenBody');
            if(!containerBody) return;

            let totalPages = Math.ceil(sellerVideos.length / itemsPerPage) || 1;
            if(currentSellerPage > totalPages) currentSellerPage = totalPages;

            let startIndex = (currentSellerPage - 1) * itemsPerPage;
            let currentBatchVideos = sellerVideos.slice(startIndex, startIndex + itemsPerPage);

            let videosHtml = '';
            currentBatchVideos.forEach((v) => {
                videosHtml += `<div class="fullscreen-thumb-card" onclick="selectFullscreenSellerVideo('${v.id}')"><div class="fs-thumb-preview"><i class="fa-solid fa-play"></i></div><div class="fs-thumb-info"><span class="fs-thumb-title">ID: ${v.id}</span><span class="fs-thumb-price">${v.price || '$85.00'}</span></div></div>`;
            });

            let paginationHtml = '';
            if(totalPages > 1) {
                paginationHtml += `<div class="fs-pagination-box">`;
                for(let i = 1; i <= totalPages; i++) {
                    let activeCls = (i === currentSellerPage) ? 'active-page' : '';
                    paginationHtml += `<button class="fs-page-btn ${activeCls}" onclick="changeSellerPage(${i})">${i}</button>`;
                }
                paginationHtml += `</div>`;
            }

            containerBody.innerHTML = `<div class="fs-profile-header-box"><img src="${sAvatar}" class="fs-profile-logo"><h2 class="fs-profile-name">${sName}</h2><p class="fs-profile-desc">${sDesc}</p><div class="fs-stats-pill"><i class="fa-solid fa-video"></i> মোট ভিডিও: <strong>${sellerVideos.length}</strong></div></div><div class="fs-videos-section-title">DROPSHIP VIDEO GALLERY</div><div class="fs-videos-grid">${videosHtml}</div>${paginationHtml}<div class="fs-bottom-back-action"><button class="fs-bottom-back-home-btn" onclick="document.getElementById('sellerFullscreenOverlay').style.display='none'"><i class="fa-solid fa-house"></i> হোমে ফিরে যান</button></div>`;
            document.getElementById('sellerFullscreenOverlay').style.display = 'flex';
        };

        window.changeSellerPage = function(pageNum) {
            currentSellerPage = pageNum;
            openSellerFullscreenProfile();
        };

        window.selectFullscreenSellerVideo = function(videoId) {
            let foundIdx = globalVideoList.findIndex(p => p.id === videoId);
            if(foundIdx !== -1) {
                currentIndex = foundIdx;
                document.getElementById('sellerFullscreenOverlay').style.display = 'none';
                renderBatchVideos();
            }
        };

        window.openProductDetail = function(productId) {
            window.location.href = `pd.html?id=${encodeURIComponent(productId)}`;
        };

        window.scrollVideo = function(direction) {
            let activeList = globalVideoList;
            if (direction === 1 && currentIndex < activeList.length - 1) { currentIndex++; renderBatchVideos(); }
            else if (direction === -1 && currentIndex > 0) { currentIndex--; renderBatchVideos(); }
        };

        function renderBatchVideos() {
            const feedContainer = document.getElementById('videoFeed');
            if(!feedContainer) return;

            let activeList = globalVideoList;
            if (activeList.length === 0) {
                feedContainer.innerHTML = `<div style="height:calc(100vh - 65px); display:flex; align-items:center; justify-content:center; color:#a0a0ab; font-size:0.85rem;">কোনো ভিডিও পাওয়া যায়নি</div>`;
                updateBottomSellerProfile(null);
                return;
            }

            if (currentIndex >= activeList.length) currentIndex = Math.max(0, activeList.length - 1);

            let product = activeList[currentIndex];
            updateBottomSellerProfile(product);

            let pId = product.id || '101';
            let pVideo = product.videoUrl || 'https://www.w3schools.com/html/mov_bbb.mp4';
            let pPrice = product.price ? product.price : '$85.00';
            let pDiscount = product.discount || '30% OFF';

            let pLikes = getDynamicEngagement(pId, product.baseLikes || 5200, 'likes');
            let pShares = getDynamicEngagement(pId, product.baseShares || 180, 'shares');

            let savedIds = JSON.parse(localStorage.getItem('rorraxy_dropship_saved_videos') || '[]');
            let savedActiveClass = savedIds.includes(pId) ? 'active' : '';
            let soundActiveClass = !isGlobalMuted ? 'active-sound' : '';

            let mediaElement = `<video src="${pVideo}" autoplay loop ${isGlobalMuted ? 'muted' : ''} playsinline preload="auto"></video>`;
            let soundIconClass = isGlobalMuted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";

            let htmlContent = `
                <div class="reel-card" data-product-id="${pId}">
                    <div class="reel-media-box" onclick="openProductDetail('${pId}')">
                        ${mediaElement}
                    </div>

                    <div class="right-vertical-actions">
                        <div class="side-action-item share-action-btn" onclick="openInlineShare(event, this)" title="Share">
                            <i class="fa-solid fa-reply action-pure-icon share-flip"></i>
                            <span class="side-count-text">${pShares}</span>
                        </div>

                        <div class="side-action-item love-action-btn" onclick="toggleLove(event, this)" title="Like">
                            <i class="fa-solid fa-heart action-pure-icon love-icon-elem"></i>
                            <span class="side-count-text love-count">${pLikes}</span>
                        </div>

                        <div class="side-action-item save-action-btn ${savedActiveClass}" onclick="toggleSaveItem(event, this, '${pId}')" title="Save">
                            <i class="fa-solid fa-bookmark action-pure-icon"></i>
                        </div>

                        <div id="soundActionItem" class="side-action-item sound-action-btn ${soundActiveClass}" onclick="toggleGlobalAudio()" title="Sound Toggle">
                            <i id="soundBtnIcon" class="${soundIconClass} action-pure-icon"></i>
                        </div>
                    </div>

                    <div class="center-price-offer-box">
                        <span class="product-price-tag">${pPrice}</span>
                        <div class="image-style-discount-badge">
                            <span class="offer-text">${pDiscount}</span>
                        </div>
                    </div>

                    <div class="inline-card-share-popup">
                        <div class="glass-popup-header">
                            <span class="glass-popup-title">SHARE PRODUCT</span>
                            <button class="glass-close-btn" onclick="closeInlineShare(event, this)"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="glass-share-grid">
                            <div class="glass-opt-btn" onclick="shareToSocial(this, 'whatsapp')"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></div>
                            <div class="glass-opt-btn" onclick="shareToSocial(this, 'messenger')"><i class="fa-brands fa-facebook-messenger"></i><span>Messenger</span></div>
                            <div class="glass-opt-btn" onclick="shareToSocial(this, 'telegram')"><i class="fa-brands fa-telegram"></i><span>Telegram</span></div>
                            <div class="glass-opt-btn" onclick="shareToSocial(this, 'twitter')"><i class="fa-brands fa-x-twitter"></i><span>Twitter</span></div>
                            <div class="glass-opt-btn" onclick="shareToSocial(this, 'linkedin')"><i class="fa-brands fa-linkedin-in"></i><span>LinkedIn</span></div>
                            <div class="glass-opt-btn" onclick="shareToSocial(this, 'facebook')"><i class="fa-brands fa-facebook-f"></i><span>Facebook</span></div>
                        </div>
                        <div class="glass-copy-row">
                            <input type="text" class="glass-copy-input lowercase-url" readonly value="dropship/pd.html?id=${pId}">
                            <button class="glass-copy-btn" onclick="copyLinkDirectSilent(this)">COPY</button>
                        </div>
                    </div>
                </div>
            `;

            feedContainer.innerHTML = htmlContent;
        }

        window.toggleLove = function(e, btn) {
            e.stopPropagation();
            if(btn.classList.contains('liked-active')) {
                btn.classList.remove('liked-active');
            } else {
                btn.classList.add('liked-active');
            }
        };

        window.openInlineShare = function(e, btn) {
            e.stopPropagation();
            document.querySelectorAll('.inline-card-share-popup').forEach(p => p.style.display = 'none');
            let card = btn.closest('.reel-card');
            let popup = card.querySelector('.inline-card-share-popup');
            if(popup) popup.style.display = 'flex';
        };

        window.closeInlineShare = function(e, btn) {
            e.stopPropagation();
            let popup = btn.closest('.inline-card-share-popup');
            if(popup) popup.style.display = 'none';
        };

        window.shareToSocial = function(btn, platform) {
            let card = btn.closest('.reel-card');
            let urlInput = card.querySelector('.glass-copy-input');
            let shareUrl = urlInput ? `dropship/pd.html?id=${encodeURIComponent(card.dataset.productId)}` : window.location.href;
            let text = "Check out this product on Rorraxy Dropship:";

            let shareLink = "";
            if (platform === 'whatsapp') shareLink = `https://api.whatsapp.com/send?text=${encodeURIComponent(text + " " + window.location.origin + "/" + shareUrl)}`;
            else if (platform === 'messenger') shareLink = `https://www.facebook.com/dialog/send?link=${encodeURIComponent(window.location.origin + "/" + shareUrl)}&app_id=291494419107518`;
            else if (platform === 'telegram') shareLink = `https://t.me/share/url?url=${encodeURIComponent(window.location.origin + "/" + shareUrl)}&text=${encodeURIComponent(text)}`;
            else if (platform === 'twitter') shareLink = `https://twitter.com/intent/tweet?url=${encodeURIComponent(window.location.origin + "/" + shareUrl)}&text=${encodeURIComponent(text)}`;
            else if (platform === 'linkedin') shareLink = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(window.location.origin + "/" + shareUrl)}`;
            else if (platform === 'facebook') shareLink = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.origin + "/" + shareUrl)}`;

            if (shareLink) window.open(shareLink, '_blank');
        };

        window.copyLinkDirectSilent = function(btn) {
            let card = btn.closest('.reel-card');
            let inputField = card.querySelector('.glass-copy-input');
            if (inputField && navigator.clipboard) {
                navigator.clipboard.writeText(window.location.origin + "/" + inputField.value).then(() => {
                    let originalText = btn.innerText;
                    btn.innerText = "COPIED!";
                    setTimeout(() => { btn.innerText = originalText; let popup = card.querySelector('.inline-card-share-popup'); if(popup) popup.style.display = 'none'; }, 800);
                });
            }
        };
    </script>

    <style>
        :root {
            --bg-dropship: #000000;
            --card-dropship: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --pink-accent: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100vw; overflow: hidden; 
            background: var(--bg-dropship) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            height: 100vh; height: 100dvh; font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }
        
        body { margin: 0; padding: 0 0 65px 0; text-transform: uppercase !important; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        .feed-container { 
            width: 100%; max-width: 440px; margin: 0 auto;
