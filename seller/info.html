<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Seller Info - rorraxy Ecosystem</title>
    
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">
    <script src="/ecosystem-core.js"></script>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #050508;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #9e9eab;
            --font-main: 'Poppins', sans-serif;
            --required-red: #ff4d4d;
            --border-gold: rgba(212, 175, 55, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }

        .main-container { width: 100%; max-width: 900px; margin: 0 auto; }
        
        .dashboard-header { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .header-logo-img { width: 85px; height: 85px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.2)); }
        .dashboard-header h1 { font-size: 1.5rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .info-card {
            background: var(--card-retail);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 30px;
        }

        .info-card-title {
            font-size: 0.9rem; font-weight: 800;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1); padding-bottom: 12px;
        }

        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full-width { grid-column: span 2; }
        
        .form-group label { 
            font-size: 0.72rem; font-weight: 700; color: var(--text-gray); 
            display: flex; align-items: center; justify-content: space-between; width: 100%;
        }

        .label-text { display: inline-flex; align-items: center; }
        .req-star { color: var(--required-red); margin-left: 4px; font-weight: 900; }
        .char-counter { font-size: 0.62rem; color: var(--text-gray); text-transform: none; }

        .form-control, .form-select, textarea.form-control { 
            width: 100%; background: #0a0a0f; border: 1px solid var(--border-gold); 
            border-radius: 10px; padding: 12px 16px; color: var(--text-white); font-size: 0.82rem; 
            outline: none; font-family: var(--font-main); text-transform: none; 
        }
        .form-control:focus, .form-select:focus { border-color: var(--gold-solid); background: #0f0f17; }
        .form-select option { background: #0f0f17; color: #fff; }

        .avatar-upload-container { display: flex; align-items: center; gap: 16px; padding: 10px 0; margin-bottom: 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.1); }
        .avatar-preview { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-solid); }
        .avatar-upload-lbl { background: rgba(212, 175, 55, 0.08); border: 1px solid var(--gold-solid); padding: 9px 18px; border-radius: 8px; color: var(--gold-solid); font-size: 0.72rem; font-weight: 700; cursor: pointer; }
        .file-input-hidden { display: none; }

        .section-save-btn, .edit-profile-btn { background: var(--gold-gradient); border: none; border-radius: 10px; padding: 12px 24px; color: #000; font-weight: 800; font-size: 0.82rem; cursor: pointer; text-transform: uppercase; margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        .section-save-btn:hover, .edit-profile-btn:hover { filter: brightness(1.1); }

        .cv-preview-box { display: flex; flex-direction: column; gap: 20px; }
        .cv-header-section { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.15); padding-bottom: 20px; }
        .cv-logo-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-solid); }
        .cv-title-area h2 { font-size: 1.25rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .cv-title-area p { font-size: 0.78rem; color: var(--text-gray); text-transform: none; margin-top: 4px; }

        .cv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .cv-item { background: #0a0a0f; border: 1px solid var(--border-gold); padding: 12px 16px; border-radius: 10px; }
        .cv-item span.lbl { display: block; font-size: 0.68rem; color: var(--text-gray); margin-bottom: 4px; }
        .cv-item span.val { font-size: 0.85rem; font-weight: 600; color: var(--text-white); text-transform: none; }
        .cv-item.full { grid-column: span 2; }

        .seller-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.98); border-top: 1px solid var(--border-gold); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; color: var(--text-gray); }

        @media (max-width: 600px) {
            .form-grid, .cv-grid { grid-template-columns: 1fr; }
            .form-group.full-width, .cv-item.full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <script>
        // ভেরিফাই না থাকলে সরাসরি ভেরিফিকেশন পেজে ফেরত পাঠাবে
        if (localStorage.getItem('rorraxy_seller_verified') !== 'true') {
            window.location.replace('/seller/index.html');
        }
    </script>

    <div class="main-container">
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-img">
            <h1>SELLER INFO</h1>
        </header>

        <div class="info-card">
            <div class="info-card-title">
                <i class="fa-solid fa-id-card"></i>
                <span id="cardTitleText">SELLER PROFILE REGISTRATION</span>
            </div>

            <!-- প্রফেশনাল সিভি স্টাইল প্রিভিউ সেকশন -->
            <div id="profilePreviewSection" style="display: none;">
                <div class="cv-preview-box">
                    <div class="cv-header-section">
                        <img src="" alt="Brand Logo" class="cv-logo-img" id="prevLogo">
                        <div class="cv-title-area">
                            <h2 id="prevBrandName">--</h2>
                            <p id="prevBusinessDesc">--</p>
                        </div>
                    </div>
                    <div class="cv-grid">
                        <div class="cv-item"><span class="lbl">BUSINESS EMAIL</span><span class="val" id="prevEmail">--</span></div>
                        <div class="cv-item"><span class="lbl">FULL NAME</span><span class="val" id="prevFullName">--</span></div>
                        <div class="cv-item"><span class="lbl">WHATSAPP</span><span class="val" id="prevWhatsapp">--</span></div>
                        <div class="cv-item"><span class="lbl">EMERGENCY PHONE</span><span class="val" id="prevPhone">--</span></div>
                        <div class="cv-item"><span class="lbl">COUNTRY</span><span class="val" id="prevCountry">--</span></div>
                        <div class="cv-item"><span class="lbl">ADDRESS</span><span class="val" id="prevAddress">--</span></div>
                        <div class="cv-item"><span class="lbl" id="prevDocTypeLbl">NID NUMBER</span><span class="val" id="prevDocNum">--</span></div>
                        <div class="cv-item"><span class="lbl">TRADE LICENSE</span><span class="val" id="prevTradeLicense">--</span></div>
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button type="button" class="edit-profile-btn" onclick="switchToEditMode()">
                            <i class="fa-solid fa-pen-to-square"></i> EDIT INFO
                        </button>
                        <button type="button" class="edit-profile-btn" style="background: var(--gold-gradient); color: #000;" onclick="location.href='/seller/dashboard.html'">
                            <i class="fa-solid fa-arrow-right"></i> GO TO DASHBOARD
                        </button>
                    </div>
                </div>
            </div>

            <!-- ইনফো আপডেট ফর্ম সেকশন -->
            <form id="businessInfoForm">
                <div class="avatar-upload-container">
                    <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="avatar-preview" id="avatarPreview">
                    <div class="avatar-upload-info">
                        <label for="profilePhotoInput" class="avatar-upload-lbl"><i class="fa-solid fa-upload"></i> UPLOAD BRAND LOGO (AUTO WEBP)</label>
                        <input type="file" id="profilePhotoInput" class="file-input-hidden" accept="image/*">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label><span class="label-text">BRAND NAME<span class="req-star">*</span></span></label>
                        <input type="text" class="form-control" id="brandName" placeholder="rorraxy store" required>
                    </div>
                    <div class="form-group">
                        <label><span class="label-text">BUSINESS EMAIL (AUTOMATIC)<span class="req-star">*</span></span></label>
                        <input type="email" class="form-control" id="businessEmail" readonly style="color: var(--gold-solid); cursor: not-allowed; text-transform: none;">
                    </div>
                    <div class="form-group">
                        <label><span class="label-text">FULL NAME<span class="req-star">*</span></span></label>
                        <input type="text" class="form-control" id="fullName" placeholder="Owner full name..." required>
                    </div>
                    <div class="form-group">
                        <label><span class="label-text">WHATSAPP<span class="req-star">*</span></span></label>
                        <input type="tel" class="form-control" id="whatsappNum" placeholder="+8801700000000" required style="text-transform: none;">
                    </div>
                    <div class="form-group full-width">
                        <label>
                            <span class="label-text">BUSINESS DESCRIPTION<span class="req-star">*</span></span>
                            <span class="char-counter" id="charCount">0/200</span>
                        </label>
                        <textarea class="form-control" id="businessDesc" rows="3" maxlength="200" placeholder="Briefly describe products..." required style="text-transform: none;"></textarea>
                    </div>
                    <div class="form-group">
                        <label><span class="label-text">EMERGENCY PHONE<span class="req-star">*</span></span></label>
                        <input type="tel" class="form-control" id="phoneNum" placeholder="+8801800000000" required style="text-transform: none;">
                    </div>
                    <div class="form-group">
                        <label><span class="label-text">COUNTRY<span class="req-star">*</span></span></label>
                        <select class="form-select" id="countrySelect" required>
                            <option value="Bangladesh">Bangladesh</option>
                            <option value="India">India</option>
                            <option value="Pakistan">Pakistan</option>
                            <option value="United Arab Emirates">United Arab Emirates</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label><span class="label-text">ADDRESS<span class="req-star">*</span></span></label>
                        <input type="text" class="form-control" id="fullAddress" placeholder="District, Postal Code..." required style="text-transform: none;">
                    </div>
                    <div class="form-group">
                        <label><span class="label-text">VERIFICATION DOCUMENT<span class="req-star">*</span></span></label>
                        <select class="form-select" id="docTypeSelect" onchange="updateDocLabel()" required>
                            <option value="NID">National ID (NID)</option>
                            <option value="BirthCert">Birth Certificate</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><span class="label-text" id="docNumLabel">NID NUMBER<span class="req-star">*</span></span></label>
                        <input type="text" class="form-control" id="docNumberInput" placeholder="Enter ID number..." required style="text-transform: none;">
                    </div>
                    <div class="form-group full-width" style="margin-top: 10px; border-top: 1px solid rgba(212, 175, 55, 0.15); padding-top: 15px;">
                        <label><span class="label-text">TRADE LICENSE (VERIFICATION FILE / NUMBER)<span class="req-star">*</span></span></label>
                        <input type="text" class="form-control" id="tradeLicenseInput" placeholder="Enter Trade License number or details..." required style="text-transform: none;">
                    </div>
                </div>
                <button type="submit" id="saveInfoBtn" class="section-save-btn">SAVE & PROCEED TO DASHBOARD <i class="fa-solid fa-arrow-right"></i></button>
                <button type="button" id="cancelEditBtn" class="edit-profile-btn" style="background: transparent; color: var(--text-gray); border: 1px solid var(--border-gold); margin-right: 10px; float: right; display: none;" onclick="cancelEditMode()">CANCEL</button>
                <div style="clear: both;"></div>
            </form>
        </div>
    </div>

    <nav class="seller-bottom-nav">
        <a href="/seller/list.html" class="nav-item"><i class="fa-solid fa-list-check"></i><span>LIST</span></a>
        <a href="/seller/payout.html" class="nav-item"><i class="fa-solid fa-hand-holding-dollar"></i><span>PAYOUT</span></a>
        <button type="button" class="nav-item" onclick="location.href='/seller/dashboard.html'"><i class="fa-solid fa-house"></i><span>HOME</span></button>
        <a href="/seller/shipment.html" class="nav-item"><i class="fa-solid fa-truck-fast"></i><span>SHIPMENT</span></a>
        <a href="/seller/info.html" class="nav-item active"><i class="fa-solid fa-user-gear"></i><span>INFO</span></a>
    </nav>

    <script>
        const businessDesc = document.getElementById('businessDesc');
        const charCount = document.getElementById('charCount');
        businessDesc.addEventListener('input', () => { charCount.innerText = `${businessDesc.value.length}/200`; });

        function updateDocLabel() {
            const type = document.getElementById('docTypeSelect').value;
            const label = document.getElementById('docNumLabel');
            if(type === 'NID') label.innerHTML = 'NID NUMBER<span class="req-star">*</span>';
            else if(type === 'BirthCert') label.innerHTML = 'BIRTH CERTIFICATE NUMBER<span class="req-star">*</span>';
        }

        let compressedAvatarData = "https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png";
        
        document.getElementById('profilePhotoInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const optimizedBlob = await compressImageToWebP(file, 300, 300, 0.75);
                const reader = new FileReader();
                reader.onload = function(event) {
                    compressedAvatarData = event.target.result;
                    document.getElementById('avatarPreview').src = compressedAvatarData;
                };
                reader.readAsDataURL(optimizedBlob);
            } catch (err) {
                console.error("Image optimization error:", err);
            }
        });

        function compressImageToWebP(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/webp', quality);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        function switchToEditMode() {
            document.getElementById('profilePreviewSection').style.display = 'none';
            document.getElementById('businessInfoForm').style.display = 'block';
            document.getElementById('cancelEditBtn').style.display = 'inline-block';
            document.getElementById('cardTitleText').innerText = "EDIT BUSINESS INFO & VERIFICATION";
        }

        function cancelEditMode() {
            document.getElementById('businessInfoForm').style.display = 'none';
            document.getElementById('profilePreviewSection').style.display = 'block';
            document.getElementById('cardTitleText').innerText = "SELLER PROFILE PREVIEW";
        }

        function renderPreview(data) {
            document.getElementById('prevLogo').src = data.logo_url || data.logo || compressedAvatarData;
            document.getElementById('prevBrandName').innerText = data.brand_name || data.brandName || "---";
            document.getElementById('prevBusinessDesc').innerText = data.business_desc || data.businessDesc || "---";
            document.getElementById('prevEmail').innerText = data.email || data.businessEmail || "---";
            document.getElementById('prevFullName').innerText = data.full_name || data.fullName || "---";
            document.getElementById('prevWhatsapp').innerText = data.whatsapp || "---";
            document.getElementById('prevPhone').innerText = data.emergency_phone || data.phone || "---";
            document.getElementById('prevCountry').innerText = data.country || "---";
            document.getElementById('prevAddress').innerText = data.full_address || data.address || "---";
            
            const docType = data.doc_type || data.docType;
            const docLabel = docType === 'BirthCert' ? 'BIRTH CERTIFICATE NUMBER' : 'NID NUMBER';
            document.getElementById('prevDocTypeLbl').innerText = docLabel;
            document.getElementById('prevDocNum').innerText = data.doc_number || data.docNum || "---";
            document.getElementById('prevTradeLicense').innerText = data.trade_license || data.tradeLicense || "---";

            document.getElementById('profilePreviewSection').style.display = 'block';
            document.getElementById('businessInfoForm').style.display = 'none';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('cardTitleText').innerText = "SELLER PROFILE PREVIEW";
        }

        window.addEventListener('DOMContentLoaded', async () => {
            let userEmail = localStorage.getItem('rorraxy_seller_email') || "seller_" + Date.now() + "@rorraxy.com";

            localStorage.setItem('rorraxy_current_seller_email', userEmail);
            document.getElementById('businessEmail').value = userEmail;

            try {
                const response = await fetch(`/api/seller?email=${encodeURIComponent(userEmail)}`);
                const result = await response.json();
                if (result.success && result.data && result.data.length > 0) {
                    const dbProfile = result.data[0];
                    if(dbProfile.brand_name) {
                        localStorage.setItem('rorraxy_seller_info_completed', 'true');
                        renderPreview(dbProfile);
                        fillFormValues({
                            brandName: dbProfile.brand_name,
                            businessEmail: dbProfile.email,
                            fullName: dbProfile.full_name,
                            businessDesc: dbProfile.business_desc,
                            whatsapp: dbProfile.whatsapp,
                            phone: dbProfile.emergency_phone,
                            country: dbProfile.country,
                            address: dbProfile.full_address,
                            docType: dbProfile.doc_type,
                            docNum: dbProfile.doc_number,
                            tradeLicense: dbProfile.trade_license,
                            logo: dbProfile.logo_url
                        });
                        return;
                    }
                }
            } catch (err) {
                console.log("Cloudflare load notice:", err);
            }

            document.getElementById('businessInfoForm').style.display = 'block';
            document.getElementById('profilePreviewSection').style.display = 'none';
            document.getElementById('cancelEditBtn').style.display = 'none';
        });

        function fillFormValues(data) {
            document.getElementById('brandName').value = data.brandName || '';
            document.getElementById('businessEmail').value = data.businessEmail || document.getElementById('businessEmail').value;
            document.getElementById('fullName').value = data.fullName || '';
            document.getElementById('businessDesc').value = data.businessDesc || '';
            charCount.innerText = `${(data.businessDesc || '').length}/200`;
            document.getElementById('whatsappNum').value = data.whatsapp || '';
            document.getElementById('phoneNum').value = data.phone || '';
            document.getElementById('countrySelect').value = data.country || 'Bangladesh';
            document.getElementById('fullAddress').value = data.address || '';
            document.getElementById('docTypeSelect').value = data.docType || 'NID';
            updateDocLabel();
            document.getElementById('docNumberInput').value = data.docNum || '';
            document.getElementById('tradeLicenseInput').value = data.tradeLicense || '';
            if(data.logo) {
                compressedAvatarData = data.logo;
                document.getElementById('avatarPreview').src = data.logo;
            }
        }

        // ফর্ম সাবমিট করার পর ক্লাউডফায়ারে সেভ হয়ে সরাসরি ড্যাশবোর্ডে চলে যাবে
        document.getElementById('businessInfoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveInfoBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> SAVING & REDIRECTING...';
            
            const userEmail = document.getElementById('businessEmail').value.trim().toLowerCase();
            const profileData = {
                seller_id: userEmail,
                email: userEmail,
                brand_name: document.getElementById('brandName').value.trim(),
                full_name: document.getElementById('fullName').value.trim(),
                business_desc: businessDesc.value.trim(),
                whatsapp: document.getElementById('whatsappNum').value.trim(),
                emergency_phone: document.getElementById('phoneNum').value.trim(),
                country: document.getElementById('countrySelect').value,
                full_address: document.getElementById('fullAddress').value.trim(),
                doc_type: document.getElementById('docTypeSelect').value,
                doc_number: document.getElementById('docNumberInput').value.trim(),
                trade_license: document.getElementById('tradeLicenseInput').value.trim() || "N/A",
                logo_url: compressedAvatarData
            };

            try {
                await fetch('/api/seller', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });
            } catch (err) {
                console.error("API Sync Error:", err);
            }

            localStorage.setItem('rorraxy_seller_info_completed', 'true');
            
            // সফলভাবে সেভ হওয়ার পর সরাসরি ড্যাশবোর্ডে চলে যাবে
            setTimeout(() => {
                window.location.replace('/seller/dashboard.html');
            }, 600);
        });
    </script>
</body>
</html>
