<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Seller Product List - rorraxy Ecosystem</title>
    
    <!-- সেন্ট্রাল স্ক্রিপ্ট ট্যাগ -->
    <script src="/ecosystem-core.js"></script>
    
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background: var(--bg-retail) !important;
            color: var(--text-white);
            font-family: var(--font-main);
            min-height: 100vh;
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        body {
            padding: 24px 16px 110px 16px;
            text-transform: uppercase;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header Section */
        .dashboard-header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header-logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            background: transparent !important;
            mix-blend-mode: screen;
        }

        .dashboard-header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.8px;
        }

        .header-email-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-retail);
            padding: 6px 16px;
            border-radius: 25px;
            text-decoration: none;
            text-transform: lowercase;
            font-size: 0.78rem;
            color: var(--text-gray);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .header-email-box i {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-email-box span {
            color: var(--text-white);
            font-weight: 600;
        }

        .product-list-card {
            background: var(--card-retail);
            border-radius: 18px;
            padding: 24px 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            padding-bottom: 12px;
        }

        /* ADD NEW বাটন ফিক্স */
        .add-new-btn {
            background: var(--gold-gradient);
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s;
        }

        .add-new-btn:hover {
            transform: scale(1.05);
        }

        .scrollable-product-container {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .desktop-table-view {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.78rem;
        }

        .desktop-table-view th {
            color: var(--gold-solid);
            padding: 14px 16px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            font-weight: 700;
            background: #040407;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .desktop-table-view td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-white);
            text-transform: none;
            vertical-align: middle;
        }

        .prod-info-cell {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .prod-thumb {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(212, 175, 55, 0.4);
            background: #000;
            flex-shrink: 0;
        }

        .prod-name-txt {
            font-weight: 700;
            color: var(--text-white);
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.approved {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .action-icon-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: var(--gold-solid);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-right: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .action-icon-btn:hover {
            background: rgba(212, 175, 55, 0.25);
        }

        .action-icon-btn.delete {
            background: rgba(255, 77, 77, 0.1);
            border-color: rgba(255, 77, 77, 0.3);
            color: #ff4d4d;
        }

        .action-icon-btn.delete:hover {
            background: rgba(255, 77, 77, 0.25);
        }

        .mobile-card-view {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .mobile-prod-card {
            background: #040407;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .mobile-card-left {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .mobile-card-info h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-white);
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .mobile-card-info p {
            font-size: 0.68rem;
            color: var(--text-gray);
            text-transform: none;
            margin-top: 3px;
        }

        .mobile-card-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            white-space: nowrap;
        }

        .mobile-card-price {
            font-size: 0.9rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .seller-bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(3, 3, 5, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 6px;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            flex: 1;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active i, .nav-item.active span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item i {
            font-size: 1.25rem;
            margin-bottom: 4px;
            color: var(--text-gray);
        }

        .nav-item span {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-gray);
        }

        @media (max-width: 768px) {
            .desktop-table-view { display: none; }
            .mobile-card-view { display: flex; }
        }
    </style>
</head>
<body>
<!-- সিকিউরিটি গার্ড চেক -->
    <script>
        if (localStorage.getItem('rorraxy_seller_verified') !== 'true') {
            window.location.replace('/seller/index.html');
        }
    </script>
    <div class="main-container">
        
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy Logo" class="header-logo-img">
            <h1>SELLER PRODUCT LIST</h1>
            
            <a href="mailto:seller@rorraxy.com?subject=Seller%20Product%20Query" class="header-email-box">
                <i class="fa-solid fa-envelope"></i>
                <span>seller@rorraxy.com</span>
            </a>
        </header>

        <section class="product-list-card">
            <div class="section-title">
                <div style="display:flex; align-items:center; gap:8px;">
                    <i class="fa-solid fa-boxes-stacked" style="color:var(--gold-solid);"></i>
                    <span>UPLOADED PRODUCTS LIST</span>
                </div>
                <a href="upload.html" class="add-new-btn"><i class="fa-solid fa-plus"></i> ADD NEW</a>
            </div>

            <div class="scrollable-product-container">
                <table class="desktop-table-view">
                    <thead>
                        <tr>
                            <th>PRODUCT</th>
                            <th>CATEGORY</th>
                            <th>PRICE</th>
                            <th>STOCK</th>
                            <th>STATUS</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="desktopTableBody"></tbody>
                </table>

                <div class="mobile-card-view" id="mobileCardContainer"></div>
            </div>
        </section>

    </div>

    <nav class="seller-bottom-nav">
        <a href="/seller/list.html" class="nav-item active">
            <i class="fa-solid fa-list-check"></i>
            <span>LIST</span>
        </a>
        <a href="/seller/payout.html" class="nav-item">
            <i class="fa-solid fa-hand-holding-dollar"></i>
            <span>PAYOUT</span>
        </a>
        <button type="button" class="nav-item" onclick="location.href='/seller/dashboard.html'">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </button>
        <a href="/seller/shipment.html" class="nav-item">
            <i class="fa-solid fa-truck-fast"></i>
            <span>SHIPMENT</span>
        </a>
        <a href="/seller/info.html" class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>INFO</span>
        </a>
    </nav>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fetchProductsFromCloudflare();
        });

        async function fetchProductsFromCloudflare() {
            let products = [];
            try {
                // পুরনো ওয়ার্কার লিংক বাদ দিয়ে এখন সরাসরি ক্লাউডফায়ার ফাংশন এপিআই কল করা হচ্ছে
                const response = await fetch('/api/products');
                const result = await response.json();
                
                // এপিআই রেসপন্স ফরম্যাট অনুযায়ী ডেটা হ্যান্ডেল করা
                let rawData = result.data || result.results || result;
                if (result.success && Array.isArray(rawData) && rawData.length > 0) {
                    products = rawData;
                } else if (Array.isArray(result) && result.length > 0) {
                    products = result;
                }
            } catch (err) {
                console.warn("Cloudflare API Fetch Warning:", err);
            }

            let localProducts = JSON.parse(localStorage.getItem('rorraxy_seller_products')) || [];
            
            let mergedMap = new Map();
            [...localProducts, ...products].forEach(p => {
                let pId = p.id || p.product_id || p.product_code || p.title;
                if(pId) mergedMap.set(String(pId), p);
            });

            products = Array.from(mergedMap.values());
            renderProductsList(products);
        }

        function renderProductsList(products) {
            const tableBody = document.getElementById('desktopTableBody');
            const mobileContainer = document.getElementById('mobileCardContainer');

            if (products.length === 0) {
                const emptyText = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-gray);">NO PRODUCTS FOUND. CLICK 'ADD NEW' TO PUBLISH.</td></tr>`;
                tableBody.innerHTML = emptyText;
                mobileContainer.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-gray);">NO PRODUCTS FOUND. CLICK 'ADD NEW' TO PUBLISH.</div>`;
                return;
            }

            let desktopHtml = '';
            let mobileHtml = '';

            products.forEach((p, index) => {
                const pTitle = p.title || 'UNTITLED ITEM';
                const pCat = p.category || 'General';
                const pPrice = p.price ? `$${parseFloat(p.price).toFixed(2)}` : '$0.00';
                const pStock = `${p.stock || 1} Pcs`;
                
                let pImg = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
                if (p.image_url) {
                    pImg = p.image_url;
                } else if (p.imageUrl) {
                    pImg = p.imageUrl;
                } else if (p.images_json) {
                    try {
                        let parsed = JSON.parse(p.images_json);
                        if (Array.isArray(parsed) && parsed.length > 0) pImg = parsed[0];
                    } catch (e) {
                        if (typeof p.images_json === 'string' && p.images_json.trim() !== '') {
                            pImg = p.images_json.split(',')[0].trim();
                        }
                    }
                }

                const uniqueEditKey = p.id || p.product_code || index;

                desktopHtml += `
                    <tr>
                        <td>
                            <div class="prod-info-cell">
                                <img src="${pImg}" class="prod-thumb" alt="${pTitle}" onerror="this.src='https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';">
                                <span class="prod-name-txt">${pTitle}</span>
                            </div>
                        </td>
                        <td>${pCat}</td>
                        <td>${pPrice}</td>
                        <td>${pStock}</td>
                        <td><span class="status-badge approved">APPROVED</span></td>
                        <td>
                            <a href="upload.html?edit=${uniqueEditKey}" class="action-icon-btn" title="Edit"><i class="fa-solid fa-pen"></i></a>
                            <button class="action-icon-btn delete" title="Delete" onclick="deleteProductRow(this, '${uniqueEditKey}')"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;

                mobileHtml += `
                    <div class="mobile-prod-card">
                        <div class="mobile-card-left">
                            <img src="${pImg}" class="prod-thumb" alt="${pTitle}" onerror="this.src='https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';">
                            <div class="mobile-card-info">
                                <h4>${pTitle}</h4>
                                <p>${pCat} | Stock: ${pStock} | <span style="color:#4ade80;">APPROVED</span></p>
                            </div>
                        </div>
                        <div class="mobile-card-right">
                            <span class="mobile-card-price">${pPrice}</span>
                            <div class="mobile-card-actions">
                                <a href="upload.html?edit=${uniqueEditKey}" class="action-icon-btn" title="Edit"><i class="fa-solid fa-pen"></i></a>
                                <button class="action-icon-btn delete" title="Delete" onclick="deleteProductRow(this, '${uniqueEditKey}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });

            tableBody.innerHTML = desktopHtml;
            mobileContainer.innerHTML = mobileHtml;
        }

        function deleteProductRow(btn, id) {
            if (confirm("ARE YOU SURE YOU WANT TO DELETE THIS PRODUCT?")) {
                let localProducts = JSON.parse(localStorage.getItem('rorraxy_seller_products')) || [];
                localProducts = localProducts.filter((p, idx) => String(p.id || p.product_code || idx) !== String(id));
                localStorage.setItem('rorraxy_seller_products', JSON.stringify(localProducts));

                const tr = btn.closest('tr');
                const card = btn.closest('.mobile-prod-card');
                if (tr) tr.remove();
                if (card) card.remove();
            }
        }
    </script>
</body>
</html>
