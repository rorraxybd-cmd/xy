<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Seller Dashboard - rorraxy Ecosystem</title>
   
    <!-- Favicon Logo -->
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <script src="/ecosystem-core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #050508;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --pink-solid: linear-gradient(135deg, #ff2a85 0%, #ff479b 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #8e8e99;
            --font-main: 'Poppins', sans-serif;
            --border-color: rgba(212, 175, 55, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; -webkit-font-smoothing: antialiased; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }
        
        .main-container { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }

        .dashboard-header { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
        .header-logo-img { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3)); }
        .dashboard-header h1 { font-size: 1.75rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.8px; }

        .header-actions { display: flex; gap: 10px; align-items: center; justify-content: center; }
        .sync-device-btn { background: var(--pink-solid); border: none; padding: 10px 22px; border-radius: 25px; color: #fff; font-weight: 700; font-size: 0.78rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(255,42,133,0.35); transition: all 0.25s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        .sync-device-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; width: 100%; }
        .stat-card { background: var(--card-retail); border-radius: 18px; padding: 20px 14px 14px 14px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--border-color); width: 100%; min-width: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .stat-card h3 { font-size: 0.72rem; color: var(--text-gray); font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
        .stat-card .value { font-size: 1.4rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        
        .graph-container { width: 100%; height: 80px; position: relative; display: block; }
        .graph-container canvas { width: 100% !important; height: 100% !important; }

        .seller-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.98); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 12px 6px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.25rem; margin-bottom: 4px; color: var(--text-gray); }
        .nav-item span { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.5px; color: var(--text-gray); }

        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
        @media (max-width: 600px) { body { padding: 16px 12px 100px 12px; } .stats-grid { grid-template-columns: 1fr; gap: 12px; } }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('rorraxy_seller_verified') !== 'true') {
            window.location.replace('/seller/index.html');
        }
    </script>

    <div class="main-container" id="mainContainer">
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy Logo" class="header-logo-img">
            <h1>SELLER DASHBOARD</h1>
            
            <div class="header-actions">
                <button type="button" class="sync-device-btn" onclick="openMultiDeviceSyncModal()">
                    <i class="fa-solid fa-qrcode"></i> SYNC DEVICE
                </button>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL REVENUE</h3>
                <div class="value" id="statRevenueVal">$0.00</div>
                <div class="graph-container"><canvas id="chartRevenue"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL BALANCE</h3>
                <div class="value" id="statBalanceVal">$0.00</div>
                <div class="graph-container"><canvas id="chartBalance"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL PRODUCT</h3>
                <div class="value" id="statProductsVal">0</div>
                <div class="graph-container"><canvas id="chartProducts"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL ORDER</h3>
                <div class="value" id="statOrdersVal">0</div>
                <div class="graph-container"><canvas id="chartOrders"></canvas></div>
            </div>
        </section>
    </div>

    <div id="deviceSyncModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:9999; justify-content:center; align-items:center; padding:16px;">
        <div style="background:#050508; border:1px solid rgba(212, 175, 55, 0.4); border-radius:24px; padding:35px 25px; width:100%; max-width:420px; text-align:center; box-shadow:0 25px 60px rgba(0,0,0,0.9);">
            <h3 style="font-size:1.15rem; font-weight:800; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px;">MULTI-DEVICE SYNC</h3>
            <p style="font-size:0.75rem; color:var(--text-gray); margin-bottom:22px; text-transform:none;">Scan this secure QR code with your mobile or target device camera to instantly sync seller session & data.</p>
            
            <div id="qrcodeContainer" style="background:#ffffff; padding:16px; border-radius:16px; display:inline-block; margin-bottom:20px; box-shadow:0 0 25px rgba(212, 175, 55, 0.2);"></div>
            <div id="syncStatusText" style="font-size:0.75rem; color:#d4af37; margin-bottom:18px; text-transform:none; font-weight:600;">Secure session handshake ready...</div>
            
            <button type="button" onclick="closeMultiDeviceSyncModal()" style="width:100%; background:var(--gold-gradient); border:none; border-radius:12px; padding:12px; color:#000; font-weight:800; font-size:0.8rem; cursor:pointer; text-transform:uppercase; box-shadow:0 0 20px rgba(212, 175, 55, 0.3);">CLOSE & RETURN</button>
        </div>
    </div>

    <nav class="seller-bottom-nav">
        <a href="/seller/list.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>LIST</span>
        </a>
        <a href="/seller/payout.html" class="nav-item" onclick="checkPayoutAccess(event)">
            <i class="fa-solid fa-hand-holding-dollar"></i>
            <span>PAYOUT</span>
        </a>
        <a href="/seller/upload.html" class="nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>UPLOAD</span>
        </a>
        <a href="/seller/shipment.html" class="nav-item">
            <i class="fa-solid fa-truck-fast"></i>
            <span>SHIPMENT</span>
        </a>
        <a href="/seller/info.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>INFO</span>
        </a>
    </nav>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadDashboardStats();
        });

        window.checkPayoutAccess = function(e) {
            const currentEmail = localStorage.getItem('rorraxy_current_seller_email') || localStorage.getItem('rorraxy_seller_email');
            const savedProfile = JSON.parse(localStorage.getItem(`rorraxy_seller_profile_${currentEmail}`) || 'null');
            if (!savedProfile || !savedProfile.brandName) {
                e.preventDefault();
                alert('MANDATORY: PLEASE COMPLETE YOUR BUSINESS INFO & EMAIL IN SETTINGS FIRST!');
                window.location.href = '/seller/info.html';
            }
        }

        window.openMultiDeviceSyncModal = function() {
            document.getElementById('deviceSyncModal').style.display = 'flex';
            const qrcodeDiv = document.getElementById('qrcodeContainer');
            qrcodeDiv.innerHTML = '';
            
            const syncToken = "rorraxy_sync_" + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('rorraxy_active_sync_token', syncToken);

            new QRCode(qrcodeDiv, {
                text: window.location.origin + "/seller/dashboard.html?sync_token=" + syncToken,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        window.closeMultiDeviceSyncModal = function() {
            document.getElementById('deviceSyncModal').style.display = 'none';
        }

        // ক্লাউডফ্লেয়ার এবং লোকালস্টোরেজ থেকে বর্তমান সেলারের প্রোডাক্ট কাউন্ট ফেচ করে ড্যাশবোর্ডে আপডেট করার ফাংশন
        async function loadDashboardStats() {
            let cloudflareProducts = [];
            
            const currentSellerId = String(localStorage.getItem('seller_id') || "").trim();
            const currentSellerEmail = String(localStorage.getItem('seller_email') || localStorage.getItem('rorraxy_seller_email') || "").toLowerCase().trim();

            try {
                const response = await fetch('/api/products');
                const result = await response.json();
                let rawData = result.data || result.results || result;
                if (result.success && Array.isArray(rawData) && rawData.length > 0) {
                    cloudflareProducts = rawData;
                } else if (Array.isArray(result) && result.length > 0) {
                    cloudflareProducts = result;
                }
            } catch (err) {
                console.warn("API Fetch Warning:", err);
            }

            let localProducts = JSON.parse(localStorage.getItem('rorraxy_seller_products')) || [];
            
            let mergedMap = new Map();
            [...localProducts, ...cloudflareProducts].forEach(p => {
                let pId = p.id || p.product_id || p.product_code || p.title;
                if(pId) mergedMap.set(String(pId), p);
            });

            let allProducts = Array.from(mergedMap.values());

            // বর্তমান লগইন করা সেলারের প্রোডাক্টগুলো ফিল্টার করা
            let sellerProducts = allProducts.filter(p => {
                const pSellerId = String(p.seller_id || p.sellerId || "").trim();
                const pSellerEmail = String(p.email || p.seller_email || "").toLowerCase().trim();

                if (currentSellerId && pSellerId === currentSellerId) return true;
                if (currentSellerEmail && (pSellerEmail === currentSellerEmail || pSellerId.includes(currentSellerEmail))) return true;
                return false;
            });

            // মোট প্রোডাক্টের সংখ্যা ড্যাশবোর্ডে বসানো
            const totalProductsCount = sellerProducts.length;
            document.getElementById('statProductsVal').innerText = totalProductsCount;
            document.getElementById('statOrdersVal').innerText = "0";
            document.getElementById('statRevenueVal').innerText = "$0.00";
            document.getElementById('statBalanceVal').innerText = "$0.00";
        }

        function createDynamicSparkline(canvasId, dataPoints, isBar = false) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 80);
            gradient.addColorStop(0, 'rgba(212, 175, 55, 0.45)');
            gradient.addColorStop(0.6, 'rgba(179, 135, 40, 0.15)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            return new Chart(ctx, {
                type: isBar ? 'bar' : 'line',
                data: {
                    labels: dataPoints.map((_, i) => `Point ${i + 1}`),
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#d4af37',
                        borderWidth: 2,
                        fill: true,
                        backgroundColor: isBar ? '#d4af37' : gradient,
                        tension: 0.4,
                        pointRadius: 0,
                        borderRadius: isBar ? 4 : 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 1200, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { x: { display: false }, y: { display: false, min: 0 } }
                }
            });
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                createDynamicSparkline('chartRevenue', [15, 30, 25, 50, 65, 90, 115, 140]);
                createDynamicSparkline('chartBalance', [10, 20, 18, 35, 50, 75, 90, 110]);
                createDynamicSparkline('chartProducts', [8, 16, 24, 32, 40, 56, 68, 80], true);
                createDynamicSparkline('chartOrders', [10, 25, 20, 40, 55, 70, 85, 105]);
            }, 100);
        });
    </script>
</body>
</html>
