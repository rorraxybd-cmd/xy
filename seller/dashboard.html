<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Seller Dashboard - rorraxy Ecosystem</title>
   
    <!-- Favicon Logo -->
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js and QRCode JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --pink-solid: linear-gradient(135deg, #ff2a85 0%, #ff479b 100%);
            --text-white: #ffffff;
            --text-gray: #9999a6;
            --font-main: 'Poppins', sans-serif;
            --border-color: rgba(212, 175, 55, 0.15);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        html, body { 
            width: 100%; 
            min-height: 100vh;
            overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); 
            font-family: var(--font-main); 
            font-size: 14px; 
            line-height: 1.4;
            -webkit-font-smoothing: antialiased; 
            -webkit-text-size-adjust: 100%;
        }

        body { 
            padding: 20px 14px 100px 14px; 
            text-transform: uppercase; 
        }
        
        .main-container { 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* Clean Header - No Effects on Logo */
        .dashboard-header { 
            text-align: center; 
            margin-bottom: 24px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px; 
            width: 100%; 
        }

        .header-logo-img { 
            width: 75px; 
            height: 75px; 
            object-fit: contain; 
            filter: none !important; /* No Shadow / Glow Effect */
            background: transparent !important;
        }

        .dashboard-header h1 { 
            font-size: 1.5rem; 
            font-weight: 800; 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: 0.8px; 
            line-height: 1.2;
            word-break: break-word;
        }

        .header-actions { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            justify-content: center; 
            width: 100%;
        }

        .sync-device-btn { 
            background: var(--pink-solid); 
            border: none; 
            padding: 9px 20px; 
            border-radius: 20px; 
            color: #fff; 
            font-weight: 700; 
            font-size: 0.75rem; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: opacity 0.2s ease, transform 0.1s ease; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            white-space: nowrap;
        }

        .sync-device-btn:active {
            transform: scale(0.96);
        }

        /* Stats & Real-Time Chart Grid */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 16px; 
            margin-bottom: 25px; 
            width: 100%; 
        }

        .stat-card { 
            background: var(--card-retail); 
            border-radius: 16px; 
            padding: 16px 14px; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            gap: 10px; 
            border: 1px solid var(--border-color); 
            width: 100%; 
            min-width: 0; 
        }

        .stat-card h3 { 
            font-size: 0.7rem; 
            color: var(--text-gray); 
            font-weight: 600; 
            letter-spacing: 0.5px; 
            line-height: 1.2;
            word-break: break-word;
            width: 100%;
        }

        .stat-card .value { 
            font-size: 1.3rem; 
            font-weight: 800; 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            line-height: 1.2;
            word-break: break-all;
            width: 100%;
        }
        
        .graph-container { 
            width: 100%; 
            height: 75px; 
            position: relative; 
            display: block; 
            margin-top: 4px;
        }

        .graph-container canvas { 
            width: 100% !important; 
            height: 100% !important; 
        }

        /* Bottom Fixed Navigation */
        .seller-bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: #030305; 
            border-top: 1px solid var(--border-color); 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px)) 4px; 
            z-index: 1000; 
        }

        .nav-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            text-decoration: none; 
            flex: 1; 
            background: none; 
            border: none; 
            cursor: pointer; 
            padding: 4px 0;
            min-width: 0;
        }

        .nav-item.active i, .nav-item.active span { 
            background: var(--gold-gradient); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .nav-item i { 
            font-size: 1.15rem; 
            margin-bottom: 3px; 
            color: var(--text-gray); 
        }

        .nav-item span { 
            font-size: 0.6rem; 
            font-weight: 700; 
            letter-spacing: 0.3px; 
            color: var(--text-gray); 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            line-height: 1;
        }

        /* Mobile & Tablet Layout Adjustments */
        @media (max-width: 1024px) { 
            .stats-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 14px; 
            } 
        }

        @media (max-width: 600px) { 
            body { 
                padding: 16px 10px 85px 10px; 
            } 
            .dashboard-header h1 {
                font-size: 1.3rem;
            }
            .stats-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 10px; 
            }
            .stat-card {
                padding: 12px 8px;
            }
            .stat-card h3 {
                font-size: 0.63rem;
            }
            .stat-card .value {
                font-size: 1.1rem;
            }
            .graph-container {
                height: 60px;
            }
        }
    </style>
</head>
<body>

    <script>
        // ভেরিফিকেশন চেক
        if (localStorage.getItem('rorraxy_seller_verified') !== 'true') {
            window.location.replace('/seller/index.html');
        }
    </script>

    <div class="main-container" id="mainContainer">
        <header class="dashboard-header">
            <!-- Clean Logo without effect -->
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy Logo" class="header-logo-img" width="75" height="75">
            <h1>SELLER DASHBOARD</h1>
            
            <div class="header-actions">
                <button type="button" class="sync-device-btn" onclick="openMultiDeviceSyncModal()">
                    <i class="fa-solid fa-qrcode"></i> SYNC DEVICE
                </button>
            </div>
        </header>

        <!-- Dynamic Commercial Stats with Real-Time Chart Canvas -->
        <section class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL REVENUE</h3>
                <div class="value" id="statRevenueVal">$0.00</div>
                <div class="graph-container"><canvas id="chartRevenue"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL BALANCE</h3>
                <div class="value" id="statBalanceVal">$0.00</div>
                <div class="graph-container"><canvas id="chartBalance"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL PRODUCT</h3>
                <div class="value" id="statProductsVal">0</div>
                <div class="graph-container"><canvas id="chartProducts"></canvas></div>
            </div>
            <div class="stat-card">
                <h3>TOTAL ORDER</h3>
                <div class="value" id="statOrdersVal">0</div>
                <div class="graph-container"><canvas id="chartOrders"></canvas></div>
            </div>
        </section>
    </div>

    <!-- Multi-Device Sync Modal -->
    <div id="deviceSyncModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:9999; justify-content:center; align-items:center; padding:16px;">
        <div style="background:#08080c; border:1px solid rgba(212, 175, 55, 0.3); border-radius:20px; padding:26px 18px; width:100%; max-width:380px; text-align:center;">
            <h3 style="font-size:1.05rem; font-weight:800; background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px; line-height:1.3;">MULTI-DEVICE SYNC</h3>
            <p style="font-size:0.72rem; color:var(--text-gray); margin-bottom:18px; text-transform:none; line-height:1.4;">Scan this secure QR code with your mobile device to sync session.</p>
            
            <div id="qrcodeContainer" style="background:#ffffff; padding:12px; border-radius:12px; display:inline-block; margin-bottom:16px;"></div>
            <div id="syncStatusText" style="font-size:0.72rem; color:#d4af37; margin-bottom:16px; text-transform:none; font-weight:600;">Session ready...</div>
            
            <button type="button" onclick="closeMultiDeviceSyncModal()" style="width:100%; background:var(--gold-gradient); border:none; border-radius:10px; padding:11px; color:#000; font-weight:800; font-size:0.78rem; cursor:pointer; text-transform:uppercase;">CLOSE & RETURN</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="seller-bottom-nav">
        <a href="/seller/list.html" class="nav-item">
            <i class="fa-solid fa-list-check"></i>
            <span>LIST</span>
        </a>
        <a href="/seller/payout.html" class="nav-item" onclick="checkPayoutAccess(event)">
            <i class="fa-solid fa-hand-holding-dollar"></i>
            <span>PAYOUT</span>
        </a>
        <a href="/seller/upload.html" class="nav-item">
            <i class="fa-solid fa-plus"></i>
            <span>UPLOAD</span>
        </a>
        <a href="/seller/shipment.html" class="nav-item">
            <i class="fa-solid fa-truck-fast"></i>
            <span>SHIPMENT</span>
        </a>
        <a href="/seller/info.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>INFO</span>
        </a>
    </nav>

    <script>
        const chartInstances = {};
        let lastProductCount = -1;

        window.addEventListener('DOMContentLoaded', () => {
            initDashboardData();
            // রিয়েল টাইমে প্রতি ৪ সেকেন্ড পর পর ডাটা ও গ্রাফ আপডেট করবে
            setInterval(initDashboardData, 4000);
        });

        window.checkPayoutAccess = function(e) {
            const currentEmail = localStorage.getItem('rorraxy_current_seller_email') || localStorage.getItem('rorraxy_seller_email');
            const savedProfile = JSON.parse(localStorage.getItem(`rorraxy_seller_profile_${currentEmail}`) || 'null');
            if (!savedProfile || !savedProfile.brandName) {
                e.preventDefault();
                alert('MANDATORY: PLEASE COMPLETE YOUR BUSINESS INFO & EMAIL IN SETTINGS FIRST!');
                window.location.href = '/seller/info.html';
            }
        }

        window.openMultiDeviceSyncModal = function() {
            document.getElementById('deviceSyncModal').style.display = 'flex';
            const qrcodeDiv = document.getElementById('qrcodeContainer');
            qrcodeDiv.innerHTML = '';
            
            const syncToken = "rorraxy_sync_" + Math.random().toString(36).substring(2) + Date.now().toString(36);
            localStorage.setItem('rorraxy_active_sync_token', syncToken);

            new QRCode(qrcodeDiv, {
                text: window.location.origin + "/seller/dashboard.html?sync_token=" + syncToken,
                width: 150,
                height: 150,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        window.closeMultiDeviceSyncModal = function() {
            document.getElementById('deviceSyncModal').style.display = 'none';
        }

        async function initDashboardData() {
            let cloudflareProducts = [];
            
            const currentSellerId = String(localStorage.getItem('seller_id') || "").trim();
            const currentSellerEmail = String(localStorage.getItem('seller_email') || localStorage.getItem('rorraxy_seller_email') || localStorage.getItem('rorraxy_current_seller_email') || "").toLowerCase().trim();

            try {
                const response = await fetch('/api/products');
                if (response.ok) {
                    const result = await response.json();
                    let rawData = result.data || result.results || result;
                    if (result.success && Array.isArray(rawData)) {
                        cloudflareProducts = rawData;
                    } else if (Array.isArray(result)) {
                        cloudflareProducts = result;
                    }
                }
            } catch (err) {
                console.warn("API Data Sync Status:", err);
            }

            let localProducts = JSON.parse(localStorage.getItem('rorraxy_seller_products')) || [];
            
            let mergedMap = new Map();
            [...localProducts, ...cloudflareProducts].forEach(p => {
                let pId = p.id || p.product_id || p.product_code || p.title;
                if (pId) mergedMap.set(String(pId), p);
            });

            let allProducts = Array.from(mergedMap.values());

            let sellerProducts = allProducts.filter(p => {
                const pSellerId = String(p.seller_id || p.sellerId || "").trim();
                const pSellerEmail = String(p.email || p.seller_email || "").toLowerCase().trim();

                if (currentSellerId && pSellerId === currentSellerId) return true;
                if (currentSellerEmail && (pSellerEmail === currentSellerEmail || pSellerId.includes(currentSellerEmail))) return true;
                return false;
            });

            const productCount = sellerProducts.length;
            
            // রিয়েল-টাইমে মানগুলো আপডেট
            document.getElementById('statProductsVal').innerText = productCount;
            document.getElementById('statOrdersVal').innerText = "0";
            document.getElementById('statRevenueVal').innerText = "$0.00";
            document.getElementById('statBalanceVal').innerText = "$0.00";

            // ডাটা পরিবর্তন হলে চার্ট নতুন করে রেন্ডার হবে
            if (lastProductCount !== productCount) {
                lastProductCount = productCount;
                renderRealtimeCharts(productCount);
            }
        }

        function createSparklineChart(canvasId, dataPoints, isBar = false) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            if (chartInstances[canvasId]) {
                chartInstances[canvasId].destroy();
            }
            
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 60);
            gradient.addColorStop(0, 'rgba(212, 175, 55, 0.45)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            chartInstances[canvasId] = new Chart(ctx, {
                type: isBar ? 'bar' : 'line',
                data: {
                    labels: dataPoints.map((_, i) => `${i + 1}`),
                    datasets: [{
                        data: dataPoints,
                        borderColor: '#d4af37',
                        borderWidth: 1.8,
                        fill: true,
                        backgroundColor: isBar ? '#d4af37' : gradient,
                        tension: 0.35,
                        pointRadius: 0,
                        borderRadius: isBar ? 3 : 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 600, easing: 'easeOutQuart' },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: { 
                        x: { display: false }, 
                        y: { display: false, min: 0 } 
                    }
                }
            });
        }

        function renderRealtimeCharts(productCount) {
            requestAnimationFrame(() => {
                // রিয়েল টাইম বাণিজ্য নির্ভর ডাটা গ্রাফের জন্য
                createSparklineChart('chartRevenue', [0, 0, 0, 0, 0]);
                createSparklineChart('chartBalance', [0, 0, 0, 0, 0]);
                
                // প্রোডাক্ট গ্রাফ (প্রোডাক্ট আপলোডের উপর ভিত্তি করে গ্রাফ অটো সমন্বয় করবে)
                const productTrend = productCount > 0 
                    ? [0, Math.ceil(productCount * 0.3), Math.ceil(productCount * 0.7), productCount] 
                    : [0, 0, 0, 0];
                createSparklineChart('chartProducts', productTrend, true);
                
                createSparklineChart('chartOrders', [0, 0, 0, 0, 0]);
            });
        }
    </script>
</body>
</html>
