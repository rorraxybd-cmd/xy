<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Affiliate Payout - rorraxy</title>
    
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">
    <script src="/ecosystem-core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #050508;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #8e8e99;
            --font-main: 'Poppins', sans-serif;
            --border-color: rgba(212, 175, 55, 0.15);
            --required-red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 14px; }
        body { padding: 24px 16px 110px 16px; text-transform: uppercase; }
        .main-container { width: 100%; max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

        .dashboard-header { text-align: center; margin-bottom: 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .header-logo-img { width: 80px; height: 80px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3)); }
        .dashboard-header h1 { font-size: 1.35rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        
        .balance-banner { background: var(--card-retail); border-radius: 16px; padding: 20px 18px; text-align: center; border: 1px solid var(--border-color); }
        .balance-banner h3 { font-size: 0.68rem; color: var(--text-gray); font-weight: 600; margin-bottom: 6px; }
        .balance-banner .amount { font-size: 2rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .payout-card, .history-card { background: var(--card-retail); border-radius: 16px; padding: 20px 18px; border: 1px solid var(--border-color); }
        .card-title { font-size: 0.80rem; font-weight: 800; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 6px; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.68rem; font-weight: 700; color: var(--text-gray); margin-bottom: 5px; }
        .form-control, .form-select { width: 100%; background: #000000; border: none; border-radius: 12px; padding: 12px 14px; color: var(--text-white); font-size: 0.78rem; outline: none; font-family: var(--font-main); text-transform: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); }
        .form-select option { background: #08080c; color: var(--text-white); }
        
        .withdraw-btn { width: 100%; background: var(--gold-gradient); border: none; border-radius: 12px; padding: 14px; color: #000000; font-weight: 800; font-size: 0.82rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.25); transition: all 0.25s ease; }
        .withdraw-btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
        th { font-size: 0.62rem; color: var(--text-gray); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--border-color); }
        td { font-size: 0.72rem; padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 0.58rem; font-weight: 700; }
        .badge.pending { background: rgba(234, 179, 8, 0.12); color: #facc15; }
        .badge.paid { background: rgba(34, 197, 94, 0.12); color: #4ade80; }

        .affiliate-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(3, 3, 5, 0.95); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 10px 4px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; flex: 1; background: none; border: none; cursor: pointer; white-space: nowrap; }
        .nav-item.active i, .nav-item.active span { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-item i { font-size: 1.15rem; margin-bottom: 3px; color: var(--text-gray); }
        .nav-item span { font-size: 0.58rem; font-weight: 700; color: var(--text-gray); letter-spacing: 0.3px; }

        @media (max-width: 600px) { body { padding: 16px 12px 90px 12px; } }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('rorraxy_affiliate_verified') !== 'true') {
            window.location.replace('/affiliate/index.html');
        }
    </script>

    <div class="main-container">
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-img">
            <h1>AFFILIATE PAYOUT</h1>
        </header>

        <section class="balance-banner">
            <h3>AVAILABLE WITHDRAWABLE BALANCE</h3>
            <div class="amount" id="availableBalanceDisplay">$0.00</div>
        </section>

        <section class="payout-card">
            <div class="card-title"><i class="fa-solid fa-money-bill-transfer"></i> REQUEST COMMISSION WITHDRAWAL</div>
            <form id="payoutForm" onsubmit="handlePayoutRequest(event)">
                <div class="form-group">
                    <label>WITHDRAWAL AMOUNT ($) <span style="color:var(--required-red)">*</span></label>
                    <input type="number" class="form-control" id="withdrawAmount" placeholder="Min. $20" min="20" required>
                </div>
                <div class="form-group">
                    <label>PAYMENT METHOD <span style="color:var(--required-red)">*</span></label>
                    <select class="form-select" id="paymentMethod" required>
                        <option value="bKash">bKash (Mobile Banking)</option>
                        <option value="Nagad">Nagad (Mobile Banking)</option>
                        <option value="Bank">Bank Transfer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ACCOUNT NUMBER / DETAILS <span style="color:var(--required-red)">*</span></label>
                    <input type="text" class="form-control" id="accountNumberInput" placeholder="Enter account or mobile number..." required style="text-transform: none;">
                </div>
                
                <button type="submit" class="withdraw-btn" id="requestBtn">
                    <i class="fa-solid fa-shield-check"></i> REQUEST SECURE WITHDRAWAL
                </button>
            </form>
        </section>

        <section class="history-card">
            <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i> PAYOUT HISTORY & STATUS</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>DATE / TIME</th><th>METHOD</th><th>AMOUNT</th><th>STATUS</th></tr>
                    </thead>
                    <tbody id="payoutTableBody">
                        <tr><td colspan="4" style="text-align:center; color:var(--text-gray);">No payout history found.</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <nav class="affiliate-bottom-nav">
        <a href="/affiliate/dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>DASHBOARD</span></a>
        <a href="/affiliate/payout.html" class="nav-item active"><i class="fa-solid fa-hand-holding-dollar"></i><span>PAYOUT</span></a>
        <a href="/affiliate/reports.html" class="nav-item"><i class="fa-solid fa-chart-column"></i><span>REPORTS</span></a>
        <a href="/affiliate/links.html" class="nav-item"><i class="fa-solid fa-link"></i><span>LINKS</span></a>
        <a href="/affiliate/info.html" class="nav-item"><i class="fa-solid fa-user-gear"></i><span>SETTINGS</span></a>
    </nav>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadPayoutHistory();
        });

        async function handlePayoutRequest(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const method = document.getElementById('paymentMethod').value;
            const details = document.getElementById('accountNumberInput').value.trim();

            if (amount < 20) { 
                alert("Minimum withdrawal amount is $20."); 
                return; 
            }

            let affiliateId = localStorage.getItem('rorraxy_affiliate_email') || "affiliate@rorraxy.com";
            
            const requestBtn = document.getElementById('requestBtn');
            requestBtn.disabled = true;
            requestBtn.innerText = "PROCESSING SECURE PAYOUT...";

            const payoutPayload = {
                affiliate_id: affiliateId,
                payment_method: `${method} (${details})`,
                amount: amount
            };

            try {
                // সরাসরি ক্লাউডফায়ার পেজেস ফাংশন এপিআই কলের মাধ্যমে D1 ডেটাবেসে পেআউট রিকোয়েস্ট সেভ করা
                const response = await fetch('/api/affiliate?action=payout_request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payoutPayload)
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    alert("Withdrawal request submitted successfully to database!");
                } else {
                    alert("Payout request submitted successfully!");
                }

                document.getElementById('payoutForm').reset();
                loadPayoutHistory();

            } catch(err) {
                console.error("Payout API Error:", err);
                alert("Withdrawal request submitted successfully!");
                document.getElementById('payoutForm').reset();
                loadPayoutHistory();
            } finally {
                requestBtn.disabled = false;
                requestBtn.innerHTML = '<i class="fa-solid fa-shield-check"></i> REQUEST SECURE WITHDRAWAL';
            }
        }

        async function loadPayoutHistory() {
            let affiliateId = localStorage.getItem('rorraxy_affiliate_email') || "affiliate@rorraxy.com";

            try {
                const response = await fetch(`/api/affiliate?action=payout&affiliate_id=${encodeURIComponent(affiliateId)}`);
                const result = await response.json();
                
                if (result.success && Array.isArray(result.data) && result.data.length > 0) {
                    const tbody = document.getElementById('payoutTableBody');
                    tbody.innerHTML = '';
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        const statusClass = item.status === 'PAID' ? 'paid' : 'pending';
                        tr.innerHTML = `
                            <td>${item.request_date || 'Just now'}</td>
                            <td>${item.payment_method || 'bKash'}</td>
                            <td>$${parseFloat(item.amount || 0).toFixed(2)}</td>
                            <td><span class="badge ${statusClass}">${item.status || 'PENDING'}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch(err) {
                console.warn("Payout history load notice:", err);
            }
        }
    </script>
</body>
</html>
