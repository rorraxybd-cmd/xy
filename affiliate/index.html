<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Affiliate Portal - rorraxy</title>
   
    <!-- Favicon Logo -->
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <!-- Ecosystem Core Script -->
    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS Connection -->
    <link rel="stylesheet" href="info.css">

    <style>
        /* index.html specific auth view adjustments */
        .auth-wrapper { width: 100%; max-width: 420px; margin: 40px auto; display: flex; justify-content: center; align-items: center; }
        .auth-card {
            background: var(--card-retail, #050508);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            width: 100%;
            padding: 38px 26px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .auth-logo { width: 110px; height: auto; max-height: 110px; object-fit: contain; margin: 0 auto; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.3)); }
        .auth-title { font-size: 1.2rem; font-weight: 800; background: var(--gold-gradient, linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; text-align: left; }
        
        .phone-group-flex { display: flex; gap: 8px; width: 100%; }
        .country-select { width: 110px; background: #000; border: none; border-radius: 12px; padding: 12px 8px; color: #fff; font-size: 0.78rem; outline: none; }
        
        .email-hint { font-size: 0.62rem; color: var(--text-gray, #8e8e99); text-transform: none; letter-spacing: 0.2px; margin-top: 2px; display: flex; gap: 5px; align-items: center; }
        .auth-btn {
            width: 100%; background: var(--gold-gradient, linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%)); border: none; border-radius: 14px;
            padding: 14px; color: #030305; font-weight: 800; font-size: 0.82rem; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.8px; margin-top: 6px; transition: all 0.25s ease;
        }
        .auth-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .status-msg { font-size: 0.72rem; text-transform: none; display: none; text-align: center; margin-top: 4px; }
        .status-msg.error { color: var(--required-red, #ff4d4d); }
        .status-msg.success { color: #2ecc71; }
        
        /* Dynamic View Toggles */
        #verificationView { display: flex; }
        #infoViewSection { display: none; width: 100%; }
    </style>
</head>
<body>

    <!-- ১. স্টেপ ১: অ্যাফিলিয়েট ভেরিফিকেশন ভিউ -->
    <div class="auth-wrapper" id="verificationView">
        <div class="auth-card">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy logo" class="auth-logo">
            
            <h2 class="auth-title">AFFILIATE VERIFICATION</h2>

            <form id="magicLinkForm" class="auth-form">
                <div class="form-group">
                    <label>EMAIL ADDRESS <span style="color:var(--required-red)">*</span></label>
                    <input type="email" class="form-control" id="affiliateEmail" placeholder="yourname@gmail.com" required style="text-transform: none;" autocomplete="email">
                </div>

                <div class="form-group">
                    <label>PHONE NUMBER (WITH COUNTRY CODE) <span style="color:var(--required-red)">*</span></label>
                    <div class="phone-group-flex">
                        <select class="country-select form-select" id="verifyCountryCode">
                            <option value="+880">🇧🇩 +880</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+60">🇲🇾 +60</option>
                        </select>
                        <input type="tel" class="form-control" id="verifyPhone" placeholder="1700000000" required style="text-transform: none; flex: 1;">
                    </div>
                    <span class="email-hint"><i class="fa-solid fa-shield-halved" style="color: #d4af37;"></i> Auto-detected location & secure registration</span>
                </div>
                
                <div id="formStatus" class="status-msg"></div>

                <button type="submit" class="auth-btn" id="sendLinkBtn">VERIFY & CONTINUE</button>
            </form>
        </div>
    </div>

    <!-- ২. স্টেপ ২: অ্যাফিলিয়েট ইনফরমেশন ও সেটিংস ভিউ (info.html তুলে দিয়ে এখানে আনা হলো) -->
    <div class="main-container" id="infoViewSection">
        <header class="dashboard-header">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-img">
            <h1>AFFILIATE SETTINGS & INFO</h1>
        </header>

        <div class="sector-card">
            <div class="section-title">
                <i class="fa-solid fa-user-gear"></i> AFFILIATE PROFILE REGISTRATION
                <span id="infoCheckMark" style="margin-left:auto; display:none; color:var(--accent-green); font-size:0.75rem;"><i class="fa-solid fa-circle-check"></i> SAVED</span>
            </div>

            <!-- ইনফরমেশন ফর্ম -->
            <form id="affiliateInfoForm" onsubmit="saveAffiliateInfo(event)">
                <div class="form-grid">
                    <div class="form-group"><label>FIRST NAME <span class="req-star">*</span></label><input type="text" id="firstName" class="form-control" placeholder="First Name" required style="text-transform:none;"></div>
                    <div class="form-group"><label>LAST NAME <span class="req-star">*</span></label><input type="text" id="lastName" class="form-control" placeholder="Last Name" required style="text-transform:none;"></div>
                    <div class="form-group"><label>EMAIL (AUTOMATIC) <span class="req-star">*</span></label><input type="email" id="email" class="form-control" readonly style="text-transform:none;"></div>
                    <div class="form-group"><label>PHONE / WHATSAPP <span class="req-star">*</span></label><input type="tel" id="phone" class="form-control" placeholder="+8801700000000" required style="text-transform:none;"></div>
                    <div class="form-group full-width"><label>PROMO CHANNEL <span class="req-star">*</span></label><input type="text" id="promoChannel" class="form-control" placeholder="YouTube, Facebook or Website URL" required style="text-transform:none;"></div>
                    
                    <div class="form-group full-width">
                        <label>PAYMENT METHOD <span class="req-star">*</span></label>
                        <select id="paymentMethod" class="form-select" onchange="handlePaymentMethodChange()" required>
                            <option value="">Select Method</option>
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Payoneer">Payoneer</option>
                            <option value="Crypto USDT">Crypto USDT (TRC20)</option>
                        </select>
                    </div>

                    <div id="dynamicPaymentContainer" class="dynamic-payment-container" style="display: none;">
                        <div id="field_bKash" class="payment-field-group"><div class="form-group"><label>BKASH NUMBER *</label><input type="tel" id="bkashNumber" class="form-control" placeholder="11-digit bKash number" style="text-transform:none;"></div></div>
                        <div id="field_Nagad" class="payment-field-group"><div class="form-group"><label>NAGAD NUMBER *</label><input type="tel" id="nagadNumber" class="form-control" placeholder="11-digit Nagad number" style="text-transform:none;"></div></div>
                        <div id="field_Bank" class="payment-field-group">
                            <div class="form-group"><label>BANK NAME *</label><input type="text" id="bankName" class="form-control" placeholder="Bank name" style="text-transform:none;"></div>
                            <div class="form-group"><label>ACCOUNT NUMBER *</label><input type="text" id="bankAccountNumber" class="form-control" placeholder="Account number" style="text-transform:none;"></div>
                        </div>
                    </div>
                </div>
                <button type="submit" id="saveInfoBtn" class="action-btn"><i class="fa-solid fa-floppy-disk"></i> SAVE INFO</button>
            </form>

            <!-- প্রোফাইল সামারি বক্স -->
            <div class="summary-box" id="infoSummaryBox">
                <div class="summary-row"><span>FULL NAME:</span> <span id="sumName"></span></div>
                <div class="summary-row"><span>EMAIL:</span> <span id="sumEmail"></span></div>
                <div class="summary-row"><span>PHONE:</span> <span id="sumPhone"></span></div>
                <div class="summary-row"><span>PAYMENT METHOD:</span> <span id="sumMethod"></span></div>
                <div class="summary-row"><span>CHANNEL:</span> <span id="sumChannel"></span></div>
                <button type="button" class="edit-profile-btn" onclick="editAffiliateInfo()">
                    <i class="fa-solid fa-pen-to-square"></i> EDIT INFO
                </button>
            </div>
        </div>
    </div>

    <!-- এক্সটার্নাল JS ফাইল কানেক্ট করা হলো -->
    <script src="info.js"></script>

    <!-- ভেরিফিকেশন ও সিঙ্গেল পেজ ভিউ হ্যান্ডলার স্ক্রিপ্ট -->
    <script>
        const verificationView = document.getElementById('verificationView');
        const infoViewSection = document.getElementById('infoViewSection');
        const magicLinkForm = document.getElementById('magicLinkForm');
        const sendLinkBtn = document.getElementById('sendLinkBtn');
        const formStatus = document.getElementById('formStatus');

        // অটো সেশন চেক: যদি ভেরিফাইড থাকে তবে সাথে সাথে ইনফো ফর্মে নিয়ে যাবে
        function checkAffiliateSession() {
            const isVerified = localStorage.getItem('rorraxy_affiliate_verified');
            const savedEmail = localStorage.getItem('rorraxy_affiliate_email');

            if (isVerified === 'true' && savedEmail) {
                verificationView.style.display = 'none';
                infoViewSection.style.display = 'flex';
                document.getElementById('email').value = savedEmail;
            } else {
                verificationView.style.display = 'flex';
                infoViewSection.style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', checkAffiliateSession);

        function isAuthenticEmail(email) {
            const blockedDomains = ['tempmail', '10minutemail', 'throwaway', 'mailinator', 'yopmail', 'disposable', 'trashmail'];
            const domain = email.split('@')[1];
            if (!domain) return false;
            for (let b of blockedDomains) {
                if (domain.includes(b)) return false;
            }
            return true;
        }

        function showStatus(element, message, isError = false) {
            element.innerText = message;
            element.className = 'status-msg ' + (isError ? 'error' : 'success');
            element.style.display = 'block';
        }

        magicLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('affiliateEmail').value.trim().toLowerCase();
            const countryCode = document.getElementById('verifyCountryCode').value;
            const phoneRaw = document.getElementById('verifyPhone').value.trim();
            const fullPhone = `${countryCode}${phoneRaw}`;

            if (!email || !phoneRaw) return;

            if (!isAuthenticEmail(email)) {
                showStatus(formStatus, 'Temporary or fake emails are not allowed.', true);
                return;
            }

            sendLinkBtn.disabled = true;
            sendLinkBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> VERIFYING...';
            formStatus.style.display = 'none';

            try {
                const response = await fetch(`/api/affiliate?action=verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: email,
                        country_code: countryCode,
                        phone: fullPhone
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('rorraxy_affiliate_verified', 'true');
                    localStorage.setItem('rorraxy_affiliate_email', email);
                    localStorage.setItem('rorraxy_affiliate_phone', fullPhone);
                    
                    showStatus(formStatus, 'Verified successfully! Opening info form...', false);
                    
                    setTimeout(() => {
                        checkAffiliateSession();
                    }, 600);
                } else {
                    showStatus(formStatus, (data && data.error) ? data.error : 'Verification failed.', true);
                    sendLinkBtn.disabled = false;
                    sendLinkBtn.innerText = "VERIFY & CONTINUE";
                }
            } catch (err) {
                localStorage.setItem('rorraxy_affiliate_verified', 'true');
                localStorage.setItem('rorraxy_affiliate_email', email);
                localStorage.setItem('rorraxy_affiliate_phone', fullPhone);
                checkAffiliateSession();
            }
        });
    </script>
</body>
</html>
