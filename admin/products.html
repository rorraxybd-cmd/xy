<!-- Advanced Enterprise Store Inventory & Product Management -->
<div class="cj-fullscreen-wrapper">
  <div class="cj-content-container">
    <div class="cj-import-header">
      <h2>Enterprise Inventory Management</h2>
      <p>Centralized Global Dashboard for CJ Dropshipping & Multi-Vendor Assets</p>
    </div>

    <!-- Search & Filter Bar -->
    <div class="cj-controls-bar">
      <input type="text" id="searchInput" placeholder="Search by product name, ID, or attributes..." onkeyup="filterProducts()">
      <select id="sourceFilter" onchange="filterProducts()">
        <option value="all">All Sources (CJ & Vendors)</option>
        <option value="dropship">CJ Dropship</option>
        <option value="vendor">Vendor / Custom</option>
      </select>
    </div>

    <!-- Products Table -->
    <div class="cj-table-responsive">
      <table class="cj-table">
        <thead>
          <tr>
            <th>ID / Date</th>
            <th>Image</th>
            <th>Source</th>
            <th>Title</th>
            <th>Retail Price</th>
            <th>Wholesale Price</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <!-- Dynamic Data Loaded Here -->
        </tbody>
      </table>
      <div id="loadingText" class="cj-loading-text">Synchronizing secure D1 database records...</div>
    </div>

    <!-- Pagination Control Bar -->
    <div class="cj-pagination-bar" id="paginationBar"></div>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="cj-modal">
  <div class="cj-modal-content">
    <h3>Modify Product Parameters</h3>
    <form id="editForm">
      <input type="hidden" id="editId">
      <div class="cj-form-group">
        <label>Product Title</label>
        <input type="text" id="editTitle" required>
      </div>
      <div class="cj-form-row">
        <div class="cj-form-group">
          <label>Retail Price ($)</label>
          <input type="number" step="0.01" id="editRetailPrice" required>
        </div>
        <div class="cj-form-group">
          <label>Wholesale Price ($)</label>
          <input type="number" step="0.01" id="editWholesalePrice" required>
        </div>
      </div>
      <div class="cj-form-group">
        <label>Stock Quantity</label>
        <input type="number" id="editStock" required>
      </div>
      <div class="cj-modal-actions">
        <button type="button" class="cj-btn-cancel" onclick="closeModal()">Cancel</button>
        <button type="submit" class="cj-btn-gold">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<style>
  :root {
    --bg-pure: #000000;
    --card-soft: #0a0a0f;
    --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    --gold-solid: #d4af37;
    --pink-love: #ff2a85;
    --text-white: #ffffff;
    --text-gray: #8a8a9e;
    --font-main: 'Poppins', sans-serif;
  }

  .cj-fullscreen-wrapper { margin: 0; padding: 0; width: 100%; min-height: 100vh; background-color: var(--bg-pure); font-family: var(--font-main); box-sizing: border-box; padding: 30px 15px; }
  .cj-content-container { width: 100%; max-width: 1300px; margin: 0 auto; padding: 35px; background-color: var(--card-soft); border-radius: 14px; box-sizing: border-box; box-shadow: 0 20px 40px rgba(0,0,0,0.9); }
  .cj-import-header h2 { font-size: 28px; font-weight: 700; margin: 0 0 6px 0; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .cj-import-header p { color: var(--text-gray); font-size: 13px; margin: 0 0 25px 0; }
  .cj-controls-bar { display: flex; gap: 15px; margin-bottom: 25px; }
  .cj-controls-bar input, .cj-controls-bar select { padding: 14px 18px; background: #000000; border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 8px; color: var(--text-white); font-size: 14px; outline: none; box-sizing: border-box; }
  .cj-controls-bar input { flex: 2.5; }
  .cj-controls-bar select { flex: 1; cursor: pointer; }
  .cj-controls-bar input:focus, .cj-controls-bar select:focus { border-color: var(--gold-solid); }
  .cj-table-responsive { width: 100%; overflow-x: auto; }
  .cj-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
  .cj-table th { color: var(--gold-solid); padding: 14px 16px; border-bottom: 1px solid rgba(212, 175, 55, 0.25); font-weight: 600; }
  .cj-table td { padding: 14px 16px; color: var(--text-white); border-bottom: 1px solid rgba(255, 255, 255, 0.04); vertical-align: middle; }
  .cj-table tr:hover { background: rgba(255, 255, 255, 0.015); }
  .cj-product-thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(212, 175, 55, 0.2); background: #111; }
  .cj-badge { padding: 4px 10px; border-radius: 5px; font-size: 11px; text-transform: uppercase; font-weight: 600; display: inline-block; }
  .cj-badge-dropship { background: rgba(212, 175, 55, 0.15); color: var(--gold-solid); border: 1px solid rgba(212, 175, 55, 0.3); }
  .cj-badge-vendor { background: rgba(0, 255, 128, 0.12); color: #00ff80; border: 1px solid rgba(0, 255, 128, 0.25); }
  .cj-date-sub { display: block; font-size: 11px; color: var(--text-gray); margin-top: 3px; }
  .cj-btn-action { padding: 7px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; border: none; margin-right: 6px; }
  .cj-btn-edit { background: rgba(212, 175, 55, 0.2); color: var(--gold-solid); }
  .cj-btn-delete { background: rgba(255, 42, 133, 0.2); color: var(--pink-love); }
  .cj-loading-text { color: var(--gold-solid); font-size: 13px; padding: 25px 0; text-align: center; }
  .cj-pagination-bar { display: flex; justify-content: center; gap: 8px; margin-top: 25px; }
  .cj-page-btn { padding: 8px 14px; background: #000; border: 1px solid rgba(212, 175, 55, 0.2); color: var(--text-white); border-radius: 6px; cursor: pointer; font-size: 13px; }
  .cj-page-btn.active { background: var(--gold-gradient); color: #000; font-weight: 700; border: none; }
  .cj-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); align-items: center; justify-content: center; z-index: 1000; }
  .cj-modal-content { background: var(--card-soft); padding: 35px; border-radius: 14px; width: 100%; max-width: 500px; border: 1px solid rgba(212, 175, 55, 0.3); }
  .cj-modal-content h3 { margin-top: 0; color: var(--gold-solid); font-size: 22px; margin-bottom: 20px; }
  .cj-form-row { display: flex; gap: 15px; }
  .cj-form-row .cj-form-group { flex: 1; }
  .cj-form-group { margin-bottom: 18px; }
  .cj-form-group label { display: block; font-size: 13px; color: var(--text-white); margin-bottom: 8px; font-weight: 500; }
  .cj-form-group input { width: 100%; padding: 12px 14px; background: #000000; border: none; border-radius: 8px; color: var(--text-white); font-size: 14px; box-sizing: border-box; outline: none; }
  .cj-modal-actions { display: flex; gap: 12px; margin-top: 25px; }
  .cj-btn-cancel { flex: 1; padding: 13px; background: #1a1a22; color: var(--text-gray); border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .cj-btn-gold { flex: 1; padding: 13px; background: var(--gold-gradient); color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; }
</style>

<script>
  let allProducts = [];
  let currentPage = 1;
  const rowsPerPage = 50;

  async function loadProducts() {
    try {
      const res = await fetch('/api/products'); 
      const result = await res.json();
      document.getElementById('loadingText').style.display = 'none';

      if (result.success && result.data.length > 0) {
        allProducts = result.data;
        filterProducts();
      } else {
        document.getElementById('productTableBody').innerHTML = `<tr><td colspan="8" style="text-align:center; color: var(--text-gray);">কোনো প্রোডাক্ট পাওয়া যায়নি।</td></tr>`;
      }
    } catch (err) {
      document.getElementById('loadingText').innerText = 'ডেটা সিঙ্ক করতে সমস্যা হয়েছে!';
    }
  }

  function displayProducts(products) {
    const tbody = document.getElementById('productTableBody');
    tbody.innerHTML = '';

    const start = (currentPage - 1) * rowsPerPage;
    const paginatedItems = products.slice(start, start + rowsPerPage);

    if (paginatedItems.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: var(--text-gray);">মিল Product পাওয়া যায়নি।</td></tr>`;
      document.getElementById('paginationBar').innerHTML = '';
      return;
    }

    paginatedItems.forEach(p => {
      const sourceBadge = p.vendor_type === 'dropship' 
        ? `<span class="cj-badge cj-badge-dropship">CJ Dropship</span>` 
        : `<span class="cj-badge cj-badge-vendor">Vendor</span>`;

      let imgSrc = 'https://via.placeholder.com/45?text=No+Img';
      if (p.image_url && p.image_url.trim() !== '') {
        if (p.image_url.startsWith('[')) {
          try {
            let parsed = JSON.parse(p.image_url);
            if (Array.isArray(parsed) && parsed.length > 0) imgSrc = parsed[0];
          } catch(e) { imgSrc = p.image_url; }
        } else {
          imgSrc = p.image_url;
        }
      }

      const rawDate = p.created_at ? new Date(p.created_at).toLocaleDateString() : 'N/A';

      tbody.innerHTML += `
        <tr>
          <td>
            <strong>#${p.id}</strong>
            <span class="cj-date-sub">${rawDate}</span>
          </td>
          <td><img src="${imgSrc}" class="cj-product-thumb" alt="Product" onerror="this.src='https://via.placeholder.com/45?text=Error'"></td>
          <td>${sourceBadge}</td>
          <td>${p.title}</td>
          <td>$${parseFloat(p.price || 0).toFixed(2)}</td>
          <td>$${parseFloat(p.price_min_whole || 0).toFixed(2)}</td>
          <td>${p.stock || 500}</td>
          <td>
            <button class="cj-btn-action cj-btn-edit" onclick="openEdit(${p.id})">Edit</button>
            <button class="cj-btn-action cj-btn-delete" onclick="deleteProduct(${p.id})">Delete</button>
          </td>
        </tr>
      `;
    });

    setupPagination(products.length);
  }

  function setupPagination(totalItems) {
    const totalPages = Math.ceil(totalItems / rowsPerPage);
    const bar = document.getElementById('paginationBar');
    bar.innerHTML = '';

    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
      bar.innerHTML += `<button class="cj-page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    }
  }

  function changePage(page) {
    currentPage = page;
    filterProducts();
  }

  function filterProducts() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const sourceFilter = document.getElementById('sourceFilter').value;

    const filtered = allProducts.filter(p => {
      const matchesSearch = (p.title && p.title.toLowerCase().includes(searchTerm)) || String(p.id).includes(searchTerm);
      const matchesSource = sourceFilter === 'all' || p.vendor_type === sourceFilter;
      return matchesSearch && matchesSource;
    });

    currentPage = 1;
    displayProducts(filtered);
  }

  function openEdit(id) {
    const p = allProducts.find(item => item.id === id);
    if (!p) return;

    document.getElementById('editId').value = p.id;
    document.getElementById('editTitle').value = p.title || '';
    document.getElementById('editRetailPrice').value = p.price || 0;
    document.getElementById('editWholesalePrice').value = p.price_min_whole || 0;
    document.getElementById('editStock').value = p.stock || 500;
    document.getElementById('editModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('editModal').style.display = 'none';
  }

  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const title = document.getElementById('editTitle').value;
    const price = document.getElementById('editRetailPrice').value;
    const price_min_whole = document.getElementById('editWholesalePrice').value;
    const stock = document.getElementById('editStock').value;

    try {
      const res = await fetch(`/api/products`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, title, price, price_min_whole, stock })
      });
      const textRes = await res.text();
      let result = {};
      try { result = JSON.parse(textRes); } catch(e) { result = { success: res.ok }; }

      if (result.success) {
        closeModal();
        loadProducts();
      } else {
        alert('আপডেট ব্যর্থ হয়েছে: ' + (result.error || 'Unknown error'));
      }
    } catch (err) {
      alert('সার্ভার এরর: ' + err.message);
    }
  });

  async function deleteProduct(id) {
    if (confirm('আপনি কি নিশ্চিতভাবে এই প্রোডাক্টটি ডাটাবেজ থেকে মুছে ফেলতে চান?')) {
      try {
        const res = await fetch(`/api/products?id=${id}`, { method: 'DELETE' });
        const textRes = await res.text();
        let result = {};
        try { result = JSON.parse(textRes); } catch(e) { result = { success: res.ok }; }

        if (result.success) {
          loadProducts();
        } else {
          alert('ডিলিট ব্যর্থ হয়েছে: ' + (result.error || 'Unknown error'));
        }
      } catch (err) {
        alert('সার্ভার এরর: ' + err.message);
      }
    }
  }

  loadProducts();
</script>
