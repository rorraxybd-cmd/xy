<!-- Full Optimized Product Details View (Gold & Black Theme) -->
<div class="product-page-wrapper">
  <div class="product-container">
    
    <!-- Left: Gallery & Video Preview -->
    <div class="product-media-section">
      <div class="main-image-box">
        <img id="mainImage" src="https://via.placeholder.com/600?text=Loading..." alt="Product Image">
      </div>
      <div class="thumbnail-gallery" id="thumbGallery">
        <!-- Dynamic Thumbnails Render Here -->
      </div>
    </div>

    <!-- Right: Pricing, Stock, Quantity & Specifications -->
    <div class="product-info-section">
      
      <!-- Top Pricing & Cushion Info -->
      <div class="price-card">
        <div class="price-header">
          <span class="currency-symbol">$</span>
          <span id="productPrice" class="price-amount">0.00</span>
          <span class="shipping-badge">FREE GLOBAL SHIPPING</span>
        </div>
        <div class="stock-status">
          <span class="status-indicator"></span>
          <span id="stockCount">IN STOCK: 500 UNITS - READY TO DISPATCH</span>
        </div>
      </div>

      <!-- Quantity Selector -->
      <div class="quantity-card">
        <label>QUANTITY</label>
        <div class="qty-controls">
          <button type="button" class="qty-btn" onclick="updateQty(-1)">-</button>
          <input type="number" id="itemQty" value="1" min="1" readonly>
          <button type="button" class="qty-btn" onclick="updateQty(1)">+</button>
        </div>
      </div>

      <!-- Seller Chat Action -->
      <button class="chat-seller-btn" onclick="openSellerChat()">
        💬 CHAT WITH SELLER
      </button>

      <!-- Full Specifications & Description Box -->
      <div class="specifications-card">
        <div class="spec-header">
          <span class="info-icon">ℹ</span> SPECIFICATIONS & DETAILS
        </div>
        <h1 id="productTitle" class="product-title-text">Loading Product Title...</h1>
        <div id="productDescription" class="product-description-body">
          Loading detailed product specifications...
        </div>
      </div>

    </div>
  </div>
</div>

<style>
  :root {
    --bg-black: #000000;
    --card-bg: #0b0b10;
    --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    --gold-color: #d4af37;
    --text-white: #ffffff;
    --text-dim: #9d9dae;
    --border-gold: rgba(212, 175, 55, 0.25);
  }

  .product-page-wrapper {
    width: 100%; min-height: 100vh;
    background-color: var(--bg-black);
    color: var(--text-white);
    font-family: 'Poppins', sans-serif;
    padding: 40px 20px; box-sizing: border-box;
  }

  .product-container {
    max-width: 1200px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
  }

  @media(max-width: 900px) {
    .product-container { grid-template-columns: 1fr; }
  }

  /* Media Section */
  .main-image-box {
    width: 100%; height: 480px; background: #050508;
    border-radius: 12px; border: 1px solid var(--border-gold);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .main-image-box img { width: 100%; height: 100%; object-fit: contain; }

  .thumbnail-gallery {
    display: flex; gap: 12px; margin-top: 15px; overflow-x: auto; padding-bottom: 5px;
  }
  .thumb-img {
    width: 70px; height: 70px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border-gold); background: #111; object-fit: cover;
  }
  .thumb-img.active { border-color: var(--gold-color); box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }

  /* Info Section Cards */
  .price-card, .quantity-card, .specifications-card {
    background: var(--card-bg); border: 1px solid var(--border-gold);
    border-radius: 12px; padding: 22px; margin-bottom: 20px;
  }

  .price-header { display: flex; align-items: center; gap: 10px; }
  .price-amount { font-size: 32px; font-weight: 700; color: var(--gold-color); }
  .shipping-badge {
    background: rgba(0, 255, 128, 0.1); color: #00ff80; border: 1px solid rgba(0, 255, 128, 0.3);
    padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-left: auto;
  }

  .stock-status { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: #00ff80; font-weight: 600; }
  .status-indicator { width: 8px; height: 8px; background: #00ff80; border-radius: 50%; box-shadow: 0 0 8px #00ff80; }

  .qty-controls { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .qty-btn {
    width: 38px; height: 38px; background: var(--gold-gradient); border: none; border-radius: 50%;
    color: #000; font-weight: 700; font-size: 18px; cursor: pointer;
  }
  .qty-controls input {
    width: 60px; text-align: center; background: #000; border: 1px solid var(--border-gold);
    color: #fff; padding: 8px; border-radius: 6px; font-size: 16px; font-weight: 600;
  }

  .chat-seller-btn {
    width: 100%; padding: 16px; background: #000000; color: var(--text-white);
    border: 1px solid var(--border-gold); border-radius: 10px; font-weight: 700;
    cursor: pointer; margin-bottom: 20px; letter-spacing: 1px; transition: background 0.3s;
  }
  .chat-seller-btn:hover { background: rgba(212, 175, 55, 0.1); }

  .spec-header { color: var(--gold-color); font-size: 12px; font-weight: 700; margin-bottom: 12px; letter-spacing: 0.5px; }
  .product-title-text { font-size: 20px; font-weight: 700; color: #fff; margin: 0 0 15px 0; line-height: 1.4; }
  .product-description-body { color: var(--text-dim); font-size: 14px; line-height: 1.7; word-break: break-word; }
</style>

<script>
  // Dynamic Product Load Logic
  async function loadProductDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (!productId) return;

    try {
      const res = await fetch(`/api/products/${productId}`);
      const result = await res.json();

      if (result.success && result.data) {
        const p = result.data;

        document.getElementById('productPrice').innerText = parseFloat(p.price).toFixed(2);
        document.getElementById('productTitle').innerText = p.title;
        document.getElementById('productDescription').innerHTML = p.description || 'No additional details provided.';
        document.getElementById('stockCount').innerText = `IN STOCK: ${p.stock || 500} UNITS - READY TO DISPATCH`;

        // Image Handling
        let images = [];
        if (p.images_json) {
          try { images = JSON.parse(p.images_json); } catch(e) { images = [p.image_url]; }
        } else if (p.image_url) {
          images = [p.image_url];
        }

        if (images.length > 0) {
          document.getElementById('mainImage').src = images[0];
          const gallery = document.getElementById('thumbGallery');
          gallery.innerHTML = '';
          images.forEach((img, idx) => {
            gallery.innerHTML += `<img src="${img}" class="thumb-img ${idx === 0 ? 'active' : ''}" onclick="changeMainImage('${img}', this)">`;
          });
        }
      }
    } catch (err) {
      console.error("Error loading product:", err);
    }
  }

  function changeMainImage(src, el) {
    document.getElementById('mainImage').src = src;
    document.querySelectorAll('.thumb-img').forEach(img => img.classList.remove('active'));
    el.classList.add('active');
  }

  function updateQty(val) {
    const input = document.getElementById('itemQty');
    let current = parseInt(input.value) || 1;
    current += val;
    if (current < 1) current = 1;
    input.value = current;
  }

  function openSellerChat() {
    alert("Connecting to verified merchant support...");
  }

  loadProductDetails();
</script>
