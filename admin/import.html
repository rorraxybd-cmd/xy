<!-- Global CJ Importer - Full Screen Soft Dark Design -->
<div class="cj-fullscreen-wrapper">
  <div class="cj-content-container">
    <div class="cj-import-header">
      <h2>Global CJ Product Importer</h2>
      <p>Automated Retail (Free Shipping) & Wholesale Sync Engine</p>
    </div>
    
    <form id="cjImportForm">
      <div class="cj-form-group">
        <label for="cjProductId">CJ Product ID (PID)</label>
        <input type="text" id="cjProductId" placeholder="e.g. 1765243142718795776" required>
      </div>

      <div class="cj-form-group">
        <label for="customMargin">Retail Markup Margin (%) [Default: 70%]</label>
        <input type="number" id="customMargin" value="70" placeholder="70" required>
        <small class="cj-hint">Includes global shipping cushion & 10% affiliate commission buffer. Both retail & wholesale prices will calculate automatically.</small>
      </div>

      <button type="submit" id="importBtn" class="cj-btn-gold">
        <span>Sync & Import to Store</span>
      </button>
    </form>

    <div id="importStatus" class="cj-status-box"></div>
  </div>
</div>

<style>
  :root {
    --bg-pure: #050505;
    --card-soft: #0d0d12;
    --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
    --gold-solid: #d4af37;
    --pink-love: #ff2a85;
    --text-white: #ffffff;
    --text-gray: #9e9eb0;
    --font-main: 'Poppins', sans-serif;
  }

  /* ফুল স্ক্রিন এবং কোনো বর্ডার বা হোয়াইট স্পেস ছাড়া লেআউট */
  .cj-fullscreen-wrapper {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    background-color: var(--bg-pure);
    font-family: var(--font-main);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  .cj-content-container {
    width: 100%;
    max-width: 650px;
    padding: 40px;
    background-color: var(--card-soft);
    box-sizing: border-box;
  }

  .cj-import-header {
    margin-bottom: 30px;
  }

  .cj-import-header h2 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 8px 0;
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.5px;
  }

  .cj-import-header p {
    color: var(--text-gray);
    font-size: 14px;
    margin: 0;
  }

  .cj-form-group {
    margin-bottom: 24px;
  }

  .cj-form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-white);
    margin-bottom: 10px;
  }

  .cj-form-group input {
    width: 100%;
    padding: 15px 16px;
    background: #000000;
    border: none;
    border-radius: 8px;
    color: var(--text-white);
    font-size: 15px;
    outline: none;
    box-sizing: border-box;
    transition: box-shadow 0.3s ease;
  }

  .cj-form-group input:focus {
    box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.4);
  }

  .cj-hint {
    color: var(--text-gray);
    font-size: 12px;
    margin-top: 6px;
    display: block;
    line-height: 1.5;
  }

  .cj-btn-gold {
    width: 100%;
    padding: 16px;
    background: var(--gold-gradient);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
    color: #000000;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .cj-btn-gold:hover {
    opacity: 0.93;
    transform: translateY(-1px);
  }

  .cj-btn-gold:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .cj-status-box {
    margin-top: 24px;
    font-size: 14px;
    line-height: 1.6;
    border-radius: 8px;
    display: none;
  }
</style>

<script>
  document.getElementById('cjImportForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusDiv = document.getElementById('importStatus');
    const btn = document.getElementById('importBtn');
    
    const cjProductId = document.getElementById('cjProductId').value.trim();
    const customMargin = document.getElementById('customMargin').value.trim();

    statusDiv.style.display = 'block';
    statusDiv.style.padding = '15px';
    statusDiv.style.background = 'rgba(212, 175, 55, 0.08)';
    statusDiv.style.color = 'var(--gold-solid)';
    statusDiv.innerHTML = 'Connecting to CJ API & calculating global pricing...';
    btn.disabled = true;

    try {
      const res = await fetch('/api/import-cj', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cjProductId, customMargin })
      });
      
      const result = await res.json();

      if (result.success) {
        statusDiv.style.background = 'rgba(0, 255, 128, 0.08)';
        statusDiv.style.color = '#00ff80';
        statusDiv.innerHTML = `✓ ${result.message}<br><br>
          <strong>Product:</strong> ${result.data.title}<br>
          <strong>Base Cost:</strong> $${result.data.cost}<br>
          <strong>Retail Price:</strong> $${result.data.retailPrice}<br>
          <strong>Wholesale Base:</strong> $${result.data.wholesalePrice}`;
        document.getElementById('cjImportForm').reset();
      } else {
        statusDiv.style.background = 'rgba(255, 42, 133, 0.08)';
        statusDiv.style.color = 'var(--pink-love)';
        statusDiv.innerHTML = `✕ Error: ${result.error}`;
      }
    } catch (err) {
      statusDiv.style.background = 'rgba(255, 42, 133, 0.08)';
      statusDiv.style.color = 'var(--pink-love)';
      statusDiv.innerHTML = `✕ Connection Failed: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  });
</script>
