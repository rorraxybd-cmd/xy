<!-- RORRAXY CJ HUB - Final Master Edition -->
<div class="cj-app-wrapper">

  <!-- 1. CJ SITE POPUP MODAL -->
  <div id="cjPopupModal" class="cj-modal-overlay">
    <div class="cj-modal-container">
      <iframe src="https://cjdropshipping.com" class="cj-modal-iframe"></iframe>
      <!-- Bottom Center Golden Gradient Close Button -->
      <button type="button" class="cj-center-gold-close" onclick="closeCjModal()">✕</button>
    </div>
  </div>

  <!-- 2. LINKS & VIDEO VIEW -->
  <div id="tabVideoLinks" class="cj-tab-view active-tab">
    
    <div class="cj-view-scroll-content">
      <!-- Video Preview and Direct Link Render Area -->
      <div id="cjVideoListContainer">
        <div class="cj-empty-state">
          <span>🎬</span>
          <p>Product video previews & URLs will appear here after fetching.</p>
        </div>
      </div>
    </div>

    <!-- Bottom Fixed Input Bar -->
    <div class="cj-bottom-input-bar">
      <div class="cj-input-group">
        <input type="text" id="cjInputPid" placeholder="Paste CJ Product Link or PID..." onfocus="this.select()">
        <button type="button" onclick="fetchCJMediaData()" class="cj-action-btn">FETCH</button>
      </div>
    </div>

    <!-- Bottom Center Golden Gradient Close Button -->
    <button type="button" class="cj-center-gold-close" onclick="resetView()">✕</button>
  </div>

  <!-- 3. IMPORT PAGE VIEW (/admin/import.html) -->
  <div id="tabImportPage" class="cj-tab-view">
    <iframe src="/admin/import.html" class="cj-full-iframe"></iframe>
    <!-- Bottom Center Golden Gradient Close Button -->
    <button type="button" class="cj-center-gold-close" onclick="switchTab('video')">✕</button>
  </div>

  <!-- 4. BOTTOM NAVIGATION BAR -->
  <nav class="cj-bottom-nav">
    <div class="cj-nav-item" id="nav-cj" onclick="openCjModal()">
      <span class="cj-icon">🛍️</span>
      <span class="cj-text">CJ Site</span>
    </div>
    
    <div class="cj-nav-item active" id="nav-video" onclick="switchTab('video')">
      <span class="cj-icon">🎬</span>
      <span class="cj-text">Links & Video</span>
    </div>
    
    <div class="cj-nav-item" id="nav-import" onclick="switchTab('import')">
      <span class="cj-icon">⚡</span>
      <span class="cj-text">Import</span>
    </div>
  </nav>

</div>

<style>
  :root {
    --bg-dark: #000000;
    --card-bg: #060609;
    --gold-grad: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #aa771c 100%);
    --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg-dark); color: #ffffff;
    font-family: var(--font-family); overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .cj-app-wrapper {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* POPUP MODAL */
  .cj-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.92); z-index: 1000;
    display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .cj-modal-overlay.open { display: flex; }

  .cj-modal-container {
    width: 100%; height: 100%;
    background: var(--bg-dark);
    display: flex; flex-direction: column; position: relative;
  }

  .cj-modal-iframe {
    width: 100%; height: 100%; border: none; background: #ffffff;
  }

  /* TAB VIEWS */
  .cj-tab-view {
    position: absolute; top: 0; left: 0; right: 0; bottom: 55px;
    display: none; width: 100%; height: calc(100% - 55px);
    background: var(--bg-dark); z-index: 10;
  }
  .cj-tab-view.active-tab { display: flex; flex-direction: column; }

  .cj-full-iframe {
    width: 100%; height: 100%; border: none; background: #ffffff;
  }

  /* SCROLLABLE CONTENT */
  .cj-view-scroll-content {
    flex: 1; padding: 14px; overflow-y: auto;
    max-width: 600px; margin: 0 auto; width: 100%;
    padding-bottom: 120px;
  }

  /* BOTTOM CENTER GOLDEN GRADIENT CLOSE BUTTON */
  .cj-center-gold-close {
    position: fixed; bottom: 68px; left: 50%; transform: translateX(-50%);
    z-index: 999; width: 36px; height: 36px; border-radius: 50%;
    background: var(--gold-grad); border: none;
    color: #000000; font-size: 0.85rem; font-weight: 900;
    cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s ease;
  }
  .cj-center-gold-close:active { transform: translateX(-50%) scale(0.92); }

  /* FIXED INPUT BAR */
  .cj-bottom-input-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: #040406; border-top: 1px solid rgba(212, 175, 55, 0.15);
    padding: 10px 14px; z-index: 80;
    display: flex; justify-content: center;
  }
  .cj-bottom-input-bar .cj-input-group {
    width: 100%; max-width: 600px;
  }

  .cj-input-group { display: flex; gap: 6px; }

  .cj-input-group input {
    flex: 1; padding: 10px 12px; background: var(--card-bg);
    border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 8px;
    color: #ffffff; font-size: 0.78rem; outline: none;
  }
  .cj-input-group input:focus {
    border-color: rgba(212, 175, 55, 0.5);
  }

  .cj-action-btn {
    background: var(--gold-grad); border: none; border-radius: 8px;
    color: #000000; font-weight: 800; font-size: 0.7rem; padding: 0 16px;
    cursor: pointer; flex-shrink: 0;
  }

  .cj-single-video-card {
    background: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 10px; padding: 12px; margin-bottom: 14px;
  }

  .cj-label {
    display: block; font-size: 0.62rem; font-weight: 700;
    background: var(--gold-grad); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; margin-bottom: 5px; letter-spacing: 0.5px;
  }

  .cj-video-player {
    width: 100%; max-height: 200px; border-radius: 6px;
    background: #000000; margin-bottom: 8px; object-fit: contain;
  }

  .cj-empty-state {
    text-align: center; padding: 40px 10px; color: #606075; font-size: 0.75rem;
  }
  .cj-empty-state span { font-size: 1.8rem; display: block; margin-bottom: 6px; }

  /* BOTTOM NAV BAR */
  .cj-bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 55px;
    background: #040406; border-top: 1px solid rgba(212, 175, 55, 0.2);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100; max-width: 600px; margin: 0 auto;
  }

  .cj-nav-item {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; cursor: pointer; opacity: 0.45;
    transition: opacity 0.2s; flex: 1; height: 100%;
  }

  .cj-nav-item .cj-icon {
    font-size: 1.1rem; margin-bottom: 2px;
    background: var(--gold-grad); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .cj-nav-item .cj-text { font-size: 0.65rem; font-weight: 700; color: #ffffff; }

  .cj-nav-item.active { opacity: 1; }
  .cj-nav-item.active .cj-text {
    background: var(--gold-grad);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
</style>

<script>
  function openCjModal() {
    document.getElementById('cjPopupModal').classList.add('open');
  }

  function closeCjModal() {
    document.getElementById('cjPopupModal').classList.remove('open');
  }

  function switchTab(tabName) {
    document.querySelectorAll('.cj-tab-view').forEach(el => el.classList.remove('active-tab'));
    document.querySelectorAll('.cj-nav-item').forEach(el => el.classList.remove('active'));

    if (tabName === 'video') {
      document.getElementById('tabVideoLinks').classList.add('active-tab');
      document.getElementById('nav-video').classList.add('active');
    } else if (tabName === 'import') {
      document.getElementById('tabImportPage').classList.add('active-tab');
      document.getElementById('nav-import').classList.add('active');
    }
  }

  function resetView() {
    document.getElementById('cjInputPid').value = '';
    document.getElementById('cjVideoListContainer').innerHTML = `
      <div class="cj-empty-state">
        <span>🎬</span>
        <p>Product video previews & URLs will appear here after fetching.</p>
      </div>
    `;
  }

  async function fetchCJMediaData() {
    let inputVal = document.getElementById('cjInputPid').value.trim();
    let container = document.getElementById('cjVideoListContainer');

    if (!inputVal) {
      alert("Please enter CJ product URL or PID.");
      return;
    }

    let cjProductId = inputVal;
    if (!/^[0-9a-zA-Z]{15,}$/.test(inputVal)) {
      let match = inputVal.match(/pid=([0-9a-zA-Z]{15,})/) || 
                  inputVal.match(/(?:productDetails|detail|product-detail)\/([0-9a-zA-Z]{15,})/) ||
                  inputVal.match(/([0-9a-zA-Z]{15,})/);
      if (match && match[1]) cjProductId = match[1];
    }

    container.innerHTML = '<div class="cj-empty-state"><span>⏳</span>Fetching video & links...</div>';

    try {
      const res = await fetch('/api/import-cj', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cjProductId, previewOnly: true })
      });

      const result = await res.json();

      if (result.success && result.data.videoUrl) {
        container.innerHTML = `
          <div class="cj-single-video-card">
            <span class="cj-label">VIDEO PREVIEW</span>
            <video src="${result.data.videoUrl}" controls class="cj-video-player"></video>
            <span class="cj-label">DIRECT MP4 VIDEO URL</span>
            <div class="cj-input-group">
              <input type="text" id="vidUrlField_0" readonly value="${result.data.videoUrl}">
              <button type="button" onclick="copyValue('vidUrlField_0')" class="cj-action-btn">COPY VIDEO</button>
            </div>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="cj-empty-state">
            <p style="color: #ff2a85;">No direct MP4 video stream found for this product.</p>
          </div>
        `;
      }
    } catch (err) {
      container.innerHTML = `<div class="cj-empty-state" style="color: #ff2a85;">Error: ${err.message}</div>`;
    }
  }

  function copyValue(elementId) {
    let input = document.getElementById(elementId);
    if (!input || !input.value) {
      alert("No data available to copy.");
      return;
    }
    navigator.clipboard.writeText(input.value);
    alert("Copied to clipboard!");
  }
</script>
