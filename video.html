<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>rorraxy - Retail & Reels Feed</title>
    
    <!-- সেন্ট্রাল স্ক্রিপ্ট ট্যাগ -->
    <script src="/ecosystem-core.js"></script>
    <link rel="manifest" href="/manifest.json">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script src="/popup.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev">
    <link rel="preconnect" href="https://vid.rorraxy.com">

    <link rel="icon" type="image/png" sizes="32x32" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">
    <link rel="apple-touch-icon" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #08080c;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --pink-accent: #ff2a85;
            --text-white: #ffffff;
            --text-gray: #a0a0ab;
            --font-main: 'Poppins', sans-serif;
        }

        html, body { 
            width: 100%; max-width: 100vw; overflow-x: hidden; 
            background: var(--bg-retail) !important; 
            color: var(--text-white); font-family: var(--font-main); 
            min-height: 100vh; font-size: 14px;
            -webkit-font-smoothing: antialiased;
            -webkit-overflow-scrolling: touch;
        }

        body { margin: 0; padding: 0 0 75px 0; text-transform: uppercase !important; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Top Floating Search Bar */
        .top-floating-search-bar {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; z-index: 1800; display: none;
            align-items: center; background: #090a0f; border: 1.5px solid #6b5523;
            border-radius: 40px; padding: 4px 6px 4px 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        .floating-search-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #ffffff; font-size: 0.85rem; font-family: var(--font-main); letter-spacing: 0.5px;
        }
        .floating-search-input::placeholder { color: #7a7a85; }
        .floating-search-btn-circle {
            width: 36px; height: 36px; border-radius: 50%; background: var(--gold-gradient);
            border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #000; font-size: 0.9rem;
        }

        /* Bottom Navigation Bar (নিচের ৫টি নির্দিষ্ট মেনু) */
        .bottom-nav-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 68px;
            background: rgba(3, 3, 5, 0.98); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(212, 175, 55, 0.25);
            display: flex; justify-content: space-around; align-items: center; z-index: 4000; padding: 0 4px;
        }
        .bottom-nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; cursor: pointer; color: #a0a0ab; font-size: 0.52rem; font-weight: 600; gap: 3px;
            width: 100%; height: 100%; text-align: center; position: relative; transition: transform 0.2s ease;
        }
        .bottom-nav-item:hover { transform: translateY(-2px); }
        .bottom-nav-item i { 
            font-size: 1.25rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
        }
        .bottom-nav-item span { 
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 65px; 
        }
        .bottom-nav-badge {
            position: absolute; top: 4px; right: 28%; background: var(--pink-accent); color: #fff;
            font-size: 0.52rem; font-weight: 800; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; box-shadow: 0 0 6px var(--pink-accent);
        }

        /* Pinterest Style Home Grid (কালো ব্যাকগ্রাউন্ড রিমুভড, ছবি বড়) */
        .pinterest-feed-container {
            padding: 8px 6px; column-count: 2; column-gap: 8px; width: 100%; max-width: 1200px; margin: 0 auto;
        }
        @media (min-width: 768px) { .pinterest-feed-container { column-count: 4; column-gap: 12px; padding: 12px; } }

        .product-card {
            background: transparent; border-radius: 14px; overflow: hidden; 
            display: inline-block; width: 100%; border: none; 
            position: relative; cursor: pointer; margin-bottom: 8px; break-inside: avoid;
            transition: transform 0.2s ease;
        }
        .product-card:hover { transform: translateY(-2px); }

        .product-media-box { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #050508; border-radius: 12px; overflow: hidden; }
        .product-media-box img { width: 100%; height: 100%; display: block; object-fit: cover; }

        .corner-discount-badge {
            position: absolute; top: 6px; left: 6px; z-index: 45;
            background: var(--pink-accent); color: #fff; font-size: 0.62rem; font-weight: 800;
            padding: 3px 7px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        /* ছবির ওপর স্বচ্ছ প্রাইস ট্যাগ (কোনো কালো বক্স নেই)[cite: 14] */
        .card-transparent-price-overlay {
            position: absolute; bottom: 8px; right: 8px; z-index: 45;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.4);
        }
        .card-transparent-price-text { 
            font-size: 0.85rem; font-weight: 800;
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Full Reels View */
        .reel-view-wrapper-outer { width: 100%; height: calc(100vh - 68px); height: calc(100dvh - 68px); position: relative; background: #000; overflow: hidden; }
        .reel-card { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; background: #000; }
        .reel-media-box { position: relative; width: 100%; height: 100%; cursor: pointer; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .reel-media-box video { width: 100%; height: 100%; display: block; object-fit: cover; background: #000; }
        .reel-media-box img { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

        /* ডানপাশের ভাসমান অ্যাকশন বার (স্ট্যান্ডার্ড সাইজ ও নিখুঁত পজিশন)[cite: 15] */
        .right-vertical-actions {
            position: fixed; right: 12px; bottom: 85px; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 16px;
            pointer-events: auto;
        }
        .side-action-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; gap: 2px; position: relative; }
        .action-pure-icon { 
            font-size: 1.6rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
            filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.9));
        }
        .side-count-text { font-size: 0.65rem; font-weight: 700; color: #ffffff; letter-spacing: 0.3px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
        .love-action-btn.liked-active .action-pure-icon { color: var(--pink-accent) !important; background: none !important; -webkit-background-clip: initial !important; -webkit-text-fill-color: initial !important; }
        .save-action-btn.active .action-pure-icon { color: var(--pink-accent) !important; background: none !important; -webkit-background-clip: initial !important; -webkit-text-fill-color: initial !important; }

        /* Overlays & Modals */
        .overlay-sheet {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 3000; overflow-y: auto; flex-direction: column; align-items: center; justify-content: center;
        }

        /* বাই প্রিভিউ মডাল পপআপ - ডানে-বামে হরিজন্টাল স্ক্রল সিস্টেম */
        .buy-preview-modal {
            width: 90%; max-width: 380px; background: #0c0c14; border: 1.5px solid var(--gold-solid);
            border-radius: 16px; padding: 16px; margin: auto; display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .preview-horizontal-scroll {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory;
        }
        .preview-horizontal-scroll::-webkit-scrollbar { height: 4px; }
        .preview-horizontal-scroll::-webkit-scrollbar-thumb { background: var(--gold-solid); border-radius: 4px; }

        .preview-img-item {
            flex: 0 0 75px; width: 75px; height: 75px; border-radius: 8px; overflow: hidden;
            border: 1.5px solid transparent; cursor: pointer; scroll-snap-align: start; background: #000;
        }
        .preview-img-item.selected { border-color: var(--pink-accent); }
        .preview-img-item img { width: 100%; height: 100%; object-fit: cover; }

        /* ফ্লায়িং গোল্ডেন কয়েন অ্যানিমেশন */
        .flying-gold-coin {
            position: fixed; z-index: 9999999; width: 32px; height: 32px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fcf6ba 25%, #bf953f 65%, #8a5d0f 100%);
            border: 2px solid #fff; pointer-events: none; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #4d3300;
            box-shadow: 0 0 15px rgba(212,175,55,0.8);
            transition: left 0.75s cubic-bezier(0.25, 0.1, 0.25, 1), top 0.75s cubic-bezier(0.5, 0, 0.75, 0.4), transform 0.75s linear, opacity 0.75s ease-in;
        }

        /* ক্যাটাগরি ও সেভ গ্যালারি ওভারলে মেনু */
        .category-transparent-overlay, .saved-gallery-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: rgba(0, 0, 0, 0.88) !important; backdrop-filter: blur(12px) !important; -webkit-backdrop-filter: blur(12px) !important;
            z-index: 3500; overflow-y: auto; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px 15px 85px 15px;
        }
        .seller-fullscreen-container { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; position: relative; margin: auto; }
        .category-fullscreen-view { padding: 0; max-width: 100%; display: flex; flex-direction: column; gap: 8px; width: 100%; }

        .accordion-category-box { background: rgba(5, 5, 8, 0.95) !important; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border-radius: 12px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.35) !important; margin-bottom: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); width: 100%; }
        .accordion-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; background: transparent !important; }
        .accordion-header:hover { background: rgba(212, 175, 55, 0.15) !important; }
        .accordion-title-wrap { display: flex; align-items: center; gap: 10px; }
        .cat-main-icon { font-size: 1.1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; width: 22px; text-align: center; }
        .accordion-main-title { font-size: 0.88rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .accordion-arrow { font-size: 0.85rem; color: var(--gold-solid); transition: transform 0.2s ease; flex-shrink: 0; }
        .accordion-category-box.active .accordion-arrow { transform: rotate(180deg); }

        .accordion-content { display: none; background: transparent !important; padding: 6px 10px 12px 10px; }
        .accordion-category-box.active .accordion-content { display: block; }

        .sub-categories-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .sub-cat-item {
            background: rgba(12, 12, 18, 0.92); border-radius: 8px; padding: 10px;
            display: flex; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.1s ease, background 0.1s ease; border: 1px solid rgba(255,255,255,0.12);
        }
        .sub-cat-item:active { transform: scale(0.96); }
        .sub-cat-item:hover { background: rgba(22, 22, 32, 1); border-color: rgba(212, 175, 55, 0.6); }
        .sub-cat-item i { font-size: 1rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
        .sub-cat-name { font-size: 0.65rem; color: var(--text-white); font-weight: 600; }

        .saved-thumb-card { background: var(--card-retail); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; border: 1px solid rgba(212,175,55,0.2); }
        .saved-thumb-preview { width: 100%; height: 110px; background: #000; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .fs-videos-grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .fs-profile-header-box { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; gap: 5px; }
        .fs-profile-name { font-size: 0.95rem; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body id="mainBody">

    <!-- Top Floating Search Bar -->
    <div id="floatingSearchContainer" class="top-floating-search-bar">
        <input type="text" id="floatingSearchInput" class="floating-search-input" placeholder="SEARCH PRODUCT...">
        <button id="floatingSearchBtn" class="floating-search-btn-circle"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <!-- Bottom Navigation Bar (৫টি নির্দিষ্ট ফুটার মেনু) -->
    <nav class="bottom-nav-bar">
        <div id="bottomWorldBtn" class="bottom-nav-item"><i class="fa-solid fa-globe"></i><span>WORLD</span></div>
        <div id="bottomCategoryBtn" class="bottom-nav-item"><i class="fa-solid fa-list-check"></i><span>CATEGORY</span></div>
        <div id="bottomBuyBtn" class="bottom-nav-item"><i class="fa-solid fa-cart-shopping"></i><span>ORDER NOW</span></div>
        <div id="bottomDetailsBtn" class="bottom-nav-item"><i class="fa-solid fa-circle-info"></i><span>DETAILS</span></div>
        <a href="/" class="bottom-nav-item" style="text-decoration:none;"><i class="fa-solid fa-house"></i><span>HOME</span></a>
    </nav>

    <!-- Saved Gallery Overlay -->
    <div id="savedGalleryOverlay" class="saved-gallery-overlay" onclick="if(event.target===this) this.style.display='none'">
        <div class="seller-fullscreen-container" id="savedGalleryBody"></div>
    </div>

    <!-- Buy Variant Preview Modal (হরিজন্টাল স্ক্রল সহ) -->
    <div id="buyPreviewOverlay" class="overlay-sheet" onclick="if(event.target===this) closeBuyPreview()">
        <div class="buy-preview-modal" id="buyPreviewModalContent"></div>
    </div>

    <!-- Category Transparent Overlay Menu -->
    <div id="categoryTransparentOverlay" class="category-transparent-overlay" onclick="if(event.target===this) this.style.display='none'">
        <div class="seller-fullscreen-container">
            <div class="category-fullscreen-view" id="categoryMainListView"></div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main id="appContainer" class="pinterest-feed-container">
        <div style="text-align: center; padding: 50px 0; color: var(--gold-solid);">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            <p style="margin-top: 10px; font-size: 0.75rem;">LOADING RORRAXY PRODUCTS...</p>
        </div>
    </main>

    <script>
        const LOCAL_STORAGE_CACHE_KEY = 'rorraxy_retail_feed_cache';
        let globalMasterProductsList = [];
        let activeProductList = [];
        let isPinterestHomeMode = true; 
        let currentReelIndex = 0;
        let slideInterval = null;
        let selectedVariantImg = '';
        let lastSaveClickTime = 0;

        window.addEventListener('DOMContentLoaded', () => {
            buildCategoriesUI();
            loadLiveProducts();
            updateCartBadgeCount();

            const bottomWorldBtn = document.getElementById('bottomWorldBtn');
            const bottomCategoryBtn = document.getElementById('bottomCategoryBtn');
            const bottomBuyBtn = document.getElementById('bottomBuyBtn');
            const bottomDetailsBtn = document.getElementById('bottomDetailsBtn');
            
            const categoryTransparentOverlay = document.getElementById('categoryTransparentOverlay');
            const floatingSearchContainer = document.getElementById('floatingSearchContainer');
            const searchInput = document.getElementById('floatingSearchInput');
            const searchBtn = document.getElementById('floatingSearchBtn');

            if(bottomWorldBtn) {
                bottomWorldBtn.addEventListener('click', () => {
                    window.location.href = 'https://rorraxy.com/world.html';
                });
            }

            if(bottomCategoryBtn && categoryTransparentOverlay) {
                bottomCategoryBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = categoryTransparentOverlay.style.display === 'flex';
                    categoryTransparentOverlay.style.display = isVisible ? 'none' : 'flex';
                });
            }

            if(bottomBuyBtn) {
                bottomBuyBtn.addEventListener('click', (e) => {
                    let list = activeProductList.length > 0 ? activeProductList : globalMasterProductsList;
                    if(list.length > 0) {
                        let targetProd = list[isPinterestHomeMode ? 0 : currentReelIndex];
                        openBuyPreviewModal(targetProd, e);
                    }
                });
            }

            if(bottomDetailsBtn) {
                bottomDetailsBtn.addEventListener('click', () => {
                    let list = activeProductList.length > 0 ? activeProductList : globalMasterProductsList;
                    if(list.length > 0) {
                        let targetProd = list[isPinterestHomeMode ? 0 : currentReelIndex];
                        let pId = targetProd.id || targetProd.product_id || '101';
                        window.location.href = `pd.html?id=${pId}`;
                    }
                });
            }

            if(searchBtn && searchInput) {
                searchBtn.addEventListener('click', () => { executeHeaderSearch(searchInput.value); });
                searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') executeHeaderSearch(searchInput.value); });
                searchInput.addEventListener('input', (e) => { executeHeaderSearch(e.target.value); });
            }

            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, {passive: true});
            window.addEventListener('touchend', (e) => {
                if(!isPinterestHomeMode) {
                    let diff = touchStartY - e.changedTouches[0].clientY;
                    if (Math.abs(diff) > 40) diff > 0 ? scrollReels(1) : scrollReels(-1);
                }
            }, {passive: true});
        });

        function buildCategoriesUI() {
            const listContainer = document.getElementById('categoryMainListView');
            if(!listContainer || typeof rorraxyCategoriesData === 'undefined') return;

            let html = '';
            rorraxyCategoriesData.forEach(cat => {
                let subHtml = '';
                cat.subCategories.forEach(sub => {
                    subHtml += `
                        <div class="sub-cat-item" onclick="filterProductsByCategory('${sub.key}')">
                            <i class="${sub.icon}"></i>
                            <span class="sub-cat-name">${sub.name}</span>
                        </div>
                    `;
                });

                html += `
                    <div class="accordion-category-box" id="${cat.id}">
                        <div class="accordion-header" onclick="toggleAccordion('${cat.id}')">
                            <div class="accordion-title-wrap">
                                <i class="${cat.icon} cat-main-icon"></i>
                                <span class="accordion-main-title">${cat.title}</span>
                            </div>
                            <i class="fa-solid fa-chevron-down accordion-arrow"></i>
                        </div>
                        <div class="accordion-content">
                            <div class="sub-categories-grid">${subHtml}</div>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        async function loadLiveProducts() {
            const cachedData = localStorage.getItem(LOCAL_STORAGE_CACHE_KEY);
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        globalMasterProductsList = parsed;
                        activeProductList = parsed;
                        if(isPinterestHomeMode) renderPinterestHomeGrid(parsed);
                    }
                } catch (e) {}
            }

            try {
                const response = await fetch(`/api/products`);
                const result = await response.json();
                let productsList = [];
                if (result && result.success && Array.isArray(result.data)) productsList = result.data;
                else if (Array.isArray(result)) productsList = result;

                if (productsList.length > 0) {
                    globalMasterProductsList = productsList;
                    localStorage.setItem(LOCAL_STORAGE_CACHE_KEY, JSON.stringify(productsList));
                    activeProductList = productsList;
                    if(isPinterestHomeMode) renderPinterestHomeGrid(productsList);
                }
            } catch (error) {}
        }

        function executeHeaderSearch(keyword) {
            let query = keyword.toLowerCase().trim();
            if (!query) {
                activeProductList = globalMasterProductsList;
                if(isPinterestHomeMode) renderPinterestHomeGrid(globalMasterProductsList);
                return;
            }
            let filtered = globalMasterProductsList.filter(item => {
                const title = (item.title || '').toLowerCase();
                const cat = (item.category || item.description || '').toLowerCase();
                return title.includes(query) || cat.includes(query);
            });
            activeProductList = filtered;
            if(isPinterestHomeMode) renderPinterestHomeGrid(filtered);
            document.getElementById('floatingSearchContainer').style.display = 'none';
        }

        function filterProductsByCategory(queryKey) {
            document.getElementById('categoryTransparentOverlay').style.display = 'none';
            let query = queryKey.toLowerCase().replace(/-/g, ' ');
            let filtered = globalMasterProductsList.filter(item => {
                const title = (item.title || '').toLowerCase();
                const cat = (item.category || item.description || '').toLowerCase();
                return title.includes(query) || cat.includes(query);
            });
            activeProductList = filtered.length > 0 ? filtered : globalMasterProductsList;
            isPinterestHomeMode = true;
            renderPinterestHomeGrid(activeProductList);
        }

        function toggleAccordion(boxId) {
            const targetBox = document.getElementById(boxId);
            const content = targetBox.querySelector('.accordion-content');
            const isOpen = targetBox.classList.contains('active');

            document.querySelectorAll('.accordion-category-box').forEach(box => {
                box.classList.remove('active');
                let c = box.querySelector('.accordion-content');
                if(c) c.style.display = 'none';
            });

            if (!isOpen) {
                targetBox.classList.add('active');
                if(content) content.style.display = 'block';
            } else {
                if(content) content.style.display = 'none';
            }
        }

        function renderPinterestHomeGrid(products) {
            const container = document.getElementById('appContainer');
            container.className = 'pinterest-feed-container';
            const fragment = document.createDocumentFragment();

            products.forEach((item, index) => {
                const title = item.title || 'rorraxy Luxury Item';
                let resolvedImageUrl = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
                try {
                    if (item.images_json) {
                        let parsed = typeof item.images_json === 'string' ? JSON.parse(item.images_json) : item.images_json;
                        if (Array.isArray(parsed) && parsed.length > 0) resolvedImageUrl = parsed[0];
                    } else if (item.image_url) resolvedImageUrl = item.image_url;
                } catch(e) {}

                let price = item.price ? `$${parseFloat(item.price).toFixed(2)}` : '$0.00';
                let discountPercent = parseFloat(item.discount_rate || item.discountRate || 0);
                let discountBadge = discountPercent > 0 ? `<div class="corner-discount-badge">${discountPercent}% OFF</div>` : '';

                const cardDiv = document.createElement('div');
                cardDiv.className = 'product-card';
                cardDiv.onclick = () => switchToReelsView(index);

                cardDiv.innerHTML = `
                    <div class="product-media-box">
                        ${discountBadge}
                        <img src="${resolvedImageUrl}" alt="${title}" loading="lazy">
                        <div class="card-transparent-price-overlay">
                            <span class="card-transparent-price-text">${price}</span>
                        </div>
                    </div>
                `;
                fragment.appendChild(cardDiv);
            });

            container.innerHTML = '';
            container.appendChild(fragment);
            renderFixedGlobalActions(container, null);
        }

        function renderFixedGlobalActions(container, pId) {
            let existingBar = document.getElementById('fixedGlobalActionsBar');
            if(existingBar) existingBar.remove();

            let targetId = pId || (activeProductList.length > 0 ? (activeProductList[0].id || activeProductList[0].product_id || '101') : '101');
            let pShares = getDynamicEngagement(targetId, 180, 'shares');
            let pLikes = getDynamicEngagement(targetId, 5200, 'likes');

            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let isSaved = savedObjects.some(item => String(item.id || item.product_id) === String(targetId));
            let savedActiveClass = isSaved ? 'active' : '';

            let actionsHtml = `
                <div id="fixedGlobalActionsBar" class="right-vertical-actions">
                    <div class="side-action-item" onclick="window.location.href='/cart.html'" title="Cart">
                        <i class="fa-solid fa-cart-shopping action-pure-icon"></i>
                        <span class="side-count-text" id="sideCartBadgeCount">0</span>
                    </div>

                    <div class="side-action-item" onclick="openNativeShare(event, '${targetId}')" title="Share">
                        <i class="fa-solid fa-reply action-pure-icon" style="transform:scaleX(-1);"></i>
                        <span class="side-count-text">${pShares}</span>
                    </div>
                    <div class="side-action-item love-action-btn" onclick="toggleReelLove(event, this, '${targetId}')" title="Like">
                        <i class="fa-solid fa-heart action-pure-icon"></i>
                        <span class="side-count-text love-count">${isPinterestHomeMode ? '' : pLikes}</span>
                    </div>
                    <div class="side-action-item" onclick="const s = document.getElementById('floatingSearchContainer'); s.style.display = s.style.display==='flex'?'none':'flex';" title="Search">
                        <i class="fa-solid fa-magnifying-glass action-pure-icon"></i>
                    </div>
                    <div class="side-action-item save-action-btn ${savedActiveClass}" onclick="handleDualSaveAction(event, this, '${targetId}')" title="Save">
                        <i class="fa-solid fa-bookmark action-pure-icon"></i>
                    </div>

                    <div class="side-action-item" onclick="window.location.href='/account.html'" title="You">
                        <i class="fa-solid fa-user action-pure-icon"></i>
                        <span class="side-count-text">YOU</span>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', actionsHtml);
            updateCartBadgeCount();
        }

        function switchToReelsView(index) {
            isPinterestHomeMode = false;
            currentReelIndex = index;
            renderSingleReelView();
        }

        function scrollReels(direction) {
            let list = activeProductList.length > 0 ? activeProductList : globalMasterProductsList;
            if (direction === 1 && currentReelIndex < list.length - 1) { currentReelIndex++; renderSingleReelView(); }
            else if (direction === -1 && currentReelIndex > 0) { currentReelIndex--; renderSingleReelView(); }
        }

        function renderSingleReelView() {
            if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }
            const container = document.getElementById('appContainer');
            container.className = 'reel-view-wrapper-outer';

            let list = activeProductList.length > 0 ? activeProductList : globalMasterProductsList;
            if(currentReelIndex >= list.length) currentReelIndex = 0;
            let product = list[currentReelIndex];
            if(!product) return;

            let pId = String(product.id || product.product_id || '101');
            let pVideo = product.video_url || product.youtube_video || '';
            let mediaElem = '';
            let extractedImages = [];

            try {
                if(product.images_json) {
                    let parsed = typeof product.images_json === 'string' ? JSON.parse(product.images_json) : product.images_json;
                    if(Array.isArray(parsed)) extractedImages = parsed;
                } else if(product.image_url) extractedImages = [product.image_url];
            } catch(e){}

            if (pVideo !== '' && (pVideo.includes('.mp4') || pVideo.includes('.r2.dev') || pVideo.includes('http'))) {
                mediaElem = `<video src="${pVideo}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>`;
            } else {
                if(extractedImages.length === 0) extractedImages = ['https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png'];
                mediaElem = `<img id="reelSlideImg" src="${extractedImages[0]}" style="width:100%; height:100%; object-fit:contain; background:#000;">`;
                
                if (extractedImages.length > 1) {
                    let imgIdx = 0;
                    slideInterval = setInterval(() => {
                        imgIdx = (imgIdx + 1) % extractedImages.length;
                        const imgElem = document.getElementById('reelSlideImg');
                        if (imgElem) imgElem.src = extractedImages[imgIdx];
                    }, 1500);
                }
            }

            let price = product.price ? `$${parseFloat(product.price).toFixed(2)}` : '$0.00';
            let discountPercent = parseFloat(product.discount_rate || product.discountRate || 0);

            container.innerHTML = `
                <div class="reel-card" data-product-id="${pId}">
                    <div class="reel-media-box" onclick="window.location.href='pd.html?id=${pId}'">
                        ${discountPercent > 0 ? `<div class="corner-discount-badge">${discountPercent}% OFF</div>` : ''}
                        ${mediaElem}
                    </div>
                </div>
            `;
            renderFixedGlobalActions(container, pId);
        }

        /* --- বাই প্রিভিউ ভ্যারিয়েন্ট পপআপ (ডানে-বামে হরিজন্টাল স্ক্রল সহ) --- */
        function openBuyPreviewModal(product, event) {
            const overlay = document.getElementById('buyPreviewOverlay');
            const content = document.getElementById('buyPreviewModalContent');

            let images = [];
            try {
                if(product.images_json) {
                    let parsed = typeof product.images_json === 'string' ? JSON.parse(product.images_json) : product.images_json;
                    if(Array.isArray(parsed)) images = parsed;
                } else if(product.image_url) images = [product.image_url];
            } catch(e){}

            if(images.length === 0) images = ['https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png'];
            selectedVariantImg = images[0];

            let imgsHtml = images.map((img, i) => `
                <div class="preview-img-item ${i===0?'selected':''}" onclick="selectPreviewImg(this, '${img}')">
                    <img src="${img}">
                </div>
            `).join('');

            content.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:0.75rem; font-weight:700; color:var(--gold-solid);">SELECT VARIANT / COLOR</span>
                    <button onclick="closeBuyPreview()" style="background:none; border:none; color:#fff; font-size:1.1rem; cursor:pointer;">&times;</button>
                </div>
                <div class="preview-horizontal-scroll">${imgsHtml}</div>
                <button onclick="confirmAddToCart(event, '${product.id||product.product_id||'101'}', '${product.title||'Item'}', ${product.price||35})" style="background:var(--pink-accent); border:none; color:#fff; padding:12px; border-radius:10px; font-weight:800; font-size:0.8rem; cursor:pointer; width:100%;">
                    ORDER NOW (CONFIRM)
                </button>
            `;
            overlay.style.display = 'flex';
        }

        function selectPreviewImg(el, imgUrl) {
            document.querySelectorAll('.preview-img-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedVariantImg = imgUrl;
        }

        function closeBuyPreview() {
            document.getElementById('buyPreviewOverlay').style.display = 'none';
        }

        function playCoinDropChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                const freqs = [1567.98, 2093.00, 2637.02, 3135.96, 4186.01]; 
                freqs.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + (idx * 0.035));
                    gain.gain.setValueAtTime(0, now + (idx * 0.035));
                    gain.gain.linearRampToValueAtTime(0.12 / (idx + 1), now + (idx * 0.035) + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.00001, now + (idx * 0.035) + 1.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + (idx * 0.035));
                    osc.stop(now + (idx * 0.035) + 1.1);
                });
            } catch (e) {}
        }

        function triggerCoinDropAnimation(e) {
            const cartBtn = document.getElementById('footerCartMenuBtn') || document.querySelector('.bottom-nav-item');
            const cartBadge = document.getElementById('sideCartBadgeCount');
            if (!cartBtn) return;

            const cartRect = cartBtn.getBoundingClientRect();
            const targetX = cartRect.left + (cartRect.width / 2) - 16;
            const targetY = cartRect.top + (cartRect.height / 2) - 16;

            let startX = e ? e.clientX : window.innerWidth / 2;
            let startY = e ? e.clientY : window.innerHeight / 2;

            const coin = document.createElement('div');
            coin.className = 'flying-gold-coin';
            coin.innerHTML = '<i class="fa-solid fa-coins"></i>';
            coin.style.left = `${startX - 16}px`;
            coin.style.top = `${startY - 16}px`;
            document.body.appendChild(coin);

            requestAnimationFrame(() => {
                coin.style.left = `${targetX}px`;
                coin.style.top = `${targetY}px`;
                coin.style.transform = 'scale(0.35) rotate(720deg)';
                coin.style.opacity = '0';
            });

            setTimeout(() => {
                if(coin.parentNode) coin.parentNode.removeChild(coin);
                playCoinDropChime();
            }, 750);
        }

        function confirmAddToCart(e, pId, title, price) {
            let cartKey = 'rorraxy_cart';
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            let existing = cart.find(i => String(i.productId) === String(pId) && i.img === selectedVariantImg);

            if(existing) {
                existing.qty += 1;
            } else {
                cart.push({
                    productId: pId,
                    title: title,
                    price: `$${parseFloat(price).toFixed(2)}`,
                    qty: 1,
                    img: selectedVariantImg
                });
            }
            localStorage.setItem(cartKey, JSON.stringify(cart));
            updateCartBadgeCount();
            triggerCoinDropAnimation(e);
            closeBuyPreview();
        }

        function updateCartBadgeCount() {
            let cart = JSON.parse(localStorage.getItem('rorraxy_cart')) || [];
            let totalQty = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
            let badge = document.getElementById('sideCartBadgeCount');
            if(badge) badge.innerText = totalQty;
        }

        function getDynamicEngagement(productId, baseVal, type) {
            let storageKey = `rorraxy_retail_${type}_${productId}`;
            let storedData = localStorage.getItem(storageKey);
            let currentVal = baseVal;
            if (storedData) {
                currentVal = JSON.parse(storedData).value;
            } else {
                currentVal = baseVal + Math.floor(Math.random() * 50);
                localStorage.setItem(storageKey, JSON.stringify({ value: currentVal }));
            }
            return currentVal >= 1000 ? (currentVal / 1000).toFixed(1) + 'K' : currentVal.toString();
        }

        window.toggleReelLove = function(e, btn, productId) {
            e.stopPropagation();
            let countElem = btn.querySelector('.love-count');
            let storageKey = `rorraxy_retail_likes_${productId}`;
            let storedData = localStorage.getItem(storageKey);
            let currentVal = storedData ? JSON.parse(storedData).value : 5200;

            if(btn.classList.contains('liked-active')) {
                btn.classList.remove('liked-active');
                currentVal = Math.max(0, currentVal - 1);
            } else {
                btn.classList.add('liked-active');
                currentVal += 1;
            }
            localStorage.setItem(storageKey, JSON.stringify({ value: currentVal }));
            if(countElem && !isPinterestHomeMode) {
                countElem.innerText = currentVal >= 1000 ? (currentVal / 1000).toFixed(1) + 'K' : currentVal.toString();
            }
        };

        window.handleDualSaveAction = function(e, btn, pId) {
            e.stopPropagation();
            let currentTime = new Date().getTime();
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let existingIndex = savedObjects.findIndex(item => String(item.id || item.product_id) === String(pId));
            
            if (currentTime - lastSaveClickTime < 400 || btn.classList.contains('active') || existingIndex > -1) {
                renderSavedGalleryContent();
                const overlay = document.getElementById('savedGalleryOverlay');
                if(overlay) overlay.style.display = 'flex';
                lastSaveClickTime = 0;
            } else {
                lastSaveClickTime = currentTime;
                let targetProduct = globalMasterProductsList.find(item => String(item.id || item.product_id) === String(pId));
                if(targetProduct && existingIndex === -1) {
                    savedObjects.push(targetProduct);
                    btn.classList.add('active');
                    localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(savedObjects));
                } else if(existingIndex > -1) {
                    btn.classList.add('active');
                }
            }
        };

        function renderSavedGalleryContent() {
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let containerBody = document.getElementById('savedGalleryBody');
            if(!containerBody) return;

            if (savedObjects.length === 0) {
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div>
                    <div style="text-align:center; color:#a0a0ab; padding:40px; font-size:0.85rem;">NO SAVED VIDEOS FOUND</div>`;
            } else {
                let thumbsHtml = '';
                savedObjects.forEach(v => {
                    let thumbImg = 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png';
                    try {
                        if(v.images_json) {
                            let parsed = typeof v.images_json === 'string' ? JSON.parse(v.images_json) : v.images_json;
                            if(Array.isArray(parsed) && parsed.length > 0) thumbImg = parsed[0];
                        } else if(v.image_url) thumbImg = v.image_url;
                    } catch(e){}

                    let vId = v.id || v.product_id;
                    thumbsHtml += `
                        <div class="saved-thumb-card" onclick="selectSavedVideo('${vId}')">
                            <div class="saved-thumb-preview">
                                <img src="${thumbImg}" style="width:100%; height:100%; object-fit:cover;">
                                <i class="fa-solid fa-play" style="position:absolute; color:#fcf6ba; font-size:1.2rem;"></i>
                            </div>
                            <span style="font-size:0.68rem; font-weight:700; color:#fff;">ID: ${vId}</span>
                        </div>`;
                });
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div>
                    <div class="fs-videos-grid">${thumbsHtml}</div>`;
            }
        }

        window.selectSavedVideo = function(videoId) {
            let foundIdx = globalMasterProductsList.findIndex(p => String(p.id || p.product_id) === String(videoId));
            if(foundIdx !== -1) {
                isPinterestHomeMode = false;
                activeProductList = globalMasterProductsList;
                currentReelIndex = foundIdx;
                renderSingleReelView();
            }
            document.getElementById('savedGalleryOverlay').style.display = 'none';
        };

        window.openNativeShare = async function(e, pId) {
            e.stopPropagation();
            const shareUrl = `${window.location.origin}/pd.html?id=${encodeURIComponent(pId)}`;
            if (navigator.share) {
                try { await navigator.share({ title: pId, url: shareUrl }); } catch (err) {}
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(shareUrl);
                alert('Link copied to clipboard!');
            }
        };
    </script>
</body>
