<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>rorraxy - Retail & Vendor Reels Feed</title>
    
    <!-- Central Script Tag -->
    <script src="/ecosystem-core.js"></script>
    <link rel="manifest" href="/manifest.json">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script src="/popup.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev">
    <link rel="preconnect" href="https://vid.rorraxy.com">

    <link rel="icon" type="image/png" sizes="32x32" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">
    <link rel="apple-touch-icon" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS Link -->
    <link rel="stylesheet" href="style.css">
    <!-- External Categories Data -->
    <script src="categories.js"></script>

    <script>
        let globalVideoList = [];
        let activeReelsList = []; 
        let currentIndex = 0;
        let slideInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            buildCategoriesUI();
            loadLiveVideosFromBackend();

            const bottomHomeBtn = document.getElementById('bottomHomeBtn');
            const bottomCategoryBtn = document.getElementById('bottomCategoryBtn');
            const bottomBuyInfoBtn = document.getElementById('bottomBuyInfoBtn');
            const bottomSearchBtn = document.getElementById('bottomSearchBtn');
            const bottomSavedBtn = document.getElementById('bottomSavedBtn');
            
            const floatingSearchContainer = document.getElementById('floatingSearchContainer');
            const searchInput = document.getElementById('floatingSearchInput');
            const searchBtn = document.getElementById('floatingSearchBtn');
            const savedGalleryOverlay = document.getElementById('savedGalleryOverlay');
            const categoryTransparentOverlay = document.getElementById('categoryTransparentOverlay');

            if(bottomHomeBtn) {
                bottomHomeBtn.addEventListener('click', () => { 
                    window.location.href = 'https://rorraxy.com';
                });
            }

            if(bottomCategoryBtn && categoryTransparentOverlay) {
                bottomCategoryBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = categoryTransparentOverlay.style.display === 'flex';
                    if (isVisible) {
                        categoryTransparentOverlay.style.display = 'none';
                    } else {
                        if(savedGalleryOverlay) savedGalleryOverlay.style.display = 'none';
                        if(floatingSearchContainer) floatingSearchContainer.style.display = 'none';
                        categoryTransparentOverlay.style.display = 'flex';
                    }
                });
            }

            if(bottomBuyInfoBtn) {
                bottomBuyInfoBtn.addEventListener('click', () => {
                    let activeList = activeReelsList.length > 0 ? activeReelsList : globalVideoList;
                    if(activeList.length > 0 && activeList[currentIndex]) {
                        window.location.href = `pd.html?id=${encodeURIComponent(activeList[currentIndex].id || activeList[currentIndex].product_id)}`;
                    }
                });
            }

            if(bottomSearchBtn && floatingSearchContainer) {
                bottomSearchBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = floatingSearchContainer.style.display === 'flex';
                    if (isVisible) {
                        floatingSearchContainer.style.display = 'none';
                    } else {
                        if(savedGalleryOverlay) savedGalleryOverlay.style.display = 'none';
                        if(categoryTransparentOverlay) categoryTransparentOverlay.style.display = 'none';
                        floatingSearchContainer.style.display = 'flex';
                        if(searchInput) searchInput.focus();
                    }
                });
            }

            if(bottomSavedBtn && savedGalleryOverlay) {
                bottomSavedBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isVisible = savedGalleryOverlay.style.display === 'flex';
                    if (isVisible) {
                        savedGalleryOverlay.style.display = 'none';
                    } else {
                        if(categoryTransparentOverlay) categoryTransparentOverlay.style.display = 'none';
                        if(floatingSearchContainer) floatingSearchContainer.style.display = 'none';
                        renderSavedGalleryContent();
                        savedGalleryOverlay.style.display = 'flex';
                    }
                });
            }

            window.addEventListener('click', (e) => {
                if (categoryTransparentOverlay && categoryTransparentOverlay.style.display === 'flex') {
                    if (!e.target.closest('#categoryMainListView') && !e.target.closest('#bottomCategoryBtn')) {
                        categoryTransparentOverlay.style.display = 'none';
                    }
                }
                if (savedGalleryOverlay && savedGalleryOverlay.style.display === 'flex') {
                    if (!e.target.closest('#savedGalleryBody') && !e.target.closest('#bottomSavedBtn')) {
                        savedGalleryOverlay.style.display = 'none';
                    }
                }
                if (floatingSearchContainer && floatingSearchContainer.style.display === 'flex') {
                    if (!e.target.closest('#floatingSearchContainer') && !e.target.closest('#bottomSearchBtn')) {
                        floatingSearchContainer.style.display = 'none';
                    }
                }
            });

            if(searchBtn && searchInput) {
                searchBtn.addEventListener('click', () => { executeSearch(searchInput.value); });
                searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') executeSearch(searchInput.value); });
            }

            window.addEventListener('keydown', (e) => {
                if(e.key === 'ArrowDown') { e.preventDefault(); scrollVideo(1); }
                else if(e.key === 'ArrowUp') { e.preventDefault(); scrollVideo(-1); }
            });

            let touchStartY = 0;
            window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, {passive: true});
            window.addEventListener('touchend', (e) => {
                let diff = touchStartY - e.changedTouches[0].clientY;
                if (Math.abs(diff) > 50) diff > 0 ? scrollVideo(1) : scrollVideo(-1);
            }, {passive: true});
        });

        // categories.js থেকে ডাইনামিক ক্যাটাগরি রেন্ডার করার ফাংশন
        function buildCategoriesUI() {
            const listContainer = document.getElementById('categoryMainListView');
            if(!listContainer || typeof rorraxyCategoriesData === 'undefined') return;

            let html = '';
            rorraxyCategoriesData.forEach(cat => {
                let subHtml = '';
                cat.subCategories.forEach(sub => {
                    subHtml += `
                        <div class="sub-cat-item" onclick="filterReelsByCategory('${sub.key}')">
                            <i class="${sub.icon}"></i>
                            <span class="sub-cat-name">${sub.name}</span>
                        </div>
                    `;
                });

                html += `
                    <div class="accordion-category-box" id="${cat.id}">
                        <div class="accordion-header" onclick="toggleAccordion('${cat.id}')">
                            <div class="accordion-title-wrap">
                                <i class="${cat.icon} cat-main-icon"></i>
                                <span class="accordion-main-title">${cat.title}</span>
                            </div>
                            <i class="fa-solid fa-chevron-down accordion-arrow"></i>
                        </div>
                        <div class="accordion-content">
                            <div class="sub-categories-grid">${subHtml}</div>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }

        async function loadLiveVideosFromBackend() {
            try {
                const response = await fetch(`/api/products`);
                const result = await response.json();
                
                let productsList = [];
                if (result && result.success && Array.isArray(result.data)) {
                    productsList = result.data;
                } else if (Array.isArray(result)) {
                    productsList = result;
                }

                if (productsList.length > 0) {
                    const randomLikeBases = [250, 500, 1000, 1500, 2000, 2500, 5000];
                    globalVideoList = productsList.map(item => {
                        let rawVid = item.video_url || item.youtube_video || '';
                        if (rawVid.includes('.r2.dev')) {
                            rawVid = rawVid.replace(/https:\/\/[^/]+\.r2\.dev/, 'https://vid.rorraxy.com');
                        }

                        let extractedImages = [];
                        try {
                            if (item.images_json) {
                                if (typeof item.images_json === 'string') {
                                    let parsed = JSON.parse(item.images_json);
                                    if (Array.isArray(parsed)) extractedImages = parsed;
                                } else if (Array.isArray(item.images_json)) {
                                    extractedImages = item.images_json;
                                }
                            }
                        } catch(e) {}

                        if (extractedImages.length === 0 && item.image_url) {
                            if (typeof item.image_url === 'string' && item.image_url.startsWith('[')) {
                                try {
                                    let parsed = JSON.parse(item.image_url);
                                    if (Array.isArray(parsed)) extractedImages = parsed;
                                } catch(e) { extractedImages = [item.image_url]; }
                            } else {
                                extractedImages = [item.image_url];
                            }
                        }

                        extractedImages = extractedImages.filter(img => img && typeof img === 'string' && img.trim() !== '');
                        let sellerTitle = item.brand_name || (item.vendor_type === 'vendor' ? 'Official Vendor' : 'rorraxy Merchant');
                        
                        let targetCountry = item.target_country ? String(item.target_country).trim().toLowerCase() : '';
                        let discountVal = parseFloat(item.discount_rate || 0);
                        let calculatedBaseLikes = item.like_count || randomLikeBases[Math.floor(Math.random() * randomLikeBases.length)];

                        return {
                            id: String(item.id || item.product_code || '101'),
                            videoUrl: rawVid,
                            imagesList: extractedImages,
                            price: item.price ? `$${parseFloat(item.price).toFixed(2)}` : '$85.00',
                            baseLikes: calculatedBaseLikes,
                            baseShares: 180,
                            targetCountry: targetCountry,
                            discountNum: discountVal,
                            discountStr: discountVal > 0 ? `${discountVal}% OFF` : '',
                            category: item.category || 'video',
                            description: item.description || '',
                            title: item.title || '',
                            sellerName: sellerTitle,
                            sellerAvatar: 'https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png',
                            sellerDesc: 'Verified seller on rorraxy ecosystem.'
                        };
                    });
                    sessionStorage.setItem('rorraxy_cached_videos', JSON.stringify(globalVideoList));
                    activeReelsList = globalVideoList; 
                    renderBatchVideos();
                } else {
                    document.getElementById('videoFeed').innerHTML = `<div style="height:calc(100vh - 65px); display:flex; align-items:center; justify-content:center; color:#a0a0ab; font-size:0.85rem;">NO PRODUCTS FOUND</div>`;
                }
            } catch (error) {
                console.error('Failed to load products from backend:', error);
                let cachedData = sessionStorage.getItem('rorraxy_cached_videos');
                if (cachedData) {
                    globalVideoList = JSON.parse(cachedData);
                    activeReelsList = globalVideoList;
                    renderBatchVideos();
                } else {
                    document.getElementById('videoFeed').innerHTML = `<div style="height:calc(100vh - 65px); display:flex; align-items:center; justify-content:center; color:#a0a0ab; font-size:0.85rem;">NO PRODUCTS FOUND</div>`;
                }
            }
        }

        function getDynamicEngagement(productId, baseVal, type) {
            let storageKey = `rorraxy_retail_${type}_${productId}`;
            let storedData = localStorage.getItem(storageKey);
            let currentTime = new Date().getTime();
            let currentVal = baseVal;

            if (storedData) {
                let parsed = JSON.parse(storedData);
                currentVal = parsed.value;
            } else {
                currentVal = baseVal + Math.floor(Math.random() * 150);
                localStorage.setItem(storageKey, JSON.stringify({ value: currentVal, lastUpdated: currentTime }));
            }

            if (currentVal >= 1000) {
                return (currentVal / 1000).toFixed(1) + 'K';
            }
            return currentVal.toString();
        }

        window.executeSearch = function(keyword) {
            let query = keyword.toLowerCase().trim();
            if(!query) return;
            let foundIndex = globalVideoList.findIndex(p => 
                (p.id && String(p.id).toLowerCase().includes(query)) ||
                (p.sellerName && p.sellerName.toLowerCase().includes(query)) ||
                (p.title && p.title.toLowerCase().includes(query))
            );
            if (foundIndex !== -1) {
                activeReelsList = globalVideoList;
                currentIndex = foundIndex;
                renderBatchVideos();
            }
            document.getElementById('floatingSearchContainer').style.display = 'none';
        };

        window.filterReelsByCategory = function(queryKey) {
            document.getElementById('categoryTransparentOverlay').style.display = 'none';
            let query = queryKey.toLowerCase().replace(/-/g, ' ');
            
            let filtered = globalVideoList.filter(item => {
                const title = (item.title || '').toLowerCase();
                const cat = (item.category || item.description || '').toLowerCase();
                return title.includes(query) || cat.includes(query);
            });

            activeReelsList = filtered.length > 0 ? filtered : globalVideoList;
            currentIndex = 0;
            renderBatchVideos();
        };

        window.toggleSaveItem = function(e, btn, pId) {
            e.stopPropagation();
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let existingIndex = savedObjects.findIndex(item => String(item.id) === String(pId));
            
            if(existingIndex > -1) {
                savedObjects.splice(existingIndex, 1);
                btn.classList.remove('active');
            } else {
                let targetProduct = globalVideoList.find(item => String(item.id) === String(pId));
                if(targetProduct) {
                    savedObjects.push(targetProduct);
                    btn.classList.add('active');
                }
            }
            localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(savedObjects));
        };

        function renderSavedGalleryContent() {
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let containerBody = document.getElementById('savedGalleryBody');
            if(!containerBody) return;

            if (savedObjects.length === 0) {
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box"><h2 class="fs-profile-name">SAVED VIDEOS</h2></div>
                    <div style="text-align:center; color:#a0a0ab; padding:40px; font-size:0.85rem;">NO SAVED VIDEOS FOUND</div>`;
            } else {
                let thumbsHtml = '';
                savedObjects.forEach(v => {
                    let thumbImg = (v.imagesList && v.imagesList.length > 0) ? v.imagesList[0] : 'https://via.placeholder.com/150';
                    thumbsHtml += `
                        <div class="saved-thumb-card" onclick="selectSavedVideo('${v.id}')">
                            <div class="saved-thumb-preview">
                                <img src="${thumbImg}" style="width:100%; height:100%; object-fit:cover;">
                                <i class="fa-solid fa-play play-overlay-icon"></i>
                            </div>
                            <div class="saved-thumb-footer">
                                <span class="saved-thumb-title">ID: ${v.id}</span>
                                <span class="saved-thumb-price">${v.price || ''}</span>
                                <button class="saved-clean-delete-btn" onclick="removeSavedVideo(event, '${v.id}')"><i class="fa-solid fa-trash"></i> DELETE</button>
                            </div>
                        </div>`;
                });
                containerBody.innerHTML = `
                    <div class="fs-profile-header-box">
                        <h2 class="fs-profile-name">SAVED VIDEOS</h2>
                        <div class="fs-stats-pill"><i class="fa-solid fa-video"></i> TOTAL SAVED: <strong>${savedObjects.length}</strong></div>
                    </div>
                    <div class="fs-videos-grid">${thumbsHtml}</div>`;
            }
        }

        window.selectSavedVideo = function(videoId) {
            let foundIdx = globalVideoList.findIndex(p => String(p.id) === String(videoId));
            if(foundIdx !== -1) {
                activeReelsList = globalVideoList;
                currentIndex = foundIdx;
            }
            document.getElementById('savedGalleryOverlay').style.display = 'none';
            renderBatchVideos();
        };

        window.removeSavedVideo = function(e, videoId) {
            e.stopPropagation();
            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            savedObjects = savedObjects.filter(item => String(item.id) !== String(videoId));
            localStorage.setItem('rorraxy_saved_video_objects', JSON.stringify(savedObjects));
            renderSavedGalleryContent();
            renderBatchVideos();
        };

        function toggleAccordion(boxId) {
            const targetBox = document.getElementById(boxId);
            const content = targetBox.querySelector('.accordion-content');
            const isOpen = targetBox.classList.contains('active');

            document.querySelectorAll('.accordion-category-box').forEach(box => {
                box.classList.remove('active');
                let c = box.querySelector('.accordion-content');
                if(c) c.style.display = 'none';
            });

            if (!isOpen) {
                targetBox.classList.add('active');
                if(content) content.style.display = 'block';
            } else {
                if(content) content.style.display = 'none';
            }
        }

        window.scrollVideo = function(direction) {
            let activeList = activeReelsList.length > 0 ? activeReelsList : globalVideoList;
            if (direction === 1 && currentIndex < activeList.length - 1) { currentIndex++; renderBatchVideos(); }
            else if (direction === -1 && currentIndex > 0) { currentIndex--; renderBatchVideos(); }
        };

        function renderBatchVideos() {
            const feedContainer = document.getElementById('videoFeed');
            if(!feedContainer) return;

            let activeList = activeReelsList.length > 0 ? activeReelsList : globalVideoList;
            if (activeList.length === 0) {
                feedContainer.innerHTML = `<div style="height:calc(100vh - 65px); display:flex; align-items:center; justify-content:center; color:#a0a0ab; font-size:0.85rem;">NO PRODUCTS FOUND</div>`;
                return;
            }

            if (currentIndex >= activeList.length) currentIndex = Math.max(0, activeList.length - 1);
            let product = activeList[currentIndex];

            let pId = String(product.id || '101');
            let pVideo = product.videoUrl ? product.videoUrl.trim() : '';
            let pPrice = product.price ? product.price : '$85.00';

            let pLikes = getDynamicEngagement(pId, product.baseLikes || 5200, 'likes');
            let pShares = getDynamicEngagement(pId, product.baseShares || 180, 'shares');

            let savedObjects = JSON.parse(localStorage.getItem('rorraxy_saved_video_objects') || '[]');
            let isSaved = savedObjects.some(item => String(item.id) === String(pId));
            let savedActiveClass = isSaved ? 'active' : '';

            if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }

            let mediaElement = '';
            if (pVideo !== '' && (pVideo.includes('.mp4') || pVideo.includes('.r2.dev') || pVideo.includes('http://') || pVideo.includes('https://'))) {
                mediaElement = `<video src="${pVideo}" autoplay loop muted playsinline preload="metadata"></video>`;
            } else {
                let images = product.imagesList || [];
                if (images.length === 0) images = ['https://via.placeholder.com/400x700?text=No+Preview+Available'];

                mediaElement = `<img id="reelSlideImg" src="${images[0]}" class="reel-fit-img" alt="Product Media">`;
                
                if (images.length > 1) {
                    let imgIdx = 0;
                    slideInterval = setInterval(() => {
                        imgIdx = (imgIdx + 1) % images.length;
                        const imgElem = document.getElementById('reelSlideImg');
                        if (imgElem) imgElem.src = images[imgIdx];
                    }, 1500);
                }
            }

            let countryCode = product.targetCountry || 'bd';
            let flagIconHtml = `<img src="https://flagcdn.com/w40/${countryCode}.png" alt="${countryCode}" class="dynamic-country-flag">`;

            let discountBadgeHtml = '';
            if (product.discountNum && product.discountNum > 0) {
                discountBadgeHtml = `
                    <div class="image-style-discount-badge">
                        <span class="dynamic-flag-box">${flagIconHtml}</span>
                        <span class="offer-text">${product.discountStr}</span>
                    </div>`;
            }

            feedContainer.innerHTML = `
                <div class="reel-card" data-product-id="${pId}">
                    <div class="reel-media-box" onclick="openProductDetail('${pId}')">${mediaElement}</div>

                    <div class="right-vertical-actions">
                        <div class="side-action-item share-action-btn" onclick="openNativeShare(event, '${pId}')" title="Share">
                            <i class="fa-solid fa-reply action-pure-icon share-flip"></i>
                            <span class="side-count-text">${pShares}</span>
                        </div>
                        <div class="side-action-item love-action-btn" onclick="toggleLove(event, this, '${pId}')" title="Like">
                            <i class="fa-solid fa-heart action-pure-icon love-icon-elem"></i>
                            <span class="side-count-text love-count">${pLikes}</span>
                        </div>
                        <div class="side-action-item save-action-btn ${savedActiveClass}" onclick="toggleSaveItem(event, this, '${pId}')" title="Save">
                            <i class="fa-solid fa-bookmark action-pure-icon"></i>
                        </div>
                    </div>

                    <div class="center-price-offer-box">
                        <span class="product-price-tag">${pPrice}</span>
                        ${discountBadgeHtml}
                    </div>
                </div>
            `;
        }

        window.toggleLove = function(e, btn, productId) {
            e.stopPropagation();
            let countElem = btn.querySelector('.love-count');
            let storageKey = `rorraxy_retail_likes_${productId}`;
            let storedData = localStorage.getItem(storageKey);
            let currentVal = storedData ? JSON.parse(storedData).value : 5200;

            if(btn.classList.contains('liked-active')) {
                btn.classList.remove('liked-active');
                currentVal = Math.max(0, currentVal - 1);
            } else {
                btn.classList.add('liked-active');
                currentVal += 1;
            }

            localStorage.setItem(storageKey, JSON.stringify({ value: currentVal, lastUpdated: new Date().getTime() }));
            if(countElem) countElem.innerText = currentVal >= 1000 ? (currentVal / 1000).toFixed(1) + 'K' : currentVal.toString();
        };

        window.openNativeShare = async function(e, pId) {
            e.stopPropagation();
            const shareUrl = `${window.location.origin}/pd.html?id=${encodeURIComponent(pId)}`;
            if (navigator.share) {
                try { await navigator.share({ title: pId, url: shareUrl }); } catch (err) {}
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareUrl).then(() => alert('Link copied to clipboard!'));
            }
        };

        window.openProductDetail = function(productId) {
            window.location.href = `pd.html?id=${encodeURIComponent(productId)}`;
        };
    </script>
</head>
<body id="mainBody">

    <!-- Top Floating Search Bar -->
    <div id="floatingSearchContainer" class="top-floating-search-bar">
        <input type="text" id="floatingSearchInput" class="floating-search-input" placeholder="SEARCH PRODUCT...">
        <button id="floatingSearchBtn" class="floating-search-btn-circle"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>

    <div class="yt-nav-arrows">
        <button class="yt-arrow-btn" onclick="scrollVideo(-1)"><i class="fa-solid fa-arrow-up"></i></button>
        <button class="yt-arrow-btn" onclick="scrollVideo(1)"><i class="fa-solid fa-arrow-down"></i></button>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav-bar">
        <div id="bottomHomeBtn" class="bottom-nav-item"><i class="fa-solid fa-house"></i><span>HOME</span></div>
        <div id="bottomCategoryBtn" class="bottom-nav-item"><i class="fa-solid fa-list-check"></i><span>CATEGORY</span></div>
        <div id="bottomBuyInfoBtn" class="bottom-nav-item center-buy-btn"><i class="fa-solid fa-cart-shopping"></i><span>BUY & INFO</span></div>
        <div id="bottomSearchBtn" class="bottom-nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>SEARCH</span></div>
        <div id="bottomSavedBtn" class="bottom-nav-item"><i class="fa-solid fa-video"></i><span>SAVED</span></div>
    </nav>

    <!-- Saved Gallery Overlay -->
    <div id="savedGalleryOverlay" class="saved-gallery-overlay"><div class="seller-fullscreen-container" id="savedGalleryBody"></div></div>

    <!-- Centered Transparent Category Overlay Menu (Dynamic Load via categories.js) -->
    <div id="categoryTransparentOverlay" class="category-transparent-overlay">
        <div class="seller-fullscreen-container">
            <div class="category-fullscreen-view" id="categoryMainListView"></div>
        </div>
    </div>

    <main class="feed-container" id="videoFeed"></main>
</body>
</html>
